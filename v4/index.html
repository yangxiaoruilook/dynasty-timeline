<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: #f5f0e8;
  color: #3d3225;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
a { color: inherit; text-decoration: none; }

/* Hero */
.hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #faf6ef 0%, #f0e8d8 50%, #e8dcc8 100%);
  padding: 80px 24px;
  text-align: center;
}
.hero::before {
  content: "";
  position: absolute;
  top: -60px; left: -60px;
  width: 300px; height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(180,140,60,0.1), transparent);
}
.hero::after {
  content: "";
  position: absolute;
  bottom: -80px; right: -80px;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(180,140,60,0.08), transparent);
}
.hero-inner { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }
.hero-badge {
  display: inline-block;
  padding: 6px 18px;
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 2px;
  color: #8b6914;
  border: 1px solid rgba(180,140,60,0.25);
  background: rgba(180,140,60,0.08);
  margin-bottom: 24px;
}
.hero h1 {
  font-size: 56px;
  font-weight: 700;
  color: #8b6914;
  margin-bottom: 16px;
  letter-spacing: -1px;
}
.hero .subtitle {
  font-size: 20px;
  color: #6b5a3e;
  margin-bottom: 8px;
}
.hero .sub2 {
  font-size: 14px;
  color: #9e8e72;
  margin-bottom: 32px;
}
.hero-cta {
  display: inline-block;
  padding: 12px 32px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 600;
  background: linear-gradient(135deg, #b48c0f, #8b6914);
  color: #fff;
  transition: transform 0.2s, box-shadow 0.2s;
}
.hero-cta:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 30px rgba(140,105,20,0.25);
}

/* Stats */
.stats {
  max-width: 1000px;
  margin: 0 auto;
  padding: 32px 24px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.stat-card {
  text-align: center;
  padding: 20px 12px;
  border-radius: 12px;
  border: 1px solid rgba(180,140,60,0.15);
  background: rgba(180,140,60,0.05);
}
.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: #8b6914;
}
.stat-suffix {
  font-size: 12px;
  color: #9e8e72;
  margin-left: 2px;
}
.stat-label {
  font-size: 12px;
  color: #9e8e72;
  margin-top: 4px;
}

/* Timeline */
.timeline-section {
  max-width: 1000px;
  margin: 0 auto;
  padding: 64px 24px;
}
.timeline-title {
  font-size: 28px;
  font-weight: 700;
  color: #8b6914;
  text-align: center;
  margin-bottom: 8px;
}
.timeline-sub {
  text-align: center;
  font-size: 14px;
  color: #9e8e72;
  margin-bottom: 56px;
}
.timeline-container {
  position: relative;
}
.timeline-line {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, transparent, #b48c0f 10%, #b48c0f 90%, transparent);
  transform: translateX(-50%);
}

/* Dynasty Card */
.dynasty-item {
  position: relative;
  display: flex;
  align-items: center;
  margin-bottom: 48px;
  cursor: pointer;
}
.dynasty-item.left { flex-direction: row; }
.dynasty-item.right { flex-direction: row-reverse; }
.dynasty-item:hover .dynasty-card {
  transform: translateY(-4px);
  box-shadow: 0 20px 60px rgba(140,105,20,0.12);
}
.dynasty-dot {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 3px solid #f5f0e8;
  z-index: 2;
}
.dynasty-card {
  width: 42%;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(180,140,60,0.18);
  background: linear-gradient(145deg, #fffcf5, #f5efe3);
  box-shadow: 0 2px 12px rgba(100,80,30,0.06);
  transition: transform 0.3s, box-shadow 0.3s;
}
.dynasty-item.left .dynasty-card { margin-right: auto; }
.dynasty-item.right .dynasty-card { margin-left: auto; }
.dynasty-bar {
  height: 5px;
}
.dynasty-img {
  position: relative;
  height: 140px;
  overflow: hidden;
}
.dynasty-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0.5;
}
.dynasty-img-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 30%, rgba(245,240,232,0.95) 100%);
}
.dynasty-img-name {
  position: absolute;
  bottom: 10px;
  left: 16px;
  font-size: 22px;
  font-weight: 700;
}
.dynasty-body {
  padding: 16px 20px 20px;
}
.dynasty-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.dynasty-name {
  font-size: 22px;
  font-weight: 700;
}
.dynasty-period {
  font-size: 12px;
  color: #9e8e72;
}
.dynasty-badge {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  opacity: 0.6;
}
.dynasty-desc {
  font-size: 13px;
  color: #6b5a3e;
  line-height: 1.7;
  margin-bottom: 14px;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.tag-chip {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid rgba(180,140,60,0.3);
  color: #8b6914;
  background: rgba(180,140,60,0.08);
  margin: 2px;
  transition: background 0.2s, border-color 0.2s;
}
.tag-chip:hover {
  background: rgba(180,140,60,0.15);
  border-color: rgba(180,140,60,0.5);
}
.dynasty-meta {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: #9e8e72;
  padding-top: 10px;
  margin-top: 10px;
  border-top: 1px solid rgba(100,80,30,0.08);
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(60,50,30,0.4);
  backdrop-filter: blur(4px);
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s, visibility 0.3s;
}
.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}
.modal {
  background: linear-gradient(145deg, #fffcf5, #f5efe3);
  border: 1px solid rgba(180,140,60,0.2);
  border-radius: 16px;
  max-width: 700px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 32px;
  position: relative;
  transform: translateY(20px);
  transition: transform 0.3s;
}
.modal-overlay.active .modal {
  transform: translateY(0);
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: rgba(180,140,60,0.1);
  color: #6b5a3e;
  font-size: 16px;
  cursor: pointer;
  transition: opacity 0.2s, background 0.2s;
}
.modal-close:hover { background: rgba(180,140,60,0.2); }
.modal h2 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 4px;
}
.modal .period {
  font-size: 13px;
  color: #9e8e72;
  margin-bottom: 20px;
}
.modal .desc {
  font-size: 15px;
  color: #5a4a30;
  line-height: 1.8;
  margin-bottom: 28px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab-btn {
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: all 0.2s;
  color: #6b5a3e;
  background: rgba(180,140,60,0.08);
}
.tab-btn:hover { background: rgba(180,140,60,0.15); }
.tab-btn.active {
  background: linear-gradient(135deg, #b48c0f, #8b6914);
  color: #fff;
}

/* Tab content */
.tab-panel { display: none; }
.tab-panel.active {
  display: block;
  animation: fadeIn 0.3s ease-out;
}
.event-item {
  padding: 12px 16px;
  border-radius: 8px;
  border: 1px solid rgba(180,140,60,0.15);
  background: rgba(180,140,60,0.04);
  margin-bottom: 8px;
  font-size: 14px;
  color: #5a4a30;
}
.figure-list, .invention-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.figure-chip, .invention-chip {
  padding: 8px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  border: 1px solid rgba(180,140,60,0.2);
  background: rgba(180,140,60,0.06);
  color: #8b6914;
}
.tp-item {
  position: relative;
  padding-left: 22px;
  margin-bottom: 16px;
}
.tp-item::before {
  content: "";
  position: absolute;
  left: 0;
  top: 7px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #8b6914;
  border: 2px solid #f5f0e8;
}
.tp-year {
  font-weight: 600;
  font-size: 14px;
  color: #8b6914;
}
.tp-desc {
  font-size: 13px;
  color: #6b5a3e;
  margin-top: 2px;
}
.tp-sig {
  font-size: 12px;
  color: #9e8e72;
  margin-top: 2px;
  font-style: italic;
}

.footer {
  text-align: center;
  padding: 32px 24px;
  font-size: 12px;
  color: #9e8e72;
  border-top: 1px solid rgba(180,140,60,0.1);
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Mobile */
@media (max-width: 768px) {
  .hero h1 { font-size: 36px; }
  .hero .subtitle { font-size: 16px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .timeline-line { left: 20px; }
  .dynasty-item.left,
  .dynasty-item.right { flex-direction: column; }
  .dynasty-dot {
    left: 20px;
    top: 0;
    transform: translate(-50%, 0);
  }
  .dynasty-card { width: 100%; margin-left: 40px !important; margin-right: 0 !important; }
  .modal { padding: 24px; }
  .modal h2 { font-size: 22px; }
  .dynasty-dot { border-color: #f5f0e8; }
}
</style>
</head>

// Stats
function renderStats() {
  const totalEvents = DYNASTIES.reduce((s, d) => s + (d.majorEvents || []).length, 0);
  const totalFigures = DYNASTIES.reduce((s, d) => s + (d.famousFigures || []).length, 0);
  const totalInventions = DYNASTIES.reduce((s, d) => s + (d.inventions || []).length, 0);
  const stats = [
    { label: '朝代', value: DYNASTIES.length, suffix: '个' },
    { label: '重大事件', value: totalEvents, suffix: '件' },
    { label: '历史人物', value: totalFigures, suffix: '位' },
    { label: '发明创造', value: totalInventions, suffix: '项' },
  ];
  document.getElementById('stats').innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-num">${s.value}<span class="stat-suffix">${s.suffix}</span></div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join('');
}

// Timeline
function renderTimeline() {
  const container = document.getElementById('timeline-container');
  let html = '<div class="timeline-line"></div>';
  DYNASTIES.forEach((d, i) => {
    const color = d.color || '#8b6914';
    const isLeft = i % 2 === 0;
    const figures = (d.famousFigures || []).slice(0, 4).map(f => `<span class="tag-chip">${f}</span>`).join('');
    const moreFigs = (d.famousFigures || []).length > 4 ? `<span class="tag-chip" style="color:#9e8e72">+${(d.famousFigures || []).length - 4}</span>` : '';

    const imgSection = d.backgroundImage
      ? `<div class="dynasty-img">
           <img src="${d.backgroundImage}" alt="${d.name}" loading="lazy" onerror="this.parentElement.style.display='none'">
           <div class="dynasty-img-overlay"></div>
           <div class="dynasty-img-name" style="color:${color}">${d.name}</div>
         </div>`
      : `<div style="padding:20px 20px 0"><span class="dynasty-name" style="color:${color};font-size:22px;font-weight:700">${d.name}</span></div>`;

    html += `
      <div class="dynasty-item ${isLeft ? 'left' : 'right'}" onclick="openModal(${i})">
        <div class="dynasty-dot" style="background:${color}"></div>
        <div class="dynasty-card">
          <div class="dynasty-bar" style="background:linear-gradient(90deg,${color},${color}44)"></div>
          ${imgSection}
          <div class="dynasty-body">
            <div class="dynasty-header">
              ${!d.backgroundImage ? '' : ''}
              <span class="dynasty-period">${d.period}</span>
            </div>
            <p class="dynasty-desc">${d.description}</p>
            <div style="margin-bottom:10px">${figures}${moreFigs}</div>
            <div class="dynasty-meta">
              <span>${(d.majorEvents || []).length} 事件</span>
              <span>${(d.famousFigures || []).length} 人物</span>
              <span>${(d.inventions || []).length} 发明</span>
              <span>${(d.turningPoints || []).length} 转折</span>
            </div>
          </div>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

// Modal
function openModal(index) {
  const d = DYNASTIES[index];
  const color = d.color || '#8b6914';
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  const modal = document.getElementById('modal');
  modal.style.borderTop = `3px solid ${color}`;

  content.innerHTML = `
    <h2 style="color:${color}">${d.name}</h2>
    <div class="period">${d.period}</div>
    <div class="desc">${d.description}</div>
    <div class="tabs" id="modal-tabs">
      <button class="tab-btn active" onclick="switchTab('events',this)" style="--c:${color}">⚡ 重大事件</button>
      <button class="tab-btn" onclick="switchTab('figures',this)">👤 著名人物</button>
      <button class="tab-btn" onclick="switchTab('inventions',this)">💡 发明创造</button>
      <button class="tab-btn" onclick="switchTab('turning',this)">🔄 转折点</button>
    </div>
    <div class="tab-panel active" id="tab-events">
      ${(d.majorEvents || []).map(e => `<div class="event-item">${e}</div>`).join('') || '<p style="color:#9e8e72;font-size:13px">暂无数据</p>'}
    </div>
    <div class="tab-panel" id="tab-figures">
      <div class="figure-list">${(d.famousFigures || []).map(f => `<span class="figure-chip">${f}</span>`).join('') || '<p style="color:#9e8e72;font-size:13px">暂无数据</p>'}</div>
    </div>
    <div class="tab-panel" id="tab-inventions">
      <div class="invention-list">${(d.inventions || []).map(inv => `<span class="invention-chip">${inv}</span>`).join('') || '<p style="color:#9e8e72;font-size:13px">暂无数据</p>'}</div>
    </div>
    <div class="tab-panel" id="tab-turning">
      ${(d.turningPoints || []).map(tp => `
        <div class="tp-item">
          <div class="tp-year">${tp.year} · ${tp.event}</div>
          <div class="tp-desc">${tp.description}</div>
          <div class="tp-sig">${tp.significance}</div>
        </div>
      `).join('') || '<p style="color:#9e8e72;font-size:13px">暂无数据</p>'}
    </div>
  `;

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  document.body.style.overflow = '';
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  btn.classList.add('active');
}

// Close on overlay click
document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Init
renderStats();
renderTimeline();
</script>
