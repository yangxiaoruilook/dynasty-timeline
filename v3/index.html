  { id:'three-kingdoms', name:'三国时期', period:'220年 - 280年', start:220, end:280, founder:'曹丕/刘备/孙权',
    desc:'三国时期是中国历史上的著名分裂时期，魏、蜀、吴三国鼎立。这一时期虽战争频繁，但也涌现出诸葛亮、曹操、关羽等一大批杰出的政治家、军事家和文学家。三国故事被后世演绎成《三国演义》，成为中国文学瑰宝，在世界范围内都有广泛影响。',
    events:[
      {name:'曹丕称帝建立魏国',desc:'公元220年，曹操病逝后其子曹丕逼迫汉献帝禅让，于洛阳称帝建立魏国，东汉正式灭亡。',background:'建安二十五年（220年）正月，曹操病逝于洛阳，其子曹丕继位为魏王、丞相。曹操生前已统一北方，实际掌握东汉朝廷大权，"挟天子以令诸侯"多年，曹魏代汉的政治基础已经成熟。',process:'曹丕继位后，华歆、贾诩等大臣多次上表劝汉献帝禅让。汉献帝四次下诏禅让帝位，曹丕按礼制三次推辞。同年十月，曹丕在洛阳南郊繁阳亭筑坛，接受汉献帝的禅让诏书和传国玉玺，即皇帝位，改元黄初，定都洛阳。',result:'东汉正式灭亡，立国195年。曹丕追尊曹操为魏武帝，封汉献帝刘协为山阳公，给予优厚待遇。魏国建立后，曹丕推行九品中正制，将选官权集中到中央。',evaluation:'曹丕以"禅让"形式完成政权更替，避免了大规模流血冲突，是古代政权过渡中较为平稳的一次。九品中正制在初期打破了世族垄断，但后来逐渐被士族门阀操控，"上品无寒门，下品无世族"。',impact:'曹丕称帝标志着三国时代的正式开启。次年（221年）刘备在成都称帝建立蜀汉，229年孙权在建业称帝建立东吴，天下三分格局正式形成。九品中正制影响了此后近四百年的政治生态，直至隋唐科举制兴起才被取代。'},
      {name:'刘备称帝建立蜀汉',desc:'公元221年，刘备在成都称帝继承汉统，国号"汉"（史称蜀汉）。刘备以"兴复汉室"为旗帜，任用诸葛亮为丞相，在益州建立了相对稳定的政权。',background:'曹丕称帝后汉室已亡，刘备作为汉宗室后裔（自称中山靖王之后）打出"兴复汉室"的旗号。他据有益州和汉中已具备建国的实力基础。但称帝时机需要慎重——过早称帝会被视为与曹丕相同的篡位者、过晚称帝又无法凝聚北伐的力量。',process:'建安二十六年（221年）刘备在成都南郊筑坛即皇帝位国号为"汉"（史称蜀汉），以诸葛亮为丞相许靖为司徒。他随即发布东征孙权的命令——为被东吴杀害的关羽复仇。诸葛亮等大臣苦劝无果，刘备率大军顺江东下。222年猇亭之战（夷陵之战）中被东吴陆逊火烧连营七百里大败，刘备退守白帝城。',result:'223年刘备在白帝城病危，临终将刘禅托付给诸葛亮并说出了"若嗣子可辅则辅之如其不才君可自取"的锥心之言。诸葛亮泣涕"臣敢不竭股肱之力效忠贞之节继之以死"。刘备在位仅两年便去世，蜀汉进入诸葛亮主政时代。',evaluation:'刘备的一生可以说是百折不挠的——从织席贩履到三分天下有其一的帝王，六十岁才称帝六十三岁就病逝。他以仁义立身的思想被演义小说放大但也不全是虚构——携民渡江十余万百姓自愿跟随他逃亡是历史上确有之事。猇亭之败是他一生最大的军事失误但也让诸葛亮北伐成为蜀汉的宿命。',impact:'蜀汉虽只存在四十三年且偏安一隅，但在中国历史上和文学中的影响力远超其实力。《三国演义》将蜀汉塑造成正统和正义的代表，"桃园结义""三顾茅庐""出师表""鞠躬尽瘁"等故事早已深入中国人的文化基因。'},
      {name:'孙权称帝建立吴国',desc:'公元229年，孙权在武昌称帝后迁都建业（今南京），正式建立吴国。孙权派卫温、诸葛直率船队到达夷洲（今台湾），是中国有史记载最早的中央政权经略台湾的行动。',background:'孙权继承父兄基业——父亲孙坚、兄长孙策——据有江东六郡，在赤壁之战中联刘抗曹大败曹操奠定了三分天下的格局。曹丕刘备先后称帝后孙权没有急于称帝而是选择向曹魏称臣接受"吴王"封号。他审时度势认为北方曹魏实力最强在蜀汉未灭前孙吴需要与曹魏保持表面和平以稳固江东。',process:'公元229年在刘备已死曹魏内斗加剧的有利时机下，孙权在武昌称帝国号为"吴"。随后迁都建业（今南京），南京作为六朝古都的历史由此开始。孙权积极发展海上力量，230年派将军卫温诸葛直率万余人船队到达夷洲（今台湾），是中国有正史记载的最早大陆与台湾的联系。',result:'东吴据有江东、荆南、交州等地，以长江天险为屏障。孙权在位期间江东经济文化取得巨大发展，江南地区从相对落后的"蛮夷之地"逐渐成为中国经济重心南移的起点。',evaluation:'孙权是三国中最沉得住气的君主——当别人称帝时他能等待，当机会来临时他能抓住。他在位最久（24年）政权也最稳定，与曹操刘备的继任者都经历了重大内乱不同，东吴在孙权时期没有发生过动摇国本的危机。他用人的宽容和用权的审慎值得肯定。',impact:'孙权建立东吴对江南的开发产生了深远影响——建业（南京）从此成为中国最重要的古都之一。卫温到达夷洲的行动是中国历史上中央政权首次经略台湾的有据可查的记录，具有重要的历史和法理意义。东吴的海上力量传统也被后世继承。'},
      {name:'诸葛亮北伐',desc:'公元228至234年，蜀汉丞相诸葛亮为"北定中原、兴复汉室"六次从汉中出兵北伐曹魏，其中最著名的是第一次出祁山和第五次在五丈原与司马懿对峙。234年诸葛亮病逝于五丈原军中，临终上呈《出师表》，"鞠躬尽瘁，死而后已"成为千古名句。',background:'刘备临终托孤后诸葛亮成为蜀汉实际执政者。蜀汉国力在三国中最弱——人口不足百万军队不过十万且益州远在西南补给线漫长。但诸葛亮认为"益州疲弊"正是"危急存亡之秋"——不北伐就意味着坐等魏国实力碾压。北伐是主动防御的战略选择而非单纯的"兴复汉室"的浪漫情怀。',process:'228年第一次北伐声势最大——诸葛亮声东击西出祁山天水南安安定三郡响应，但因马谡失守街亭功败垂成诸葛亮挥泪斩马谡自贬三等。此后又连续发动五次北伐，其中最著名的是231年第四次北伐用木牛流马运粮与司马懿对峙上邽，234年第五次北伐驻兵五丈原与司马懿对峙百余日。司马懿坚守不出，诸葛亮派人送女人衣服羞辱他他仍不出战。234年八月诸葛亮积劳成疾病逝五丈原军中年仅五十四岁。',result:'六次北伐均未成功——国力差距是难以逾越的鸿沟。但诸葛亮在对抗强大魏国的战争中保持了七年不败，展示了卓越的军事指挥才能。他死后蜀汉失去了北伐的能力，进入蒋琬费祎主政的守成时期。',evaluation:'诸葛亮北伐是明知不可为而为之的悲壮之举。"鞠躬尽瘁死而后已"不仅是他个人的写照也定义了后世臣子的最高道德标准。从纯军事角度看六出祁山劳而无功；但从政治角度看北伐是凝聚蜀汉人心的目标——有"兴复汉室"的旗帜蜀汉才不仅仅是偏安一隅的地方政权。',impact:'诸葛亮在中国文化中具有独特的地位——既是智慧的化身（"诸葛一生唯谨慎"）也是忠诚的典范（"两朝开济老臣心"）。《出师表》被后世文人推为文章中"至情至性"的典范。"出师未捷身先死长使英雄泪满襟"——杜甫的这句诗写尽了千百年来志士仁人对诸葛亮的无限惋惜。'},
      {name:'司马懿高平陵之变',desc:'公元249年，魏国太傅司马懿趁大将军曹爽陪同少帝出城祭扫高平陵之机发动政变，以迅雷之势控制京城洛阳，曹爽束手被杀。此后司马氏彻底掌控曹魏朝政大权，为日后代魏立晋扫清了障碍。',background:'魏明帝曹叡临终安排宗室曹爽和元老司马懿共同辅政。但曹爽大权独揽排挤司马懿，将司马懿升为太傅实际上是明升暗降剥夺实权。司马懿表面称病退隐暗中积蓄力量等待翻盘机会——他装中风流口水骗过曹爽派来探病的李胜。',process:'249年正月初六，曹爽三兄弟陪同少帝曹芳出城前往洛阳城南的高平陵祭拜魏明帝。司马懿立即抓住机会发动政变——以郭太后名义下令关闭洛阳城门控制武库，占领曹爽及其党羽的府邸，驻守洛水浮桥阻止曹爽回城。曹爽面对突如其来的政变方寸大乱，拒绝大司农桓范"挟天子幸许昌号召天下勤王"的建议，选择了投降。司马懿许诺只免曹爽官职不伤其性命骗取了曹爽的束手就擒。',result:'曹爽投降后仅数日司马懿即以"谋反"罪名将曹爽及其党羽夷三族，诛杀数千人血流成河。司马懿成为魏国唯一的掌权者。此后司马懿及其子司马师司马昭逐步清除曹魏宗室势力，魏国皇帝沦为傀儡。',evaluation:'高平陵之变是三国后期政治史上最精彩的权谋表演。司马懿的成功在于他完美把握了两个关键因素——时机和对手的弱点。曹爽缺乏决断力——如果听从桓范挟天子幸许昌鹿死谁手尚未可知。在权力斗争中犹豫就是死亡，这个道理被无数历史案例反复证明。',impact:'高平陵之变终结了曹魏宗室的统治开启了司马氏代魏的进程。此后的历史走向就此改变——司马氏建立了晋朝统一了中国。司马懿在这场政变中的表现也让他成为中国权谋文化中最具代表性的人物之一——能忍常人所不能忍、伺机而动一击必杀。'},
      {name:'邓艾偷渡阴平灭蜀汉',desc:'公元263年，魏国大将邓艾率军从无人防守的阴平小道翻越摩天岭天险，如神兵天降般兵临成都城下，后主刘禅出城投降，蜀汉灭亡。刘禅被迁至洛阳后留下"此间乐，不思蜀"的典故。',background:'司马昭掌握魏国实权后决定伐蜀以积累功业和声望为代魏做准备。263年派钟会率主力十余万从褒斜道进攻汉中，邓艾率偏师三万从狄道进攻沓中牵制姜维。姜维从沓中撤退至剑阁凭借天险挡住了钟会的主力。',process:'钟会大军被阻于剑阁粮草将尽准备撤退。邓艾提出出奇制胜——率精兵通过无人把守的阴平小道翻越摩天岭。山路七百余里荒无人烟，将士们用毛毡裹身从悬崖峭壁滚下。当他们如天降神兵般出现在江油城下时蜀汉守将不战而降。邓艾击溃诸葛瞻率领的最后抵抗力量后兵临成都。后主刘禅采纳谯周建议出城投降，蜀汉灭亡。',result:'刘禅被迁至洛阳受封安乐公。司马昭设宴招待时故意表演蜀地歌舞，蜀汉旧臣无不落泪唯有刘禅嬉笑自若。司马昭问刘禅"颇思蜀否？"刘禅答"此间乐不思蜀也。"旧臣郤正教他说应该回答"先人坟墓远在陇蜀乃心西悲无日不思"。司马昭再问时刘禅照背了一遍被识破是别人教的，众人哄笑。',evaluation:'邓艾偷渡阴平是军事史上最具想象力的奇袭战例之一。但灭蜀之后邓艾未经司马昭许可擅自以皇帝名义封赏蜀汉官员，招来杀身之祸——被钟会等人诬以谋反被捕后在押解途中被杀。功高震主历来是中国古代功臣最大的危险。',impact:'蜀汉灭亡使三国格局变为魏吴对峙。从此长江上游为魏（晋）所有，东吴的灭亡只是时间问题了。刘禅"乐不思蜀"成为中国历史上最有名的软弱君主形象，但也有人解读这是刘禅的生存智慧——在胜利者面前表现得毫无威胁才能保全性命。'},
      {name:'三国归晋',desc:'公元280年，晋武帝司马炎派王濬率楼船水师顺长江而下直取建业，吴主孙皓效仿刘禅自缚出降，东吴灭亡。至此分裂六十年的三国时代彻底结束，中国重归统一。',background:'265年司马炎代魏建立晋朝，三国中仅剩东吴。此时的东吴在末代君主孙皓的统治下政治黑暗民怨沸腾——孙皓残暴好杀动辄剥面皮挖眼珠，朝臣人人自危。而晋朝已经控制了长江上游的巴蜀地区和荆襄一带对东吴形成了战略包围。',process:'晋武帝司马炎派羊祜在荆州经营多年以德服人使吴人归心。279年王濬在四川建造了巨大的楼船舰队——"舟楫之盛自古未有"。280年晋军六路并进王濬率楼船水师从益州顺长江而下，吴军在长江险要处设置的铁索被王濬用大木筏和大火炬轻松破除。孙皓效仿刘禅自缚出城投降。',result:'孙皓被迁往洛阳封归命侯。司马炎指着殿上给他准备的座位说"朕设此座以待卿久矣"，孙皓回嘴"臣在南方亦设此座以待陛下"。吴国灭亡三国时代结束，从220年曹丕称帝算起分裂六十年，中国重归一统。',evaluation:'三国归晋实现了天下重归一统。从更宏大的历史视角看三国是中国历史从秦汉统一经大分裂再回到统一的过渡期，而这个过渡为后来的隋唐大一统盛世奠定了制度和文化基础。晋朝虽然后来因八王之乱迅速衰落，但统一本身是值得肯定的历史功绩。',impact:'三国归晋后中国进入了一段短暂统一（仅十一年后便爆发八王之乱进入更长的分裂期），但统一的记忆从未被抹去。三国时代虽短但因其戏剧性和传奇性通过《三国演义》的传播成为中国人最熟悉的历史时期，其人物和故事至今活跃在戏剧影视游戏等各种文化形式中。"合久必分分久必合"的历史规律在中国人心目中留下了深刻的印象。'}
    ],
    figures:[
      {name:'曹操',desc:'字孟德（155—220年），东汉末年杰出的政治家军事家文学家。迎汉献帝迁都许昌"挟天子以令诸侯"，先后削平吕布袁绍等割据势力统一中国北方。实行屯田制恢复农业生产，用人唯才打破门第限制。善诗歌，《短歌行》《观沧海》千古传诵。'},
      {name:'刘备',desc:'字玄德（161—223年），蜀汉开国皇帝。以"兴复汉室"为旗帜，三顾茅庐请诸葛亮出山，联吴抗曹取得赤壁之战的胜利。取益州、汉中称汉中王，221年在成都称帝。临终在白帝城托孤诸葛亮，留下"勿以恶小而为之，勿以善小而不为"的遗训。'},
      {name:'孙权',desc:'字仲谋（182—252年），东吴开国皇帝。继承父兄基业坐镇江东，联合刘备在赤壁之战中大败曹操，稳固了三分天下的格局。派卫温率船队到达夷洲（今台湾），创中国经略台湾之始。'},
      {name:'诸葛亮',desc:'字孔明（181—234年），号卧龙，三国蜀汉丞相，中国历史上最著名的政治家军事家之一。刘备三顾茅庐后出山辅佐，提出"隆中对"三分天下的战略蓝图。刘备去世后受托孤之重辅佐刘禅，六出祁山北伐中原，234年病逝于五丈原军中。"鞠躬尽瘁死而后已"成为千古名句。'},
      {name:'关羽',desc:'字云长（？—220年），三国蜀汉名将。与刘备张飞桃园结义，以忠义勇武著称。白马之战中于万军之中斩杀袁绍大将颜良，襄樊之战水淹七军擒于禁斩庞德威震华夏。后被东吴吕蒙偷袭荆州，败走麦城被俘杀。后世尊为"关圣帝君""武圣"。'},
      {name:'张飞',desc:'字益德（？—221年），三国蜀汉名将。长坂坡之战中率二十余骑据守当阳桥，据水断桥瞋目横矛震慑曹军不敢近前。为人勇猛刚烈但不恤士卒，后在准备讨伐东吴时被部下所害。'},
      {name:'赵云',desc:'字子龙（？—229年），三国蜀汉名将。长坂坡之战中单骑救主，保护幼主刘禅和甘夫人突出曹军重围。随诸葛亮北伐，街亭之战中亲自断后保全军队。以忠勇谨慎著称，被后世视为完美武将的典范。'},
      {name:'周瑜',desc:'字公瑾（175—210年），东吴名将。赤壁之战中以火攻大破曹操水军，奠定了三分天下的格局。"羽扇纶巾谈笑间樯橹灰飞烟灭"即是对他指挥若定的生动描写。惜三十六岁英年早逝，临终叹"既生瑜何生亮"。'},
      {name:'司马懿',desc:'字仲达（179—251年），曹魏名将政治家。为人深沉多谋，多次率军抵御诸葛亮北伐，以"坚守不战"之策耗尽蜀军粮草。249年发动高平陵之变诛杀曹爽，掌控曹魏朝政大权。其孙司马炎代魏建晋，追尊其为晋宣帝。'},
      {name:'陆逊',desc:'字伯言（183—245年），东吴名将。夷陵之战中以少胜多火烧刘备七百里连营，一举击败蜀汉大军巩固了东吴的西部防线。后官至丞相，因卷入太子之争被孙权责难忧愤而死。'}
    ],
    inventions:['木牛流马','连弩','屯田制','《出师表》'],
    turningPoints:[{y:'208年',e:'赤壁之战',d:'孙权刘备联军在赤壁以火攻大败曹操八十万大军',s:'奠定三国鼎立格局，曹操统一天下的梦想破灭'},{y:'280年',e:'三国归晋',d:'晋武帝司马炎派王濬率水军顺长江而下灭吴，统一全国',s:'结束六十年分裂，中国重归统一'}],
    color:'#B8956A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/6393b4d4-b4b7-4f9c-9e0e-7b3b3e7e9f2c.jpg'
  },
  { id:'jin', name:'两晋时期', period:'265年 - 420年', start:265, end:420, founder:'晋武帝司马炎',
    desc:'两晋分为西晋和东晋。西晋短暂统一后，因八王之乱和永嘉之乱而迅速灭亡。东晋偏安江南，北方陷入五胡十六国的混乱局面。这一时期，士族门阀势力极度强大，"王与马共天下"是当时的真实写照。玄学盛行，王羲之的书法、顾恺之的绘画、陶渊明的诗歌均达到了艺术高峰。',
    events:[
      {name:'司马炎建立西晋',desc:'公元265年，司马昭之子司马炎逼迫魏元帝禅让，在洛阳称帝建立西晋，定都洛阳。280年灭吴统一全国后，司马炎推行占田制和户调制，社会经济得到一定恢复。但他在继承人问题上犯下重大失误，选择了智力低下的司马衷为太子。',background:'司马懿、司马师、司马昭父子三人经高平陵之变和平定淮南三叛已将曹魏政权完全架空。"司马昭之心路人皆知"——代魏只是时间问题。265年司马昭病逝其子司马炎继位为晋王。',process:'265年司马炎逼迫魏元帝曹奂禅让在洛阳南郊筑坛正式受禅称帝，国号为"晋"。280年发动灭吴之战——王濬楼船下益州金陵王气黯然收。吴主孙皓出降，自黄巾起义以来近百年的分裂战乱终告结束天下重归一统。',result:'太康年间（280-289年）西晋经济恢复人口增长，出现了短暂的繁荣——"太康之治"。但司马炎犯了一个致命的错误：大封同姓王并赋予兵权各王出镇一方都督诸军事。',evaluation:'晋武帝统一天下是伟大的功业，但他在继承人问题上犯下了不可饶恕的错误——明知司马衷智力低下仍立为太子。大封同姓王看似巩固司马氏的统治，实际上把老虎养在了身边，这些老虎在他死后立刻互相撕咬。',impact:'西晋的短暂统一如昙花一现——仅十一年后武帝去世便爆发八王之乱，紧接着永嘉之乱五胡乱华。这再次证明：统一难守成更难，建立一个制度远比建立一个王朝重要。'},
      {name:'八王之乱',desc:'公元291至306年，西晋宗室诸王为争夺中枢权力爆发了长达十六年的血腥内讧。汝南王、楚王、赵王、齐王、长沙王、成都王、河间王、东海王相继卷入混战，战火燃遍中原大地，西晋国力消耗殆尽，此后无力抵御内迁少数民族的反抗。',background:'武帝去世后智力低下的惠帝司马衷即位，皇后贾南风悍妒多谋开始干政。司马炎生前大封同姓王的制度设计——各王"出镇方面都督诸军事"手握兵权——为即将爆发的内战提供了充足的"弹药"。',process:'291年贾南风联合楚王司马玮诛杀辅政的外戚杨骏，随后反手杀掉司马玮独揽大权。300年赵王司马伦起兵杀贾南风后竟然废惠帝自立为帝——宗室在禅让之外自行称帝前所未有。齐王冏、成都王颖、河间王颙、长沙王乂、东海王越相继起兵混战，十六年间"城头变幻大王旗"血流成河。',result:'八王之乱使西晋精锐部队全部消耗在内战之中——数十万人死亡。更致命的是西晋在北方的军事力量被抽空，内迁的匈奴鲜卑羯氐羌等少数民族趁虚而入——"五胡"坐等晋室自相残杀准备入主中原。',evaluation:'八王之乱是制度设计失败的经典案例。晋武帝以为分封同姓王能拱卫中央却不知赋予宗室兵权等于把武器分发给潜在的叛乱者。制度设计必须考虑人性中最坏的面向——有枪的人终究会想用枪来获取更多。',impact:'八王之乱是西晋由盛转衰的转折点也是五胡乱华的导火索。内乱比外患更致命——中原的精锐部队不是死在抵御外敌的战场上而是死在了家族内部的权力争夺中。这个教训在后世被反复验证。'},
      {name:'永嘉之乱',desc:'公元311年，匈奴贵族刘曜率军攻破西晋都城洛阳，俘虏晋怀帝，屠杀王公士民三万余人，焚烧宫室。建兴四年（316年）刘曜又攻陷长安，俘虏晋愍帝，西晋灭亡。中原士族纷纷携家南迁，史称"衣冠南渡"。',background:'八王之乱后西晋国力被掏空。内迁的匈奴贵族刘渊以"复兴汉业"为号召在左国城称汉王建立匈奴汉国。刘渊死后其子刘聪继位派族弟刘曜和羯人石勒率军南下。',process:'311年（永嘉五年）刘曜与石勒联军攻破洛阳。晋怀帝被俘至平阳后被刘聪当仆人使唤——让他在宴会上穿青衣给匈奴贵族斟酒。王公士民三万余人被杀，匈奴兵挖掘晋朝皇陵焚毁宫室。316年刘曜再次出兵攻入长安晋愍帝出降。西晋正式灭亡，立国仅五十一年。',result:'西晋灭亡后中原沦为五胡纷争的战场。晋宗室司马睿在江东士族支持下在建康称帝建立东晋，大批中原士民——士族和庶民——跟随南迁。"洛京倾覆中州士女避乱江左者十六七"。',evaluation:'永嘉之乱是中华文明遭遇的一次重大劫难。西晋从统一天下到亡国仅三十七年——创下了中国历史上统一王朝最短命的记录。上层的内耗和腐败一旦到达临界点整个文明都会面临倾覆。"永嘉之祸"成为后世文人痛心疾首的历史记忆。',impact:'衣冠南渡是中国历史上第一次大规模的南北人口迁移。大批中原士族和百姓南迁极大推动了江南地区的经济文化开发，中国经济重心从此开始南移。这次南迁也保存了中华文明的核心火种使之能在南方延续发展。'},
      {name:'司马睿建立东晋',desc:'公元317年，西晋宗室司马睿在南迁士族的拥戴下于建康（今南京）称帝建立东晋。当时有"王与马，共天下"之说——琅琊王氏的代表人物王导在内主持朝政，其堂兄王敦在外统率军队，士族门阀势力一度凌驾于皇权之上。',background:'永嘉之乱前司马睿已被任命为安东将军都督扬州诸军事坐镇建业。洛阳长安相继陷落后中原士族纷纷南逃。但司马睿在江东本无根基——他是晋宗室的远支在江南没有影响力。',process:'王导（琅琊王氏）运用其巨大影响力说服江东本土士族顾荣贺循等接受司马睿的领导。317年晋愍帝被俘消息传到建康后司马睿在百官劝进下先即晋王位次年正式称帝。登基之日司马睿拉着王导要他同坐御床接受百官朝贺——"王与马共天下"的局面由此形成。',result:'东晋偏安江南以建康为都城延续了晋室一百余年。但东晋政权从一开始就是弱势皇权——"王与马共天下"意味着皇权与士族共治，此后庾氏桓氏谢氏等大族轮流掌权皇帝形同虚设。',evaluation:'东晋的建立是以王导为代表的士族与司马睿为代表的皇权之间的政治交易。为了换取士族支持皇权付出了让渡权力的代价——皇帝"垂拱"士族"当轴"。这种模式虽维持了东晋百余年的稳定但也决定了它始终无法强大到统一中国。',impact:'东晋的建立和衣冠南渡彻底改变了中国南北格局。中原文化精华迁入江南后江南从蛮荒之地逐渐变成中国的经济文化重心。南京从此成为六朝古都——"江南佳丽地金陵帝王州"。'},
      {name:'淝水之战',desc:'公元383年，前秦皇帝苻坚率八十余万大军南下欲一举灭晋。东晋宰相谢安坐镇建康指挥，其弟谢石、侄谢玄率八万北府兵在淝水大败前秦军，苻坚身中流矢逃回北方，前秦随即土崩瓦解。"风声鹤唳、草木皆兵"均出自此战。',background:'前秦天王苻坚在名相王猛辅佐下统一了北方。王猛临终前恳切告诫苻坚"晋虽僻陋正朔相承，愿勿以晋为图"。但王猛去世八年后苻坚被统一天下的雄心冲昏了头脑，不顾举朝反对执意南征。',process:'383年苻坚率步兵六十万骑兵二十七万号称百万南下。"以吾之众旅投鞭于江足断其流"。东晋宰相谢安以谢石为征讨大都督谢玄为前锋都督率八万北府兵迎击。两军在淝水隔河对峙。谢玄要求秦军稍退让晋军过河决战，苻坚想趁晋军半渡出击便下令撤退。但多民族拼凑的秦军号令不一，撤退变成溃退。东晋降将朱序在阵后大喊"秦军败了！"全军崩溃。晋军渡河追击秦军自相践踏，"风声鹤唳草木皆兵"。苻坚身中流矢逃回北方。',result:'淝水之战保全了东晋和南方华夏文明。前秦帝国随即土崩瓦解——鲜卑慕容垂建立后燕、羌人姚苌建立后秦。苻坚不久被姚苌缢死于新平佛寺。北方重新分裂。',evaluation:'淝水之战说明军队战斗力不在人数而在凝聚力。百万拼凑之众不敌八万同仇敌忾之士。谢安接到捷报后面不改色继续下棋——"小儿辈遂已破贼"。这句轻描淡写背后是"镇之以静"的极致从容。',impact:'淝水之战保全了南方华夏文明使其免遭吞并。战后北方重新分裂中国进入南北朝对峙。"风声鹤唳""草木皆兵""东山再起""投鞭断流"等成语皆源于此战，至今活跃在日常语言中。'},
      {name:'刘裕代晋建宋',desc:'公元420年，东晋权臣刘裕逼迫晋恭帝禅让，在建康称帝建立宋朝（刘宋），东晋灭亡。刘裕出身寒门从军起家，"气吞万里如虎"，但在北伐即将成功之际因后方变故功亏一篑。从此南方进入南朝时期。',background:'刘裕出身贫寒种过田砍过柴捕过鱼被称为"寄奴"。在镇压孙恩起义和讨伐桓玄之乱中崛起，后又北伐灭南燕、灭谯蜀、灭后秦，功业在偏安政权中堪称空前。',process:'刘裕收复长安灭后秦后声望达到顶点，但他急于回建康夺取帝位留下年仅十二岁的儿子刘义真留守长安。长安很快被赫连勃勃攻陷北伐成果付之东流。420年刘裕逼迫晋恭帝禅让代晋称帝国号"宋"。东晋灭亡南朝开始。但刘裕开创了杀前朝末帝的恶劣先例——晋恭帝禅位后被刘裕派人用被子闷死。',result:'刘裕在位期间整顿吏治打击豪强轻徭薄赋，江南出现了东晋以来少有的清明局面。但他仅在位两年便病逝。此后南朝各代取而代之者无不杀前朝末帝，血腥循环持续一百七十年。',evaluation:'刘裕是中国历史上唯一从社会最底层爬到皇帝的贫民——从砍柴捕鱼到"气吞万里如虎"的帝王。辛弃疾"想当年金戈铁马气吞万里如虎"写的就是他。但他杀前朝末帝开启了极其恶劣的先例，南朝政治从此染上了难以洗刷的血腥。',impact:'刘裕代晋标志着门阀政治的衰落和寒门武人集团的崛起。皇帝从此不再是士族手中的傀儡。他北伐虽然功亏一篑但毕竟证明南方政权也有能力主动出击——这个精神遗产被后来的陈霸先等人继承。'}
    ],
    figures:[
      {name:'司马炎',desc:'字安世（236—290年），西晋开国皇帝。265年逼魏元帝禅让称帝，280年灭吴统一全国。在位前期推行占田制使社会经济有所恢复，但在继承人选择上犯下大错——立智力低下的长子司马衷为太子，为八王之乱埋下祸根。'},
      {name:'司马睿',desc:'字景文（276—323年），东晋开国皇帝。西晋灭亡后在南迁士族王导等人的拥戴下于建康称帝。"王与马共天下"的局面使其权力受到琅琊王氏的极大制约，在位期间始终未能真正集权。'},
      {name:'王导',desc:'字茂弘（276—339年），东晋丞相。辅佐司马睿在建康建立东晋，在内主持朝政调和南北士族关系，力主"镇之以静"的治国方针稳定了东晋初年的政治局面，被誉为"江左管夷吾"。'},
      {name:'王羲之',desc:'字逸少（303—361年），东晋书法家，被尊为"书圣"。永和九年（353年）在兰亭集会上写下《兰亭序》，被誉为"天下第一行书"。其书法兼善隶草楷行各体，风格平和自然遒美健秀，影响中国书法一千六百年。'},
      {name:'陶渊明',desc:'字元亮（约365—427年），号五柳先生，东晋诗人。曾任彭泽县令八十余日即"不为五斗米折腰"辞官归隐，是中国田园诗派的开创者。《桃花源记》《归去来兮辞》千古传诵，塑造了中国文人的隐逸精神和田园理想。'},
      {name:'顾恺之',desc:'字长康（约348—409年），东晋画家，被尊为"画祖"。擅长人物画和肖像画，提出"以形写神"的绘画理论，传世作品《女史箴图》《洛神赋图》是中国早期绘画的巅峰之作。'},
      {name:'谢安',desc:'字安石（320—385年），东晋名相。四十余岁始出仕，淝水之战中坐镇建康运筹帷幄，以八万北府兵大败前秦苻坚八十余万大军，创造了中国战争史上以少胜多的经典战例。"东山再起"的典故即出自他。'},
      {name:'刘裕',desc:'字德舆（363—422年），南朝宋开国皇帝。出身寒门从北府兵普通士兵做起，以军功步步高升，先后灭南燕后秦，"气吞万里如虎"。420年迫使东晋恭帝禅让，建立宋朝（刘宋），南朝由此开始。'}
    ],
    inventions:['行书与草书','山水诗','田园诗','玄学思想'],
    turningPoints:[{y:'316年',e:'西晋灭亡',d:'匈奴首领刘曜攻破长安，俘虏晋愍帝，西晋覆灭',s:'北方陷入五胡十六国大混乱，汉族士民大规模南迁'},{y:'383年',e:'淝水之战',d:'谢安坐镇建康指挥，其弟谢石、侄谢玄在淝水大败苻坚',s:'保住了江南汉族政权，延续了中华文明的正朔'}],
    color:'#C9A86A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/3798c5d5-c5c8-4a0d-8f1f-8c4c4f8f9a3d.jpg'
  },
  { id:'northern-southern', name:'南北朝时期', period:'420年 - 589年', start:420, end:589, founder:'刘裕/拓跋珪',
    desc:'南北朝时期是中国历史上又一个大分裂时期。南方经历了宋、齐、梁、陈四个朝代，北方则先后有北魏、东魏、西魏、北齐、北周五个政权。这一时期，佛教在中国广泛传播，石窟艺术（云冈、龙门石窟）达到鼎盛，民族融合加速推进。北魏孝文帝的汉化改革对中华文明发展具有里程碑意义。',
    events:[
      {name:'刘裕建宋与南朝开始',desc:'公元420年，刘裕代东晋建宋（刘宋），定都建康，南朝由此开始。',background:'刘裕出身寒微从北府兵底层士兵以战功步步高升，先后灭南燕、桓玄、谯蜀、后秦，功业之盛在偏安政权中堪称空前。收复长安后急于回建康夺取帝位留下幼子守长安，北伐成果付之东流。',process:'420年刘裕逼迫晋恭帝禅让在建康称帝国号宋（刘宋）。推行土断法打击士族隐匿人口、轻徭薄赋恢复经济。但他开创了杀前朝末帝的恶劣先例——晋恭帝被用被子闷死。南朝的血腥政治由此开始。',result:'刘宋建立后南朝开始。刘裕在位期间"清简寡欲严整有法度"，江南出现东晋以来少有的清明局面。但仅在位两年便病逝。此后南朝宋齐梁陈四代迭代，杀前朝末帝成为惯例。',evaluation:'刘裕是中国历史上唯一从社会最底层爬到皇帝的贫民。"气吞万里如虎"是对他最好的写照。但他开创的杀前朝末帝先例使南朝政治染上洗不净的血腥，四代之间无一例外。',impact:'刘裕代晋标志着门阀政治的衰落和寒门武人的崛起。从此皇帝不再是士族的傀儡，政治权力从门阀手中重新集中到皇权和军功集团手中。'},
      {name:'北魏统一北方',desc:'公元439年，鲜卑拓跋部建立的北魏终于统一了自西晋灭亡以来分裂了百余年的中国北方。',background:'西晋灭亡后北方陷入五胡十六国混战一百余年。鲜卑拓跋部从大兴安岭南下建立代国，386年拓跋珪改国号为魏（北魏）。经道武帝、明元帝、太武帝三代经营逐步强大。',process:'太武帝拓跋焘先后攻灭夏国、北燕、北凉等割据政权。439年灭北凉后中国北方自西晋灭亡以来首次重归统一。北魏统一后实行"以胡治胡、以汉治汉"的双轨政策，与南朝形成南北对峙格局。',result:'南北朝格局正式形成——北魏领有北方、南朝据有江南，对峙持续一百五十年。北方的统一为后来的孝文帝改革和民族大融合创造了稳定的政治环境。',evaluation:'北魏统一北方结束了五胡十六国的混乱，为民族大融合创造了条件。鲜卑人从草原进入中原后主动学习汉族文化，这种"征服者被被征服者的文化征服"的模式在后世多次重演。',impact:'北魏统一是隋唐大一统的重要前奏——正是北魏整合了北方的人力物力资源才使后来的北周、隋朝有了统一天下的物质基础。中华文明的民族融合在南北朝达到了一个新的高度。'},
      {name:'北魏孝文帝汉化改革',desc:'公元494年，北魏孝文帝拓跋宏力排鲜卑贵族旧势力的强烈反对，将都城从平城迁至洛阳，强制推行全面汉化。',background:'北魏统一北方已近六十年但鲜卑贵族仍保持草原传统。孝文帝幼年由汉族祖母冯太后抚养深受汉文化熏陶。他认识到要统治中原必须接受汉族文化否则迟早会被赶回草原。',process:'493年孝文帝以"南征"为名率大军到达洛阳，正值连日大雨贵族们苦不堪言。孝文帝趁机说"若不南征便迁都于此"，贵族们选择了迁都。迁都后推行全面汉化——禁穿胡服改穿汉服、禁说鲜卑语改说汉语、改鲜卑姓氏为汉姓（拓跋改元、步六孤改陆等）、鼓励鲜卑贵族与汉族通婚、采用汉族官制和礼仪。太子元恂因反对改革被废黜后处死。',result:'改革极大促进了北方民族大融合。鲜卑贵族逐渐融入汉族，洛阳成为繁荣的国际大都市。但改革也带来了副作用——留守北方的鲜卑守旧贵族与洛阳汉化贵族产生裂痕，为后来的六镇起义埋下伏笔。',evaluation:'孝文帝改革是人类历史上罕见的"自上而下"的民族融合案例——统治者主动放弃自己的语言服饰姓氏来融入被统治民族。这种自我否定的勇气超越了民族主义的历史局限。但在当时也引发了守旧势力的强烈反弹。',impact:'孝文帝改革加速了北方民族融合进程，为隋唐大一统帝国奠定了文化和社会基础。隋唐皇室都有鲜卑血统——隋文帝杨坚的妻子独孤伽罗是鲜卑人，唐太宗李世民的祖母和母亲也都是鲜卑人。中华民族的多元一体特质在这次改革中得到了充分体现。'},
      {name:'梁武帝与南朝佛教极盛',desc:'公元502年，萧衍代齐建梁（南梁），在位四十八年。梁武帝晚年笃信佛教，广建佛寺，"南朝四百八十寺"正是此时的写照。',background:'萧衍出身兰陵萧氏是南齐宗室之后，趁南齐内乱起兵夺取政权。前期勤政爱民，早上鸡鸣起床批阅奏章，冬天手指冻裂仍不停止，"天监之治"是南朝少有的治世。',process:'梁武帝晚年极度崇佛，四次舍身同泰寺"出家"——脱下龙袍穿上僧衣住进寺庙。每次都需要大臣们筹集亿万铜钱把他"赎"回来。他令全国僧尼吃素（从此中国佛教形成了素食传统），广建佛寺无数。建康城内佛寺达五百余所，僧尼十余万。"南朝四百八十寺多少楼台烟雨中"正是此时的写照。',result:'崇佛导致国家财力枯竭——巨额财富用于建寺赎身而非军备民生。朝政荒废奸臣当道。548年侯景之乱中八十六岁的梁武帝被叛军囚禁于台城活活饿死。南梁随即崩溃。',evaluation:'梁武帝的悲剧在于将宗教狂热置于治国理政之上——一个皇帝可以信仰佛教但不能用管理寺庙的方式来管理国家。"南朝四百八十寺"的繁华表象下是国家根基的空虚。慈悲不能代替法治信仰不能取代治理。',impact:'梁武帝的教训成为后世帝王的重要警示——宗教虔诚与政治责任之间存在不可逾越的边界。但他在佛教中国化方面的贡献是深远的：素食传统、水陆法会等中国佛教特色均始于梁武帝时期。'},
      {name:'侯景之乱',desc:'公元548年，东魏降将侯景在寿阳起兵叛梁，次年攻破建康，将八十余岁的梁武帝萧衍囚禁饿死于台城。',background:'侯景是东魏的羯族将领勇猛善战但野心极大。东魏高澄上台后侯景与高澄不合先后向西魏和南梁求降。梁武帝贪图河南之地接纳了侯景——有人警告"接纳侯景如同养虎为患"。',process:'548年侯景探知南梁内部空虚在寿阳起兵叛乱。梁武帝的侄子萧正德贪图皇位竟与侯景里应外合。侯景军攻破建康将台城团团包围。城中粮食耗尽尸横遍野。八十六岁的梁武帝被囚禁饿死。侯景进入建康后大肆烧杀抢掠，屠杀王公大臣无数。富庶繁华的建康化为废墟。',result:'侯景之乱使江南遭受毁灭性打击——建康人口从一百余万降至不足十万。南梁在混乱中灭亡，随后陈霸先平定侯景收复建康建立南陈。但南朝元气已伤再也无力与北方抗衡。',evaluation:'侯景之乱是南朝由盛转衰的转折点。梁武帝好心办坏事的教训——出于慈悲接纳侯景却给江南带来了更大灾难。在国际政治中仁慈如果没有实力做后盾往往会带来灾难。',impact:'侯景之乱后南方人口锐减经济凋敝，南北实力对比彻底向北方倾斜。南朝从此再无北伐之力，统一天下的历史使命转移到了北方政权手中。建康的毁灭也使南京的城市发展出现断层。'},
      {name:'北周灭北齐统一北方',desc:'公元577年，北周武帝宇文邕亲率大军攻灭北齐，统一了中国北方。',background:'北魏分裂为东魏西魏后，东魏被高洋篡位建立北齐、西魏被宇文觉篡位建立北周。北齐据有富庶的关东地区但后期政治极度腐败——"无愁天子"高纬荒淫无道。北周据有关中相对贫瘠但厉行改革。',process:'北周武帝宇文邕诛杀权臣宇文护后亲政。他推行"灭佛"运动没收寺院田产和数百万僧尼还俗参军——"求兵于僧众之间取地于塔庙之下"国力大增。577年宇文邕亲率大军东征北齐，北齐军队一触即溃高纬被俘后被处死。北方统一。',result:'北周统一北方为随后的隋朝统一天下奠定了基础。但宇文邕统一后仅一年便病逝年仅三十六岁，儿子宇文赟荒淫无道即位一年便暴毙——政权落入外戚杨坚手中。',evaluation:'北周武帝成功的关键在于"灭佛"——佛教寺院占有大量土地和人口不纳税不参军已严重削弱国家基础。他不信神佛信实力，用真金白银充实了军队。可惜天不假年大业未竟。',impact:'北周统一北方直接为隋朝的统一铺平了道路。杨坚从北周手中接过的已是一个统一了北方的强大政权，只需再加上灭陈一战。这也是为什么隋文帝能在短短八年内完成统一大业。'},
      {name:'杨坚代周建隋',desc:'公元581年，北周外戚杨坚以"受禅"为名取代年仅七岁的周静帝，建立隋朝。589年隋文帝派大军南下灭陈，结束了近四百年的分裂局面。',background:'北周武帝去世后继位的宣帝宇文赟残暴荒淫即位仅一年暴毙，留下七岁的静帝。杨坚作为静帝的外祖父以外戚身份掌握朝政大权。他迅速清除北周宗室势力——将宇文氏诸王召入京城后全部处死。',process:'581年杨坚逼迫静帝禅让称帝建立隋朝定都长安。587年灭西梁、589年派杨广率五十一万大军南下灭陈。陈后主与宠妃张丽华躲入井中被搜出俘虏。岭南的冼夫人率众归降。自东汉末年以来近四百年的分裂终告结束天下归一。',result:'隋文帝杨坚在位期间推行均田制轻徭薄赋、整顿户籍实行"大索貌阅"清查隐漏人口、废除酷刑制定《开皇律》、改革中央官制确立三省六部。隋朝迅速强盛起来府库充盈人口大增。',evaluation:'杨坚结束了近四百年的分裂是人类历史上最伟大的统一事业之一。他个人虽节俭勤政但在继承人问题上犯了大错——废长立幼选择杨广导致了隋朝二世而亡。',impact:'隋朝统一为此后的盛唐奠定了政治制度框架和经济基础。三省六部制、科举制、均田制、府兵制都被唐朝继承并发扬光大。大运河更是成为此后千年中国南北经济文化交流的大动脉。'}
    ],
    figures:[
      {name:'刘裕',desc:'字德舆（363—422年），南朝宋开国皇帝。出身寒门，从北府兵底层士兵以战功步步高升，先后灭南燕后秦，辛弃疾赞其"气吞万里如虎"。420年迫使东晋恭帝禅让建立刘宋，南朝由此开始。'},
      {name:'北魏孝文帝',desc:'拓跋宏（467—499年），北魏第七位皇帝。五岁即位由祖母冯太后摄政，亲政后于494年力排鲜卑贵族反对将都城从平城迁至洛阳，强制推行全面汉化改革——禁胡服胡语改鲜卑姓为汉姓娶汉族女子，极大促进了北方民族大融合。'},
      {name:'梁武帝萧衍',desc:'字叔达（464—549年），南梁开国皇帝。在位四十八年前期勤政爱民被称为"天监之治"，但后期极度崇佛四次舍身同泰寺出家，耗尽国力。侯景之乱中被叛军囚禁于台城活活饿死，享年八十六岁。'},
      {name:'陈霸先',desc:'字兴国（503—559年），南陈开国皇帝。出身寒微从基层军官做起，平定侯景之乱收复建康，557年迫使梁敬帝禅让建立南陈。在位期间稳定了江南残破局面。'},
      {name:'祖冲之',desc:'字文远（429—500年），南朝数学家天文学家。首次将圆周率推算到小数点后第七位（3.1415926—3.1415927之间），这一精度领先世界近千年。还编制了《大明历》，首次引入岁差概念。'},
      {name:'郦道元',desc:'字善长（约470—527年），北魏地理学家。所著《水经注》四十卷约三十万字，详细记述了一千二百五十二条河流及相关历史遗迹和风土人情，是中国古代最全面系统的综合性地理著作。'},
      {name:'贾思勰',desc:'北魏农学家。所著《齐民要术》约十一万字，系统总结了六世纪以前黄河中下游地区的农牧渔业生产经验，是中国现存最早最完整的农学百科全书。'}
    ],
    inventions:['均田制','三长制','石窟艺术','《水经注》','《齐民要术》'],
    turningPoints:[{y:'494年',e:'孝文帝改革',d:'北魏孝文帝拓跋宏迁都洛阳，禁胡服胡语，改鲜卑姓为汉姓',s:'极大促进了民族大融合，为隋唐大一统奠定文化和制度基础'},{y:'589年',e:'隋朝统一',d:'隋文帝杨坚派晋王杨广率五十一万大军南下灭陈，俘虏陈后主',s:'结束自东汉末年以来近四百年的分裂局面，中国重归统一'}],
    color:'#D4AF6A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/2e2c0e6e-e6e7-4a1f-9f2f-9d5d5f0f6a2e.jpg'
  },
  { id:'sui', name:'隋朝', period:'581年 - 618年', start:581, end:618, founder:'隋文帝杨坚',
    desc:'隋朝虽然国祚短暂仅37年，但它结束了近三百年的分裂局面，重新统一了中国。隋文帝开创了科举制度，隋炀帝修建了贯通南北的大运河。这些制度创新和重大工程建设对后世影响极为深远。科举制打破了门阀士族对政治权力的垄断，大运河则成为此后千年中国经济的大动脉。',
    events:[
      {name:'杨坚建立隋朝',desc:'公元581年，北周外戚杨坚以"受禅"之名取代年仅七岁的周静帝宇文阐，即位于长安建立隋朝，是为隋文帝。',background:'北周武帝灭北齐统一北方后不幸英年早逝。继位的宣帝宇文赟残暴荒淫即位一年便暴毙，留下七岁静帝。杨坚作为静帝外祖父以外戚身份入朝辅政，迅速将北周宗室诸王召入京师全部诛杀清除政敌。',process:'581年杨坚逼迫静帝禅让称帝建立隋朝定都长安。为消除"欺负孤儿寡母"的骂名他竭力证明自己比宇文氏更有能力治理天下——登基后励精图治每天早起晚睡批阅奏章，推行均田制轻徭薄赋、整顿户籍"大索貌阅"清查隐漏人口、废除酷刑制定《开皇律》。',result:'隋朝在短短数年内强盛起来——府库充盈、人口大增、边境安宁。突厥分裂为东西两部后向隋称臣，隋文帝被尊为"圣人可汗"。',evaluation:'杨坚夺位手段虽然不光彩但他用治理成果证明了自己。然而他在继承人问题上犯了大错——先立杨勇为太子后被独孤皇后和杨广说服改立杨广，导致隋朝二世而亡。立储是古代帝王最重大的决策之一，一念之差毁了一个王朝。',impact:'隋文帝的统一为后来的盛唐奠定了制度和经济基础。他所创的三省六部制、均田制、府兵制被唐朝继承完善，科举制的雏形也在他手中出现。'},
      {name:'隋灭南陈统一全国',desc:'公元589年，隋文帝派晋王杨广率五十一万大军分八路南下伐陈，俘虏沉湎酒色的陈后主陈叔宝。自西晋永嘉之乱以来分裂了273年的中国终于重归统一。',background:'隋朝建立后南方尚有陈朝据有江南。陈后主陈叔宝沉湎酒色宠幸张丽华，所作《玉树后庭花》被后世视为"亡国之音"。当隋朝在北方厉兵秣马时陈后主还在宫中饮酒作诗。',process:'588年隋文帝下诏列举陈后主二十大罪状印制三十万份散发江南。589年杨广率五十一万大军分八路南下，隋军势如破竹。陈后主直到隋军渡江后才慌忙组织抵抗但为时已晚。隋军攻入建康陈后主与张丽华孔贵妃三人躲入枯井中被搜出俘虏。岭南的冼夫人率众归附。',result:'自西晋永嘉之乱（311年）以来分裂了273年的中国重新统一。隋文帝将陈后主迁往洛阳封为长城公。"门外韩擒虎楼头张丽华"——韩擒虎以五百精骑入朱雀门的壮举成为千古传奇。',evaluation:'隋灭陈是中国历史上最经典的大一统收复战——军事准备充分、政治宣传到位、时机选择精准。陈后主"商女不知亡国恨隔江犹唱后庭花"的昏聩与隋军的雷霆万钧形成鲜明对比。',impact:'统一使隋朝获得了江南的富庶粮仓和人力资源，全国人口恢复到五千万以上。长江天堑不再是分裂的理由，南北经济文化交流进入全新时代。这次统一为盛唐文明奠定了国土和人口基础。'},
      {name:'开创科举制度',desc:'隋文帝废除九品中正制，隋炀帝于大业年间正式设立进士科，以考试策问取士取代门第荐举。',background:'九品中正制自曹魏以来已推行近四百年，造成"上品无寒门下品无世族"——政治权力被门阀士族完全垄断，出身决定命运。隋朝统一后需要大量官员管理全国，而旧的门阀荐举制度无法提供足够的合格人才。',process:'隋文帝首先废除九品中正制改用荐举和策试。隋炀帝在大业年间正式设立"进士科"——以考试策问取士。虽然隋朝的科举还处于萌芽阶段考试内容以策论为主尚未有后世那么规范，但它标志着一个革命性的转变——以考试成绩而非家族出身来决定谁能当官。',result:'科举制打破了门阀士族对政治权力的垄断，为寒门子弟提供了通过读书改变命运的通道。"朝为田舍郎暮登天子堂"成为可能。唐朝沿袭并完善了科举制，此后延续一千三百年。',evaluation:'科举制是人类历史上最伟大的制度创新之一——它在一个等级森严的社会中开了一扇"向上流动"的窗。通过公平考试选拔人才的理念后来被西方文官制度吸收，影响了世界政治文明进程。',impact:'科举制深刻塑造了中国社会——"万般皆下品惟有读书高"成为普遍价值观。它以制度化的方式维系了大一统国家的文化认同和治理基础。一个四川的穷书生和一个江南的富家子在考场上公平竞争，这种想象激励了无数中国人。'},
      {name:'开凿大运河',desc:'公元605至610年，隋炀帝征发百万民夫开凿以洛阳为中心、南起余杭北至涿郡的大运河，全长两千余公里。',background:'中国地形西高东低主要河流均为东西流向，南北之间缺乏天然水路通道。长期分裂后统一国家需要高效的南北运输系统——南方的粮食需要北运供应京师和边防、中央政令需要快速传达四方。',process:'605年隋炀帝下令开凿通济渠连接洛阳与淮河、邗沟连接淮河与长江；608年开凿永济渠连接洛阳与涿郡（今北京）；610年开凿江南河连接长江与余杭（今杭州）。大运河全长两千余公里沟通海河黄河淮河长江钱塘江五大水系。工程征发民夫数百万"役丁死者什四五"。',result:'大运河成为此后千年中国经济南北交流的大动脉。南方的粮食丝绸茶叶瓷器北方的马匹铁器沿着运河北上与南下。沿河城市——扬州汴州临安——因漕运而极度繁荣。',evaluation:'大运河是中国古代最伟大的工程之一其经济价值不亚于万里长城。但隋炀帝"功在千秋罪在当代"——在短短六年间完成如此浩大的工程代价是百姓生命。"东南四十三州地取尽膏脂是此河"——大运河是血泪铸成的奇迹。',impact:'大运河改变了中国经济的空间格局——"苏湖熟天下足""天下赋税十之七八出于江南"皆因运河之便。此后唐、宋、元、明、清各代都将维护漕运作为国策。大运河至今仍在发挥灌溉防洪航运等重要作用。'},
      {name:'完善三省六部制',desc:'隋朝将中央行政体制规范为三省六部，这套高效分权的中央官制被唐朝继承并成为此后中国历代王朝中央行政的基本框架。',background:'秦汉以来中央官制不断演变但缺乏系统化的权力制衡设计。丞相权力过大时威胁皇权、权力过散时行政效率低下。隋朝统一后需要一套既能提高效率又能防止专权的中央行政体制。',process:'隋文帝和隋炀帝在总结前朝经验的基础上确立了"三省六部"架构——中书省草拟政令（决策）、门下省审核封驳（审议）、尚书省负责执行（行政）。尚书省下设六部：吏部管人事、户部管财政、礼部管礼仪教育、兵部管军事、刑部管司法、工部管建设。三省长官均为宰相集体议政避免了单一宰相权力过大的问题。',result:'三省六部制实现了决策审议执行三权分立与制衡的理想设计。唐朝完全沿袭了这一制度并将其规范化和细化。此后宋元明清虽然具体名称和职能有所变化但六部的架构延续至清末。',evaluation:'三省六部制是中国古代政治制度设计的巅峰之作——它将权力分解为三个互相制约的环节哪个环节都不能独大。这一设计理念与现代三权分立有相通之处，但它是在行政体系内部的分权而非立法司法行政之间的分权。',impact:'三省六部制影响了此后一千三百年的中国政治制度。日本律令制下的"二官八省"也深受三省六部制影响。这种制度设计的核心逻辑——通过分权来防止权力滥用——至今仍有启发意义。'},
      {name:'三征高句丽',desc:'公元612至614年，隋炀帝倾全国之力三次亲征高句丽，动用兵力超过百万，民夫加倍。三次征讨耗费了巨量人力物力，民不聊生激起遍地农民起义，加速了隋朝的崩溃。',background:'高句丽据有辽东和朝鲜半岛北部是东北亚强国。隋文帝曾派三十万大军征讨失利。隋炀帝自比秦皇汉武认为征伐高句丽是完成帝国版图统一的最后一块拼图。但高句丽据险而守城池坚固——尤其是辽东城（今辽宁辽阳）易守难攻。',process:'612年第一次远征出动一百一十三万大军号称二百万，"旌旗亘千里"前所未有。但隋军深入辽东后补给困难，渡过萨水（今清川江）的三十万先锋部队遭到高句丽大将乙支文德的伏击仅两千七百人生还。613年第二次远征正围攻辽东城时后方杨玄感在黎阳叛乱隋炀帝被迫回师。614年第三次远征高句丽国王虽表面对隋称臣但隋炀帝已无力再战。',result:'三次远征耗费人力物力之巨史无前例——民夫累死于道者不计其数、天下骚动。王薄在长白山高唱"无向辽东浪死歌"号召逃避兵役。农民起义从星星之火迅速燎原。隋炀帝三征高句丽后隋朝已是一具空壳。',evaluation:'征高句丽是隋朝速亡最直接的原因。隋炀帝的致命错误在于将有限的国力倾注于无限扩张——他的野心超出了国家的承受能力。"其功也巨其过也暴"是对他最公允的评价。',impact:'三征高句丽的失败直接导致了隋末农民大起义和隋朝的覆亡。唐朝建立后唐太宗也三次征高句丽均未成功，直到唐高宗时期才最终灭亡高句丽。隋炀帝的教训警示后来者：战争必须量力而行否则胜利也是失败。'},
      {name:'隋朝灭亡',desc:'公元618年，隋炀帝杨广在江都（今扬州）被禁军将领宇文化及缢杀。李渊在长安废隋恭帝自立为帝建立唐朝，隋朝仅存在37年便覆亡。',background:'三征高句丽后全国农民起义此起彼伏——瓦岗军翟让李密据河南、窦建德据河北、杜伏威据江淮。隋炀帝心灰意冷逃往江都，"我梦江南好征辽亦偶然但存颜色在离别只今年"——连他自己也知道末日将至。',process:'618年禁军骁果卫士多为关中人思念家乡不愿留在江南。宇文化及利用这种情绪发动兵变冲入江都宫中。隋炀帝问"天子死法"自己解下腰带被缢死于寝殿。李渊在长安闻讯后废黜隋恭帝杨侑自立为帝建立唐朝。隋朝立国仅37年便覆亡。',result:'李渊建立唐朝后派李世民率军消灭各路割据势力，经数年征战统一全国。"昔秦之亡也天下共逐秦皇；隋之亡也群雄竞逐其鹿"——隋末群雄逐鹿的英雄谱成为了后来传奇小说的重要素材。',evaluation:'隋朝与秦朝惊人地相似——都是结束长期分裂后建国的短命统一王朝、都是一代强盛二代速亡、都留下了永垂不朽的制度遗产。秦朝十五年隋朝三十七年，历史似乎重复了一次但给了更长的周期。教训也是相同的：可以马上得天下不能马上治天下，可以压榨民力完成伟业但不能超出人民承受的极限。',impact:'隋朝虽短但其制度遗产影响深远——三省六部、科举制、大运河、均田制全部被唐朝继承。唐朝的伟大很大程度上得益于站在隋朝这个巨人的肩膀上。隋朝的速亡教训也让唐初统治者选择了"以民为本"的治国路线。'}
    ],
    figures:[
      {name:'隋文帝杨坚',desc:'（541—604年），隋朝开国皇帝。原为北周外戚，581年以受禅之名取代年仅七岁的周静帝建立隋朝。589年南下灭陈统一中国，推行均田制轻徭薄赋。在位期间政治清明、国力迅速恢复，史称"开皇之治"。'},
      {name:'隋炀帝杨广',desc:'（569—618年），隋朝第二位皇帝。修建大运河贯通南北、创立进士科开创科举、营建东都洛阳，功业巨大但急功近利伤民过重。三征高句丽耗尽国力引发天下大乱，618年在江都被宇文化及缢杀。'},
      {name:'独孤皇后',desc:'隋文帝杨坚的皇后，名伽罗。与杨坚感情深厚，杨坚在位期间在后宫事务和政治决断上对她颇为倚重，宫中并称"二圣"。她力主废太子杨勇立杨广为嗣，间接影响了隋朝的命运。'},
      {name:'宇文化及',desc:'隋朝禁军将领。618年在江都发动兵变缢杀隋炀帝杨广，立秦王杨浩为傀儡皇帝自封大丞相。后被瓦岗军首领李密击败，逃往聊城途中被窦建德擒杀。'}
    ],
    inventions:['科举制度','大运河','赵州桥','三省六部制'],
    turningPoints:[{y:'605年',e:'开创科举制',d:'隋炀帝正式设立进士科，以考试选拔人才代替门第荐举',s:'打破门阀垄断，开辟了平民通过读书入仕的道路，影响中国一千三百年'},{y:'605—610年',e:'修建大运河',d:'以洛阳为中心，南起余杭北至涿郡，全长两千余公里',s:'促进南北经济文化交流，成为此后千年中国经济的大动脉'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/3455d1f1-f1f2-4b2f-9a3f-0e6e6f7f5b3f.jpg'
  },
  { id:'tang', name:'唐朝', period:'618年 - 907年', start:618, end:907, founder:'唐高祖李渊',
    desc:'唐朝是中国历史上最强盛的王朝之一，国力强盛、文化繁荣、对外开放，是当时世界上最强大的国家。贞观之治和开元盛世是中国封建社会的巅峰时期。唐朝在诗歌、绘画、音乐、舞蹈等方面都达到了极高的成就，李白、杜甫、王维等诗人的作品至今广为传诵。唐朝对日本、朝鲜半岛、越南等周边地区影响深远。',
    events:[
      {name:'李渊称帝建唐',desc:'公元618年，隋太原留守李渊在次子李世民的极力推动下于长安太极殿称帝建立唐朝。',background:'隋末天下大乱群雄并起。李渊时任太原留守手握重兵但犹豫不决。次子李世民力劝父亲起兵——"今主上无道百姓困穷晋阳城外皆为战场。大人若守小节在下有寇盗上有严刑危亡无日矣。"',process:'617年李渊在太原起兵打出"尊隋讨贼"旗帜进军关中。他利用隋朝主力被瓦岗军和河北义军牵制的有利时机迅速渡过黄河攻入长安。立隋炀帝之孙杨侑为隋恭帝遥尊隋炀帝为太上皇。618年隋炀帝在江都被杀后李渊逼迫杨侑禅让正式称帝建立唐朝定都长安。',result:'唐朝建立后李渊派李世民率军东征西讨。经过虎牢关之战等关键战役陆续消灭薛举刘武周王世充窦建德等割据势力。至624年全国基本统一。',evaluation:'李渊建立唐朝的关键不在于他本人的能力多么出众而在于他有一个极其出色的儿子李世民。但他在继承人问题上摇摆不定——既放不下太子建成的法定地位又无法忽视世民的功劳——最终导致了玄武门之变的悲剧。',impact:'唐朝是中国历史上最辉煌的王朝之一。李渊作为开国皇帝虽被儿子李世民的光芒所掩盖但他"无为而治""与民休息"的治国方针为贞观之治奠定了基础。'},
      {name:'玄武门之变',desc:'公元626年，秦王李世民在长安玄武门设伏射杀太子李建成和齐王李元吉，随后逼迫唐高祖李渊立自己为太子。两个月后李世民即位为唐太宗。',background:'唐朝建立过程中李世民功盖天下——虎牢关一战擒双王（王世充窦建德）威震天下。太子李建成感到威胁联合齐王李元吉排挤李世民。李渊在两人之间摇摆不定既不忍废太子又无法忽视世民的功劳。矛盾已无法调和。',process:'626年六月初四清晨李世民率尉迟敬德等九名将领在玄武门设伏。李建成李元吉骑马入宫时发现异常调转马头想走。李世民一箭射死李建成、尉迟敬德杀李元吉。李世民派尉迟敬德全副武装入宫"保护"高祖李渊——实际是武力逼宫。李渊被迫立李世民为太子两个月后传位。',result:'李世民即位为唐太宗改元贞观。李建成和李元吉的十个儿子全部被杀。但李世民没有扩大清洗范围——前太子洗马魏征曾建议建成早除世民，李世民即位后反而重用魏征为谏议大夫。',evaluation:'玄武门之变是李世民一生的污点——杀兄逼父篡位在传统道德中罪不可赦。但他在夺位之后用贞观之治证明了自己的能力。历史评价李世民时往往将夺位的手段和治国的成果分开看待——这不是宽容而是对结果的客观承认。',impact:'玄武门之变开创了贞观之治也为后来的皇室政变提供了范本——权力斗争在宫廷内部解决比扩大到全国范围更好。李世民的儿子们后来也上演了夺位之争酿成悲剧。'},
      {name:'贞观之治',desc:'唐太宗李世民在位期间（627—649年），虚心纳谏知人善任，政治清明社会安定四夷宾服，是中国历史上治世的最佳范例。',background:'玄武门之变后李世民即位面对的是隋末战乱后残破的社会——"自伊洛以东暨乎海岱灌莽巨泽苍茫千里人烟断绝"。他深知"水能载舟亦能覆舟"，如不励精图治很可能重蹈隋炀帝的覆辙。',process:'李世民用人唯贤——房玄龄杜如晦为相（"房谋杜断"）、魏征为谏议大夫。魏征一生向太宗进谏二百余次当面批评毫不留情，太宗虽有时被气得说要杀他但事后总是说"以铜为镜可以正衣冠以古为镜可以知兴替以人为镜可以明得失。魏征死朕亡一镜矣"。轻徭薄赋减轻百姓负担、完善科举选拔人才、编修《五经正义》统一儒学。对外灭东突厥俘虏颉利可汗，被四方尊为"天可汗"。',result:'贞观年间"天下大稔流散者咸归乡里米斗不过三四钱"。贞观四年全国判死刑的仅二十九人——"几致刑措"。长安成为当时世界上最大最繁华的国际化大都市。',evaluation:'贞观之治的核心逻辑是"畏民"——李世民深知民众的力量可以推翻任何王朝所以竭尽全力做一个好皇帝。虚心纳谏不是因为他性格好而是因为他足够聪明——让有不同意见的人说真话可以避免灾难性决策。',impact:'贞观之治成为中国后世治国理政的最高标准。"贞观"二字成为盛世和明君的象征——此后历代君臣都以贞观为典范。《贞观政要》被翻译成多国文字至今仍是政治管理学的经典教材。'},
      {name:'玄奘西行取经',desc:'公元629至645年，高僧玄奘法师孤身西行求法，历经千难万险到达天竺（印度），归国后带回佛经六百五十七部。',background:'佛教自汉代传入中国已有数百年但经文翻译混乱多误，各宗派教义分歧严重。玄奘深感疑惑决心到佛教发源地天竺求取真经。但唐朝立国不久边境管制严格玄奘的出境申请被驳回。',process:'629年玄奘不顾禁令偷渡出境孤身西行——穿越戈壁沙漠翻越帕米尔高原途经西域中亚大小百余国。在印度那烂陀寺（当时世界最大的佛教学府）留学五年师从戒贤法师精通瑜伽师地论。在曲女城的无遮大会上与全印度高僧辩论十八日无人能胜被大乘尊为"大乘天"小乘尊为"解脱天"。645年回到长安受到太宗接见，带回佛经六百五十七部。',result:'玄奘在长安大慈恩寺主持翻译佛经十九年，译出七十五部一千三百三十五卷——中国佛经翻译的巅峰。其《大唐西域记》详细记述了中亚南亚一百多个国家的风土人情和历史地理。',evaluation:'玄奘是历史上最伟大的旅行家和翻译家之一——他孤身一人穿越地球上最严酷的地形只为求取真经。这种为追求真理不惜生命的精神超越了宗教和国界。《西游记》以玄奘为原型创造了唐僧形象，但真实的玄奘比小说中更伟大——他没有三个神通广大的徒弟保护，只有一个人面对万里征途。',impact:'玄奘带回的唯识宗学说丰富了中国佛教的理论体系。《大唐西域记》成为研究中亚南亚古代史的珍贵文献——印度许多佛教遗址就是根据此书的记载被重新发现的。玄奘的事迹也激励了无数后人在求知和探索的道路上勇往直前。'},
      {name:'武则天称帝',desc:'公元690年，唐高宗皇后武则天废唐睿宗自立为帝，改国号为"周"，是中国历史上唯一的女皇帝。',background:'武则天十四岁入宫为太宗的才人（妃嫔）。太宗死后入感业寺为尼，被继位的唐高宗李治重新接入宫中封为昭仪。她以极强的政治手腕和高超的谋略一步步从昭仪爬到皇后再到与高宗并称"二圣"临朝听政。',process:'高宗去世后武则天先立太子李显为中宗仅五十四天便废为庐陵王，再立李旦为睿宗将其软禁在别殿。690年武则天正式废睿宗自称圣神皇帝改国号为"周"定都洛阳。她推行殿试亲自面试考生、创立武举选拔军事人才、编修《姓氏录》打击关陇贵族势力。',result:'武则天在位十五年，延揽狄仁杰等名臣，保持了唐朝的繁荣态势。但任用周兴来俊臣等酷吏大兴告密之风株连无辜无数。705年宰相张柬之发动"神龙政变"逼迫武则天退位归政中宗。同年武则天病逝年八十二岁，遗诏去帝号称"则天大圣皇后"，墓前立无字碑。',evaluation:'武则天的历史评价极其复杂——她作为女性在男权社会中夺取最高权力展示了非凡的政治智慧和勇气。但她任用酷吏打压政敌的手段也令人不寒而栗。无字碑留给后人无限评说空间——也许最深刻的评价就是"无法评价"。',impact:'武则天证明了女性可以治理天下而且治理得并不比男性差。她推动了科举制的完善让更多寒门子弟进入仕途。无字碑成为中国历史上最著名的沉默——功过是非任凭后人评说。'},
      {name:'开元盛世',desc:'唐玄宗李隆基在位前期（713—741年）励精图治以姚崇宋璟为相，开元年间唐朝国力臻于极盛。',background:'武则天之后唐朝经历了中宗韦后之乱、太平公主之乱，政局动荡不安。李隆基联合太平公主发动"唐隆政变"诛杀韦后拥立睿宗，后又发动"先天政变"除掉太平公主掌握实权。',process:'玄宗以姚崇宋璟张九龄等名臣为相虚心纳谏整顿吏治。姚崇上《十事要说》作为施政纲领——以仁义治天下不贪边功、宦官不得干政、皇亲国戚不任台省官等。开元年间户口增加赋税减轻、物价低廉社会治安良好。长安人口超过一百万汇集了来自波斯阿拉伯印度日本等国的商人留学生和僧侣。',result:'开元年间唐朝达到极盛——"忆昔开元全盛日小邑犹藏万家室。稻米流脂粟米白公私仓廪俱丰实"。唐朝的疆域也达到最大范围东至朝鲜半岛西至中亚咸海地区南至越南。',evaluation:'开元盛世是中国古代社会最接近"理想国"的时期——经济繁荣文化昌盛军事强大社会开放。但盛极必衰——玄宗在位太久晚年怠于政事将朝政交给李林甫杨国忠等奸相，自己沉迷于与杨贵妃的爱情。开元盛世与天宝之乱之间的巨大反差令人唏嘘。',impact:'开元盛世代表了中国古代文明的最高水平。长安作为当时的国际大都市吸引了全世界的人才和文化。李白杜甫王维等诗人正是在这个时代创作了他们的不朽诗篇。盛唐气象——开放自信包容——至今仍是中国人怀念和向往的时代精神。'},
      {name:'安史之乱',desc:'公元755年，身兼范阳平卢河东三镇节度使的安禄山以"讨伐杨国忠"为名在范阳起兵叛乱。战乱持续七年多唐朝从此由盛转衰。',background:'唐玄宗晚年昏聩将朝政交给李林甫杨国忠等奸相。杨国忠与杨贵妃兄妹权势熏天。安禄山身为三镇节度使手握重兵对杨国忠积怨已久——杨国忠多次在玄宗面前说安禄山要造反。',process:'755年安禄山在范阳（今北京）起兵"渔阳鼙鼓动地来惊破霓裳羽衣曲"。叛军势如破竹攻下洛阳安禄山在洛阳称帝建国号"大燕"。随后攻破潼关长安门户洞开。玄宗仓皇逃往四川在马嵬坡禁军哗变杀死杨国忠逼迫玄宗赐死杨贵妃。"六军不发无奈何宛转蛾眉马前死"。太子李亨在灵武自立为帝（肃宗）遥尊玄宗为太上皇。郭子仪李光弼等将领率军与叛军展开旷日持久的拉锯战。763年叛乱最终平定历时七年多。',result:'安史之乱虽被平定但唐朝元气大伤——人口从五千三百万锐减至一千七百万。为平定叛乱朝廷不得不赋予各地节度使更大权力导致藩镇割据局面形成。安史之乱后唐朝再也无法恢复开元时期的强盛。',evaluation:'安史之乱是唐朝由盛转衰的分水岭。根本原因在于制度失衡——节度使集军政财权于一身权力过大而中央缺乏有效制衡。唐玄宗的个人悲剧也令人感慨——他年轻时励精图治开创了开元盛世年老后却因沉湎享乐而毁掉了自己创造的一切。"靡不有初鲜克有终"是对他最精准的评价。',impact:'安史之乱结束了盛唐时代中国经济重心加速南移江南成为朝廷的主要财政来源。藩镇割据的局面为后来的五代十国分裂埋下了伏笔。这场动乱也使中华文明的内敛性格开始形成——从开放到保守从进取到内敛。'},
      {name:'黄巢起义',desc:'公元875年，盐贩出身的黄巢响应王仙芝起义后成为起义领袖。880年军攻入长安建立"大齐"。884年起事最终失败但沉重打击了唐朝统治。',background:'安史之乱后唐朝中央权威衰落藩镇割据赋税沉重民不聊生。加之连年旱灾和蝗灾百姓"贫者以蓬子为粮磨面槐叶为齑"。874年王仙芝在长垣起义喊出"天补均平"口号。',process:'黄巢出身盐贩家庭善骑射通文墨。875年响应王仙芝起义后王仙芝战死黄巢成为义军领袖转战南北。880年攻克洛阳随后攻破潼关直入长安。唐僖宗逃往成都。黄巢在长安含元殿即皇帝位建国号"大齐"。但黄巢缺乏治理能力——入长安后纵兵抢掠大失民心。884年唐军反攻黄巢败退自刎于泰山狼虎谷。',result:'黄巢起义历时十年转战大半个中国，虽终被镇压但唐朝的统治根基已彻底瓦解。黄巢军过境之后各地节度使势力进一步坐大——朱温李克用等将领在镇压起义中壮大了实力。',evaluation:'黄巢起义与历代农民起义有相同的轨迹——以"均平"口号发动贫民声势浩大但因缺乏治国能力而迅速崩溃。"冲天香阵透长安满城尽带黄金甲"是他在科举落第后的诗句，表达了一个被社会体制排斥的人对社会体制的仇恨。',impact:'黄巢起义是唐朝灭亡的催命符。起义之后唐朝廷对地方的控制名存实亡，907年朱温篡唐只是压死骆驼的最后一根稻草。黄巢起义失败后大部分骨干战死或投降，但起义加速了门阀社会的彻底瓦解也为后来宋朝平民社会的到来扫清了障碍。'},
      {name:'朱温篡唐',desc:'公元907年，唐朝权臣朱温（朱全忠）逼迫唐哀帝李柷禅让在汴州称帝建立后梁。绵延289年的大唐帝国正式灭亡。',background:'黄巢起义中降将朱温背叛黄巢投唐被赐名"朱全忠"。他利用镇压起义之机扩充势力成为中原最强大的军阀。唐廷已沦为朱温手中的傀儡。',process:'904年朱温逼迫唐昭宗迁都洛阳途中将昭宗杀害。立十三岁的哀帝为傀儡。907年朱温逼迫哀帝禅让在汴州（今开封）称帝建国号"后梁"定都汴京。绵延289年的大唐帝国正式灭亡中国历史进入五代十国时期。',result:'朱温对待唐朝宗室极为残忍——将昭宗诸子全部杀害唐室被屠戮殆尽。但朱温的后梁仅存16年便被李存勖的后唐所灭。朱温本人被儿子朱友珪刺杀死于非命。',evaluation:'朱温叛变黄巢投降唐朝又灭唐朝自立——一生两次叛主。他虽然夺取了江山但维持不住——五代十国就是一个强者为王但谁都坐不稳的时代。篡位者终究也被别人篡位历史在这里形成了一个完美的循环。',impact:'唐朝灭亡标志着中国中古时代的结束。五代十国后中国进入宋朝——一个全新的平民社会。唐朝的文化遗产——诗歌书法绘画音乐——在此后千年中持续滋养着中华文明。唐诗至今被每个中国人传诵盛唐气象至今是中国人怀念的黄金时代。'}
    ],
    figures:[
      {name:'李世民',desc:'（598—649年），唐朝第二位皇帝唐太宗。发动玄武门之变夺位后开创贞观之治，以"水能载舟亦能覆舟"为治国理念，虚心纳谏知人善任，被四方尊为"天可汗"，是中国历史上最杰出的帝王之一，其治国思想被后世奉为典范。'},
      {name:'武则天',desc:'（624—705年），中国历史上唯一的女皇帝。原为唐太宗才人和唐高宗皇后，690年废唐睿宗自立为帝改国号为周。在位期间推行殿试和武举打破关陇贵族垄断，大力发展科举。无字碑留给后世无尽评说空间。'},
      {name:'李白',desc:'字太白（701—762年），号青莲居士，唐代伟大的浪漫主义诗人。诗风豪放飘逸想象奇绝，被尊为"诗仙"。杜甫赞其"笔落惊风雨诗成泣鬼神"，《将进酒》《静夜思》《望庐山瀑布》等千古传诵。'},
      {name:'杜甫',desc:'字子美（712—770年），号少陵野老，唐代伟大的现实主义诗人。以诗记录安史之乱前后社会动荡和人民苦难，被尊为"诗圣"，其诗被称为"诗史"。"朱门酒肉臭路有冻死骨"至今震撼人心。'},
      {name:'白居易',desc:'字乐天（772—846年），号香山居士，唐代大诗人。倡导新乐府运动主张"文章合为时而著歌诗合为事而作"，《长恨歌》《琵琶行》是中国叙事诗的双璧，语言通俗老妪能解。'},
      {name:'玄奘',desc:'（602—664年），唐代高僧，中国佛教史上最伟大的翻译家。孤身西行五万里赴天竺求法十七年，在那烂陀寺学习佛法。归国后翻译佛经七十五部一千三百三十五卷，著有《大唐西域记》，是《西游记》唐僧的原型。'},
      {name:'鉴真',desc:'（688—763年），唐代高僧。应日本留学僧邀请六次东渡日本弘扬佛法，前五次均失败双目失明仍不放弃。第六次成功抵达日本，在奈良建造唐招提寺，被日本人民尊为"文化之父""律宗之祖"。'},
      {name:'狄仁杰',desc:'字怀英（630—700年），唐代名臣。武则天时期官至宰相，以刚正不阿善断疑案著称，审理案件涉及一万七千余人无一人冤诉。后世将其事迹演绎为《狄公案》系列小说。'},
      {name:'颜真卿',desc:'字清臣（709—785年），唐代书法家。其楷书端庄雄伟气势开张，被尊为"颜体"，与柳公权并称"颜筋柳骨"。《多宝塔碑》《祭侄文稿》等是书法史上的巅峰之作。安史之乱中率义军抵抗，最终被叛将李希烈杀害。'},
      {name:'韩愈',desc:'字退之（768—824年），唐代文学家思想家，被尊为"唐宋八大家"之首。倡导古文运动反对骈俪文风，"文起八代之衰而道济天下之溺"。曾任潮州刺史，以《谏迎佛骨表》闻名。'}
    ],
    inventions:['雕版印刷术','火药','唐诗','飞钱（早期汇票）'],
    turningPoints:[{y:'627—649年',e:'贞观之治',d:'唐太宗李世民虚心纳谏，任用魏征、房玄龄等贤臣治理国家',s:'政治清明，经济繁荣，文化昌盛，被后世奉为治国典范'},{y:'755年',e:'安史之乱',d:'范阳节度使安禄山以讨伐杨国忠为名起兵叛乱，战火遍及大半个中国',s:'唐朝由盛转衰的转折点，此后藩镇割据局面持续一百五十余年'}],
    color:'#A0826D', bg:'https://miaoda-site-img.cdn.bcebos.com/images/ac30e2f2-f2f3-4c3f-0a4f-1f7f7f6f4c0f.jpg'
  },
  { id:'five-dynasties', name:'五代十国时期', period:'907年 - 960年', start:907, end:960, founder:'朱温灭唐',
    desc:'五代十国是唐朝灭亡后中国再次陷入的分裂时期。北方中原地区先后经历了后梁、后唐、后晋、后汉、后周五个朝代，南方和山西则有十个割据政权。这一时期虽然战乱频繁，但经济文化仍有重要发展，后周世宗柴荣的改革尤为突出，为后来宋朝统一奠定了坚实基础。',
    events:[
      {name:'朱温灭唐建立后梁',desc:'公元907年，宣武节度使朱温逼迫唐哀帝禅让建立后梁五代正式开始。',background:'朱温原为黄巢起义军将领后叛变降唐被赐名朱全忠。他在镇压起义中扩充实力成为中原最强大的军阀。唐廷已沦为朱温手中的傀儡。',process:'904年朱温逼迫唐昭宗迁都洛阳途中将昭宗杀害。907年逼迫唐哀帝禅让称帝建国号"后梁"定都汴京。唐朝289年的统治正式结束。朱温残暴多疑将唐朝宗室几乎屠戮殆尽。',result:'后梁建立后朱温面对的是四分五裂的天下——南方十国林立、北方晋王李克用与之为敌。朱温在位仅五年便被亲子朱友珪刺杀。"弑父篡位者最终被儿子所弑"——历史给了最讽刺的报应。',evaluation:'朱温一生反复——叛黄巢降唐又灭唐自立。他是五代乱世的缩影：背叛没有道德包袱、暴力可以解决一切。但暴力夺取的权力终究被暴力夺走——这个循环贯穿了整个五代。',impact:'朱温篡唐标志着五代十国时代的开始。此后五十四年间中原换了五个王朝八姓十四帝——政权更迭之频繁程度在中国历史上空前绝后。'},
      {name:'李存勖建立后唐',desc:'公元923年，沙陀人李存勖在魏州称帝灭后梁建立后唐迁都洛阳。',background:'李存勖是沙陀人晋王李克用之子。李克用临终交给他三支箭嘱托他完成三件事——灭后梁、平契丹、灭刘仁恭。李存勖将三支箭供奉于太庙每次出征前请箭而行。',process:'923年李存勖在魏州称帝国号仍为"唐"（史称后唐）。随后率精骑突袭汴京灭后梁。他曾骁勇善战亲自冲锋陷阵将士用命。但称帝后迅速蜕变——宠信伶人放任他们干预朝政、横征暴敛丧失民心、猜忌功臣自毁长城。',result:'926年禁军哗变李存勖在洛阳被杀年仅四十三岁。从灭梁到被杀仅三年。"夫祸患常积于忽微而智勇多困于所溺"——欧阳修用他警示后人。',evaluation:'李存勖完美诠释了"生于忧患死于安乐"——在逆境中他能克服一切困难；在顺境中却被自己的傲慢和享乐毁掉。"其得之也难，其失之也忽"——得来不易的东西往往失去得最快。',impact:'后唐的出现说明在五代时期任何军阀都有可能成为皇帝——无论汉人还是沙陀人。民族身份不是障碍军事力量才是唯一的语言。'},
      {name:'石敬瑭割让燕云十六州',desc:'公元936年，后唐河东节度使石敬瑭以割让燕云十六州、自称"儿皇帝"的屈辱条件换取契丹出兵。',background:'后唐末年潞王李从珂怀疑石敬瑭有反心。石敬瑭为自保决定举兵反叛。但单凭河东一镇之力不足以对抗后唐，他选择向契丹（辽朝）求援。',process:'石敬瑭派使者向辽太宗耶律德光求援条件极其屈辱——认比自己小十岁的耶律德光为父自称"儿皇帝"；割让燕云十六州（今河北山西北部和北京天津一带）；每年进贡帛三十万匹。辽太宗大喜亲率五万骑兵南下灭后唐，石敬瑭在太原被辽太宗册封为帝建立后晋。',result:'中原王朝失去了燕山和长城一线的天然防线。此后四百余年中原政权长期处于被动挨打的不利军事态势——契丹女真蒙古铁骑可以随时南下牧马如入无人之境。',evaluation:'石敬瑭是民族罪人——为了一己之私将国防生命线拱手送人。"儿皇帝"成为中国古代最耻辱的政治称谓。"燕云十六州"从此成为中原王朝心头的伤疤——朝朝想收复代代难如愿。',impact:'燕云十六州的丧失影响了此后四百年的中国历史。宋朝始终无法收复燕云导致面对辽金元时长期处于军事劣势。直到明太祖朱元璋派徐达北伐才将燕云故地收回汉族政权手中。一块土地的问题影响了几个世纪的地缘政治格局。'},
      {name:'郭威建立后周',desc:'公元951年，后汉大将郭威在澶州被兵士拥立为帝建立后周。',background:'后汉建立仅三年隐帝刘承祐疑忌功臣杀郭威全家包括两个儿子。郭威被迫起兵"清君侧"攻入汴京。刘承祐被杀后郭威请立刘赟为帝。',process:'951年郭威奉命出征契丹行至澶州时部下哗变将黄旗撕开披在郭威身上高呼万岁——这就是后来赵匡胤黄袍加身的"模板"。郭威回师汴京称帝建立后周。郭威在位三年革除五代弊政减轻赋税废除苛法，临终遗命薄葬不立石像不藏金玉。',result:'郭威一扫五代的暴政之风为后周奠定了清明政治的基础。但他全家已被后汉杀尽无子可传——将帝位传给养子柴荣（本姓柴是郭威妻子的侄子）。',evaluation:'郭威是五代最被低估的好皇帝——在位仅三年但每一项政策都切中时弊。他出身寒微当了皇帝后仍保持简朴本色。在军阀当道的乱世中他以德服众而非以力压人。',impact:'郭威开启的后周虽然只传了两代但为宋朝的建立和统一铺平了道路。赵匡胤的陈桥兵变几乎照搬了郭威在澶州的剧本——历史在这里完成了一次奇妙的复刻。'},
      {name:'柴荣改革',desc:'公元954年，后周世宗柴荣即位后锐意进取整顿军政使后周国力大增。',background:'柴荣年轻时曾外出经商贩卖茶叶行走大江南北深知民间疾苦。他即位后面对的是一盘散沙的五代乱局——北有契丹虎视眈眈南有南唐后蜀各自为政。',process:'柴荣推行全面改革——澄清吏治惩处贪腐、整顿军队淘汰老弱选拔精锐编为"殿前诸班"（赵匡胤就是在这时被提拔上来的）、抑制佛教废毁寺院三万余所令僧尼还俗以铜钟佛像铸钱充军费、招抚流民恢复生产、修筑汴京城墙。先后击败北汉、攻下后蜀四州、夺取南唐淮南十四州。',result:'柴荣在位仅五年便使后周国力跃居天下之首。"天下三分后周已有其二"——统一大业几乎触手可及。959年他率军北伐契丹连克三关正要挥师幽州时突发重病被迫班师回朝后病逝年仅三十九岁。',evaluation:'柴荣的早逝是中国历史的一大遗憾——他若多活十年统一天下的一定是后周而非宋朝。五代十国持续半个多世纪好不容易等到一位英主却英年早逝。"出师未捷身先死"——诸葛亮的故事在五百年后重演。',impact:'柴荣改革的全部成果被赵匡胤继承——正是后周积累的强大军力和财政基础让宋朝能如此迅速地完成统一。"前人栽树后人乘凉"——赵匡胤就是那个站在柴荣肩膀上的人。'},
      {name:'陈桥兵变与宋朝建立',desc:'公元960年，赵匡胤在陈桥驿被部下黄袍加身拥立为帝建立宋朝。',background:'柴荣病逝后七岁的周恭帝即位主少国疑。赵匡胤身为殿前都点检掌握禁军精锐是后周最有实力的军事将领。"主少国疑大将手握重兵"——这是五代十国时期政变的经典配方。',process:'960年正月初三赵匡胤奉命率军北上抵御契丹。行至陈桥驿时赵普赵光义等心腹将一件事先准备好的黄袍披在醉酒的赵匡胤身上全军高呼万岁。赵匡胤"不得已"接受回师汴京。进城后他约束士兵秋毫无犯——与五代其他兵变入城后烧杀抢掠形成鲜明对比。周恭帝和平退位赵匡胤以宋代周。',result:'赵匡胤迅速平定后周残余势力的反抗、杯酒释兵权解除武将武力。采取"先南后北"统一方略——先灭南方割据政权积蓄力量再北上收复燕云。在位十六年基本统一了中原和南方。',evaluation:'陈桥兵变是五代十国历次政变中最文明、最温和的一次——没有流血没有屠城连前朝幼帝都得以善终。赵匡胤以宋代周的方式是五代乱世终结的象征——从此中国历史从"武人政治"转向"文人政治"。',impact:'宋朝的建立标志着五代十国乱世的终结。赵匡胤建立的"重文轻武"国策保证了宋朝三百余年的稳定但也削弱了军事实力。中国历史从此进入了一个经济文化极度繁荣但军事相对弱势的新时代。'}
    ],
    figures:[
      {name:'朱温',desc:'（852—912年），后梁开国皇帝。原为黄巢起义军将领后投降唐朝被赐名朱全忠。907年逼迫唐哀帝禅让建立后梁，五代正式开始。为人残暴多疑，在位仅五年便被亲生儿子朱友珪所杀。'},
      {name:'李存勖',desc:'（885—926年），沙陀人，后唐开国皇帝。骁勇善战灭后梁统一北方，但称帝后自满骄奢宠信伶人荒废朝政，仅在位三年便死于兵变。"生于忧患死于安乐"是其一生写照。'},
      {name:'石敬瑭',desc:'（892—942年），后晋开国皇帝。以割让燕云十六州、自称"儿皇帝"的屈辱条件换取契丹出兵助其夺取帝位。燕云十六州的丧失使中原王朝失去北方屏障，影响中国数百年军事格局。'},
      {name:'郭威',desc:'（904—954年），后周开国皇帝。出身寒微从普通士兵升至大将，951年在澶州被拥立为帝。在位三年革除五代暴政减轻赋税，临终遗命薄葬，是五代最开明的君主之一。'},
      {name:'柴荣',desc:'（921—959年），后周世宗，郭威养子。即位后锐意改革整顿军政，使后周国力迅速增强。在位仅五年便为统一奠定了基础，可惜北伐契丹途中病逝年仅三十九岁，被史家评为五代第一明君。'},
      {name:'赵匡胤',desc:'（927—976年），宋朝开国皇帝。960年在陈桥驿被将士黄袍加身拥立为帝，以和平方式取代后周建立宋朝。杯酒释兵权解除武将兵权、"先南后北"统一方略，开创了中国历史上经济文化最繁荣的时代之一。'},
      {name:'李煜',desc:'（937—978年），五代南唐后主，世称李后主。虽政治无能亡国被俘，但在诗词方面天賦极高，"问君能有几多愁恰似一江春水向东流"等词句千古传诵，被尊为"词中之帝"。被宋太宗赐牵机药毒死。'}
    ],
    inventions:['火药武器开始实战应用','活字印刷技术萌芽','词的发展成熟'],
    turningPoints:[{y:'936年',e:'割让燕云十六州',d:'后晋石敬瑭为换取契丹出兵支持，将燕云十六州割让给辽朝',s:'中原王朝失去北方天然屏障，对后世数百年军事格局产生深远影响'},{y:'960年',e:'宋朝建立',d:'赵匡胤在陈桥驿发动兵变，被将士黄袍加身拥立为帝',s:'结束五代十国分裂局面，中国再次走向统一'}],
    color:'#B8956A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/45b3e3f3-f3f4-4d4f-1b5f-2f8f8f7f5d1f.jpg'
  },
  { id:'song', name:'宋朝', period:'960年 - 1279年', start:960, end:1279, founder:'宋太祖赵匡胤',
    desc:'宋朝分为北宋和南宋两个阶段，是中国历史上经济、文化、科技最发达的朝代之一。北宋都城汴京（开封）是当时世界上最大的城市。宋朝虽然军事上较为弱势，但经济极度繁荣，商业高度发达，出现了世界上最早的纸币"交子"。指南针、火药、活字印刷术三大发明都在宋朝得到重大发展或广泛应用。',
    events:[
      {name:'赵匡胤建立宋朝',desc:'公元960年，赵匡胤陈桥兵变黄袍加身，回师汴京建立了宋朝。',background:'后周显德七年（960年）正月初一，边报辽与北汉联兵南侵，宰相范质仓促间派殿前都点检赵匡胤统兵北上御敌。初三夜大军行至陈桥驿（今河南封丘东南）驻扎。',process:'当夜五更时分，赵匡胤之弟赵光义与掌书记赵普等人发动兵变，将事先准备好的黄袍披在赵匡胤身上，众将士跪拜山呼万岁。赵匡胤"被迫"接受，随即回师汴京。守城将领石守信等人开城门接应，几乎未遇抵抗。赵匡胤入城后，宰相范质、王溥被迫承认既成事实，周恭帝柴宗训禅位。',result:'赵匡胤正式登基称帝，国号"宋"，建元建隆，定都汴京（开封）。后周灭亡，五代最后一个朝代结束。宋朝建立后采取"先南后北、先易后难"的统一方略，先后灭荆南、后蜀、南汉、南唐等割据政权，基本统一中原和南方。',evaluation:'陈桥兵变是中国历史上最"文明"的改朝换代之一，几乎没有流血。赵匡胤以军人之身行仁厚之政，善待前朝宗室和大臣，为宋朝"以文治国"的基调奠定了基础。',impact:'宋朝的建立结束了五代十国五十余年的分裂战乱，中国再次走向统一。但北方的燕云十六州仍被辽朝占据，终宋一朝未能收复，成为两宋三百余年最大的国防隐患。'},
      {name:'杯酒释兵权',desc:'公元961年，宋太祖赵匡胤在一次宴会上借酒劝谕石守信等大将交出兵权。',background:'宋朝建立后，赵匡胤深以五代十国"兵强马壮者为天子"的频繁政权更迭为戒。宰相赵普多次进言，指出禁军将领手握重兵是最大隐患，必须削夺其兵权。赵匡胤起初犹豫，认为这些老部下忠心可靠，赵普反问："陛下何以能黄袍加身？"一语惊醒梦中人。',process:'建隆二年（961年）七月初九晚，赵匡胤设宴款待石守信、高怀德、王审琦、张令铎等禁军高级将领。酒至半酣，赵匡胤屏退左右，感叹道："我能有今天全靠你们，但做皇帝实在不如做节度使快乐，夜夜不敢安枕。"众将问其故，赵匡胤说："这个位子谁不想坐？你们虽然忠心，但如果部下把黄袍披在你们身上，你们能拒绝吗？"众将惊恐跪地求指生路。赵匡胤说："不如交出兵权，到地方做大官，多买田宅、多蓄歌伎，安享富贵。我与你们联姻，君臣之间永无猜忌。"',result:'次日早朝，石守信等人纷纷上表称病请辞。赵匡胤一一批准，赏赐大量金银田宅，将他们外放为节度使。禁军指挥权从此分散到殿前司、侍卫马军司、侍卫步军司三个机构，互不统属，直接听命于皇帝。',evaluation:'杯酒释兵权以极其温和的方式解决了开国功臣拥兵自重的问题，避免了刘邦、朱元璋式的屠戮功臣，体现了赵匡胤的政治智慧和宽厚品格。但它也开启了宋朝"重文轻武、以文抑武"的国策，导致武官地位下降。',impact:'杯酒释兵权确立了宋朝文官治国的基本格局，此后三百余年再未出现武将篡位。但矫枉过正的"重文轻武"政策也导致宋朝军力长期不振，面对辽、西夏、金、蒙古的军事压力屡屡处于被动。'},
      {name:'王安石变法',desc:'公元1069年，宋神宗任命王安石为宰相推行大规模新政改革。',background:'北宋中期，冗官、冗兵、冗费的"三冗"问题日益严重，财政入不敷出。到宋神宗即位时，国库已近枯竭。与此同时，辽和西夏的军事威胁持续存在。年仅二十岁的宋神宗锐意求治，决心改革图强。',process:'熙宁二年（1069年），宋神宗任命王安石为参知政事（副宰相），次年拜相，全面推行新法。新法涵盖三大类：理财方面有青苗法（政府低息贷款给农民）、免役法（以钱代役）、市易法（政府调控物价）、方田均税法（重新丈量土地）；军事方面有保甲法（民兵训练）、置将法（兵将结合训练）；人才方面改革科举、设立太学三舍法。',result:'新法推行十余年，国家财政收入明显增加，农田水利工程大规模兴修，军队战斗力有所恢复。但变法触动了大地主、大商人和官僚阶层的既得利益，遭到司马光、苏轼、欧阳修等保守派的强烈反对。新旧两党互相攻击，朝局动荡不安。熙宁九年（1076年）王安石第一次罢相，次年复相又于一年后再罢，退居江宁（南京）直至去世。',evaluation:'王安石变法是11世纪世界范围内最宏大的一次国家改革尝试，列宁称王安石为"中国十一世纪的改革家"。新法本身设计精良、立意高远，但在执行中出现了急功近利、用人不当、地方官吏借机盘剥等问题。新旧党争的本质是"激进变革"与"渐进守成"的路线之争。',impact:'变法失败后新旧党争持续了半个世纪，北宋政治从良性竞争逐渐恶化为意气用事的朋党倾轧，消耗了国力和人才。宋徽宗时蔡京借"新法"之名行聚敛之实，新法彻底变质。政治内耗使北宋在面对金国崛起时措手不及，间接导致了靖康之变。'},
      {name:'毕昇发明活字印刷术',desc:'约公元1040年，北宋平民毕昇发明了胶泥活字印刷术。',background:'宋代文化教育事业空前繁荣，科举取士规模大幅扩大，全社会对书籍的需求激增。传统的雕版印刷虽然技术成熟，但每一页书都需要雕刻一整块木板，费工费料，且雕好的版只能印一部书，无法重复利用。',process:'毕昇在雕版印刷的基础上进行创新。他用胶泥（黏土）制成一个个规格一致的长方形毛坯，一端刻上凸起的反体单字，用火烧硬后成为单个活字。排版时，将活字按文章顺序排列在有松脂、蜡和纸灰的铁框内，加热使松脂熔化粘住活字，再用平板压平字面，冷却后即可上墨印刷。印完后加热取下活字，下次还可重复使用。常用字各备数个甚至数十个，冷僻字则随用随刻。',result:'活字印刷术克服了雕版印刷"一页一版"的局限，大大提高了印刷效率、降低了成本。虽然毕昇本人的生平记载极少（仅沈括《梦溪笔谈》中有详细记录），但这些记录成为后世研究活字印刷术最珍贵的文献依据。',evaluation:'活字印刷术是中国古代四大发明之一，体现了宋代平民的杰出创造力。沈括在《梦溪笔谈》中精确记载了毕昇的发明过程，使这一伟大技术得以流传后世。虽然由于汉字数量庞大，胶泥活字在当时的实际普及度不如雕版印刷，但其理念开创了印刷技术的全新方向。',impact:'活字印刷术先后传入朝鲜、日本、越南和欧洲。朝鲜在此基础上发展出金属活字，比德国古腾堡的铅活字印刷早了约二百年。活字印刷术的传播极大地推动了人类知识的生产和传播效率，被公认为世界文明史上的重大里程碑。'},
      {name:'靖康之变',desc:'公元1127年，金国大军南下攻破北宋都城汴京，俘虏宋徽宗、宋钦宗二帝及后妃、宗室、大臣三千余人北去。',background:'北宋末年，宋徽宗赵佶沉迷书画道教、荒废朝政，致使朝政腐败、国库空虚。与此同时，北方的金国崛起，灭辽后与北宋直接接壤，金太宗完颜晟秣马厉兵准备南下。北宋联金灭辽过程中暴露了军力虚弱，金朝对北宋心生轻视。',process:'宣和七年（1125年）十月，金军分两路南下攻宋，东路由完颜宗望率领，西路由完颜宗翰率领。宋徽宗慌忙将帝位禅让给太子赵桓（宋钦宗），自己退位为太上皇。靖康元年（1126年）正月，金东路军已兵临汴京城下。宋钦宗在主战派李纲的主持下组织汴京保卫战，一度打退金军。但宋廷急于求和，答应割让太原、中山、河间三镇并赔款。金军退兵后宋廷又反悔不割三镇，金军同年八月再次南下。十一月，金军攻破汴京外城，宋钦宗亲赴金营求和被扣。',result:'靖康二年（1127年）二月，金太宗下诏废宋徽宗、宋钦宗为庶人。金军将二帝连同后妃、皇子、宗室、大臣、工匠、教坊乐工等三千余人尽数掳往北方，汴京城中金银财宝、典籍图书、礼器法物被洗劫一空。侥幸逃脱的徽宗第九子康王赵构在应天府（今河南商丘）登基称帝，是为宋高宗，南宋由此开始。',evaluation:'靖康之变是中国历史上最惨烈的王朝覆灭事件之一。堂堂天朝皇帝被异族俘虏为奴，皇族女性受尽凌辱，北宋百余年的文化积累毁于一旦。岳飞"靖康耻，犹未雪"的词句千古悲愤，成为南宋军民心中永远的痛。',impact:'靖康之变彻底改变了中国历史的走向。北宋灭亡后，中国经济重心加速南移，淮河以北沦入金朝统治。南宋虽偏安江南一百余年，但再也没有恢复中原的实力和机会。靖康之耻成为后世"国耻"话语的源头，每当国家危亡之际便被反复提及。'},
      {name:'岳飞郾城大捷',desc:'公元1140年，岳飞率岳家军在郾城等地大败金国精锐骑兵，乘胜进军至距汴京仅四十五里的朱仙镇。',background:'绍兴十年（1140年），金国撕毁和议大举南侵。宋高宗被迫下诏各路宋军北伐。岳飞率岳家军从鄂州（今武汉）北上，一路势如破竹连克颖昌、陈州、郑州、洛阳等地，兵锋直指汴京。金军主帅完颜宗弼（金兀术）亲率精锐在郾城迎战。',process:'郾城之战中，完颜宗弼出动其王牌部队——"拐子马"（两翼轻骑兵包抄）和"铁浮图"（重甲骑兵正面冲击）。铁浮图人马皆披重甲，三骑为一小组用皮索相连，冲击力极强，此前几乎未遇敌手。岳飞命步兵手持麻扎刀、提刀、大斧入阵，"勿仰视，第斫马足"。岳家军战士伏身砍马腿，一马倒地连带一组三马无法前进。同时岳飞亲率骑兵从两翼反击，大破金军精锐。此后又在颍昌、朱仙镇等地连败金军。',result:'郾城—颍昌—朱仙镇一连串辉煌胜利后，金军士气崩溃，完颜宗弼准备放弃汴京北撤。中原遗民纷纷响应，"顶盆焚香"迎接宋军。岳飞鼓舞将士"直捣黄龙府，与诸君痛饮"。然而宋高宗和秦桧连发十二道金牌强令班师，岳飞"十年之功，毁于一旦"，含恨撤军。',evaluation:'郾城大捷是冷兵器时代步兵对重骑兵最辉煌的胜利之一。岳飞以机动灵活的战术和严明的军纪，将岳家军锻造成了"撼山易，撼岳家军难"的铁军。但宋高宗出于对"迎二圣还朝"政治风险的恐惧和对武将坐大的猜忌，自毁长城。',impact:'岳飞郾城大捷证明南宋有实力收复中原，但宋高宗选择放弃。这一决策使南宋永远失去了还都汴京的机会，也注定了岳飞个人的悲剧命运。次年岳飞即在风波亭遇害。'},
      {name:'绍兴和议与岳飞冤狱',desc:'公元1141年，南宋与金国达成屈辱的"绍兴和议"，同年底岳飞被以"莫须有"罪名遇害。',background:'郾城大捷后，宋高宗和秦桧强令各路宋军班师，主动放弃了北伐的大好形势。宋高宗的根本顾虑是：如果岳飞真的收复中原迎回钦宗，自己的皇位合法性会受到挑战。秦桧则力主和议，主张以屈辱条件换取偏安。',process:'绍兴十一年（1141年）四月，秦桧以"论功行赏"为名，将岳飞、韩世忠、张俊三大将召至临安，明升暗降任命为枢密使副使，解除了他们的统兵权。同年八月，岳飞被罢去枢密副使之职。十月，秦桧指使党羽诬告岳飞部将张宪"谋反"，牵连岳飞。岳飞被投入大理寺狱。主审官何铸审问后认为岳飞无罪，秦桧改命万俟卨主审，严刑逼供。同年十一月，南宋与金国签订"绍兴和议"：宋向金称臣，岁贡银二十五万两、绢二十五万匹，东以淮水、西以大散关为界。十二月二十九日除夕，宋高宗下诏"岳飞特赐死"，岳飞在临安风波亭遇害，年仅三十九岁。其子岳云、部将张宪同日被斩。',result:'绍兴和议订立后，南宋以称臣纳贡的代价换来了二十年的和平。岳飞被冤杀，韩世忠被解除兵权，南宋抗金力量遭受毁灭性打击。秦桧独揽朝政十九年，排斥异己、钳制舆论。南宋自此偏安一隅，再无力北伐。',evaluation:'绍兴和议是中国历史上最屈辱的和约之一，宋朝首次以"称臣"的身份向外部政权纳贡。岳飞冤狱则是中国历史上最令人扼腕的忠臣悲剧。韩世忠质问秦桧岳飞何罪，秦桧答以"莫须有"（也许有），这三个字成为千古冤案的代名词。宋孝宗即位后为岳飞平反昭雪，追谥"武穆"、后又追封鄂王。',impact:'绍兴和议从根本上改变了南宋的政治格局。主和派全面得势，主战派遣受压制，南宋朝廷放弃中原成为定局。此后百余年间，虽偶有北伐之议，但再无人能组织起岳飞那样规模的军事行动。岳飞精神则超越了时代，成为中国人忠义气节的最高象征。'},
      {name:'崖山海战与南宋灭亡',desc:'公元1279年，元军在崖山与南宋残部展开最后决战，南宋灭亡。',background:'襄阳保卫战失败后，元朝大军顺长江东下，南宋防线全面崩溃。1276年，元军攻占临安，年仅五岁的宋恭帝被俘。大臣陆秀夫、张世杰等人保护恭帝之弟赵昰、赵昺南逃，在福州拥立赵昰为帝（宋端宗）。此后宋廷辗转广东沿海，宋端宗在逃亡途中病故，陆秀夫又拥立八岁的赵昺为帝，退守崖山（今广东江门新会）。',process:'祥兴二年（1279年）正月，元将张弘范率水陆大军进攻崖山。宋军在张世杰指挥下将千余艘战船用铁索连接成一字阵，誓与元军决一死战。二月六日，元军趁涨潮时南北夹攻，宋军阵型被冲散。激战中宋军大败，战船纷纷起火。',result:'败局已定时，丞相陆秀夫对幼帝赵昺说："国事至此，陛下当为国死。"遂背负八岁的赵昺跳入大海殉国。杨太后闻帝死讯亦投海自尽。张世杰率残部突围失败，溺死于海上。十余万不愿投降的南宋军民纷纷蹈海自杀，海面浮尸蔽日。南宋就此灭亡，蒙古元朝统一了全中国。',evaluation:'崖山海战是人类历史上规模最大、最惨烈的亡国战役之一，十余万军民以死殉国，其气节之悲壮至今令人震撼。陆秀夫、张世杰等人的忠义行为被后人世代传颂。"崖山之后无中华"虽过于绝对，但确实反映了这场战役给华夏文明带来的巨大创伤。',impact:'南宋灭亡标志着中国自唐末以来三百余年分裂局面的终结，元朝建立了疆域空前辽阔的大一统王朝。崖山殉国所体现的民族气节成为中国人的精神图腾，每当国家危亡之际便被重新唤起。今天广东新会的崖门仍立有"宋少帝陵"和"陆秀夫祠"，供后人凭吊。'}
    ],
    figures:[
      {name:'赵匡胤',desc:'（927—976年），宋朝开国皇帝。960年陈桥兵变黄袍加身，以和平方式取代后周建立宋朝。杯酒释兵权解除武将兵权、确立"重文轻武"国策、制定"先南后北"统一方略。在位期间基本统一中原和南方。'},
      {name:'王安石',desc:'字介甫（1021—1086年），号半山，北宋政治家文学家。宋神宗时拜相推行大规模改革——青苗法免役法市易法保甲法等，旨在"富国强兵"。因触动保守派利益最终失败被罢相，新旧党争持续半个世纪。其散文位列"唐宋八大家"。'},
      {name:'苏轼',desc:'字子瞻（1037—1101年），号东坡居士，北宋文学家书画家。诗文书画无一不精：词开豪放一派与辛弃疾并称"苏辛"；散文与欧阳修并称"欧苏"位列唐宋八大家；《赤壁赋》《水调歌头》千古传诵；书法为宋四家之首。一生仕途坎坷屡遭贬谪却始终豁达乐观。'},
      {name:'岳飞',desc:'字鹏举（1103—1142年），南宋抗金名将。率领岳家军收复大片失地，郾城大捷大破金国精锐骑兵拐子马和铁浮图，进军至距汴京仅四十五里的朱仙镇。但被宋高宗和秦桧以十二道金牌强令班师，以"莫须有"之罪在杭州风波亭遇害，年仅三十九岁。《满江红》气势磅礴千古传诵。'},
      {name:'文天祥',desc:'字宋瑞（1236—1283年），号文山，南宋丞相民族英雄。元军南下时散尽家财组织义军抵抗，兵败被俘后拒绝元朝高官厚禄的劝降，在狱中写下《正气歌》。临刑前从容南向跪拜，衣带中留有绝笔"孔曰成仁孟曰取义，读圣贤书所学何事？而今而后庶几无愧"。'},
      {name:'朱熹',desc:'字元晦（1130—1200年），南宋理学家。继承发展二程（程颢程颐）思想，集理学之大成。编注《四书章句集注》成为此后六百余年科举考试的标准教材，其学说被称为"程朱理学"，深刻影响了中国的思想文化和教育制度。'},
      {name:'沈括',desc:'字存中（1031—1095年），北宋科学家。所著《梦溪笔谈》被誉为"中国科学史上的里程碑"，内容涵盖天文地理数学物理化学生物医药工程技术等众多领域，首次记录了磁偏角发现和活字印刷术。'},
      {name:'辛弃疾',desc:'字幼安（1140—1207年），号稼轩，南宋词人爱国将领。青年时率五十骑突袭五万金军大营擒获叛徒，后率军抗金。"醉里挑灯看剑梦回吹角连营"等词雄浑豪放，与苏轼并称"苏辛"，是宋词豪放派的巅峰代表。'},
      {name:'李清照',desc:'（1084—约1155年），号易安居士，宋代女词人。前期词风婉约清新，"莫道不销魂帘卷西风人比黄花瘦"；南渡后历经国破家亡转为沉郁悲凉，"生当作人杰死亦为鬼雄"展现其风骨。被尊为"千古第一才女"。'}
    ],
    inventions:['活字印刷术','指南针','火药武器','纸币（交子）','《梦溪笔谈》'],
    turningPoints:[{y:'1044年',e:'火药配方正式记载',d:'曾公亮《武经总要》首次详细记载了火药的三种配方',s:'火药开始用于军事领域，逐步改变了世界战争形态'},{y:'1127年',e:'靖康之变',d:'金国大军南下攻破汴京，俘虏宋徽宗、宋钦宗二帝北去',s:'北宋灭亡，宋室南迁临安，进入南宋时期'}],
    color:'#C9A86A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/b86ef4f4-f4f5-4e5f-2c6f-3f9f9f8f6e2f.jpg'
  },
  { id:'yuan', name:'元朝', period:'1271年 - 1368年', start:1271, end:1368, founder:'元世祖忽必烈',
    desc:'元朝是由蒙古族建立的中国历史上疆域最辽阔的统一王朝，其版图横跨欧亚大陆。元朝定都大都（今北京），首次将西藏、云南等地正式纳入中国版图。元朝时期，中外交流空前活跃，马可·波罗等西方旅行家来到中国。元曲（关汉卿《窦娥冤》等）和杂剧是中国文学史上的璀璨明珠。',
    events:[
      {name:'铁木真统一蒙古称成吉思汗',desc:'公元1206年，铁木真在斡难河源头被推举为全蒙古大汗，尊号成吉思汗。',background:'12世纪的蒙古高原上分布着塔塔儿、克烈、乃蛮、蔑儿乞、蒙古等众多部落，部落之间长期混战仇杀。铁木真出身于蒙古乞颜部孛儿只斤氏，幼年丧父，历经磨难。他在与各部落的斗争中逐渐崛起，先后击败了蔑儿乞人、塔塔儿人、克烈部和乃蛮部，统一了蒙古高原。',process:'1206年春，铁木真在斡难河（今蒙古国鄂嫩河）源头召开忽里台（部落联盟大会），竖起九斿白纛，被各部落首领推举为全蒙古的大汗，尊号"成吉思汗"（意为"拥有四海的大汗"）。他随即创建了千户制（将全蒙古牧民编为九十五个千户，集军政于一体）、扩建怯薛军（大汗亲卫军）、颁布《大札撒》（蒙古第一部成文法典）、任命失吉忽秃忽为最高断事官。',result:'蒙古从此由一个松散的部落联盟转变为一个军政合一的强大国家。成吉思汗的建国为蒙古帝国的崛起奠定了制度基础，《大札撒》法典确保了帝国秩序的运转。此后蒙古开始了震惊世界的征服扩张。',evaluation:'成吉思汗统一蒙古是13世纪世界历史上最具影响力的事件之一。他以卓越的军事才能和组织能力将一个分裂的游牧部落整合为强大的国家机器。但蒙古的征服战争也给欧亚大陆各族人民带来了深重的灾难。',impact:'成吉思汗建国标志着蒙古民族的形成，也拉开了蒙古征服世界的序幕。此后数十年间，蒙古铁骑踏遍欧亚，建立了人类历史上疆域最辽阔的陆上帝国。蒙古征服深刻改变了欧亚大陆的政治格局、人口分布和文化交流路径。'},
      {name:'忽必烈建元定都大都',desc:'公元1271年，忽必烈取《易经》"大哉乾元"之意改国号为"大元"，次年定都大都（今北京）。',background:'忽必烈是成吉思汗之孙、拖雷之子。1251年其兄蒙哥即大汗位后，命忽必烈总领漠南汉地事务。忽必烈在金莲川（今内蒙古正蓝旗）设立幕府，大量任用汉人儒士如刘秉忠、姚枢等人，学习汉法治理。1260年蒙哥在征宋战争中去世，忽必烈在开平（今内蒙古正蓝旗）即大汗位，但其弟阿里不哥也在漠北称汗，爆发了长达四年的汗位争夺战。',process:'忽必烈击败阿里不哥后，决定将蒙古帝国的政治中心从漠北草原南移至中原。1264年改燕京（今北京）为中都，1267年开始在中都东北郊营建新城。1271年，忽必烈采纳刘秉忠的建议，取《易经》"大哉乾元，万物资始"之意，正式改国号为"大元"。1272年改中都为大都，1274年大都宫殿建成，元朝正式定都于此。',result:'大都（今北京）是按照《周礼·考工记》的理想都城规划建造的，城垣周长28.6公里，设有十一座城门，城内有皇城和宫城。大都首次将今北京确立为全中国的政治中心，这座城市从此成为此后七百余年中国最重要的首都。',evaluation:'忽必烈迁都建元是蒙古帝国从草原帝国转型为中原王朝的关键步骤。改国号、定都城、行汉法等一系列举措，表明忽必烈不再满足于做蒙古大汗，而是要成为中原正统王朝的皇帝。这种文化转型虽然不彻底，但使元朝得以统治中国近百年。',impact:'元朝定都大都标志着北京作为中国首都历史的真正开端。大都在当时是世界上最大、最繁华的城市之一，马可·波罗盛赞其为"世界诸城无与伦比"。元大都的选址和规划影响了明清北京城的基本格局，一直延续至今。'},
      {name:'元灭南宋统一全国',desc:'公元1279年，元将张弘范在崖山海战中彻底击败南宋残部，南宋灭亡，元朝统一全国。',background:'忽必烈即位后，将灭宋作为首要战略目标。1268年元军开始围攻南宋的战略要塞襄阳、樊城。二城军民苦守六年，1273年樊城被攻破，襄阳守将吕文焕力竭降元。襄阳失守后，长江中游门户洞开，元军顺流东下的通道被打通。',process:'1274年，元朝以伯颜为统帅率二十万大军水陆并进沿长江东下。1276年，元军攻占南宋都城临安（今杭州），年仅五岁的宋恭帝赵㬎被俘。南宋残余势力在陆秀夫、张世杰等人率领下南逃闽粤，先后拥立赵昰、赵昺为帝，在广东沿海坚持抵抗。1279年，元将张弘范在崖山（今广东新会）与南宋残部展开最后决战。',result:'崖山海战中宋军大败，丞相陆秀夫背负八岁的幼帝赵昺跳海殉国，十余万军民不愿投降蹈海而死。南宋彻底灭亡。自唐末黄巢起义（875年）以来分裂四百余年的中国再次实现统一，且元朝疆域远超汉唐：北至西伯利亚、南至南海、东至朝鲜半岛、西至中亚东欧。',evaluation:'元朝统一结束了中国自唐末以来长期的分裂割据局面，其疆域之辽阔在中国历史上空前绝后。但统一过程中伴随着大量的战争破坏和人口损失，南宋最富庶的江南地区也经历了剧烈的社会动荡。',impact:'元朝统一标志着中国历史上第一次由少数民族政权完成全国统一。元朝将西藏、云南、东北、台湾等地正式纳入中央政府的有效管辖之下，奠定了此后中国版图的基本轮廓。大运河的重新开通和海运的发展使南北经济联系空前紧密。'},
      {name:'马可·波罗来华',desc:'公元1275年，威尼斯旅行家马可·波罗沿丝绸之路到达元大都，留居中国十七年。',background:'13世纪的蒙古帝国建立了横跨欧亚的庞大统治，丝绸之路在蒙古的"蒙古和平"（Pax Mongolica）下空前畅通，东西方的商人、使节、传教士往来频繁。威尼斯是当时地中海贸易的重要枢纽，商人家庭出身的马可·波罗在这样的时代背景下踏上了东方之旅。',process:'1271年，年仅十七岁的马可·波罗随父亲尼科洛和叔叔马泰奥从威尼斯出发，经地中海、小亚细亚、波斯高原、帕米尔高原、塔克拉玛干沙漠，历经四年艰辛跋涉，于1275年到达元上都（今内蒙古正蓝旗），受到忽必烈的接见。马可·波罗聪明好学、精通蒙古语和汉语，深得忽必烈信任，多次奉命出使各地和海外，游历了中国大江南北。',result:'马可·波罗在中国居留十七年，足迹遍布大都、上都、江南、四川、云南等地。1291年他借护送元朝公主阔阔真远嫁伊儿汗国的机会从泉州出发经海路返回威尼斯。1298年马可·波罗在威尼斯与热那亚的海战中被俘，在狱中向狱友鲁斯蒂谦口述了他在东方的见闻，整理成《马可·波罗游记》。',evaluation:'《马可·波罗游记》向欧洲人展示了一个远比欧洲富庶和文明的东方世界，打破了中世纪欧洲对东方的无知。但自问世以来争议不断，有人质疑马可·波罗是否真的到过中国。现代学者大多认为游记基本可信，个别夸大之处属于口述文学的常态。',impact:'《马可·波罗游记》深刻改变了欧洲人的世界观念。书中描述的"黄金遍地"的东方激发了欧洲人探索东方的狂热热情。哥伦布就是带着《马可·波罗游记》出发寻找通往东方的新航路，却意外发现了美洲大陆。可以说，马可·波罗间接推动了大航海时代的到来。'},
      {name:'行省制度确立',desc:'元朝在全国设立十个行中书省，作为中央派出机构管理地方，被明清沿袭至今。',background:'元朝疆域空前辽阔，如何有效管理从漠北到南海、从高丽到中亚的庞大国土，是忽必烈面临的重大挑战。传统的中原郡县制难以适应如此广袤的版图，而蒙古原有的分封制又不利于中央集权。忽必烈在保留部分草原旧制的同时，借鉴金朝的行台尚书省制度，创立了行省制度。',process:'忽必烈将全国划分为中书省直辖地（腹里，今河北山东山西内蒙古）和十个行中书省：岭北、辽阳、河南江北、陕西、四川、甘肃、云南、江浙、江西、湖广。行省设丞相、平章政事等官职，作为中书省的派出机构代行中央权力。行省下辖路、府、州、县四级。行省区划打破了过去按山河地势划分的传统，"犬牙交错"使各省之间相互牵制，防止地方割据。',result:'行省制度使元朝中央政府能够有效管辖从漠北到南海的庞大国土，是中国古代地方行政制度的一次重大创新。西藏地区由宣政院直接管理，首次纳入中央政府行政体系。云南、东北、台湾等地也通过行省系统得到有效治理。',evaluation:'行省制度在加强中央集权的同时兼有地方分权的灵活性，既避免了秦朝郡县制过分集中的弊病，又防止了唐代藩镇割据的重演，是中国古代地方行政制度发展的高峰。',impact:'行省制度被明清两朝继承和发展，一直影响到现代中国的省级行政区划。今天中国的"省"作为最高一级地方行政单位，其名称和格局都源自元代的行省制度。这是元朝留给中国政治制度最重要的遗产之一。'},
      {name:'红巾军起义',desc:'公元1351年，韩山童、刘福通等人发动治理黄河的民夫在颍州起义，红巾军迅速蔓延全国。',background:'元朝中后期，政治日益腐败，皇位更迭频繁，权臣专权。加之天灾不断——黄河多次决口泛滥、旱灾蝗灾交替发生，百姓流离失所。元朝统治者对汉人的民族压迫政策使社会矛盾更加尖锐。白莲教等民间秘密宗教在基层广泛传播，成为组织民众反抗的工具。',process:'至正十一年（1351年），元朝强征十五万民夫治理黄河。白莲教首领韩山童、刘福通等人提前在河道中埋下一个独眼石人，上刻"石人一只眼，挑动黄河天下反"的谶语。民夫掘出石人后群情激愤，韩山童、刘福通随即在颍州（今安徽阜阳）发动起义。起义军头裹红巾为标志，故称"红巾军"。起义迅速从淮河流域蔓延至全国，徐寿辉在湖北起事，郭子兴在濠州起事（朱元璋投奔的就是这支队伍），张士诚在江苏起事。',result:'红巾军起义席卷大半个中国，元朝的地方统治土崩瓦解。各路起义军在反元的同时也互相兼并攻伐。朱元璋从郭子兴部下一名小兵成长为一方统帅，先后消灭陈友谅、张士诚、方国珍等势力，统一南方，为推翻元朝奠定了基础。',evaluation:'红巾军起义是中国历史上规模最大的农民起义之一，以民间宗教为组织形式、利用谶语动员群众是其主要特色。虽然韩山童、刘福通等人最终失败，但他们点燃的反元烈火最终烧毁了元朝的统治。',impact:'红巾军起义从根本上动摇了元朝的统治根基。起义中崛起的朱元璋最终推翻了元朝，建立了明朝，使中国重新回到汉族统治之下。但长达十余年的战乱也给社会生产带来了严重破坏，人口锐减，经济凋敝。'},
      {name:'元朝灭亡',desc:'公元1368年，朱元璋派徐达、常遇春率明军北伐攻克大都，元顺帝北逃，元朝灭亡。',background:'红巾军起义后期，朱元璋在南方崛起，先后消灭陈友谅（1363年鄱阳湖大战）、张士诚（1367年平江之战）和方国珍等势力，统一了长江流域。1368年正月初四，朱元璋在应天（今南京）称帝，建立明朝，建元洪武。此时北方元朝尚有相当实力，但内部纷争不断，军队纪律松弛。',process:'洪武元年（1368年）八月，朱元璋命徐达为征虏大将军、常遇春为副将，率二十五万明军北伐。北伐军从南京出发沿大运河北上，先后攻克山东、河南。闰七月，明军进逼大都，元顺帝妥懽帖睦尔与太子、后妃及大臣仓皇放弃大都北逃至上都（今内蒙古正蓝旗）。八月初二，徐达率军进入大都，攻占元朝首都。',result:'元顺帝北逃后仍沿用"大元"国号（史称"北元"），试图收复中原但未能成功。1388年北元后主脱古思帖木儿被阿里不哥后裔也速迭儿杀害，北元灭亡。蒙古各部从此分裂，退回草原。明朝统一了中国内地。',evaluation:'元朝是第一个由少数民族建立的大一统王朝，享国九十七年。其灭亡的原因是多方面的：民族压迫政策导致汉人反抗、财政危机和通货膨胀、皇室内斗和权臣专权、黄河水灾等自然灾害的冲击。元朝"来得猛烈、去得也迅速"，兴衰之速在中国历代大一统王朝中少见。',impact:'元朝灭亡后，明朝在制度上全面恢复汉制。但元朝的一些制度遗产（如行省制度）被明朝继承。蒙古势力退回草原后长期与明朝对峙，终明一朝北方边防压力始终未除。元朝留下的民族问题和文化遗产，至今仍可在中国多民族国家的格局中寻到痕迹。'}
    ],
    figures:[
      {name:'忽必烈',desc:'（1215—1294年），元朝开国皇帝元世祖，成吉思汗之孙。取《易经》"大哉乾元"改国号为元，定都大都（今北京）。灭南宋统一中国，开创行省制度，推崇儒学重用汉臣，使元朝完成从草原帝国到中原正统王朝的转型。'},
      {name:'成吉思汗',desc:'名铁木真（1162—1227年），蒙古帝国的缔造者。统一蒙古各部落后于1206年被推举为大汗，创建千户制军政体制，颁布蒙古第一部成文法典《大札撒》。在位期间蒙古疆域扩张至中亚和东欧，是世界历史上最伟大的征服者之一。'},
      {name:'郭守敬',desc:'字若思（1231—1316年），元代天文学家数学家。编制的《授时历》确定回归年为365.2425天，与当今公历完全一致但早了整整三百年。还设计制造了简仪仰仪等十余种天文仪器，在元大都设立了中国古代最精密的天文观测台。'},
      {name:'关汉卿',desc:'号已斋叟（约1220—1300年），元代杂剧作家，被尊为"曲圣"。一生创作杂剧六十余种，《窦娥冤》《救风尘》《单刀会》等为元曲巅峰之作，深刻反映了社会底层人民的生活和抗争，被列入世界文化名人。'},
      {name:'马致远',desc:'号东篱（约1250—1321年），元代杂剧家和散曲家。与关汉卿郑光祖白朴并称"元曲四大家"。代表作《汉宫秋》写王昭君出塞故事，散曲《天净沙·秋思》"枯藤老树昏鸦小桥流水人家"成为千古绝唱。'},
      {name:'马可·波罗',desc:'（1254—1324年），意大利威尼斯旅行家。1275年沿丝绸之路到达元大都得到忽必烈信任。留居中国十七年游历大江南北，回国后口述《马可·波罗游记》描绘了中国无与伦比的富庶与文明，深刻影响了欧洲人对东方的认知。'}
    ],
    inventions:['《授时历》（精确到365.2425天）','元曲','行省制度','回回炮'],
    turningPoints:[{y:'1279年',e:'元朝统一全国',d:'元军在崖山海战中击败南宋残部，陆秀夫背幼帝跳海殉国',s:'中国历史上首次由少数民族政权完成全国统一'},{y:'1368年',e:'元朝灭亡',d:'朱元璋部下徐达、常遇春率明军攻克大都，元顺帝北逃',s:'蒙古势力退回草原，汉人重新建立统一王朝'}],
    color:'#D4AF6A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/7009f5f5-f5f6-4f6f-3d7f-4f0f0f9f7f3f.jpg'
  },
  { id:'ming', name:'明朝', period:'1368年 - 1644年', start:1368, end:1644, founder:'明太祖朱元璋',
    desc:'明朝是中国历史上最后一个由汉族建立的大一统王朝。明初国力强盛，郑和七下西洋展示了中国强大的海上实力。永乐年间编纂的《永乐大典》是当时世界上最大的百科全书。明朝中后期出现了资本主义萌芽，王阳明心学影响深远。但明朝后期宦官专权、党争激烈、财政危机，最终被农民起义推翻。',
    events:[
      {name:'朱元璋称帝建明',desc:'公元1368年正月初四，朱元璋在应天府（今南京）即皇帝位，国号大明，建元洪武。',background:'朱元璋（1328—1398），原名朱重八，安徽凤阳人，出身赤贫农家。1344年淮北大旱，父母长兄相继饿死，十七岁的朱元璋入皇觉寺为僧，后外出化缘乞食三年，足迹遍布淮西。1352年红巾军起义席卷江淮，朱元璋投奔濠州郭子兴的红巾军，因作战勇敢、机智多谋，很快从士卒升至将领。此后他逐步壮大实力，先后消灭陈友谅、张士诚、方国珍，统一南方。',process:'洪武元年（1368年）正月初四，朱元璋在应天府（今南京）南郊祭告天地，正式即皇帝位，国号"大明"，建元"洪武"。朱元璋对国号的解释是"明王出世"以应白莲教谶言，同时也取"光明"之意。即位当月即立长子朱标为太子，确立皇后马氏（马大脚）。同年八月，派徐达、常遇春北伐元朝，攻克大都。',result:'明朝建立后，朱元璋以"驱逐胡虏，恢复中华"为号召，发布了著名的《谕中原檄》。他推行重典治国、严惩贪腐的政策：明初规定贪污六十两以上即处死并剥皮实草。他废除丞相制度，将权力集中于皇帝一人。通过"洪武之治"，明初社会经济迅速恢复发展。',evaluation:'朱元璋是中国历史上出身最寒微的开国皇帝，从乞丐到天子的传奇一生在世界史上也属罕见。他的重典治国在短期内有效整顿了元末以来的贪腐风气，但过于严苛的统治也为明初的政治氛围蒙上了肃杀之气。',impact:'明朝的建立结束了元朝的统治，中国再次回到汉族政权之下。"洪武之治"为明朝近三百年的统治奠定了基础。朱元璋废除丞相、设立锦衣卫、分封诸王等制度安排，深刻影响了此后明朝乃至整个中国帝制晚期的政治格局。'},
      {name:'靖难之役',desc:'公元1399至1402年，燕王朱棣以"清君侧"为名起兵反抗建文帝的削藩政策，攻入南京夺位。',background:'朱元璋为巩固朱家天下，将二十四个儿子和一个重孙分封到全国各地为王，诸王拥有护卫军队。其中镇守北平的燕王朱棣（朱元璋第四子）实力最强，麾下精锐数万。1398年朱元璋驾崩，因太子朱标早逝，皇太孙朱允炆（建文帝）继位。建文帝深感藩王叔父们军权过重威胁皇权，在齐泰、黄子澄辅佐下开始削藩。',process:'建文帝在一年内先后废黜了周王、湘王、齐王、代王、岷王五位藩王。湘王朱柏不堪受辱自焚而死，这使燕王朱棣深感警惕。1399年七月，朱棣以《皇明祖训》中"朝无正臣，内有奸逆，必举兵诛讨以清君侧"为名，在北平起兵，史称"靖难之役"。战争历时三年多，双方互有胜负。1402年，朱棣采纳降将建议，绕过坚城直取南京。六月，谷王朱橞和李景隆打开金川门投降，朱棣军攻入南京。宫中大火，建文帝不知所踪。',result:'朱棣在南京奉天殿登基，改元永乐，是为明成祖。他废除了建文年号和各种新政，恢复洪武旧制。对于忠于建文帝的大臣，朱棣进行了残酷镇压：方孝孺因拒绝起草即位诏书被灭十族（九族之外加门生故旧），齐泰、黄子澄等皆被处死。建文帝的下落成为中国历史著名悬案。',evaluation:'靖难之役本质上是朱家内部的皇位争夺战。朱棣雄才大略、战功赫赫，其治国能力远胜文弱的建文帝，开创了永乐盛世。但他篡位夺权和残酷镇压异己的行为，始终是其帝王生涯的污点。方孝孺等人的忠烈气节也为后人景仰。',impact:'靖难之役改变了明朝的政治走向。朱棣迁都北京、"天子守国门"，五次亲征漠北，派郑和下西洋，编纂《永乐大典》，开创了明朝最辉煌的永乐盛世。但藩王造反的成功先例也使后世皇帝对宗室更加猜忌和限制。'},
      {name:'永乐迁都北京',desc:'公元1421年，明成祖朱棣力排众议将都城从南京迁至北京，提出"天子守国门"的理念。',background:'朱棣即位后，深感南京偏处东南，不利于控制北方边防。北京（原元大都）是朱棣的封地和大本营，他在这里经营多年根基深厚。同时北京地处农耕区与游牧区的交界地带，以首都直接镇守北方边境符合军事需要。永乐四年（1406年），朱棣下诏以南京皇宫为蓝本营建北京新都。',process:'北京紫禁城的建设从永乐四年开始筹备——采伐木材于四川、江西、湖广，开采石料于北京房山，烧制金砖于苏州，历时十余年。永乐十五年（1417年）主体工程全面展开，动用工匠二十三万人、民夫数十万人。1420年，紫禁城（宫城）、皇城、内城三大工程基本竣工。1421年正月初一，朱棣在紫禁城奉天殿接受百官朝贺，正式迁都北京。',result:'迁都后北京成为明朝的政治军事中心。朱棣提出"天子守国门，君王死社稷"的理念——皇帝亲自镇守边防、与国家共存亡。这一决策影响了北京此后的历史地位，北京至今仍是中国首都。',evaluation:'永乐迁都是一项具有远见的战略决策。坐镇北京有利于集中全国力量防御北方蒙古势力，有明一代北京从未被外敌攻破。但远离富庶的江南经济中心也增加了漕运负担，每年需通过大运河从南方调运数百万石粮食供应京师。',impact:'迁都北京是中国政治地理格局的重大转折——此前的统一王朝多以长安、洛阳、开封或南京为都，自永乐以后北京成为此后五百余年中国的政治中心，直到今天。紫禁城作为明清两代的皇宫，是中国古代建筑艺术的巅峰之作。'},
      {name:'郑和七下西洋',desc:'公元1405至1433年，郑和奉明成祖之命率领庞大船队七次远航西洋，最远到达非洲东海岸。',background:'朱棣即位后急于宣扬国威、建立朝贡体系，同时也有寻找可能逃亡海外的建文帝的意图。永乐时期的明朝国力鼎盛，造船技术和航海技术世界领先。郑和（原名马和，回族）因在靖难之役中立有战功深得朱棣信任，被选为远航船队的统帅。',process:'自永乐三年（1405年）至宣德八年（1433年），郑和先后七次率领庞大船队远航西洋。船队拥有宝船（旗舰）等各型船只两百余艘，随行官兵、水手、工匠、译员等二万七千余人。宝船长约一百二十五米、宽约五十米，是当时世界上最大的海船。船队经东南亚、印度洋到达红海和非洲东海岸，访问了三十多个国家和地区。航程中运用了牵星术（天文导航）、指南针、航海图等先进技术。',result:'郑和船队七次远航，建立了从中国到非洲东海岸的庞大海上贸易网络。各国使节随船来华朝贡者络绎不绝，明朝的国际威望达到顶峰。但宣德以后，明朝全面实行海禁，庞大的远洋船队被废弃，宝船图纸被兵部侍郎刘大夏烧毁，中国的远洋航海戛然而止。',evaluation:'郑和下西洋是人类航海史上的伟大壮举，其船队规模、航行距离和时间都远超半个世纪后哥伦布、达·伽马等欧洲航海家。但郑和的航行以宣扬国威和朝贡贸易为目的，不具有经济驱动和殖民扩张的性质，与欧洲大航海时代有本质不同。',impact:'郑和远航促进了中国与东南亚、南亚、西亚和东非各国的经济文化交流。但是永乐之后明朝从海洋全面退缩，中国从此退出了远洋舞台，错失了参与大航海时代的机会。五百年后，取代郑和船队出现在印度洋上的已是西方列强的炮舰。'},
      {name:'土木堡之变',desc:'公元1449年，明英宗朱祁镇在宦官王振怂恿下御驾亲征瓦剌，在土木堡被围英宗被俘。',background:'正统年间，蒙古瓦剌部在首领也先的领导下崛起，屡次南下骚扰明朝边境。明朝方面，宦官王振深受明英宗朱祁镇宠信，权倾朝野。王振为人骄横贪婪，多次扣减对瓦剌的赏赐，激化了双方矛盾。正统十四年（1449年）七月，也先率瓦剌大军分四路大举南下，明军边境防线告急。',process:'王振怂恿年仅二十二岁的英宗效仿成祖亲征漠北的壮举，御驾亲征瓦剌。英宗不顾群臣反对，仓促调集五十万大军（号称）从北京出发。由于准备不足，大军粮草不继、士气低落。行至大同后得知前线明军大败，王振又决定班师。撤退途中王振为炫耀乡里，令大军绕道蔚州（王振故乡），后又怕大军践踏自家田禾而再次改道，行军路线反复变更延误了撤退时机。八月十五日，明军在土木堡（今河北怀来）被瓦剌骑兵追上包围。土木堡无水泉，明军人困马乏大乱，瓦剌骑兵趁势冲杀。',result:'土木堡之战明军全军覆没，五十万大军死伤大半，随行文武官员数百人战死。英宗被瓦剌俘虏北去，王振在乱军中被愤怒的明将樊忠锤杀。消息传到北京举朝震恐。留守北京的兵部侍郎于谦力排南迁之议，拥立英宗之弟朱祁钰为帝（景泰帝），组织北京保卫战打退瓦剌进攻，保住了明朝江山。',evaluation:'土木堡之变是明朝由盛转衰的转折点。此前明朝对外保持攻势防御，此后转为被动防御。王振的专权和英宗的轻率导致了这场空前的军事灾难。但于谦在危难之际挺身而出力挽狂澜，展现了中国士大夫"天下兴亡，匹夫有责"的担当精神。',impact:'土木堡之变使明朝元气大伤，精锐部队损失殆尽，开国以来的武臣勋贵集团遭到毁灭性打击。虽然于谦守住了北京，但明朝从此丧失了主动出击的能力，边防战略从进攻转为全面防御。英宗被俘也引发了一系列政治危机——代宗继位、英宗复辟（夺门之变）、于谦冤死，明朝政治日趋复杂化。'},
      {name:'张居正改革',desc:'公元1572至1582年，内阁首辅张居正利用万历帝年幼推行全面改革，使明朝一度中兴。',background:'明朝中期以后，土地兼并严重，大量田地被宗室和势家隐占，国家税基严重萎缩。同时官僚机构效率低下、腐败成风，财政入不敷出，边防废弛。1572年隆庆帝驾崩，年仅九岁的万历帝朱翊钧即位。张居正在太监冯保的支持下取代高拱成为内阁首辅，利用万历帝年幼代行皇权。',process:'张居正的改革以"尊主权、课吏职、信赏罚、一号令"为纲领，主要措施包括：一条鞭法（将田赋、徭役和各种杂税合并为一，按亩征银，简化税制）、考成法（建立官员绩效考核制度，事事有期限、件件有考核）、清丈田亩（在全国重新丈量土地，查出大量被隐匿的田产）、整饬边防（任用戚继光镇守蓟门、李成梁镇守辽东）。',result:'改革取得了显著成效：万历十年国家存粮可用十年、存银达四百万两，扭转了隆庆以来的财政危机。张居正权势达到顶峰，实际上成为明朝的"摄政"。但万历十年（1582年）张居正病逝后，二十岁的万历帝开始亲政，在反对派的鼓动下对张家进行清算——抄家、追夺官爵、家属流放，张居正长子张敬修自缢而死。改革措施大部分被废除。',evaluation:'张居正是中国历史上最有作为的改革家之一，以一人之力支撑起了摇摇欲坠的大明王朝，"救时宰相"之称名副其实。但他大权独揽、专断独行的作风也树敌众多，且教育万历帝时过于严厉（甚至代表皇帝起草罪己诏），导致万历年幼时积累的怨恨在亲政后全面爆发。',impact:'张居正改革是明朝最后一次挽救国家命运的重大努力。改革的成功证明明朝的衰败并非无药可救，但改革成果的全面被废说明制度性的衰朽已难以逆转。张居正身后遭受的清算产生了恶劣的示范效应——后来的内阁首辅再也不敢推行激进改革，明朝在因循苟且中走向灭亡。'},
      {name:'戚继光抗倭',desc:'明代中期倭寇肆虐东南沿海，名将戚继光组建"戚家军"创造"鸳鸯阵"战法，基本肃清倭患。',background:'明朝实行严厉的海禁政策，禁止民间海外贸易。但东南沿海地少人多，百姓自古以海为生。海禁迫使许多人铤而走险从事走私贸易。嘉靖年间，日本进入战国时代，大量失业的武士（浪人）与中国沿海的走私商人和海盗勾结，形成武装走私集团——"倭寇"。倭寇不仅走私，还大肆烧杀抢劫，江浙闽粤沿海处处告急。明军卫所制度废弛，官军屡战屡败。',process:'嘉靖三十四年（1555年），戚继光调任浙江都司佥事，负责抗倭。他发现本地卫所兵不堪用，于是到义乌招募农民和矿工三千人严格训练，组建了著名的"戚家军"。戚继光针对倭寇擅用长刀近身格斗的特点，创造了"鸳鸯阵"——以十一人为一组，配备藤牌手、狼筅手、长枪手、镗钯手，长短兵器协同作战，攻防兼备。',result:'嘉靖四十年（1561年），戚继光在台州之战中九战九捷，歼灭倭寇数千。次年率军入闽，攻克倭寇巢穴横屿岛，又在兴化、仙游大破倭寇。至嘉靖末年，东南沿海的大股倭寇基本被肃清。戚继光后来又奉命镇守蓟门十六年，防御蒙古鞑靼部的侵扰。',evaluation:'戚继光是明朝最杰出的军事家之一。他不仅战功卓著，还著有《纪效新书》和《练兵实纪》两部军事学经典，在军队组织、训练方法、战术阵法等方面都有系统性创新。他的"鸳鸯阵"以步兵协同作战克制倭寇的刀法优势，是军事史上因地制宜、灵活应变的典范。',impact:'戚继光抗倭保卫了东南沿海人民的生命财产安全，使遭受倭患数十年的沿海地区恢复了安宁。但明朝政府未能从根本上反思海禁政策的弊端——倭患的根源之一是海禁体制下的走私经济。隆庆年间部分开放海禁（"隆庆开关"）后，倭患才真正平息。'},
      {name:'李自成攻破北京与明朝灭亡',desc:'公元1644年三月十九日，李自成率领大顺农民军攻入北京，崇祯帝在煤山自缢殉国，明朝灭亡。',background:'明朝末年，西北地区连年灾荒（尤以崇祯大旱为烈），百姓无以为生，而政府的赋税反而因辽东战事不断加派（"辽饷""剿饷""练饷"三饷合计超过正赋数倍）。陕西爆发了大规模农民起义，涌现出李自成、张献忠等领袖。与此同时，关外的清朝（后金）多次突破长城防线入掠中原。明朝腹背受敌，应对失措。',process:'李自成出身陕西米脂贫苦农家，曾为驿卒，后加入农民起义军闯王高迎祥部。高迎祥被俘杀后，李自成继称"闯王"，提出"均田免赋"的口号，深得饥民响应。1643年李自成在襄阳称新顺王，1644年正月在西安正式建立大顺政权，改元永昌。同年二月，大顺军从西安出发东征，一路势如破竹攻克太原、大同、宣府，三月十七日抵达北京城下。三月十八日夜太监曹化淳打开彰义门献城，大顺军攻入内城。',result:'三月十九日凌晨，崇祯帝朱由检见大势已去，在煤山（今景山）一棵槐树上自缢殉国。死前在衣襟上留下血书遗诏："朕死无面目见祖宗于地下，自去冠冕，以发覆面。任贼分裂朕尸，勿伤百姓一人。"明朝自洪武元年（1368年）至崇祯十七年（1644年），享国二百七十六年，至此灭亡。',evaluation:'崇祯帝在位十七年，是中国历史上最勤政的皇帝之一，夙兴夜寐、节俭自持，但他刚愎多疑、用人不当，十七年间更换内阁首辅五十余位、诛杀督师大臣十余人（包括袁崇焕），自毁长城。明朝的灭亡是制度性衰朽、财政崩溃、军事失败和自然灾荒等多重因素综合作用的结果，非一人之力可回天。',impact:'明朝的灭亡标志着中国历史上最后一个汉族大一统王朝的终结。李自成入京后未能巩固政权，大顺军纪律败坏、拷掠官绅敛财，仅四十余日即被清军和吴三桂联军击败。清军随即入关定鼎北京，开始了清朝对中国的统治。明朝灭亡的教训极为深刻，成为后世治国理政的一面镜子。'}
    ],
    figures:[
      {name:'朱元璋',desc:'（1328—1398年），明朝开国皇帝。出身贫苦农家，少年当和尚乞丐，后参加红巾军以卓越的军事才能崛起。1368年在应天称帝建立明朝，北伐推翻元朝统治。在位期间重典治国严惩贪腐，但诛杀功臣也留下争议。'},
      {name:'朱棣',desc:'（1360—1424年），明成祖永乐帝。发动靖难之役夺位后迁都北京建造紫禁城，提出"天子守国门"的理念。派郑和下西洋宣扬国威，编纂《永乐大典》，五次亲征漠北鞑靼瓦剌，开创了明朝的鼎盛时期。'},
      {name:'郑和',desc:'（1371—1433年），本姓马原名文和，回族，明代航海家。1405至1433年七次率领庞大船队下西洋，访问三十余国，远达非洲东海岸。航海规模远超同时代欧洲航海家，是世界航海史上的伟大壮举。'},
      {name:'王阳明',desc:'名守仁字伯安（1472—1529年），明代思想家军事家。提出"致良知""知行合一"的心学理论，强调"心外无物心外无理"。平定宁王之乱和广西少数民族起义，是中国历史上少有的文能立言、武能定国的大儒。'},
      {name:'张居正',desc:'字叔大（1525—1582年），明代内阁首辅。推行一条鞭法简化赋税统一征银、考成法整顿吏治。改革使明朝一度中兴，被誉为"宰相之杰"。去世后被万历帝抄家清算，改革成果尽废。'},
      {name:'戚继光',desc:'字元敬（1528—1588年），明代抗倭名将。在浙江招募矿工农民组建"戚家军"，创鸳鸯阵战法。台州之战九战九捷、福建之战大破倭寇，基本肃清东南沿海倭患。著有《纪效新书》。'},
      {name:'李时珍',desc:'字东璧（1518—1593年），明代医药学家。历时二十七年走遍大江南北，参考八百余种文献写成《本草纲目》——五十二卷一百九十余万字收录药物一千八百九十二种。被达尔文誉为"中国古代的百科全书"。'},
      {name:'海瑞',desc:'字汝贤（1514—1587年），明代著名清官。以刚直不阿敢于直言著称，任户部主事时买好棺材诀别家人冒死上《治安疏》批评嘉靖帝迷信道教荒废朝政。被后世尊为"海青天"，是中国历史上清官文化的象征。'},
      {name:'徐光启',desc:'字子先（1562—1633年），明代科学家。与意大利传教士利玛窦合作翻译《几何原本》，编著《农政全书》——中国古代最完备的农业百科全书。官至礼部尚书兼文渊阁大学士，是明末具有世界眼光的科学家。'}
    ],
    inventions:['《永乐大典》','《本草纲目》','《天工开物》','紫禁城','明代青花瓷'],
    turningPoints:[{y:'1405—1433年',e:'郑和下西洋',d:'郑和率领两万七千余人的庞大船队七次远航，访问三十多个国家和地区',s:'展示了明朝强大的海上实力，促进了中国与亚非各国的经济文化交流'},{y:'1644年',e:'明朝灭亡',d:'李自成农民军攻入北京，崇祯帝在万岁山（煤山）自缢殉国',s:'最后一个汉族大一统王朝结束，清军随即入关定鼎中原'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/fc23f6f6-f6f7-5f7f-4e8f-5f1f1f0f8f4f.jpg'
  },
  { id:'qing', name:'清朝', period:'1636年 - 1912年', start:1636, end:1912, founder:'清太祖努尔哈赤',
    desc:'清朝是中国历史上最后一个封建王朝，由满族建立。康雍乾三朝国力达到鼎盛，康乾盛世时期中国疆域超过1300万平方公里，人口突破三亿规模。但清朝中后期闭关锁国，与工业革命失之交臂，在西方列强的侵略下逐渐沦为半殖民地半封建社会。1911年辛亥革命推翻帝制，终结了中国延续两千多年的封建君主专制制度。',
    events:[
      {name:'努尔哈赤建后金与皇太极改国号为清',desc:'公元1616年努尔哈赤建立后金，1636年皇太极改国号为"大清"。',background:'明朝后期，东北地区的女真族分为建州、海西、野人三大部。建州女真首领努尔哈赤以祖、父留下的十三副铠甲起兵，经过三十余年的征伐，先后统一了建州各部和海西女真四部，势力日益壮大。明朝在辽东的统治日趋腐朽，与女真各部矛盾不断加深。',process:'1616年（天命元年）正月初一，努尔哈赤在赫图阿拉（今辽宁新宾）称汗，国号"大金"（史称后金），建元天命。1618年努尔哈赤以"七大恨"告天誓师，公开反明。1626年努尔哈赤在宁远之战中被袁崇焕的红夷大炮击伤，不久去世。其第八子皇太极继位后，对内仿行明制建立六部、整顿八旗、改族名为"满洲"；对外征服朝鲜、蒙古。1636年，皇太极在盛京（今沈阳）称帝，取"大清"为国号（五行中"明"属火，"清"属水，水克火），改元崇德。',result:'后金—清朝在东北崛起，逐步蚕食明朝辽东领土。1643年皇太极去世，其第九子福临（顺治帝）继位，由叔父多尔衮摄政。此时清朝已具备入主中原的实力，只待时机。',evaluation:'努尔哈赤和皇太极父子两代人，用不到三十年时间将一个边远部落打造成了能够取代明朝的强大政权。皇太极改国号为清、仿行明制、重用汉臣，使清朝完成了从部落政权到封建王朝的转型，为日后入关统治全中国做好了制度准备。',impact:'清朝的建立改变了中国此后近三百年的政治格局。满族从一个边远少数民族成长为统治民族，"八旗制度"和"满汉分治"等清朝特色制度深刻影响了中国社会。清朝入关后成为继元朝之后第二个由少数民族建立的大一统王朝。'},
      {name:'清军入关定鼎北京',desc:'公元1644年，吴三桂引清军入关，多尔衮率八旗军击败李自成攻占北京，清朝入主中原。',background:'1644年三月李自成攻破北京、崇祯帝自缢的消息传到辽东后，明朝山海关总兵吴三桂陷入两难：是降"贼"（大顺军）还是降"虏"（清军）。吴三桂起初打算投降李自成，但其爱妾陈圆圆被大顺将领刘宗敏霸占、其父吴襄被拷打追饷，吴三桂"冲冠一怒为红颜"转而向清朝求援。此时清摄政王多尔衮正率八旗大军南下，收到吴三桂求援信后迅速进军山海关。',process:'1644年四月二十二日，多尔衮率清军与吴三桂军在山海关内外夹击李自成的大顺军。大顺军溃败退回北京。五月初二，多尔衮率清军进入北京。九月，顺治帝福临自盛京（今沈阳）迁都北京，在紫禁城武英殿举行登极大典。清廷随即宣布"为崇祯帝发丧"以收买明朝遗臣人心。',result:'清军入关后迅速击败李自成的大顺军和南明残余势力。1645年清军南下攻占南京，南明弘光政权灭亡。此后清军又经过三十余年的南征北战，先后消灭大西军（张献忠余部）、夔东十三家、台湾郑氏政权等反清势力，到1683年基本统一全国。',evaluation:'清军入关是中国历史上极具戏剧性的一幕：一个仅有数十万人口的边远民族，借李自成灭明之机以迅雷不及掩耳之势入主中原，最终统治了人口数千万的庞大帝国近三百年。吴三桂引清军入关的行为被后世视为"汉奸"的典型，其个人悲剧和民族罪人的身份至今争议不休。',impact:'清军入关改变了中国历史的走向。清朝以少数民族身份统治汉族占绝大多数的中国，推行剃发易服、圈地投充等政策，引发了剧烈的民族矛盾和社会冲突。但清朝也继承了明朝的政治制度和儒家文化传统，并在康雍乾时期将中国经济和文化推向了新的高峰。'},
      {name:'康熙平定三藩收台湾',desc:'康熙帝八岁登基智擒鳌拜亲政，1673—1681年平定三藩之乱，1683年派施琅统一台湾。',background:'清初为奖励降清有功的明朝将领，封吴三桂为平西王镇守云南、尚可喜为平南王镇守广东、耿精忠为靖南王镇守福建，合称"三藩"。三藩拥有独立的军队和财政权，尤其是吴三桂在云南"用人吏部不得掣肘，用财户部不得稽核"，形同独立王国。康熙帝亲政后将削藩作为首要任务。',process:'1673年康熙帝力排众议下令撤藩，吴三桂随即在云南起兵反清，自称"天下都招讨兵马大元帅"，尚之信（尚可喜之子）和耿精忠纷纷响应。三藩之乱席卷半个中国，战火燃遍云南、贵州、四川、湖南、广东、广西、江西、福建、陕西、甘肃等省。康熙帝镇定应对，采取分化瓦解策略，先打击最强的吴三桂。1678年吴三桂在衡州（今衡阳）称帝后不久病死，其孙吴世璠继位。1681年清军攻克昆明，吴世璠自杀，三藩之乱平定。1683年康熙派施琅率水师渡海攻占澎湖，郑克塽（郑成功之孙）率台湾郑氏政权投降，台湾纳入清朝版图。',result:'三藩之乱历时八年被平定，清朝废除了藩镇制度，加强了中央集权。台湾收复后，康熙在台湾设置一府三县，隶属福建省，台湾正式纳入中国版图的行政体系。',evaluation:'康熙帝平定三藩时年仅二十岁，展现出了卓越的政治魄力和军事指挥能力。平定三藩消除了清朝最严重的内部分裂威胁，收复台湾则完成了明末以来中国的最终统一。康熙以"恩威并施"的策略，用武力平定叛乱、用政治手段巩固统一。',impact:'平定三藩和收复台湾巩固了清朝的大一统局面，为康乾盛世的到来清除了最大障碍。台湾纳入清朝版图后，大批闽粤汉人移居台湾开垦，台湾的开发进入了新阶段。施琅平台的成功也证明，统一事业需要坚船利炮的硬实力和政治智慧的软实力相结合。'},
      {name:'康乾盛世',desc:'康熙、雍正、乾隆三朝（1661—1795年）持续134年，是中国封建社会的最后一个鼎盛时期。',background:'清朝经历了清初的战乱之后，康熙帝平定三藩、收复台湾、抗击沙俄、三征噶尔丹，国家进入相对稳定期。雍正帝继位后整顿吏治、推行财政改革（摊丁入亩、耗羡归公），为乾隆盛世的鼎盛奠定了财力基础。',process:'康乾盛世从康熙二十年（1681年）平定三藩到乾隆六十年（1795年）乾隆退位，持续114年。期间的成就包括：疆域鼎盛——东至库页岛、西至巴尔喀什湖、南至南海诸岛、北至外兴安岭，总面积超过1300万平方公里；人口增长——从清初的约两千万激增至乾隆末年的三亿；经济繁荣——粮食总产量、手工业规模、商业贸易总量均达到中国古代最高水平；文化工程——编纂《古今图书集成》《四库全书》等大型文化典籍。',result:'康乾盛世将中国传统农业文明推向了极致巅峰——人口之众、疆域之广、物产之丰均远超汉唐。盛世景象令来华的欧洲传教士和使节叹为观止。但盛世辉煌之下隐忧重重：人口激增导致人均耕地减少、乾隆后期吏治严重腐败、八旗军队战斗力锐减、闭关锁国政策使中国与工业革命失之交臂。',evaluation:'康乾盛世是中国封建社会的"夕阳辉煌"——它达到了传统农业文明所能达到的最高水平，但从世界范围看，同一时期英国正在进行工业革命、法国思想启蒙运动蓬勃发展，"盛世"的中国已开始落后于西方。乾隆接见英使马戛尔尼时傲慢地宣称"天朝物产丰盈无所不有"，这种盲目的自大是盛世表象下的深层危机。',impact:'康乾盛世为现代中国留下了庞大的疆域版图和众多人口，是多民族统一国家最终形成的关键时期。但盛世的繁荣也使清朝统治者失去了变革的紧迫感。乾隆去世仅四十五年后鸦片战争爆发，中国从天朝上国迅速跌落为半殖民地，盛世与屈辱之间的剧烈反差成为中国近代史的底色。'},
      {name:'鸦片战争',desc:'公元1840至1842年，英国以林则徐虎门销烟为借口发动侵华战争，清军战败签订《南京条约》。',background:'18世纪末至19世纪初，英国通过东印度公司向中国大量走私鸦片，以平衡中英贸易逆差。鸦片泛滥使中国白银大量外流、国民身心遭受毒害。1839年，道光帝派林则徐为钦差大臣赴广州禁烟。林则徐在虎门海滩当众销毁没收的鸦片二百三十七万斤。英国政府以此为借口决定发动侵华战争。',process:'1840年6月，英国远征军到达广州海面，因广东防守严密转攻浙江定海。1841年英军攻陷广州外围炮台，清廷将林则徐革职。1842年英军沿长江深入，攻陷镇江威逼南京。道光帝被迫求和。1842年8月29日，清政府全权代表耆英、伊里布在停泊于南京下关江面的英国军舰"康华丽号"上签订了《南京条约》。',result:'《南京条约》主要内容：开放广州、厦门、福州、宁波、上海五处为通商口岸；割让香港岛给英国；赔款2100万银元；协定关税（中国不能自行制定关税税率）。次年又签订《虎门条约》和《五口通商章程》，给予英国领事裁判权和片面最惠国待遇。中国开始丧失独立主权。',evaluation:'鸦片战争是中国近代屈辱史的开端。一个拥有四亿人口的庞大帝国，被远道而来的几千名英国远征军击败，这一事实极大地震动了中国社会。林则徐是中国近代"睁眼看世界的第一人"，他在广东组织的禁烟和战备活动展现了抵抗外来侵略的坚定决心，但个人的努力终究无法弥补制度性的落后。',impact:'《南京条约》的签订标志着中国被迫打开国门、开始沦为半殖民地半封建社会。此后西方列强纷纷效仿英国，通过不平等条约从中国攫取各种特权。"落后就要挨打"的惨痛教训从此深深烙印在中国人的集体意识中，成为后世追求民族复兴的强大动力。'},
      {name:'太平天国运动',desc:'公元1851至1864年，洪秀全在广西金田村发动起义建立"太平天国"，势力发展到十八省。',background:'鸦片战争后，清政府为支付巨额赔款加重赋税，百姓负担沉重。广东花县人洪秀全屡试不第，在基督教小册子《劝世良言》的影响下创立"拜上帝会"，自称上帝次子、耶稣之弟。他与其好友冯云山到广西桂平县紫荆山一带传教，吸引了大量贫苦农民和矿工入会。洪秀全撰写了《原道醒世训》《原道觉世训》等宣传文章，提出建立"天下一家、共享太平"的理想社会。',process:'1851年1月11日，洪秀全在广西桂平金田村宣布起义，建号"太平天国"，自称"天王"。太平军从广西出发，经湖南北上，一路势如破竹——攻克武汉三镇后兵力从不足两万发展至五十余万。1853年3月太平军攻占南京，改名为"天京"，定都于此。太平天国颁布《天朝田亩制度》（平均分配土地），势力范围最盛时曾达十八省。但1856年天京事变（杨秀清逼封万岁被韦昌辉杀害，韦昌辉又被洪秀全处死，石达开负气出走）严重削弱了大平天国的实力。清朝方面以曾国藩的湘军、李鸿章的淮军为主力与之对抗。',result:'1864年，湘军曾国荃部攻破天京（南京）。洪秀全已于城破前病死（一说服毒自尽），幼天王洪天贵福被俘后处死。太平天国运动历时十四年终于失败。这场战争波及十六省，造成的人口损失估计高达两三千万人，江南最富庶的地区遭到严重破坏。',evaluation:'太平天国运动是中国历史上规模最大的农民起义之一，其特别之处在于借用了基督教的宗教外衣和提出了一套独特的社会理想。太平天国一定程度上动摇了清王朝的统治根基。但其内部的权力斗争、宗教极端主义和对传统文化的全面否定也饱受批评。',impact:'太平天国运动加速了清王朝的衰落。为镇压太平军，清廷被迫下放财政军事权力给汉族地方督抚，以曾国藩、李鸿章、左宗棠为代表的汉族官僚集团崛起，地方势力膨胀，中央集权遭到削弱。这种"内轻外重"的格局一直延续到清朝灭亡。战争的巨大破坏使江南经济文化倒退数十年。'},
      {name:'洋务运动',desc:'公元1861至1894年，洋务派倡导"师夷长技以自强"，创办军事工业和北洋水师，甲午战败宣告破产。',background:'经历两次鸦片战争和太平天国运动后，清政府面临空前严重的内忧外患。一部分有远见的官员认识到西方"船坚炮利"的优势，主张学习西方技术以图自强，形成了以"自强求富"为旗帜的洋务运动。洋务派的核心人物包括中央的恭亲王奕訢、地方的曾国藩、李鸿章、左宗棠、张之洞。',process:'洋务运动前期以"自强"为目标，重点建设军事工业：江南制造总局、金陵机器局、福州船政局、天津机器局等。后期提出"求富"口号，发展民用工业以"分洋商之利"：轮船招商局、开平矿务局、汉阳铁厂、湖北织布局等。同时创办新式教育：京师同文馆培养翻译人才，派遣幼童留美。军事上建成了亚洲最强的北洋水师——拥有铁甲舰定远、镇远等各型军舰七十余艘，号称"世界第八舰队"。',result:'洋务运动三十余年间，中国近代工业从无到有建设了第一批近代化的工厂、矿山、铁路、电报线路和学校。但1894年甲午战争中，洋务运动的最高军事成果——北洋水师在黄海海战和威海卫之战中全军覆没。洋务派"中学为体、西学为用"（保留中国传统制度的前提下仅学习西方技术）的指导思想受到严重质疑。',evaluation:'洋务运动是中国近代化的开端，它使中国迈出了从传统农业社会向近代工业化社会转型的第一步。但洋务运动的根本局限在于只引进西方技术而不变革制度——梁启超批评说："知有洋务而不知有国务，知有兵事而不知有民政。"这种"换汤不换药"的改革注定无法使中国真正富强。',impact:'洋务运动培养了中国第一批近代科技人才和产业工人，建立了中国近代工业的基础。甲午战败的惨烈教训使更多人认识到仅学技术层面的改革远远不够，从而推动了维新变法和辛亥革命等更深层次的变革。"中体西用"思想的失败也为后世改革提供了深刻的教训。'},
      {name:'甲午中日战争',desc:'公元1894至1895年，日本发动侵华战争，北洋水师全军覆没，签订《马关条约》。',background:'日本明治维新后迅速走上对外扩张道路，其"大陆政策"的首个目标是朝鲜，进而侵略中国。1894年春，朝鲜爆发东学党起义，清政府应朝鲜政府请求派兵入朝协助镇压。日本也以保护侨民为由派兵入朝。起义平息后日本拒不撤兵，反而增兵控制朝鲜。',process:'1894年7月25日，日本海军在丰岛海面突袭中国运兵船，中日战争爆发。9月17日黄海大海战中，"致远"舰管带邓世昌在弹尽舰伤的情况下下令全速撞击日舰"吉野"，不幸被鱼雷击中沉没，全舰二百五十余名官兵壮烈殉国。此后北洋水师退守威海卫消极避战。1895年1月日军在山东荣成登陆攻占威海卫，北洋水师提督丁汝昌在援绝粮尽的情况下自杀殉国，残存军舰被日军俘获，北洋水师全军覆没。同年4月17日，清政府全权代表李鸿章在日本马关（下关）签订了《马关条约》。',result:'《马关条约》主要内容：中国承认朝鲜"独立"（实际沦为日本殖民地）；割让台湾全岛、澎湖列岛及辽东半岛给日本；赔偿日本军费白银二亿两；开放沙市、重庆、苏州、杭州为商埠。后因俄德法三国干涉，日本归还辽东半岛，但中国须另付三千万两白银"赎辽费"。',evaluation:'甲午战败是中国近代史上最沉重的打击之一。被一个长期被视为"最尔小国"的日本打败，而且输得如此之惨——亚洲最强大的舰队全军覆没、割地赔款之惨烈远超历次——这一事实彻底击碎了中国人"天朝上国"的幻想。梁启超沉痛地说："吾国四千年大梦之唤醒，实自甲午战败割台湾、偿二百兆始。"',impact:'甲午惨败引发了空前的民族危机和救亡运动。台湾割让给日本后，台湾人民组织义军进行了悲壮的抗日斗争。《马关条约》的巨额赔款相当于清政府三年的财政收入，为筹集赔款清政府大举外债，财政从此依赖于列强。日本的赔款则成为其军备扩张和工业发展的资金，加速了日本军国主义的膨胀。甲午战后列强掀起了瓜分中国的狂潮，中华民族面临着"亡国灭种"的现实威胁。'},
      {name:'戊戌变法（百日维新）',desc:'公元1898年，光绪帝采纳维新派建议推行新政，仅一百零三天后被慈禧太后政变镇压。',background:'甲午战败后，民族危机空前加深。康有为、梁启超等维新派知识分子发起"公车上书"反对《马关条约》，主张维新变法。康有为撰写《孔子改制考》《新学伪经考》为变法寻找理论依据。光绪帝面对国破家亡的危局，决心变法图强。1898年6月11日，光绪帝颁布《明定国是诏》，宣布变法。',process:'从6月11日至9月21日的一百零三天里，光绪帝连续颁发了数十道改革上谕，涉及领域包括：政治上裁撤闲散机构、广开言路；经济上设立农工商总局、修筑铁路、开采矿产、改革财政；文化上废八股改试策论、设立京师大学堂、奖励科学发明；军事上裁汰旧军、训练新式陆海军。但由于守旧势力的阻抗，大部分诏令并未真正落实。',result:'维新变法严重危及了以慈禧太后为首的守旧派利益。9月21日慈禧发动政变，重新"训政"，将光绪帝囚禁于中南海瀛台。戊戌六君子——谭嗣同、林旭、杨锐、刘光第、杨深秀、康广仁被斩于北京菜市口。康有为、梁启超流亡海外。新政措施除京师大学堂外全部被废除。',evaluation:'戊戌变法是近代中国第一次由皇帝主导的全面政治改革尝试，虽然失败了，但它在思想启蒙方面的意义远超其实际政治成果。谭嗣同临刑前高呼"有心杀贼，无力回天。死得其所，快哉快哉"，其舍生取义的精神感召了无数后来的革命志士。',impact:'戊戌变法的失败说明和平改良的道路在中国走不通。此后越来越多的仁人志士转向革命，主张以暴力手段推翻清朝统治。变法期间设立的京师大学堂后来发展为北京大学，成为中国新文化运动的策源地。康梁在海外继续宣传维新思想，对海外华人社会和日本的中国留学生产生了重要影响。'},
      {name:'辛亥革命与清帝退位',desc:'公元1911年武昌起义成功，1912年孙中山就任临时大总统，清帝退位，封建帝制终结。',background:'经历戊戌变法失败和八国联军侵华后，清政府被迫推行"新政"——废科举、练新军、设资政院——但改革力度有限，未能挽救统治危机。以孙中山为首的革命派在海外成立同盟会（1905年），提出"驱除鞑虏、恢复中华、创立民国、平均地权"的革命纲领，组织多次武装起义（1911年4月的黄花岗起义牺牲惨烈但影响深远）。国内立宪派多次请愿要求速开国会，清廷敷衍以"皇族内阁"回应。',process:'1911年10月10日，湖北新军中的革命党人在武昌发动起义并迅速占领武汉三镇，成立湖北军政府，推举黎元洪为都督。武昌起义的消息传遍全国后各省纷纷响应，一个月内先后有十三个省宣布脱离清廷独立。清廷起用袁世凯为内阁总理大臣率北洋军镇压。1912年1月1日，孙中山在南京宣誓就任中华民国临时大总统，亚洲第一个民主共和国正式诞生。袁世凯在与革命党谈判中达成协议：如果他能迫使清帝退位并赞同共和，则让他出任临时大总统。',result:'1912年2月12日，隆裕太后代表年幼的宣统帝溥仪在紫禁城养心殿颁布退位诏书："将统治权公诸全国，定为共和立宪国体。"延续了二千一百三十二年的封建帝制就此终结。2月13日孙中山辞去临时大总统，2月15日参议院选举袁世凯为临时大总统。',evaluation:'辛亥革命的成功带有一定的偶然性——武昌起义最初只是偶然发生的军事哗变，但它反映了清政府统治已经腐朽到了任何事件都可能引发崩溃的程度。孙中山虽未亲自指挥武昌起义，但他数十年如一日奔走革命宣传共和、创立同盟会的思想启蒙和组织储备，为革命奠定了不可或缺的基础。',impact:'辛亥革命终结了两千余年的帝制传统，使民主共和的观念深入人心。但革命的胜利果实很快被袁世凯窃取，中国随后陷入了北洋军阀的黑暗统治时期。民国虽然建立了，但民主宪政的理想始终未能真正实现。孙中山的遗言"革命尚未成功，同志仍须努力"成为此后中国革命者前仆后继的动力源泉。'}
    ],
    figures:[
      {name:'康熙',desc:'爱新觉罗·玄烨（1654—1722年），清朝第四位皇帝。八岁登基智擒鳌拜亲政，平三藩收台湾、三征噶尔丹、抗击沙俄侵略签订《尼布楚条约》。在位六十一年开创康乾盛世的局面，是中国历史上在位时间最长的皇帝。'},
      {name:'雍正',desc:'爱新觉罗·胤禛（1678—1735年），清朝第五位皇帝。整顿吏治设立军机处加强皇权、推行摊丁入亩耗羡归公等财政改革，勤政异常据说每天批阅奏折万余字，为乾隆盛世的繁荣奠定了坚实基础。'},
      {name:'乾隆',desc:'爱新觉罗·弘历（1711—1799年），清朝第六位皇帝。在位六十年（退位后以太上皇训政三年），康乾盛世在他治下达到顶峰，疆域超一千三百万平方公里人口突破三亿。编纂《四库全书》。晚年宠信和珅吏治腐败，盛世之下危机暗伏。'},
      {name:'林则徐',desc:'字元抚（1785—1850年），清代政治家民族英雄。任湖广总督期间严禁鸦片，1839年奉旨赴广州在虎门海滩当众销毁鸦片二百三十七万斤。鸦片战争爆发后被革职流放新疆伊犁，在流放途中写下"苟利国家生死以，岂因祸福避趋之"。'},
      {name:'曾国藩',desc:'字伯涵（1811—1872年），晚清名臣湘军创始人。组建湘军平定太平天国运动，与李鸿章左宗棠张之洞并称"晚清四大名臣"。倡导洋务运动创办江南制造总局，其家书家训影响深远，被誉为"立德立功立言三不朽"的典范。'},
      {name:'李鸿章',desc:'字渐甫（1823—1901年），晚清重臣。创建淮军、倡导洋务运动创办轮船招商局等企业、筹建北洋水师。先后代表清政府签订《马关条约》《辛丑条约》等不平等条约，背负了深重的历史争议。临终前留下"三百年来伤国步，八千里外吊民残"的哀叹。'},
      {name:'左宗棠',desc:'字季高（1812—1885年），晚清名臣。年届六十九岁抬棺出征率领湘军收复被阿古柏侵占十二年的新疆全境，迫使沙俄归还伊犁。如果没有左宗棠的收复行动，今天中国的版图上可能就没有占国土面积六分之一的新疆。'},
      {name:'慈禧太后',desc:'（1835—1908年），清朝咸丰帝妃，同治光绪两朝的实际统治者。统治中国四十七年，发动辛酉政变夺取最高权力，镇压戊戌变法囚禁光绪帝。在位期间中国屡遭列强侵略割地赔款，是中国近代屈辱史中最具争议的人物。'},
      {name:'孙中山',desc:'名文字德明号逸仙（1866—1925年），中国近代民族民主主义革命的先行者。创建兴中会同盟会，提出三民主义，领导辛亥革命推翻延续两千余年的封建帝制。1912年就任中华民国临时大总统，被尊为"国父"。'},
      {name:'康有为',desc:'字广厦号长素（1858—1927年），晚清维新派领袖。公车上书反对签订《马关条约》，主导戊戌变法推动制度革新，变法失败后流亡海外十六年。著有《大同书》构想理想社会，是中国近代重要的思想家和改革家。'}
    ],
    inventions:['《四库全书》','《红楼梦》','京剧','圆明园','《康熙字典》'],
    turningPoints:[{y:'1840年',e:'鸦片战争',d:'英国以林则徐虎门销烟为借口发动侵华战争，清朝战败签订《南京条约》',s:'中国开始沦为半殖民地半封建社会，被迫打开国门'},{y:'1911年',e:'辛亥革命',d:'武昌起义爆发，各省纷纷响应宣布独立，成立中华民国',s:'结束延续两千余年的封建帝制，中国进入共和时代'}],
    color:'#A0826D', bg:'https://miaoda-site-img.cdn.bcebos.com/images/2e35f7f7-f7f8-6f8f-5f9f-6f2f2f1f9f5f.jpg'
  },
  { id:'modern', name:'近现代时期', period:'1912年 - 至今', start:1912, end:2026, founder:'孙中山',
    desc:'辛亥革命推翻帝制后，中国经历了北洋政府、国民政府、抗日战争、解放战争等重大历史阶段。1949年中华人民共和国成立，标志着中国人民站起来了。1978年改革开放后，中国经济持续高速发展，到21世纪初已成为世界第二大经济体。今天的中国，正在实现中华民族伟大复兴的道路上坚定前行。',
    events:[
      {name:'中华民国成立',desc:'公元1912年1月1日，孙中山在南京就任中华民国临时大总统，亚洲第一个民主共和国正式成立。',background:'辛亥革命成功后，各省代表齐集南京商讨组建临时中央政府。此时孙中山仍在海外，但他多年来奔走革命宣传共和的巨大声望使其成为总统的不二人选。12月25日孙中山回到上海，12月29日十七省代表选举孙中山为中华民国临时大总统。与此同时，袁世凯的北洋军与革命军在武汉对峙，南北和谈正在进行。',process:'1912年1月1日晚十时，孙中山在南京原两江总督署（太平天国天王府旧址）宣誓就任中华民国临时大总统，宣读誓词："倾覆满洲专制政府，巩固中华民国，图谋民生幸福。"改用公历，以1912年为中华民国元年。一月三日各省代表选举黎元洪为副总统，组成南京临时政府。',result:'南京临时政府虽仅存在了三个月，但发布了一系列具有民主革命意义的法令：废除"大人""老爷"等旧式称呼，历法改用公历，剪辫放足，禁除鸦片，保护人民权利。2月12日清帝退位，2月14日孙中山辞去临时大总统，3月10日袁世凯在北京就任临时大总统，辛亥革命果实落入袁世凯之手。',evaluation:'中华民国的成立标志着两千余年封建帝制的终结和民主共和制度的开始。孙中山领导中国"走向共和"，实现了从"帝国"到"民国"的历史性跨越。但革命的迅速成功也带来了致命的弱点——革命党缺乏足够的军事力量和组织能力来巩固政权。',impact:'中华民族的创立深刻改变了中国人的政治观念。"天下为公""主权在民"的思想开始深入人心。虽然民国初年的政治实践充满混乱和挫折，但民主共和成为此后中国政治发展的不可逆转的方向。孙中山的"三民主义"成为此后中国革命的重要思想资源。'},
      {name:'五四运动',desc:'公元1919年5月4日，巴黎和会上中国外交失败的消息传回，北京学生走上街头抗议，运动席卷全国。',background:'第一次世界大战期间中国加入了协约国方面，派出十余万华工赴欧洲支援。1918年德国投降后，中国各界对巴黎和会寄予厚望，期待作为战胜国收回德国在山东的权益。但1919年4月，巴黎和会决定将德国在山东的全部权益转让给日本——"公理战胜强权"的幻想破灭。',process:'1919年5月4日下午，北京大学、高等师范等十三所学校的三千余名学生在天安门前集会，高呼"外争国权、内惩国贼""废除二十一条""还我青岛"等口号。游行队伍行至赵家楼胡同时火烧了曹汝霖的住宅（曹为签订"二十一条"时的外交次长）。军警逮捕了三十二名学生。消息传开后全国各地学生纷纷罢课声援。6月3日后运动升级为全国范围的罢工、罢课、罢市——上海工人罢工，商人罢市，运动由知识界扩展至全社会。',result:'在全国人民的巨大压力下，北洋政府被迫释放被捕学生，罢免曹汝霖、章宗祥、陆宗舆三人的职务。6月28日中国代表拒绝在巴黎和约上签字。五四运动取得了重大胜利。',evaluation:'五四运动是中国近代以来第一次由知识分子发起、各阶层广泛参与的全国性爱国运动。它标志着中国新民主主义革命的开端——无产阶级开始作为独立的政治力量登上历史舞台。五四运动的伟大意义在于它唤醒了全民族的政治觉悟，"爱国、进步、民主、科学"的五四精神激励了一代又一代中国人。',impact:'五四运动在思想文化上推动了新文化运动向纵深发展——白话文取代文言文、民主与科学思想广泛传播、马克思主义开始在中国系统传播。五四运动为中国共产党的成立做了思想上和干部上的准备。此后每年的五四被定为"中国青年节"，五四精神成为中华民族精神的重要组成部分。'},
      {name:'中国共产党成立',desc:'公元1921年7月23日，中国共产党第一次全国代表大会在上海开幕，最后一天转到嘉兴南湖游船上举行。',background:'五四运动后马克思主义在中国广泛传播。1920年，陈独秀在上海、李大钊在北京、毛泽东在长沙等地先后建立了共产党的早期组织。以《新青年》为代表的进步刊物大量介绍俄国十月革命和马克思主义理论。各地共产主义小组积极在工人中宣传马克思主义、组织工会。',process:'1921年7月23日晚，中共一大在上海法租界望志路106号（今兴业路76号）李汉俊之兄李书城的寓所秘密开幕。出席代表十三人：毛泽东、何叔衡、董必武、陈潭秋、王尽美、邓恩铭、李达、李汉俊、张国焘、刘仁静、陈公博、周佛海、包惠僧（受陈独秀委派），以及共产国际代表马林和尼科尔斯基。代表全国五十余名党员。7月30日会场遭法租界巡捕搜查，代表们转移到浙江嘉兴南湖的一条游船（后称"红船"）上举行了最后一天的会议。',result:'大会通过了中国共产党的第一个纲领和决议，确定党的名称为"中国共产党"，选举陈独秀为中央局书记。党纲规定："革命军队必须与无产阶级一起推翻资本家阶级的政权"，"承认无产阶级专政"，"消灭资本家私有制"。一个完全新式的、以马克思列宁主义为行动指南的无产阶级政党正式诞生。',evaluation:'中国共产党成立是中国历史上开天辟地的大事件。在此之前中国的先进分子尝试过各种救国方案——洋务、维新、宪政、共和——都未能真正改变中国的命运。中国共产党的成立使中国人民有了坚强的领导核心，中国革命的面貌从此焕然一新。',impact:'中国共产党成立后，迅速投入了中国革命的实际斗争。1922年中共二大提出了反帝反封建的民主革命纲领，1923年决定与国民党合作（第一次国共合作），1924—1927年领导了轰轰烈烈的国民大革命。大革命失败后，中国共产党走上了独立领导武装斗争和土地革命的道路，经过二十八年艰苦卓绝的斗争最终取得了全国政权。'},
      {name:'抗日战争全面爆发',desc:'公元1937年7月7日卢沟桥事变爆发，日本发动全面侵华战争，全国军民浴血奋战十四年最终取得胜利。',background:'日本自明治维新后对中国侵略步步深入：1895年割占台湾、1931年发动"九一八事变"侵占中国东北三省、1932年在上海发动"一二八事变"。1937年日本的侵略野心全面膨胀，在北平（今北京）郊区频繁举行军事演习，蓄谋发动全面侵华战争。',process:'1937年7月7日深夜，日军在北平西南卢沟桥附近举行"军事演习"时，以一名士兵"失踪"为借口要求进入宛平县城搜查，被中国守军第29军严词拒绝。日军随即炮击宛平城和卢沟桥，第29军奋起抵抗。七七事变标志着日本全面侵华战争的开始。8月13日日军进攻上海（八一三事变），淞沪会战爆发。9月国共两党实现第二次合作，抗日民族统一战线正式形成。中国人民开始了长达八年的全面抗战（如从1931年九一八事变算起则为十四年）。',result:'全国人民以巨大的民族牺牲换来了抗战的胜利。正面战场有淞沪会战、台儿庄大捷、武汉会战、昆仑关大捷等战役；敌后战场有平型关大捷、百团大战等战役。1945年8月15日日本宣布无条件投降，9月2日正式签署投降书，中国人民抗日战争胜利结束。中国军民伤亡超过三千五百万人，财产损失难以计数。',evaluation:'抗日战争是近代以来中国人民第一次取得完全胜利的民族解放战争。在民族存亡的危急关头，中华民族空前团结——国共两党捐弃前嫌携手合作，"地无分南北，年无分老幼，无论何人，皆有守土抗战之责任"。抗战的胜利洗雪了鸦片战争以来屡战屡败的民族屈辱。',impact:'抗战胜利使中国收复了被日本侵占五十年的台湾和澎湖列岛，成为联合国安理会五个常任理事国之一，国际地位空前提高。抗战中中国军民展现的不屈不挠的民族精神成为中国人民宝贵的精神财富。抗战的胜利也为中国共产党领导的新民主主义革命的最终胜利奠定了广泛的群众基础。'},
      {name:'中华人民共和国成立',desc:'公元1949年10月1日，毛泽东在天安门城楼上庄严宣告中华人民共和国中央人民政府成立。',background:'抗战胜利后国民党发动全面内战（1946年），中国共产党领导的解放军经过辽沈、淮海、平津三大战役（1948年9月—1949年1月）歼灭国民党军主力。1949年4月解放南京、宣告国民党在大陆统治的终结。1949年9月21日至30日，中国人民政治协商会议第一届全体会议在北平召开，会议通过了《共同纲领》（起临时宪法作用），确定以五星红旗为国旗、《义勇军进行曲》为代国歌、北平改名为北京作为首都。',process:'1949年10月1日下午二时，中央人民政府委员会在北京中南海勤政殿举行第一次会议，宣布就职。下午三时，首都北京三十万军民齐集天安门广场举行开国大典。毛泽东主席在天安门城楼上向全世界庄严宣告："中华人民共和国中央人民政府今天成立了！"并亲自按动电钮升起了新中国第一面五星红旗。朱德总司令检阅了海陆空三军，举行了盛大的阅兵式和群众游行。',result:'新中国的诞生标志着中国彻底结束了半殖民地半封建社会的屈辱历史，彻底结束了旧中国一盘散沙的局面，实现了民族的独立和人民的解放。中华人民共和国成立后，迅速统一了中国大陆（除台湾外），开展了土地改革、抗美援朝和国民经济的恢复重建。',evaluation:'中华人民共和国的成立是中国共产党领导中国人民经过二十八年浴血奋斗取得的伟大胜利，是中国历史和世界历史上具有里程碑意义的重大事件。毛泽东所说的"中国人民从此站起来了"表达了全中国人民的心声。新中国的成立也极大地改变了世界政治格局——一个占世界人口四分之一的大国选择了社会主义道路。',impact:'新中国的成立开启了中国历史的新纪元。此后七十余年间，中国从一个一穷二白的农业国发展成为世界第二大经济体，数亿人口摆脱贫困，创造人类发展史上的奇迹。新中国的建立也为中华民族伟大复兴奠定了根本政治前提和制度基础，中国人民的命运从此牢牢掌握在自己手中。'},
      {name:'抗美援朝',desc:'公元1950至1953年，中国人民志愿军跨过鸭绿江入朝作战，最终迫使美方在停战协定上签字。',background:'1950年6月25日朝鲜战争爆发。朝鲜人民军势如破竹攻占首尔，将韩军和美军逼至釜山一隅。9月15日以美国为首的联合国军在仁川登陆，切断朝鲜人民军退路，战局急转直下。联合国军越过三八线北上，战火烧到了中国边境鸭绿江边。美军飞机多次轰炸中国东北边境城市。中国政府多次警告美国不要越过三八线，但麦克阿瑟扬言"圣诞节前结束战争"，对中国警告置若罔闻。',process:'应朝鲜政府请求，中国作出"抗美援朝、保家卫国"的战略决策。1950年10月19日，彭德怀率领中国人民志愿军秘密跨过鸭绿江入朝作战。从1950年10月至1951年6月，志愿军连续发动五次大规模战役，将以美军为首的联合国军从鸭绿江边赶回三八线附近。此后战争转入长达两年的阵地战阶段——上甘岭战役（1952年）是其中最为惨烈的战役，志愿军在仅3.7平方公里的阵地上承受了190余万发炮弹的轰击，坚守住了阵地。',result:'经过两年多的战场较量，1953年7月27日，《朝鲜停战协定》在板门店签署宣告朝鲜战争结束。中国人民志愿军以落后的武器装备打败了世界上最强大的以美国为首的联合国军，取得了抗美援朝战争的伟大胜利。',evaluation:'抗美援朝是新中国立国之初最严峻的考验。面对世界上头号军事强国，新生的中华人民共和国没有屈服退缩，而是以坚定的意志和巨大的牺牲"打得一拳开，免得百拳来"。彭德怀说："抗美援朝雄辩地证明：西方侵略者几百年来只要在东方一个海岸上架起几尊大炮就可以霸占一个国家的时代，一去不复返了。"',impact:'抗美援朝的胜利极大增强了中国人民的民族自信心和自豪感、极大提高了新中国的国际威望。苏联也因此加快了对华援助，中国获得了工业化的起步助力。但战争也迟滞了解放台湾的进程，美国第七舰队封锁台湾海峡，台湾问题至今悬而未决。'},
      {name:'改革开放',desc:'公元1978年12月，中共十一届三中全会决定将工作重心转移到社会主义现代化建设上来，中国进入改革开放新时期。',background:'1976年"文化大革命"结束后，国民经济处于崩溃边缘，人民生活水平长期低下。约九亿人口中有七亿多农村人口，其中相当比例处于贫困状态。面对与发达国家的巨大差距，全党全国上下都产生了强烈的改革和发展要求。1978年全国展开了关于"实践是检验真理的唯一标准"的大讨论，打破了"两个凡是"的思想禁锢。',process:'1978年12月18日至22日，中共十一届三中全会在北京召开。全会作出了"把全党工作的着重点和全国人民的注意力转移到社会主义现代化建设上来"的重大决策，确立了"解放思想、实事求是"的思想路线，否定了"以阶级斗争为纲"的方针。改革从农村起步——安徽凤阳小岗村十八位农民以"血手印"秘密签约实行包产到户，随后家庭联产承包责任制在全国推广。1980年设立深圳、珠海、汕头、厦门四个经济特区。1984年十二届三中全会通过《关于经济体制改革的决定》，改革从农村扩展到城市。1992年邓小平南方谈话进一步推动了改革开放的深入。',result:'改革开放四十余年来中国经济创造了世界经济发展史上的奇迹：GDP从1978年的3679亿元增长到超过120万亿元，近八亿人摆脱绝对贫困。中国建立起了社会主义市场经济体制，成为世界第二大经济体、第一大工业国和第一大贸易国。',evaluation:'改革开放是当代中国命运的关键抉择，是党和人民事业大踏步赶上时代的重要法宝。邓小平作为改革开放的总设计师，以巨大的政治勇气和远见卓识推动了这场改变中国命运的伟大革命。中国的经验证明：发展是硬道理，改革发展稳定是一个有机整体。',impact:'改革开放深刻地改变了中国和世界。中国不仅甩掉了贫穷落后的帽子、全面建成了小康社会，而且成为世界经济增长的最大引擎。改革开放的成功经验为其他发展中国家提供了中国方案。新时代中国继续坚持全面深化改革和扩大开放，在高质量发展道路上坚定前行。'},
      {name:'香港澳门回归',desc:'公元1997年7月1日香港回归，1999年12月20日澳门回归，"一国两制"伟大构想成功实践。',background:'香港（包括香港岛、九龙和新界）自1842年、1860年和1898年先后被英国割占和强租，租期九十九年于1997年6月30日届满。澳门自1557年被葡萄牙逐步占据。1980年代初邓小平创造性提出了"一个国家，两种制度"的构想来解决历史遗留的港澳问题。',process:'1982年邓小平会见英国首相撒切尔夫人时明确指出"主权问题不是一个可以讨论的问题"，开启了中英谈判。1984年12月中英签署《联合声明》，确定1997年7月1日中国恢复对香港行使主权。1987年4月中葡签署《联合声明》，确定1999年12月20日中国恢复对澳门行使主权。1997年6月30日午夜至7月1日凌晨，中英香港政权交接仪式在香港会展中心举行。1999年12月19日午夜至20日凌晨，中葡澳门政权交接仪式在澳门文化中心举行。',result:'香港和澳门在"一国两制""港人治港""澳人治澳"和保持原有社会制度与生活方式五十年不变的原则下顺利回归祖国。这是中国人民在完成国家统一大业道路上迈出的重要一步，洗雪了中华民族被列强欺凌割地赔款的奇耻大辱。',evaluation:'"一国两制"是世界政治史上具有独创性的构想，以和平谈判方式解决了历史遗留问题，为国际社会以和平方式解决类似问题提供了典范。香港回归以来的实践证明"一国两制"是行得通、办得到、得人心的。',impact:'港澳回归极大地增强了中华民族的民族自豪感和凝聚力。解决了历史遗留的领土问题后，国家的完全统一只剩下台湾问题。港澳在回归后继续保持繁荣稳定，证明了"一国两制"的生命力，也为解决台湾问题提供了借鉴。'},
      {name:'北京奥运会',desc:'公元2008年8月8日，第29届夏季奥林匹克运动会在北京盛大开幕，中国代表团以51枚金牌名列金牌榜首位。',background:'1993年北京首次申办奥运会以两票之差惜败悉尼。2001年7月13日萨马兰奇宣布北京获得2008年第29届夏季奥运会举办权，举国欢腾。北京奥运会是中国综合国力提升和国际地位提高的重要标志，也是中国人民百年奥运梦想的实现。',process:'北京奥运会于2008年8月8日晚8时在国家体育场"鸟巢"盛大开幕，由张艺谋担任总导演的开幕式以"文明与和谐"为主题，通过中国画卷、千人击缶、活字印刷、丝绸之路等震撼表演展现了中国五千年文明。来自二百零四个国家和地区的运动员参赛。中国代表团派出六百三十九名运动员参赛，以51枚金牌、21枚银牌、28枚铜牌高居金牌榜首位，创造了中国参加奥运会以来的最好成绩。',result:'北京奥运会获得了国际社会的高度赞誉，被誉为"真正无与伦比"的一届奥运会。鸟巢、水立方等奥运场馆成为北京新的城市地标，"同一个世界，同一个梦想"的奥运口号深入人心。奥运会极大地促进了北京的城市建设和中国体育事业的发展。',evaluation:'北京奥运会是中国改革开放三十年成果的一次集中展示。世界各国人民通过奥运会直观感受到了中国翻天覆地的变化和中国人民热情友好开放自信的精神面貌。北京奥运会不仅是一场体育盛会，更是一场文化盛事，增进了中国与世界的相互了解。',impact:'北京奥运会的成功举办标志着中国以全新的姿态站在了世界舞台的中央。此后中国又成功举办了2014年南京青年奥运会、2022年北京冬季奥运会，北京成为世界上第一个"双奥之城"。奥运会留下的体育设施和城市基础设施至今为北京市民所享用，全民健身运动和体育产业蓬勃发展。'},
      {name:'全面建成小康社会',desc:'公元2020年，中国如期完成脱贫攻坚目标任务，近一亿农村贫困人口全部脱贫，全面建成小康社会。',background:'"小康"一词最早出自《诗经》"民亦劳止，汔可小康"，表达了中国人民对安定富裕生活的朴素向往。1979年邓小平会见日本首相时首次使用"小康"来描述中国式的现代化。2002年中共十六大明确提出"全面建设惠及十几亿人口的更高水平的小康社会"的奋斗目标。2012年中共十八大提出到2020年全面建成小康社会的目标。其中脱贫攻坚是最艰巨的任务。',process:'2012年以来，中国以前所未有的力度推进脱贫攻坚：累计投入财政专项扶贫资金近1.6万亿元，选派25.5万个驻村工作队、300多万名第一书记和驻村干部，近200万名乡镇干部和数百万村干部奋战在扶贫一线。通过产业扶贫、易地搬迁扶贫、教育扶贫、健康扶贫、生态扶贫等多元方式，精准帮扶每一个贫困家庭。',result:'2020年底，全国832个贫困县全部摘帽，12.8万个贫困村全部出列，近一亿农村贫困人口全部脱贫，完成了消除绝对贫困的艰巨任务。中国提前十年实现了联合国2030年可持续发展议程中消除贫困的目标。全面建成小康社会意味着中国经济、政治、文化、社会、生态各方面都达到了小康水平。',evaluation:'全面建成小康社会是中国历史上具有里程碑意义的重大成就。它是中国共产党以人民为中心的发展思想的生动实践，"小康路上一个也不能少"的庄严承诺变成了现实。脱贫攻坚战不仅改变了数千万人的生活，也创造了人类减贫史上的奇迹。',impact:'全面建成小康社会后，中国开启了全面建设社会主义现代化国家的新征程。第一个百年奋斗目标（中国共产党成立一百年时全面建成小康社会）的圆满实现，为第二个百年奋斗目标（中华人民共和国成立一百年时建成社会主义现代化强国）奠定了坚实基础。中国的发展经验为其他发展中国家提供了减贫和现代化的中国方案。'}
    ],
    figures:[
      {name:'孙中山',desc:'名文字德明号逸仙（1866—1925年），中国近代民族民主主义革命的先行者。创建兴中会同盟会提出三民主义，领导辛亥革命推翻延续两千余年的封建帝制。1912年就任中华民国临时大总统，被尊为"国父"。晚年改组国民党实行"联俄联共扶助农工"三大政策。'},
      {name:'毛泽东',desc:'字润之（1893—1976年），中国共产党和中华人民共和国的主要缔造者。领导中国人民取得新民主主义革命的伟大胜利，1949年宣告中华人民共和国成立。毛泽东思想对中国和世界都产生了深远影响。'},
      {name:'周恩来',desc:'字翔宇（1898—1976年），中华人民共和国首任总理。一生勤政爱民鞠躬尽瘁，参与领导南昌起义创建人民军队，西安事变中促成国共合作抗日。建国后负责外交内政，提出和平共处五项原则，是深受人民爱戴的好总理。'},

      {name:'鲁迅',desc:'原名周树人（1881—1936年），中国现代文学的奠基人。以笔为投枪匕首猛烈抨击封建礼教和国民劣根性，《狂人日记》《阿Q正传》《呐喊》等作品深刻影响了中国现代文学和思想启蒙运动。被毛泽东誉为"文化新军的最伟大和最英勇的旗手"。'},

      {name:'邓稼先',desc:'（1924—1986年），中国核武器研制工作的开拓者和奠基者。隐姓埋名在戈壁滩奋斗二十八年，主持中国第一颗原子弹和氢弹的理论设计，是"两弹一星"元勋。因长期接触核辐射身患癌症去世，临终仍惦念国家核试验。'}
