<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国全历史</title>
<style>
  :root {
    --bg: #1a1812;
    --card: #242118;
    --card-hover: #2a2720;
    --text: #e8dfcf;
    --text-secondary: #a09880;
    --text-muted: #6b6258;
    --border: #3a3428;
    --primary: 45 90% 55%;
    --accent: 35 80% 50%;
    --radius: 16px;
    --shadow-card: 0 20px 60px -20px rgba(0,0,0,.6);
    --shadow-glow: 0 0 40px hsl(45 90% 55% / .3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(hsl(45 90% 55% / .025) 1px, transparent 1px),
      linear-gradient(90deg, hsl(45 90% 55% / .025) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ── Hero ── */
  .hero {
    position:relative; z-index:1;
    text-align:center; padding:48px 24px 28px;
  }
  .hero h1 {
    font-size:clamp(28px,5vw,42px); font-weight:800; letter-spacing:.12em;
    background:linear-gradient(135deg, hsl(45 85% 58%), hsl(42 100% 72%), hsl(35 75% 55%));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 30px hsl(45 90% 55% / .3));
    margin-bottom:10px;
    text-indent:.05em;
  }
  .hero .subtitle {
    color:var(--text-secondary); font-size:15px; letter-spacing:.08em;
    margin-bottom:14px;
  }
  .hero .stats {
    display:inline-flex; align-items:center; gap:16px;
    font-size:13px; color:var(--text-muted); letter-spacing:.05em;
  }
  .hero .stats span {
    padding:5px 16px; border-radius:20px;
    background:hsl(var(--primary) / .06);
    border:1px solid hsl(var(--primary) / .12);
    color:hsl(var(--primary) / .8);
    font-weight:600;
  }

  /* ── Era Tabs with arrows ── */
  .era-tabs-wrap {
    position:sticky; top:0; z-index:100;
    background:hsl(30 15% 10% / .88);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:0;
    padding:0;
  }
  .tab-arrow {
    flex-shrink:0; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    color:var(--text-secondary); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .25s ease; user-select:none;
    margin:0 4px;
  }
  .tab-arrow:hover {
    border-color:hsl(var(--primary)); color:hsl(var(--primary));
    box-shadow:0 0 16px hsl(var(--primary) / .15);
  }
  .tab-arrow:active { transform:scale(.92); }
  .era-tabs {
    flex:1; display:flex; gap:4px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
    padding:10px 0; scrollbar-width:none;
  }
  .era-tabs::-webkit-scrollbar { display:none; }
  .era-tab {
    flex-shrink:0; padding:8px 18px; border-radius:24px;
    border:1px solid transparent; font-size:13px; font-weight:600;
    cursor:pointer; color:var(--text-muted);
    transition:all .3s ease; user-select:none; white-space:nowrap;
  }
  .era-tab:hover { color:var(--text); background:var(--card); }
  .era-tab.active {
    color:var(--bg); background:hsl(var(--primary));
    box-shadow:0 0 24px hsl(var(--primary) / .35);
    border-color:hsl(var(--primary));
  }

  /* ── Main Content ── */
  .container {
    position:relative; z-index:1;
    max-width:1280px; margin:0 auto; padding:32px 24px 80px;
  }
  .main-grid {
    display:grid; grid-template-columns:1fr;
    gap:24px;
  }
  @media (min-width:1024px) {
    .main-grid { grid-template-columns:1fr 1fr; }
  }

  /* ── Cards ── */
  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px 32px;
    box-shadow:var(--shadow-card);
    animation:fadeInUp .5s ease-out;
  }
  .card h2 {
    font-size:24px; font-weight:800; margin-bottom:6px;
    background:linear-gradient(135deg, hsl(var(--primary)), hsl(35 80% 55%));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .card .period-label {
    display:inline-block; font-size:12px; color:hsl(var(--primary));
    background:hsl(var(--primary) / .08); padding:4px 14px;
    border-radius:20px; margin-bottom:16px; font-weight:600;
    letter-spacing:.04em;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(24px); }
    to { opacity:1; transform:translateX(0); }
  }

  /* ── Section titles ── */
  .section-title {
    font-size:16px; font-weight:700; margin-bottom:14px; margin-top:24px;
    display:flex; align-items:center; gap:8px;
    color:var(--text);
  }
  .section-title::before {
    content:''; display:inline-block;
    width:3px; height:16px; border-radius:2px;
    background:hsl(var(--primary));
    flex-shrink:0;
    box-shadow:0 0 8px hsl(var(--primary) / .4);
  }

  /* ── Era description ── */
  .era-desc {
    font-size:15px; line-height:1.95; color:var(--text-secondary);
    margin-bottom:4px;
  }

  /* ── Event list ── */
  .event-list { display:flex; flex-direction:column; gap:5px; }
  .event-item {
    display:flex; align-items:flex-start; gap:10px;
    padding:10px 14px; border-radius:8px;
    border:1px solid transparent;
    font-size:13.5px; cursor:pointer;
    transition:all .25s ease; line-height:1.5;
  }
  .event-item:hover {
    background:var(--card-hover);
    border-color:var(--border);
    transform:translateX(5px);
    box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  .event-dot {
    flex-shrink:0; width:7px; height:7px; border-radius:50%;
    background:hsl(var(--primary));
    box-shadow:0 0 6px hsl(var(--primary) / .4);
    margin-top:6px;
  }

  /* ── Figure tags ── */
  .tag-list { display:flex; flex-wrap:wrap; gap:8px; }
  .tag {
    display:inline-block; padding:6px 14px; border-radius:20px;
    font-size:13px; font-weight:500;
    background:hsl(var(--primary) / .06);
    color:hsl(var(--primary) / .85); border:1px solid hsl(var(--primary) / .15);
    transition:all .25s ease; cursor:default;
  }
  .tag:hover {
    background:hsl(var(--primary) / .12);
    border-color:hsl(var(--primary) / .35);
    box-shadow:0 0 10px hsl(var(--primary) / .12);
  }

  /* ── Invention grid ── */
  .invention-grid {
    display:grid; grid-template-columns:repeat(2,1fr); gap:8px;
  }
  .invention-item {
    background:var(--card-hover); border:1px solid var(--border);
    border-radius:12px; padding:14px; text-align:center;
    font-size:13px; font-weight:500;
    transition:all .3s ease;
  }
  .invention-item:hover {
    border-color:hsl(var(--primary) / .3);
    box-shadow:0 0 20px hsl(var(--primary) / .1);
    transform:translateY(-2px);
  }

  /* ── Turning points ── */
  .tp-card {
    background:var(--card-hover); border:1px solid var(--border);
    border-radius:12px; padding:16px;
    transition:all .3s ease; margin-bottom:8px;
    border-left:3px solid hsl(var(--primary) / .4);
  }
  .tp-card:hover {
    border-color:hsl(var(--primary) / .25);
    box-shadow:0 0 18px hsl(var(--primary) / .08);
  }
  .tp-year { font-size:11px; font-weight:700; color:hsl(var(--primary)); margin-bottom:4px; letter-spacing:.05em; }
  .tp-event { font-size:14px; font-weight:700; margin-bottom:4px; }
  .tp-desc { font-size:13px; color:var(--text-secondary); margin-bottom:4px; line-height:1.5; }
  .tp-sig { font-size:12px; color:var(--text-muted); font-style:italic; }

  /* ── Detail overlay ── */
  .detail-overlay {
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .detail-panel {
    position:relative;
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px;
    max-width:600px; width:100%; max-height:82vh; overflow-y:auto;
    box-shadow:0 24px 80px rgba(0,0,0,.8), 0 0 0 1px hsl(var(--primary) / .08);
    animation:slideUp .3s ease-out;
  }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(32px); }
    to { opacity:1; transform:translateY(0); }
  }
  .detail-panel h3 {
    font-size:20px; margin-bottom:12px;
    background:linear-gradient(135deg, var(--text), hsl(var(--primary)));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .detail-close {
    position:sticky; top:0; float:right;
    width:34px; height:34px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    color:var(--text-secondary); font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s ease; z-index:1;
  }
  .detail-close:hover { border-color:hsl(var(--primary)); color:hsl(var(--primary)); }
  .detail-body { font-size:14px; line-height:2; color:var(--text-secondary); }

  /* ── Footer ── */
  footer {
    position:relative; z-index:1;
    text-align:center; padding:24px; color:var(--text-muted);
    font-size:12px; border-top:1px solid var(--border);
  }

  @media (max-width:768px) {
    .card { padding:20px 18px; }
    .card h2 { font-size:21px; }
    .era-tabs-wrap { padding:0; }
    .invention-grid { grid-template-columns:repeat(2,1fr); }
    .detail-panel { padding:24px 18px; max-width:94vw; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>中 国 全 历 史</h1>
  <p class="subtitle">穿越五千年时光轴，纵览中国历史脉络，沉浸探索每个时代的文明印记</p>
  <div class="stats">
    <span>19个历史时期</span>
    <span>5000+年历史跨度</span>
  </div>
</div>

<div class="era-tabs-wrap">
  <button class="tab-arrow" id="tabLeft" title="向左滑动">&#8249;</button>
  <div class="era-tabs" id="eraTabs"></div>
  <button class="tab-arrow" id="tabRight" title="向右滑动">&#8250;</button>
</div>

<div class="container">
  <div class="main-grid" id="mainContent"></div>
</div>

<footer>数据来源：百度百科 · 中国历史年表 &nbsp;|&nbsp; 基于中国全历史网架构重建</footer>

<div class="detail-overlay" id="detailOverlay" style="display:none;"></div>

    inventions:['世袭制度','历法雏形','青铜器初现','城市规划'],
    turningPoints:[
      {y:'约前2070年',e:'夏朝建立',d:'大禹治水成功，受舜禅让建立中国历史上第一个王朝',s:'标志着中国进入王朝时代，原始社会结束'},

    events:['商汤灭夏建立商朝（约前1600年）','盘庚迁殷（约前1300年）','武丁中兴，商朝鼎盛','妇好出征，中国最早女将军','帝辛（纣王）暴政','牧野之战，商朝灭亡（约前1046年）'],
    figures:['商汤','伊尹','盘庚','武丁','妇好','纣王','比干'],

    turningPoints:[

      {y:'约前1046年',e:'商朝灭亡',d:'周武王伐纣，牧野之战商军阵前倒戈，纣王自焚于鹿台',s:'青铜文明达到顶峰后衰落，周朝建立'}

  },
  { name:'西周', period:'约前1046年 — 前771年', start:-1046, end:-771,

  { name:'清朝', period:'1636年 — 1912年', start:1636, end:1912,

    events:['努尔哈赤建立后金（1616年），皇太极改国号为清（1636年）','清军入关定鼎北京（1644年）','康熙擒鳌拜、平三藩、收台湾','康乾盛世（1661—1795年），疆域和国力达到封建王朝巅峰','鸦片战争（1840年），《南京条约》割让香港','太平天国运动（1851—1864年）','洋务运动（1861—1894年），"师夷长技以自强"','甲午中日战争（1894年），北洋水师全军覆没','戊戌变法（1898年），百日维新失败','辛亥革命（1911年），清帝退位（1912年）'],
    figures:['康熙','雍正','乾隆','林则徐','曾国藩','李鸿章','左宗棠','慈禧太后','孙中山','康有为'],
    inventions:['《四库全书》','《红楼梦》','京剧','圆明园','《康熙字典》'],
    turningPoints:[
      {y:'1840年',e:'鸦片战争',d:'英国以林则徐虎门销烟为借口发动侵华战争，清朝战败签订《南京条约》',s:'中国开始沦为半殖民地半封建社会，被迫打开国门'},

      {y:'1978年',e:'改革开放',d:'中共十一届三中全会决定将工作重心转移到经济建设上来',s:'中国开始了人类历史上规模最大的经济腾飞'}
    ]
  }
];

let activeIdx = 7; // 秦朝默认

// ── Render ──
function renderEraTabs() {
  document.getElementById('eraTabs').innerHTML = eras.map((e,i) => {
    const cls = i === activeIdx ? 'era-tab active' : 'era-tab';
    return `<span class="${cls}" data-idx="${i}">${e.name}</span>`;
  }).join('');
  scrollActiveIntoView();
}

function scrollActiveIntoView() {
  setTimeout(() => {
    const t = document.querySelector('#eraTabs .era-tab.active');
    if (t) t.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 80);
}

// ── Arrow buttons ──
document.getElementById('tabLeft').addEventListener('click', () => {
  document.getElementById('eraTabs').scrollBy({ left:-200, behavior:'smooth' });
});
document.getElementById('tabRight').addEventListener('click', () => {
  document.getElementById('eraTabs').scrollBy({ left:200, behavior:'smooth' });
});

// ── Tab click ──
document.getElementById('eraTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.era-tab');
  if (!tab) return;
  activeIdx = parseInt(tab.dataset.idx);
  renderEraTabs();
  renderContent();
  document.getElementById('mainContent').scrollIntoView({ behavior:'smooth', block:'start' });
});

function renderContent() {
  const era = eras[activeIdx];
  if (!era) return;

  document.getElementById('mainContent').innerHTML = `
    <!-- Left Column -->
    <div style="display:flex;flex-direction:column;gap:24px;">
      <div class="card">
        <span class="period-label">${era.period}</span>
        <h2>${era.name}</h2>
        <p class="era-desc" style="margin-top:14px;">${era.desc}</p>

        <div class="section-title">重大事件</div>
        <div class="event-list">
          ${era.events.map((ev,i) => `
            <div class="event-item" data-event-idx="${i}">
              <span class="event-dot"></span>
              <span>${ev}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div style="display:flex;flex-direction:column;gap:24px;animation:slideInRight .5s ease-out;">
      <div class="card">
        <div class="section-title" style="margin-top:0;">著名人物</div>
        <div class="tag-list">
          ${era.figures.map(f => `<span class="tag">${f}</span>`).join('')}
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0;">重要成就</div>
        <div class="invention-grid">
          ${era.inventions.map(inv => `
            <div class="invention-item">${inv}</div>
          `).join('')}
        </div>
      </div>

      <div class="card">
        <div class="section-title" style="margin-top:0;">关键转折</div>
        ${era.turningPoints.map(tp => `
          <div class="tp-card">
            <div class="tp-year">${tp.y}</div>
            <div class="tp-event">${tp.e}</div>
            <div class="tp-desc">${tp.d}</div>
            <div class="tp-sig">${tp.s}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ── Event detail click ──
document.getElementById('mainContent').addEventListener('click', function(e) {
  const item = e.target.closest('.event-item');
  if (!item) return;
  const idx = parseInt(item.dataset.eventIdx);
  if (isNaN(idx)) return;
  const era = eras[activeIdx];
  const ev = era.events[idx];
  showDetail(era, ev, idx);
});

function showDetail(era, ev, idx) {
  const overlay = document.getElementById('detailOverlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <div class="detail-panel">
      <button class="detail-close" onclick="closeDetail()">&times;</button>
      <span class="period-label">${era.period}</span>
      <h3>${ev}</h3>
      <div class="detail-body">
        <p>${era.desc}</p>
        ${era.turningPoints.length > 0 ? `
          <p style="margin-top:16px;"><strong style="color:hsl(var(--primary))">相关转折：</strong></p>
          ${era.turningPoints.map(tp => `
            <p style="margin-bottom:8px;">· ${tp.y} — <strong>${tp.e}</strong>：${tp.d}（${tp.s}）</p>
          `).join('')}
        ` : ''}
        <p style="margin-top:16px;"><strong style="color:hsl(var(--primary))">著名人物：</strong>${era.figures.join('、')}</p>
        <p style="margin-top:8px;"><strong style="color:hsl(var(--primary))">重要成就：</strong>${era.inventions.join('、')}</p>
      </div>
    </div>
  `;
}

function closeDetail() {
  document.getElementById('detailOverlay').style.display = 'none';
}
document.getElementById('detailOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

// ── Init ──
renderEraTabs();
renderContent();
</script>
</body></html>
