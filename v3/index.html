<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国全历史网</title>
<style>
:root {
  --background: 30 15% 12%;
  --foreground: 40 25% 92%;
  --card: 30 18% 16%;
  --card-foreground: 40 25% 92%;
  --primary: 45 90% 55%;
  --primary-foreground: 30 15% 12%;
  --primary-glow: 45 100% 65%;
  --secondary: 30 35% 35%;
  --secondary-foreground: 40 25% 92%;
  --muted: 30 20% 22%;
  --muted-foreground: 40 20% 70%;
  --accent: 35 80% 50%;
  --accent-foreground: 30 15% 12%;
  --border: 30 25% 25%;
  --ring: 45 90% 55%;
  --radius: 0.75rem;

  --period-ancient: 35 60% 45%;
  --period-classical: 30 70% 40%;
  --period-medieval: 40 65% 50%;
  --period-imperial: 25 55% 35%;
  --period-modern: 35 75% 45%;

  --shadow-elegant: 0 20px 60px -20px hsl(var(--background) / 0.9);
  --shadow-glow: 0 0 40px hsl(var(--primary) / 0.3);
  --shadow-card: 0 10px 30px -10px hsl(var(--background) / 0.8);

  --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-history: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,sans-serif;
  background: hsl(var(--background)); color: hsl(var(--foreground)); line-height: 1.6;
  min-height: 100vh;
}

/* ── Background ── */
.bg-grid {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(hsl(var(--primary) / 0.05) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--primary) / 0.05) 1px, transparent 1px);
  background-size: 50px 50px;
}
.bg-gradient-overlay {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, hsl(var(--primary) / 0.06) 0%, transparent 60%),
              linear-gradient(180deg, hsl(var(--primary) / 0.03) 0%, transparent 40%);
}

/* ── Animations ── */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes slideInRight {
  from { opacity:0; transform:translateX(30px); }
  to { opacity:1; transform:translateX(0); }
}
@keyframes pulseGlow {
  0%,100% { box-shadow:0 0 20px hsl(var(--primary) / 0.3); }
  50% { box-shadow:0 0 40px hsl(var(--primary) / 0.6); }
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(32px); }
  to { opacity:1; transform:translateY(0); }
}
.animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
.animate-slide-in-right { animation: slideInRight 0.5s ease-out; }
.animate-pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }

/* ── Header ── */
header {
  position:relative; z-index:100;
  background:linear-gradient(180deg, hsl(var(--background)), hsl(var(--card)));
  border-bottom:1px solid hsl(var(--border) / 0.5);
  box-shadow:var(--shadow-elegant);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.header-inner {
  max-width:1400px; margin:0 auto; padding:24px 32px;
  text-align:center;
}
.header-deco {
  display:flex; align-items:center; justify-content:center; gap:16px;
  margin-bottom:8px;
}
.header-bar {
  width:4px; height:48px; border-radius:2px;
  background:linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 16px hsl(var(--primary) / 0.5);
}
header h1 {
  font-size:clamp(28px,4.5vw,42px); font-weight:800; letter-spacing:.12em;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 20px hsl(var(--primary) / 0.5)) drop-shadow(0 0 40px hsl(var(--primary) / 0.3));
  text-indent:.05em;
}
header .subtitle {
  color:hsl(var(--muted-foreground)); font-size:14px; margin-top:6px;
  max-width:672px; margin-left:auto; margin-right:auto;
}
.header-stats {
  display:flex; align-items:center; justify-content:center; gap:12px; margin-top:12px;
}
.header-stats .pill {
  padding:4px 16px; border-radius:9999px;
  background:hsl(var(--primary) / 0.1); border:1px solid hsl(var(--primary) / 0.2);
  font-size:12px; color:hsl(var(--muted-foreground));
}
.header-stats .pill strong {
  color:hsl(var(--primary)); font-weight:700;
}

/* ── Main Container ── */
.container {
  position:relative; z-index:1;
  max-width:1400px; margin:0 auto; padding:24px 32px 80px;
}

/* ── Timeline Card ── */
.timeline-card {
  background:hsl(var(--card) / 0.95); border:1px solid hsl(var(--border));
  border-radius:var(--radius); box-shadow:var(--shadow-card), 0 0 0 1px hsl(var(--primary) / 0.15), 0 0 20px hsl(var(--primary) / 0.1);
  padding:24px; margin-bottom:24px;
  transition:var(--transition-smooth); position:relative;  
}
.timeline-card::before {
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(hsl(var(--primary) / 0.03) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--primary) / 0.03) 1px, transparent 1px);
  background-size:50px 50px; pointer-events:none; opacity:0.4;
}
.timeline-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px; position:relative; z-index:1;
}
.timeline-title-group {
  display:flex; align-items:center; gap:12px;
}
.timeline-icon {
  padding:8px; border-radius:8px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 20px hsl(var(--primary) / 0.4);
}
.timeline-icon svg { display:block; width:20px; height:20px; color:hsl(var(--primary-foreground)); }
.timeline-title-group h3 { font-size:20px; font-weight:700; }
.timeline-title-group p { font-size:12px; color:hsl(var(--muted-foreground)); margin-top:2px; }
.timeline-year-badge {
  padding:6px 16px; border-radius:9999px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:hsl(var(--primary-foreground)); font-weight:700; font-size:14px;
  box-shadow:0 0 20px hsl(var(--primary) / 0.4);
  position:relative; z-index:1;
}

/* ── Era info preview ── */
.era-preview {
  padding:16px 20px; border-radius:10px; margin-bottom:12px;
  background:hsl(var(--muted) / 0.3);
  border:1px solid hsl(var(--primary) / 0.15);
  position:relative; z-index:1;
}
.era-preview h4 {
  font-size:18px; font-weight:700;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:4px;
}
.era-preview .era-preview-period {
  font-size:12px; color:hsl(var(--muted-foreground)); font-weight:500;
  padding:3px 10px; border-radius:9999px; background:hsl(var(--background) / 0.5);
  display:inline-block; margin-bottom:8px;
}
.era-preview p { font-size:13px; color:hsl(var(--muted-foreground)); line-height:1.6; }

/* ── Slider ── */
input[type=range] {
  -webkit-appearance:none; width:100%; height:12px; padding:0 2px;
  border-radius:3px;
  background:linear-gradient(90deg,
    hsl(38 45% 38%), hsl(40 55% 45%), hsl(42 60% 48%), hsl(43 65% 50%),
    hsl(44 75% 52%), hsl(45 85% 54%), hsl(45 90% 55%), hsl(45 92% 57%),
    hsl(45 90% 55%), hsl(44 80% 52%), hsl(43 70% 50%), hsl(42 60% 48%),
    hsl(40 50% 44%), hsl(38 45% 38%), hsl(40 52% 44%), hsl(42 62% 48%),
    hsl(43 72% 50%), hsl(44 82% 53%), hsl(45 90% 55%)
  );
  outline:none; cursor:pointer; position:relative; z-index:1;
  margin:4px 0;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 16px hsl(var(--primary) / 0.5), 0 0 0 4px hsl(var(--background) / 0.6); cursor:pointer;
  border:2px solid hsl(var(--primary-foreground));
  transition:transform 0.15s ease;
}
input[type=range]::-webkit-slider-thumb:hover {
  transform:scale(1.15);
}

/* ── Era Bars ── */
.era-bars {
  position:relative; height:32px; margin:8px 0 14px; border-radius:8px;
  background:hsl(var(--muted) / 0.25);
  padding:6px; position:relative; z-index:1;  
}
.era-bar {
  position:absolute; height:10px; border-radius:5px; cursor:pointer;
  top:50%; transform:translateY(-50%);
  transition:all 0.2s ease; opacity:.82;
  min-width:3px;
}
.era-bar:hover { height:16px; border-radius:8px; opacity:1; box-shadow:0 0 14px currentColor; z-index:1; }
.era-bar.active { height:16px; border-radius:8px; opacity:1; box-shadow:0 0 18px currentColor; z-index:2; }

/* ── Era Pills ── */
.era-pills {
  display:flex; flex-wrap:wrap; gap:6px; position:relative; z-index:1;
}
.era-pill {
  padding:6px 14px; border-radius:9999px; font-size:11px; font-weight:600;
  cursor:pointer; border:1px solid hsl(var(--border) / 0.6);
  background:hsl(var(--muted) / 0.4); color:hsl(var(--muted-foreground));
  transition:all 0.25s ease; white-space:nowrap; letter-spacing:.02em;
}
.era-pill:hover { background:hsl(var(--muted)); color:hsl(var(--foreground)); border-color:hsl(var(--primary) / 0.3); }
.era-pill.active {
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:hsl(var(--primary-foreground)); border-color:transparent;
  box-shadow:0 0 20px hsl(var(--primary) / 0.5);
  transform:scale(1.06);
}

/* ── Content Grid ── */
.main-grid {
  display:grid; grid-template-columns:1fr; gap:24px;
}
@media (min-width:1280px) {
  .main-grid {
    grid-template-columns:1fr 1fr;
    height:calc(100vh - 340px);
  }
}
.col { display:flex; flex-direction:column; gap:24px; }
.right-col { min-height:0; }
.right-col > .card {
  flex:1; display:flex; flex-direction:column; min-height:0;
}
.right-card-scroll {
  flex:1; overflow-y:auto; overflow-x:hidden; min-height:0;
  scrollbar-width:thin; scrollbar-color:hsl(var(--border)) transparent;
}
.right-card-scroll::-webkit-scrollbar { width:4px; }
.right-card-scroll::-webkit-scrollbar-track { background:transparent; }
.right-card-scroll::-webkit-scrollbar-thumb { background:hsl(var(--border)); border-radius:2px; }

/* ── Tabs ── */
.content-tabs {
  display:flex; gap:4px; background:hsl(var(--muted) / .5);
  padding:4px; border-radius:10px; margin-bottom:16px;
}
.content-tab {
  flex:1; padding:10px 8px; border-radius:8px; font-size:12px; font-weight:600;
  text-align:center; cursor:pointer; color:hsl(var(--muted-foreground));
  transition:all .25s ease; border:none; background:none;
  white-space:nowrap;
}
.content-tab:hover { color:hsl(var(--foreground)); background:hsl(var(--muted)); }
.content-tab.active {
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:hsl(var(--primary-foreground)); box-shadow:0 0 16px hsl(var(--primary) / .4);
}

/* ── Stat cards ── */
.stat-cards {
  display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;
}
.stat-item {
  text-align:center; padding:20px 16px; border-radius:12px;
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  transition:all .25s ease;
}
.stat-item:hover { border-color:hsl(var(--primary) / .3); box-shadow:0 0 20px hsl(var(--primary) / .1); }
.stat-item .stat-icon { font-size:24px; margin-bottom:6px; }
.stat-item .stat-num { font-size:28px; font-weight:800; color:hsl(var(--primary)); }
.stat-item .stat-label { font-size:11px; color:hsl(var(--muted-foreground)); margin-top:2px; }

/* ── Cards ── */
.card {
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); padding:24px 28px;
  box-shadow:var(--shadow-card);
}
.card h2 {
  font-size:22px; font-weight:800; margin-bottom:4px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.card .period-label {
  display:inline-block; font-size:12px; color:hsl(var(--primary));
  background:hsl(var(--primary) / 0.08); padding:4px 14px;
  border-radius:9999px; margin-bottom:12px; font-weight:600; letter-spacing:.04em;
}
.era-desc {
  font-size:14px; line-height:1.9; color:hsl(var(--muted-foreground));
  margin-top:12px;
}

/* ── Section titles ── */
.section-title {
  font-size:15px; font-weight:700; margin-bottom:12px; margin-top:20px;
  display:flex; align-items:center; gap:8px; color:hsl(var(--foreground));
}
.section-title::before {
  content:''; display:inline-block; width:3px; height:16px; border-radius:2px;
  background:linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  flex-shrink:0; box-shadow:0 0 8px hsl(var(--primary) / 0.4);
}

/* ── Event list ── */
.event-list { display:flex; flex-direction:column; gap:4px; }
.event-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:9px 12px; border-radius:8px; border:1px solid transparent;
  background:hsl(var(--muted) / 0.3); font-size:13px;
  cursor:pointer; transition:all 0.25s ease; line-height:1.5;
}
.event-item:hover {
  background:hsl(var(--muted)); border-color:hsl(var(--primary) / 0.3);
  transform:translateX(4px); box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.clickable-item { cursor:pointer; }
.tag.clickable-item:hover { background:hsl(var(--primary) / 0.12); border-color:hsl(var(--primary) / 0.4); }
.invention-item.clickable-item:hover { border-color:hsl(var(--primary) / 0.5); box-shadow:0 0 20px hsl(var(--primary) / 0.15); }
.tp-card.clickable-item:hover { border-color:hsl(var(--primary) / 0.5); box-shadow:0 0 20px hsl(var(--primary) / 0.15); }
.event-dot {
  flex-shrink:0; width:6px; height:12px; padding:0 2px; border-radius:50%;
  background:hsl(var(--primary)); box-shadow:0 0 8px hsl(var(--primary) / 0.5);
  margin-top:7px;
}

/* ── Tags / Figure list ── */
.tag-list { display:flex; flex-direction:column; gap:4px; }
.tag {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px;
  font-size:13px; font-weight:500;
  background:hsl(var(--muted) / 0.15); color:hsl(var(--foreground));
  border:1px solid transparent; transition:all 0.25s ease;
}
.tag::before { content:''; flex-shrink:0; width:5px; height:5px; border-radius:50%; background:hsl(var(--primary) / 0.6); }
.tag:hover { background:hsl(var(--muted) / 0.3); border-color:hsl(var(--border)); }

/* ── Invention list ── */
.invention-grid { display:flex; flex-direction:column; gap:4px; }
.invention-item {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px;
  font-size:13px; font-weight:500;
  background:hsl(var(--muted) / 0.15); color:hsl(var(--foreground));
  border:1px solid transparent; transition:all 0.25s ease;
}
.invention-item::before { content:'\2726'; flex-shrink:0; font-size:10px; color:hsl(var(--primary) / 0.6); }
.invention-item:hover { background:hsl(var(--muted) / 0.3); border-color:hsl(var(--border)); }

/* ── Turning points ── */
.tp-card {
  background:hsl(var(--muted) / 0.2); border:1px solid hsl(var(--border));
  border-radius:12px; padding:14px; transition:all 0.3s ease; margin-bottom:8px;
  border-left:3px solid hsl(var(--primary));
}
.tp-card:hover { border-color:hsl(var(--primary) / 0.4); box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.tp-year { font-size:11px; font-weight:700; color:hsl(var(--primary)); margin-bottom:4px; letter-spacing:.05em; }
.tp-event { font-size:14px; font-weight:700; margin-bottom:4px; }
.tp-desc { font-size:13px; color:hsl(var(--muted-foreground)); margin-bottom:4px; line-height:1.5; }
.tp-sig { font-size:12px; color:hsl(var(--muted-foreground) / 0.7); font-style:italic; }

/* ── Detail overlay ── */
.detail-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,0.78); backdrop-filter:blur(12px);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.detail-panel {
  position:relative;
  background:linear-gradient(160deg, hsl(32 18% 18%), hsl(28 16% 13%));
  border:1px solid hsl(var(--border) / .6);
  border-radius:16px; padding:0;
  max-width:540px; width:100%; max-height:84vh; overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,.55), 0 0 0 1px hsl(var(--primary) / .06) inset, 0 0 40px hsl(var(--primary) / .06);
  animation:slideUp 0.3s ease-out;
}
.detail-panel::before {
  content:''; display:block; height:3px;
  background:linear-gradient(90deg, transparent, hsl(var(--primary) / .5), hsl(var(--primary)), hsl(var(--primary) / .5), transparent);
  border-radius:16px 16px 0 0; position:relative; z-index:2;
}
.detail-panel-inner { padding:24px 28px 28px; }
.detail-panel h3 {
  display:inline-block;
  font-size:18px; font-weight:700; margin:0 0 14px;
  color:hsl(42 45% 82%);
  letter-spacing:0.03em;
  padding:8px 22px; border-radius:9999px;
  background:linear-gradient(135deg, hsl(var(--primary) / .14), hsl(var(--primary) / .07));
  border:1px solid hsl(var(--primary) / .32);
  box-shadow:0 0 20px hsl(var(--primary) / .12), inset 0 1px 0 hsl(var(--primary) / .1);
}
.detail-panel .period-label {
  display:inline-block; margin-bottom:14px;
  font-size:11px; letter-spacing:0.05em;
  padding:4px 14px; border-radius:9999px;
  background:hsl(var(--primary) / .08); color:hsl(var(--primary));
  border:1px solid hsl(var(--primary) / .15);
  font-weight:600;
}
.detail-close {
  position:sticky; top:12px; float:right; margin-right:16px;
  width:34px; height:34px; border-radius:50%;
  border:1px solid hsl(var(--border) / .5); background:hsl(var(--muted) / .6);
  color:hsl(var(--muted-foreground)); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.25s ease; z-index:3; backdrop-filter:blur(6px);
}
.detail-close:hover {
  border-color:hsl(var(--primary) / .5); color:hsl(var(--primary));
  background:hsl(var(--primary) / .1); transform:rotate(90deg);
}
.detail-body {
  font-size:14px; line-height:2; color:hsl(38 18% 72%);
}
.detail-meta {
  display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;
}
.detail-era-tag {
  display:inline-block; padding:5px 16px; border-radius:9999px;
  font-size:11px; font-weight:600; letter-spacing:0.05em;
  background:hsl(var(--primary) / .1); color:hsl(43 55% 72%);
  border:1px solid hsl(var(--primary) / .2);
  box-shadow:0 0 10px hsl(var(--primary) / .06);
}
.detail-period {
  display:inline-block;
  font-size:11px; color:hsl(43 55% 72%); letter-spacing:0.03em; font-weight:500;
  padding:5px 16px; border-radius:9999px;
  background:hsl(var(--primary) / .1);
  border:1px solid hsl(var(--primary) / .2);
  box-shadow:0 0 10px hsl(var(--primary) / .06);
}
.detail-year-badge {
  display:inline-block; padding:5px 16px; border-radius:9999px;
  font-size:13px; font-weight:700; letter-spacing:0.03em;
  background:hsl(var(--primary) / .1); color:hsl(var(--primary));
  border:1px solid hsl(var(--primary) / .18);
}
.detail-desc {
  font-size:14.5px; line-height:2; color:hsl(38 22% 78%);
  margin:0 0 16px;
}
.detail-section-title {
  margin-top:24px; margin-bottom:10px;
  font-size:13px; font-weight:700; letter-spacing:0.04em;
  color:hsl(var(--primary));
  display:flex; align-items:center; gap:8px;
}
.detail-section-title::after {
  content:''; flex:1; height:1px;
  background:hsl(var(--primary) / .15);
}
.detail-related-item {
  margin-bottom:6px; padding:10px 16px;
  background:hsl(30 18% 18%); border-radius:10px;
  font-size:13.5px; color:hsl(38 18% 72%);
  border:1px solid hsl(var(--border) / .25);
  transition:all 0.2s ease;
}
.detail-related-item:hover { border-color:hsl(var(--primary) / .2); background:hsl(30 18% 20%); }
.detail-impact-box {

const eras = [
  { id:'ancient', name:'上古时期', period:'史前 - 公元前2070年', start:-3000, end:-2070, founder:'三皇五帝',
    desc:'此时期是人类社会发展的初级阶段，也是中华文明的孕育期。北京猿人、蓝田人等古人类的发现，展示了中国早期人类的智慧与生存状态。随着石器工具的进步和火的使用，人类社会逐渐进入新石器时代，农业、畜牧业开始兴起，定居生活成为可能。',
    events:[
      {name:'北京猿人生活',desc:'约70万年前，北京周口店地区的北京猿人已能制造和使用打制石器，掌握了保存火种的技术，以采集和狩猎为生，是东亚地区目前已发现最早的古人类之一。',background:'在旧石器时代早期，东亚大陆气候温暖湿润，动植物资源丰富，为早期人类的生存提供了良好的自然环境。北京周口店龙骨山一带分布着大量天然洞穴，成为古人类理想的栖息场所。',process:'北京猿人在周口店地区长期生活，留下了厚达40多米的堆积层。他们使用石英、燧石等石料打制砍砸器、刮削器和尖状器，通过打击燧石产生火花和保存天然火种来控制火。火的使用使人类可以取暖、照明、驱赶猛兽、烤熟食物。',result:'北京猿人在此繁衍生息长达数十万年，遗址中出土了6具头盖骨和大量牙齿、肢骨化石，代表了40多个不同年龄和性别的个体。这是世界上已知材料最丰富、最系统的古人类遗址之一。',evaluation:'北京猿人的发现为"从猿到人"的进化理论提供了关键证据。他们使用火的能力代表了人类演化史上的飞跃——火的使用是人类第一次支配了一种自然力，极大拓展了人类的生存空间和能力。',impact:'北京猿人的发现震惊世界，确立了直立人在人类演化序列中的重要地位。作为东亚最早的系统性古人类遗存，证明了东亚地区是人类起源和演化的重要区域之一，也为后来的古人类研究树立了标杆。'},
      {name:'仰韶文化兴起',desc:'约公元前5000年，以彩陶为鲜明特征的新石器时代文化在黄河中游地区兴起，西安半坡遗址是典型代表，先民进入定居农耕生活，种植粟黍，驯养猪狗等家畜。',background:'新石器时代中期，黄河中游的黄土高原和河谷地带土壤疏松肥沃，适合用石制工具进行原始耕作。气候比现代温暖湿润，年降水量更为充沛，为先民从采集渔猎向农耕定居过渡创造了条件。',process:'先民选择河流阶地建造半地穴式圆形房屋，聚落四周挖掘壕沟防御野兽和外敌。他们使用磨制石器和骨器，种植粟和黍两种耐旱作物，驯养猪、狗、鸡等家畜家禽。妇女在陶坯上绘制人面纹、鱼纹、几何纹等精美图案后入窑烧制。',result:'仰韶文化延续约两千年，分布范围覆盖陕西、河南、山西、甘肃等广大地区，形成了以彩陶为核心的发达文化体系。西安半坡遗址发现了房址、窖穴、陶窑、墓葬等完整聚落遗迹，是黄河流域新石器时代最繁荣的文化代表。',evaluation:'仰韶文化标志着黄河流域先民完成了从游猎采集到定居农耕的关键转变。彩陶不仅是实用器皿，更是原始艺术的杰作——那些充满想象力的纹饰展示了先民丰富的精神世界和审美意识。',impact:'仰韶文化的发现打破了"中国文化西来说"，证明了黄河流域是中华文明的独立起源地之一。它奠定了后来龙山文化乃至夏商文明的物质和文化基础，是中华文明从蒙昧走向文明的关键一步。'},
      {name:'大汶口文化发展',desc:'约公元前4300年，大汶口文化在黄河下游山东地区繁荣发展，墓葬中出现明显的贫富分化和社会分层现象，出土了精美的玉器和象牙制品，是龙山文化的直接前身。',background:'仰韶文化在黄河中游繁荣的同时，黄河下游的山东半岛及周边地区也发展出了具有鲜明特色的新石器文化。大汶口文化继承和发扬了本地北辛文化的传统，又与中原仰韶文化有着密切交流。',process:'大汶口先民善于制作精美的磨光黑陶和白陶，掌握了较高的玉器加工技术。墓葬中开始出现明显的随葬品数量差异——大墓随葬品多达百余件，包括玉琮、象牙雕筒等珍贵物品，小墓仅有少量陶器甚至空无一物。男女合葬墓中男左女右的固定姿势反映了父权制已取代母权制。',result:'大汶口文化发展前后约两千年，社会发展水平不断提高，晚期已出现阶级分化和特权阶层的雏形。精美玉器、象牙器的出现说明已有专业手工业者脱离农业生产，社会分工进一步细化。',evaluation:'大汶口文化的墓葬资料是社会从平等走向分层的"化石"证据。随葬品的巨大差异说明私有制和社会等级已经开始形成，原始共产主义社会正在瓦解，文明的门槛已经近在咫尺。',impact:'大汶口文化直接发展为龙山文化，而龙山文化被认为与夏朝的建立有密切关系。黄河下游文明与中原文明的双峰并峙和最终融合，构成了早期华夏文明多元一体的基本格局。'},
      {name:'三皇五帝传说时期',desc:'远古传说中的帝王时代，伏羲、女娲、神农为"三皇"，黄帝、颛顼、帝喾、尧、舜为"五帝"。黄帝在阪泉之战中击败炎帝、涿鹿之战中擒杀蚩尤，被尊为中华民族的人文初祖。',background:'在文字出现以前，先民通过口耳相传的方式保存历史记忆，各部落有各自的祖先传说。随着华夏部落联盟的形成与壮大，不同来源的传说逐渐融合为一个体系化的远古帝王谱系，成为华夏民族的共同记忆。',process:'伏羲教民结网渔猎、创制八卦；神农尝百草发明医药和农耕；黄帝击败炎帝于阪泉、擒杀蚩尤于涿鹿，统一华夏各部；颛顼绝地天通改革宗教；帝喾仁德治世；尧命羲和制历法并禅让舜；舜经三年考察后继位，命禹治水成功后又禅让给禹。',result:'三皇五帝的传说体系最终形成于战国至汉代，被司马迁写入《史记·五帝本纪》成为正史的开篇。黄帝被尊为中华民族的人文初祖，炎黄二帝并称成为华夏民族的共同祖先符号。',evaluation:'三皇五帝传说虽不是严格意义上的信史，但它承载了先民对文明起源的集体记忆和价值理想。禅让制的传说体现了古代思想家对"天下为公、选贤与能"的政治理想；黄帝的统一象征了华夏民族对团结统一的永恒追求。',impact:'三皇五帝传说深刻塑造了中华民族的认同感和价值观。"炎黄子孙"成为全世界华人的文化纽带；禅让故事成为后世儒家批判君主世袭的经典论述；黄帝陵至今仍是海内外中华儿女寻根问祖的精神圣地。'}
    ],
    figures:[
      {name:'黄帝',desc:'姬姓，号轩辕氏，被尊为中华民族的人文初祖。阪泉之战击败炎帝，涿鹿之战擒杀蚩尤，统一华夏部落，被后世尊为"五帝"之首。传说中养蚕、舟车、音律等皆始于黄帝时期。'},
      {name:'炎帝',desc:'姜姓，号神农氏，教民农耕、尝百草发明医药，被尊为农业和医药之神。后与黄帝结盟，共同形成华夏族的核心，"炎黄子孙"由此而来。'},
      {name:'尧',desc:'陶唐氏，五帝之一。命羲和观测天象制定历法，晚年禅让帝位给舜而非传子，开创了中国最早的"禅让"政治传统，被儒家奉为圣王典范。'},
      {name:'舜',desc:'有虞氏，五帝之一。出身贫寒，以孝闻名天下，经受尧的三年考察后受禅为帝。命大禹治水成功，晚年将帝位禅让给大禹。'},
      {name:'禹',desc:'姒姓，因治水功绩卓著受舜禅让为部落联盟首领。采用疏导之法治理滔天洪水，划定九州、铸造九鼎，是中国历史上第一个王朝——夏朝的奠基者。'}
    ],
    inventions:['石器工具','火的使用','彩陶制作','农业种植'],
    turningPoints:[{y:'约前5000年',e:'仰韶文化兴起',d:'以彩陶为特色的新石器时代文化，分布在黄河中游地区',s:'标志着中国进入定居农业社会，文明曙光初现'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/256d90d2-c525-4280-b7b0-828b93cdb6f8.jpg'
  },
  { id:'xia', name:'夏朝', period:'公元前2070年 - 公元前1600年', start:-2070, end:-1600, founder:'禹',
    desc:'夏朝是中国历史上第一个世袭制王朝，标志着中国由原始社会向奴隶制社会的过渡。大禹治水成功后建立夏朝，开创了"家天下"的政治格局。夏朝虽然文献记载较少，但考古发现的二里头文化被认为与夏朝有关，出土了宫殿基址、青铜器等重要遗迹遗物。',
    events:[
      {name:'大禹治水建立夏朝',desc:'约公元前2070年，大禹采用疏导之法成功治理滔天洪水，受舜禅让为部落联盟首领，划定九州、铸造九鼎，建立了中国历史上第一个世袭制王朝——夏朝。',background:'尧舜时期黄河流域洪水泛滥已有数十年，鲧（禹之父）受命治水，沿用筑堤堵水之法九年不成被处死。大禹接替父亲重任时，洪水已淹没大片农田和聚落，民众苦不堪言。',process:'大禹总结父亲失败的教训，改用疏导之法——率众开凿河道将洪水引入大海。他"三过家门而不入"，在外奔波十三年，小腿上的汗毛都磨光了。治水成功后，大禹将天下划分为冀、兖、青、徐、扬、荆、豫、梁、雍九州，铸造九鼎象征王权，各部落首领在涂山大会中推举大禹为部落联盟首领。',result:'大禹建立了中国历史上第一个具有国家雏形的政权，定都阳城（今河南登封）。他创制了刑法《禹刑》，组建军队，设立官职，初步建立了早期国家的管理制度。',evaluation:'大禹治水体现了中华民族面对自然灾害不屈不挠的精神——从被动"堵"到主动"疏"的方法转变，更蕴含着顺应规律、因势利导的东方智慧。"三过家门而不入"成为公而忘私的经典典范。',impact:'夏朝的建立标志着中国从原始部落联盟进入了王朝时代。大禹划分九州为中国奠定了早期的地理框架，九州从此成为中国的代称。夏朝虽文献记载较少，但开启了此后四千年王朝更替的历史进程。'},
      {name:'启继承王位开创世袭制',desc:'大禹之子启击败法定继承人伯益，在钧台大会诸侯即天子位，从此"公天下"变为"家天下"，禅让制被世袭制取代，成为中国王位继承制度的转折点。',background:'大禹晚年按照禅让传统指定东夷部落首领伯益为继承人。但大禹治水期间其子启已积累了相当的政治声望和势力，而伯益在联盟中根基尚浅。两种继承人模式——传统的禅让制和新兴的父子相传——之间的矛盾已无法调和。',process:'大禹去世后，诸侯朝拜启而不朝拜伯益。伯益率军与启争夺王位，双方在甘地交战。启在钧台召集天下诸侯大会，得到多数部落首领的支持。伯益战败后被杀（一说被启囚禁）。启正式即天子位，建立了中国第一个世袭王朝。',result:'禅让制被彻底废除，世袭制开始成为此后四千年中国王朝更替的基本模式。启建立了以夏后氏为核心的权力体系，都城设在阳翟（今河南禹州）。',evaluation:'启以武力终结禅让制有其历史必然性——随着社会生产力提高和私有制发展，部落首领手中的权力和财富大幅增长，他们不再愿意将权力拱手让给外人。"家天下"虽日后备受批判，但在当时是社会进步的体现。',impact:'"公天下"变"家天下"是中国政治制度史上最重大的转折之一。世袭制虽带来了"一姓之私"的种种弊病，但也为早期国家的稳定延续提供了制度保障。禅让的理想在后世儒家学说中不断被提起，成为鞭策君主"为政以德"的思想资源。'},
      {name:'太康失国与后羿夺权',desc:'夏第三代君主太康沉湎田猎不恤民事，东夷有穷氏首领后羿趁机夺取夏朝政权，"太康失国"成为后世君主荒政误国的经典警示。',background:'夏朝建立不久，内部统治基础尚不稳固。东夷有穷氏部落实力强劲，善于射箭，其首领后羿（与神话中射日之后羿可能为同一部落首领）暗中觊觎夏朝政权已久。',process:'太康即位后沉迷于打猎游乐，经常出城狩猎数月不归不理朝政。后羿趁太康外出打猎渡过黄河之机，派兵封锁洛水北岸，切断了太康返回都城安邑（一说斟鄩）的道路。太康被迫流亡在外，后羿率军进入夏都自立为王，夏朝第一次亡国。',result:'太康被废黜后流亡多年最终客死异乡。后羿取代夏后氏统治中原约数十年，但他本人后来也被部下寒浞所杀，政局更加混乱。',evaluation:'太康失国是中国历史上第一个因君主荒政而导致亡国的案例，成为后世帝王教育的反面教材。它说明在制度建设尚不完善的早期王朝，君主个人品行对国家存亡有决定性影响。',impact:'太康失国教训深刻，使得后来的统治者更加重视君主的行为规范和权力制衡。"太康盘游"成为后世臣子劝谏君主勤政的常用典故，周公、孔子等人也在思考如何防止"一人失德天下遭殃"的制度性问题。'},
      {name:'少康中兴',desc:'太康之孙少康在有仍氏等部落协助下积蓄力量，最终反攻复国，重建夏朝统治，史称"少康中兴"，是中国历史上第一次王朝中兴。',background:'后羿和寒浞先后篡位，夏朝宗室流散各地。太康的侄孙少康逃亡到有仍氏部落（今山东济宁一带），隐姓埋名长大成人，以放牧为生。寒浞得知少康下落派人追杀，少康又逃到有虞氏部落（今河南商丘一带）避难。',process:'有虞氏首领将两个女儿嫁给少康，并给予方圆十里的纶邑和五百名部众。少康在这里积蓄力量、收拢夏朝旧臣后裔，与流亡的夏朝遗臣秘密联络。经过二十余年的准备，少康联合有鬲氏、斟灌氏等支持夏朝的部落，一举击败寒浞主力攻入夏都，重建夏朝。',result:'少康恢复了夏后氏的统治，诛杀寒浞及其子浇和豷，夏朝复国成功。此后夏朝延续约四百年，进入相对稳定期。',evaluation:'少康中兴展现了中华民族在困境中不屈不挠、卧薪尝胆的精神。作为一个流亡王子，在实力悬殊的情况下以数十年的隐忍和积累最终复国，是中国历史上最励志的逆转故事之一。',impact:'少康中兴是中国历史上第一次"中兴"案例，成为后世评价王朝复兴的标准用语。"少康"二字成为政治复兴的文化符号，此后但凡王朝出现中兴之主，论者必引少康为参照。'},
      {name:'夏桀暴政与夏朝灭亡',desc:'约公元前1600年，末代君主夏桀荒淫暴虐，自比太阳，民众咒骂"时日曷丧？予及汝皆亡"。商汤在伊尹辅佐下兴兵灭夏，鸣条之战夏军大败，夏朝覆亡。',background:'夏朝统治约四百年后，社会矛盾日益加剧。末代君主桀（名履癸）虽有文武之才能徒手搏虎，但骄奢淫逸、滥用民力。他宠爱妹喜大兴土木建造倾宫瑶台，将国库存粮做成酒池肉林供自己享乐，而百姓却在饥饿中挣扎。',process:'关龙逄等正直大臣冒死进谏，被桀处以酷刑。商部族首领汤在贤相伊尹的辅佐下，以"吊民伐罪"为号召联合各方部落，在鸣条（今河南封丘东）与夏军决战。夏军士气低落一触即溃，桀率残部逃至南巢（今安徽巢湖一带）被商军俘获。',result:'夏朝灭亡，立国约471年。桀被流放南巢，不久病死。商汤在伊尹辅佐下建立商朝，定都于亳（一说今河南商丘）。',evaluation:'夏桀的灭亡典型地验证了"得民心者得天下、失民心者失天下"的政治铁律。"时日曷丧"的诅咒说明当统治者彻底丧失民心后，百姓宁可与他同归于尽也不愿继续忍受其统治——这是对暴政最强有力的控诉。',impact:'夏朝作为中国第一个王朝的覆亡，为后世提供了"失德失国"的深刻教训。商汤"以有道伐无道"的伐夏模式，被周武王伐纣继承和发扬，形成了中国政治传统中独特的"革命"理论——君若无道，天必命有德者取而代之。'}
    ],
    figures:[
      {name:'大禹',desc:'夏朝开国君主。因治水有功受舜禅让，划定九州、铸造九鼎，将部落联盟改造为早期国家形态，是中国历史上第一个世袭王朝的创立者，其子启继承王位开启了"家天下"时代。'},
      {name:'启',desc:'大禹之子，夏朝第二代君主。击败法定继承人伯益，在钧台大会诸侯正式即天子位，以世袭制取代禅让制，开创了中国王位家族传承的先河。'},
      {name:'太康',desc:'夏朝第三代君主，大禹之孙。即位后沉湎田猎游乐不理朝政，被东夷有穷氏首领后羿趁虚而入夺取政权，流亡在外多年不得归国，史称"太康失国"。'},
      {name:'少康',desc:'夏朝第六代君主，太康之孙。在流亡中长大，依靠有仍氏等部落支持积蓄力量，最终以少胜多反攻复国成功，史称"少康中兴"，是中国历史上第一次王朝中兴。'},
      {name:'桀',desc:'夏朝末代君主。力大无穷能徒手搏虎，但荒淫暴虐宠幸妹喜，大兴土木建造倾宫瑶台，自比太阳永不坠落。最终被商汤在鸣条之战击败，夏朝覆亡。'}
    ],
    inventions:['世袭制度','历法雏形','青铜器初现','城市规划'],
    turningPoints:[{y:'约前2070年',e:'夏朝建立',d:'大禹治水成功，受舜禅让建立中国历史上第一个王朝',s:'标志着中国进入王朝时代，原始社会结束'},{y:'约前1600年',e:'夏朝灭亡',d:'夏桀暴虐无道，商汤起兵灭夏，鸣条之战夏军大败',s:'暴政导致王朝更替，开启商朝时代'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/93877b7d-3c74-4ad0-9a6a-62a4516a666b.jpg'
  },
  { id:'shang', name:'商朝', period:'公元前1600年 - 公元前1046年', start:-1600, end:-1046, founder:'成汤',
    desc:'商朝是中国历史上第二个王朝，以青铜器文明和甲骨文闻名于世。商朝的青铜冶炼技术达到了很高的水平，司母戊鼎是世界最大的青铜器。甲骨文的出现标志着中国文字的成熟，为后世留下了大量珍贵的甲骨文资料。商朝实行神权政治，占卜活动频繁。',
    events:[
      {name:'商汤灭夏建立商朝',desc:'约公元前1600年，商部族首领汤以"吊民伐罪"为号召，在伊尹辅佐下联合各部族起兵讨伐夏桀，经鸣条之战大败夏军，夏桀被流放南巢，商朝正式建立。',background:'商部族兴起于黄河下游，以玄鸟为图腾，始祖契因协助大禹治水有功被封于商地。到汤这一代时商已发展为一个强大方国，而夏朝在桀的暴政下民心尽失。伊尹出身奴隶以烹饪之道比喻治国得到汤的赏识，被任命为尹（丞相）。',process:'汤以"吊民伐罪"为旗帜发布《汤誓》声讨夏桀罪行，联合有缗氏、有莘氏等部落组成联军。伊尹先用停止朝贡的方式试探夏桀的反应——夏桀大怒起九夷之师讨伐商，伊尹发现九夷还听从夏桀号令便劝汤暂时屈服。次年九夷不再听从夏桀，时机成熟，汤率军在鸣条与夏军决战大获全胜。',result:'夏桀被俘后流放南巢（今安徽巢湖），不久病死。汤在众诸侯推举下即天子位，定都于亳（一说今河南商丘），中国历史上第二个王朝——商朝正式建立。',evaluation:'商汤灭夏是中国历史上第一次以"革命"口号推翻前朝的案例——以"有夏多罪，天命殛之"为理论依据，开创了"以有道伐无道"的政治传统。伊尹出身奴隶却成为开国元勋的传奇经历，也打破了夏朝以来贵族垄断权力的格局。',impact:'商汤革命奠定了中国王朝更替的基本模式——"失德者失天下，有德者得天下"。这一理论被后世儒家发扬光大，成为约束君权的重要思想武器。伊尹作为中国第一位平民出身的宰相，也成为后世"出身寒微而成就大业"的榜样。'},
      {name:'盘庚迁殷',desc:'约公元前1300年，商王盘庚力排众议将都城从奄（今山东曲阜）迁至殷（今河南安阳），此后273年不再迁都。殷墟遗址出土了大量甲骨文和青铜器，是20世纪中国最重大的考古发现之一。',background:'商朝建立后频繁迁都，"殷人屡迁，前八后五"。到盘庚即位时，商都已迁至奄地（今山东曲阜一带），贵族势力盘根错节，土地肥力下降、水患频发，内外矛盾交织。盘庚认为继续留在奄地已不利于国家的长期稳定。',process:'盘庚提出迁都计划遭到贵族阶层强烈反对，他们不愿放弃在奄地积累的田产和势力。盘庚召集贵族大臣训话，表示"若网在纲，有条而不紊"，若不服从就是自取灭亡。在严厉警告下贵族最终屈服，商都迁至殷地（今河南安阳小屯村一带），此后273年不再迁都。',result:'迁殷后商朝进入稳定发展期，殷迅速成为当时东亚最繁华的都市。1899年在此发现的甲骨文震惊世界，1928年起殷墟正式发掘，出土了大量甲骨文、青铜器、玉器，成为研究商代社会的无价宝库。',evaluation:'盘庚迁殷展现了杰出领袖在关键时刻力排众议的决断力。迁都看似冒险却为商朝带来了近三百年的稳定，说明正确的战略决策往往需要克服短期利益和既得利益者的阻力。',impact:'殷墟是中国考古学的圣地，甲骨文的发现让商朝从传疑时代进入信史时代。2006年殷墟被列入世界文化遗产名录，作为中国青铜时代的杰出代表，持续向世界展示中华文明源远流长的辉煌。'},
      {name:'武丁中兴',desc:'商王武丁在位59年，任用贤臣傅说、甘盘，妻子妇好多次率军出征，商朝国力达到鼎盛，疆域空前辽阔，北至燕山、南达江淮、西到陇东、东抵海滨。',background:'盘庚迁殷后商朝进入稳定期，但到小乙时期国力有所衰退。武丁年轻时曾被父亲派往民间生活，亲身体验了百姓疾苦和农业生产。这段特殊经历使他对国家实际情况有深刻的了解，也让他结识了一批有才能的平民。',process:'武丁即位后三年不问政事，将朝政委托给冢宰，自己"默以思道"暗中观察朝野。三年后他梦到一位圣人，按梦中形象派人寻访找到了正在筑墙的囚犯傅说，当即任命为相。他大胆提拔平民出身的人才甘盘、祖己等，并让妻子妇好多次率军出征征伐羌方、土方、鬼方等周边方国。',result:'武丁在位59年，商朝疆域达到顶峰——北至燕山、南达江淮、西到陇东、东抵海滨。被征服的方国多达数十个，甲骨文中记有"武丁中兴，殷道复兴"。妇好墓中出土了468件青铜器和755件玉器，展示了当时的繁荣。',evaluation:'武丁之所以能实现中兴，关键在于他能不拘一格用人才——从筑墙奴隶中提拔傅说，让女性将领妇好领兵出征，这种打破常规的用人魄力在古代帝王中极为罕见。而他少时深入民间的经历，也使他成为一位真正了解国情的君主。',impact:'武丁中兴让商朝成为当时东亚最强大的政权，为后世留下大量珍贵甲骨文记录和青铜器艺术杰作。妇好作为有史记载的第一位女将军和女政治家，至今仍是中国女性的杰出代表，妇好墓的发现被誉为20世纪中国考古重大成果。'},
      {name:'妇好出征',desc:'商王武丁之妻妇好是中国有文字记载以来第一位女将军，多次统率大军征伐羌方、土方等周边方国，甲骨文中关于她的占卜记录多达二百余条。',background:'商朝时期周边方国林立，羌方、土方、鬼方等时常侵扰商朝边境。武丁常年对外用兵征战，而妇好不仅是他最宠爱的妻子，更是他最信任的军事统帅。在甲骨文记载中，"妇好"二字出现高达二百余次。',process:'妇好多次率军出征，其中一次率领一万三千人的大军征伐羌方——这是目前已知甲骨文中记载的最大规模用兵。她还曾与武丁配合，在设伏围歼巴方的战役中表现出色。除了军事才能，妇好还担任占卜官，主持重要的祭祀典礼，是集军事、政治、宗教权力于一身的商朝核心人物。',result:'在妇好的协助下，武丁时期商朝对周边方国取得了决定性军事优势，疆域空前扩展。妇好去世后武丁悲痛万分，将其葬在宫殿区旁边而非远郊的王陵区，并在墓上修建"母辛宗"享堂以供祭祀，这在商代是极高的礼遇。',evaluation:'妇好在三千多年前就打破了"男主外女主内"的性别壁垒，以女性身份担任军队统帅和高级祭司，这在世界古代史上都极为罕见。1976年妇好墓的发现改写了人们对商代社会结构和女性地位的认知。',impact:'妇好是中国有文字记载的第一位女性军事统帅和女政治家，比古希腊女诗人萨福、古埃及女法老哈特谢普苏特更早被历史记录。她的存在证明了在中华文明的早期阶段，女性曾拥有远超后世的公共角色和社会地位。'},
      {name:'帝辛暴政',desc:'商朝末代君主帝辛（纣王）虽有文武之才，但宠幸妲己、拒谏饰非，以炮烙之刑残害忠良，叔父比干因直言进谏被剖心而死，微子、箕子等纷纷出走。',background:'帝辛（纣王）天资聪颖能徒手搏虎，口才极佳足以文过饰非。他继位时商朝虽外表强大但内部矛盾积聚已久——连年征战消耗国力、贵族势力割据、东夷叛乱不断。',process:'纣王决定集中力量征伐东夷以转移内部矛盾，常年率大军远征使国库空虚。他宠幸美女妲己沉迷酒色，创造炮烙之刑残害忠良，九侯之女和鄂侯因劝谏被杀被烹。叔父比干苦谏三日被纣王怒而剖心，箕子佯狂为奴被囚禁，微子逃亡。西伯姬昌（后之周文王）被囚于羑里，靠贿赂获释后暗中积蓄力量。',result:'纣王的暴政使商朝统治基础彻底瓦解，众叛亲离。周武王伐纣时八百诸侯不期而会，纣王的军队在牧野阵前倒戈，纣王逃回朝歌登鹿台自焚而死。',evaluation:'传统史书将纣王描述为典型的"暴君"，但有学者认为其中有周朝胜利者污名化的成分。从甲骨文看纣王征伐东夷确有其事，说明他在军事上并非无能。真正的教训在于：统治者的暴行和拒谏可能导致万劫不复的后果。',impact:'纣王成为中国历史上"暴君"的代名词，与夏桀并列成为反面帝王的经典形象。"酒池肉林""炮烙之刑""剖心比干"等典故至今被用来形容极端暴政。周人以纣王为鉴在制度建设上下足功夫——分封制、宗法制、礼乐制无不是为防止"第二个纣王"出现而设计。'},
      {name:'牧野之战与商朝灭亡',desc:'约公元前1046年，周武王姬发率诸侯联军在牧野与商军决战，商军主力远在东南征战，临时武装的奴隶阵前倒戈，纣王兵败逃回朝歌自焚于鹿台，商朝灭亡。',background:'纣王的暴政使诸侯离心，西伯姬昌在被囚羑里获释后，返国修德养民暗结诸侯。文王去世后其子武王姬发继承遗志，会盟八百诸侯于盟津。太公望吕尚（姜子牙）认为时机未到，劝武王暂时等待。两年后纣王愈加残暴，杀比干、囚箕子、逐微子，殷商内部众叛亲离。',process:'武王在太公望辅佐下，率战车三百乘、虎贲三千人、甲士四万五千人，联合庸、蜀、羌、髳、微、卢、彭、濮等方国部落，与纣王七十万大军在牧野（今河南新乡）展开决战。纣军虽数量庞大但主力在东南讨伐东夷，临时征调的奴隶和战俘阵前倒戈反击商军，商军顷刻崩溃。',result:'纣王逃回朝歌，登上收藏天下珍宝的鹿台穿上玉衣自焚而死。武王进入朝歌斩纣王首级悬挂，释放被囚的箕子等忠臣，散发鹿台之财和钜桥之粟给百姓。商朝灭亡，立国约554年。',evaluation:'牧野之战以少胜多的关键不在于兵力对比而在于人心向背。纣王的七十万大军战斗力为零因为他们根本不愿为暴君卖命。"前徒倒戈"成为中国古代战争史上最经典的教训——失去民心的军队，数量再多也只能是纸老虎。',impact:'牧野之战开启了周朝八百年的统治，也确立了"得道多助失道寡助"的政治铁律。周人以此役为起点建立了一整套政治制度和文化体系——分封制、宗法制、礼乐制、《周礼》，深刻影响了此后三千年中国的政治文化和思维方式。'}
    ],
    figures:[
      {name:'商汤',desc:'商朝开国君主，子姓，名履。以"吊民伐罪"为号召，在名相伊尹辅佐下联合各部族起兵灭夏，经鸣条之战大败夏桀，建立了中国历史上第二个王朝，被后世视为"革命"的典范——以有道伐无道。'},
      {name:'伊尹',desc:'商朝开国名相，出身奴隶，以烹饪之道比喻治国之理得到商汤赏识。辅佐商汤灭夏建商，汤去世后又辅佐三代商王，被后世尊为"元圣"，是中国历史上最早的贤相典范。'},
      {name:'盘庚',desc:'商朝第二十任君主，力排众议将都城从奄迁至殷（今河南安阳），此后273年不再迁都，商朝进入稳定发展期。殷墟遗址成为20世纪中国最重大的考古发现之一。'},
      {name:'武丁',desc:'商朝第二十三任君主，在位59年。任用贤臣傅说、甘盘，其妻妇好是中国最早的女将军。在位期间商朝国力达到鼎盛，疆域空前辽阔，史称"武丁中兴"。'},
      {name:'妇好',desc:'商王武丁之妻，中国有文字记载以来第一位女将军。多次统率大军征伐羌方、土方等周边方国，甲骨文中关于她的占卜记录达二百余条，墓葬出土了大量青铜器和玉器。'},
      {name:'纣王',desc:'商朝末代君主，名受。虽有文武之才但宠幸妲己、拒谏饰非，以炮烙之刑残害忠良，叔父比干因直言进谏被剖心。牧野之战兵败后自焚于鹿台，商朝覆亡。'},
      {name:'比干',desc:'商纣王叔父，官至少师（丞相）。因纣王暴虐无道，冒着灭族危险连续三日跪谏纣王，被纣王怒而剖心。后世尊为"亘古第一忠臣"，民间奉为文财神。'}
    ],
    inventions:['甲骨文','青铜器','历法','占卜术'],
    turningPoints:[{y:'约前1300年',e:'盘庚迁殷',d:'商王盘庚力排众议将都城迁至殷（今河南安阳），此后273年不再迁都',s:'商朝进入稳定发展期，殷墟成为重要考古遗址'},{y:'约前1046年',e:'商朝灭亡',d:'周武王伐纣，牧野之战商军阵前倒戈，纣王自焚于鹿台',s:'青铜文明达到顶峰后衰落，周朝建立'}],
    color:'#A0826D', bg:'https://miaoda-site-img.cdn.bcebos.com/images/d91e5372-7269-4ee0-9f64-5d4c58cd3b0e.jpg'
  },
  { id:'zhou', name:'西周', period:'公元前1046年 - 公元前771年', start:-1046, end:-771, founder:'周武王姬发',
    desc:'西周建立了完善的分封制和宗法制度，形成了"天子—诸侯—卿大夫—士"的等级体系。周公制礼作乐，确立了礼乐文化的基础，对中国后世政治制度和文化传统产生了深远影响。西周时期农业、手工业都有很大发展，青铜器铭文成为重要的历史资料。',
    events:[
      {name:'武王伐纣建立周朝',desc:'约公元前1046年，周武王姬发继承父亲文王遗志，会合八百诸侯于盟津，在牧野之战中击败商纣王，攻入朝歌建立周朝，定都镐京（今西安西南），开启了延续八百年的周王朝。',background:'周部族兴起于渭水流域（今陕西关中），经古公亶父、季历、文王三代经营，国力日渐强盛。纣王囚禁文王于羑里，周人以美女宝马赎之，文王归国后暗结诸侯积聚力量。文王去世时天下三分已有其二归周，嘱托武王完成灭商大业。',process:'武王以太公望吕尚为师、周公旦为辅、召公奭毕公为左右，会合八百诸侯于盟津誓师。太公望以"时至勿疑"劝武王进军，率战车三百、虎贲三千在牧野与商军决战，商军阵前倒戈一击即溃。纣王自焚鹿台，武王入朝歌斩纣王首级、释箕子之囚、表商容之闾、散鹿台之财、发钜桥之粟。',result:'周朝正式建立，定都镐京（今陕西西安西南），武王举行了盛大的开国庆典。他大规模分封诸侯——封姜子牙于齐、封周公于鲁、封召公于燕等，建立了以周天子为顶点的分封体系。',evaluation:'武王伐纣是中国历史上"革命"一词的最早来源——《周易》："汤武革命，顺乎天而应乎人。"以武力推翻暴君不仅被视为合法，更被视为天命所归。这一思想对后来中国政治产生了极其深远的影响。',impact:'周朝的建立开启了中国历史上延续最久的王朝（约八百年），其创立的宗法制、分封制、礼乐制度成为中国传统文化最核心的组成部分。周文化的影响至今仍在中国人的思维方式和行为习惯中随处可见。'},
      {name:'周公东征',desc:'武王去世后幼子成王即位，周公旦摄政辅佐。管叔、蔡叔勾结纣王之子武庚发动叛乱，周公率军东征三年平定三监之乱，巩固了周朝对东方广大地区的统治。',background:'武王灭商后并未完全消灭商人的势力，他将纣王之子武庚封于殷地以续殷祀，同时安排管叔、蔡叔、霍叔三位弟弟在殷地周边设立"三监"监视武庚。武王去世时成王年幼，周公旦以叔父身份摄政，引起了管叔蔡叔的猜疑——他们怀疑周公有篡位之心。',process:'管叔蔡叔联合武庚和东夷徐、奄等部落公开反叛。周公果断率军东征，先杀管叔、囚蔡叔、贬霍叔，诛灭武庚。又挥师东进讨伐参与叛乱的东夷部落，灭奄国、薄姑等五十余国，将周朝势力推进到东海之滨。整个东征历时三年，周公"一年救乱、二年克殷、三年践奄"。',result:'东征彻底消除了商朝残余势力的威胁，周的疆域从关中平原扩展到整个黄河中下游和淮河流域。周公将殷商遗民分散迁往各地——部分迁往洛邑、部分封给卫国和鲁国管辖，防止他们重新聚集反叛。',evaluation:'周公东征是周朝由关中地方政权变为全国性王朝的关键。面对以兄弟骨肉为首的叛乱，周公展现了极为果断的决断力和出色的军事指挥能力。但更难得的是他在胜利后没有大开杀戒，而是通过分封和迁民来化解矛盾，展现出政治家的远见。',impact:'东征后周朝彻底确立了对中原和东方的统治。周公将殷商"顽民"迁至洛邑实行军事化管理，并在洛邑营建东都成周——这一东西两京的制度被后世汉唐等朝代继承。东征的胜利也让周公的摄政地位无人再敢挑战，为制礼作乐创造了稳定的政治环境。'},
      {name:'周公制礼作乐',desc:'周公旦在东征胜利后大规模分封诸侯，制定了一整套典章制度，确立了以嫡长子继承为核心的宗法制和以周天子为顶点的分封体系，礼乐文明成为中华文化的核心基因。',background:'商朝社会以神权为核心，大事小事都要占卜问鬼神。周人在灭商后认识到"天命靡常""皇天无亲惟德是辅"——上天不会永远保佑一个王朝，只有有德者才能获得天命。他们需要一套不同于商朝的制度来巩固统治并教化民众。',process:'周公以"敬天保民"为核心思想，设计了宗法制以嫡长子继承确保权力平稳过渡，设计分封制将姬姓宗亲和功臣分封各地拱卫王室，设计礼乐制度规范从祭祀、朝聘、宴飨到婚丧嫁娶的社会秩序。"礼"区分贵贱尊卑，"乐"调和人心情感，礼乐相辅相成共同维系社会和谐。',result:'周朝形成了一套完备的典章制度体系——《周礼》《仪礼》《礼记》记录了这套制度的方方面面。从天子、诸侯、卿大夫到士、庶人的每个阶层都有明确的礼仪规范。这套制度保证了周朝近三百年的稳定统治。',evaluation:'礼乐文明是人类历史上罕见的以文化而非武力来整合社会的伟大尝试。它把外在的行为规范（礼）和内在的情感调谐（乐）结合起来，创造了一种极其精致的文明形态。虽然在后世出现了"礼教吃人"的异化，但礼乐文明的核心精神——以文化教化而非暴力统治——至今仍有启示意义。',impact:'礼乐文明成为中华文化的灵魂——"礼仪之邦"由此而来。孔子终生以"克己复礼""吾从周"为理想，儒家学说本质上是对周代礼乐文明的继承和发扬。宗法制对祖先崇拜、孝道、家族观念的塑造影响至今，中国人的家国情怀、长幼有序等价值观念都可以追溯到周公。'},
      {name:'成康之治',desc:'周成王、周康王在位期间（约前1043—前996年），延续周公之政，轻徭薄赋、明德慎罚，社会安定和谐，史载"天下安宁，刑错四十余年不用"，是西周最鼎盛的时期。',background:'周公摄政七年后归政于成王，此时周朝的政治制度已经完备，社会秩序基本稳定。成王在周公的教导下成长为一位贤明的君主，而周公在归政后不久去世，成王独立执政。',process:'成王和其子康王在位期间严格遵循周公制定的治国方针：对外不轻易发动战争，以礼乐教化诸侯而非武力威慑；对内轻徭薄赋减轻百姓负担，刑罚从宽极少动用死刑。四十多年间国家机器不需要用严刑峻法来维持社会秩序。',result:'成康时期社会安定、经济繁荣、人口增长，中原地区出现了周朝建立以来最繁荣的治世局面。这一时期也是西周青铜器铸造的黄金时代，大量精美礼器如大盂鼎、小盂鼎等皆出自这一时期。',evaluation:'"刑错不用"并非因为犯罪不存在，而是因为社会公平正义得到了较好的维护，百姓安居乐业自然不会犯法。成康之治证明了：最好的社会治理不是依靠严刑峻法来威慑，而是通过公平的制度让人民有尊严地生活。',impact:'成康之治奠定了周朝长期稳定的基础，成为后世评价治世的标杆。儒家的"德主刑辅""为政以德"思想，在很大程度上就是从成康之治的实践经验中提炼出来的政治智慧。'},
      {name:'国人暴动',desc:'公元前841年，周厉王推行专利政策垄断山林川泽之利，又派卫巫监视国人言论使"道路以目"，镐京城内的"国人"（自由民）忍无可忍发动暴动驱逐厉王，这一年成为中国历史确切纪年之始。',background:'西周中期以后王室财政日渐拮据，周厉王任用荣夷公推行"专利"政策——将山林川泽收归王室垄断，禁止国人自由渔猎樵采。这一政策严重侵犯了国都中自由民阶层（国人）的传统经济权益。',process:'国人怨声载道纷纷议论批评，厉王不仅不反省反而派卫巫监视国人言论，被告密者立即处死。镐京街头"道路以目"——人们走在路上只能用眼神交流不敢说话。召公虎以"防民之口甚于防川"劝谏厉王：堵百姓的嘴比堵洪水还危险，洪水决堤必然伤人，百姓积怨一旦爆发后果不堪设想。厉王不听。',result:'前841年，国人忍无可忍发动暴动攻入王宫，厉王仓皇出逃渡过黄河逃到彘地（今山西霍州），此后十四年不敢返回。召公以自己的儿子替太子静死，太子才免于一死。周朝进入周公召公联合执政的"共和行政"时期，这一年成为中国历史有确切纪年的起点。',evaluation:'国人暴动是世界历史上少有的城市平民成功驱逐君主的案例。召公"防民之口甚于防川"的劝谏成为千古名言——压制言论的社会如同被堵塞的河道，表面平静实际上暗流汹涌，一旦决堤后果不堪设想。',impact:'前841年（共和元年）是中国历史确切纪年的开端，从此中国的历史记载有了精确的年份坐标，司马迁就是以此为起点编写了《十二诸侯年表》。"共和"一词也成为后世共和制的翻译来源。"国人"作为一支政治力量登上历史舞台，说明西周政治中并非只有天子诸侯，城市自由民也有不容忽视的力量。'},
      {name:'烽火戏诸侯与西周灭亡',desc:'公元前771年，周幽王宠幸褒姒废嫡立庶，为博美人一笑不惜点燃烽火台戏弄诸侯。当犬戎联军真的来犯时诸侯无人来援，镐京被攻破，幽王被杀于骊山之下，西周覆亡。',background:'周幽王即位后立申后之子宜臼为太子，后因宠幸美女褒姒而废申后和太子，改立褒姒之子伯服为太子。申后之父申侯对此极为愤怒，暗中与犬戎部落和鄫国结盟准备复仇。',process:'褒姒虽有绝色但生性不爱笑，幽王为博美人一笑命人点燃骊山烽火台。诸侯见到烽火以为犬戎入侵纷纷率军赶来勤王，到了骊山才发现空跑一趟。褒姒看到诸侯被戏弄的狼狈样子终于开怀大笑，幽王大喜。申侯趁幽王失信于诸侯之机联合犬戎和鄫国大举进攻镐京，幽王再燃烽火但诸侯以为又是戏弄无人来援。',result:'犬戎联军攻破镐京，幽王逃至骊山脚下被犬戎追兵杀死，褒姒被俘，西周府库被洗劫一空。申侯与众诸侯拥立原太子宜臼为周平王。因镐京已残破不堪，前770年平王将都城迁至洛邑（今洛阳），东周开始。',evaluation:'"烽火戏诸侯"的故事虽有后人添油加醋的成分，但其核心教训是真实的：君主的诚信是统治的基石，一旦失信就失去了臣属的信任。"狼来了"的效应在政治领域同样致命——信用破产之后没有人会再次响应你的呼吁。',impact:'西周的灭亡标志着中国历史进入了礼崩乐坏的春秋战国时代。周天子虽然还存在但权威一落千丈，"礼乐征伐自天子出"变成了"礼乐征伐自诸侯出"。幽王的教训成为后世帝王教育的反面教材，"女色亡国"的叙事也从此成为中国历史书写中反复出现的主题。'}
    ],
    figures:[
      {name:'周武王',desc:'姬姓，名发，周朝开国君主。继承父亲文王遗志，会合八百诸侯于盟津，在牧野之战中以少胜多击败商纣王，建立周朝定都镐京，开启了延续八百年的周王朝。'},
      {name:'周公旦',desc:'周武王之弟，姓姬名旦。武王去世后摄政辅佐年幼的成王，率军东征平定三监之乱，大规模分封诸侯，制礼作乐确立宗法制和分封制，被尊为儒家元圣，是中华礼乐文明的总设计师。'},
      {name:'姜子牙',desc:'姜姓吕氏，名尚，号太公望。在渭水之滨垂钓时被周文王访得，年逾七十辅佐文王武王两代灭商建周，因功封于齐地成为齐国开国之君，被尊为兵家始祖。'},
      {name:'周成王',desc:'名诵，武王之子。幼年即位由叔父周公旦摄政，成年后周公归政，亲政期间继续推行周公的制度建设，与子康王共同开创了"成康之治"的盛世局面。'},
      {name:'周康王',desc:'名钊，成王之子。在位期间延续成王和周公的治国方针，轻徭薄赋、明德慎罚，社会安定四十余年不用刑罚，是西周国力的鼎盛时期。'},
      {name:'周幽王',desc:'名宫湦，西周最后一任君主。宠幸褒姒废嫡立庶，为博美人一笑不惜烽火戏诸侯。公元前771年犬戎联军攻破镐京，幽王被杀于骊山之下，西周灭亡。'}
    ],
    inventions:['分封制','宗法制','礼乐制度','井田制'],
    turningPoints:[{y:'约前1046年',e:'西周建立',d:'周武王伐纣成功，建立周朝，定都镐京',s:'分封制和宗法制确立，礼乐文化形成'},{y:'前771年',e:'西周灭亡',d:'犬戎攻破镐京，周幽王被杀于骊山之下',s:'西周结束，平王东迁洛邑，进入春秋时期'}],
    color:'#B8956A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/a0f5a1de-0315-4d68-ba22-3f7f45566a5e.jpg'
  },
  { id:'spring-autumn', name:'春秋时期', period:'公元前770年 - 公元前476年', start:-770, end:-476, founder:'周平王东迁',
    desc:'春秋时期是东周的前半期，周王室权威衰落，诸侯争霸成为主旋律。齐桓公、晋文公、楚庄王、吴王阖闾、越王勾践先后称霸，史称"春秋五霸"。这一时期，铁器开始使用，生产力提高，社会经济发展，思想文化空前活跃，出现了百家争鸣的萌芽。',
    events:[
      {name:'平王东迁',desc:'公元前770年，周平王在晋文侯、郑武公等诸侯的护卫下将都城从镐京东迁至洛邑（今河南洛阳），东周开始。此后周王室直辖领地大幅缩小，权威一落千丈，诸侯争霸时代正式拉开帷幕。',background:'幽王被杀后镐京残破不堪，犬戎等游牧部落仍在关中平原活动。申侯等拥立的周平王面对的是一个王畿被毁、国库被劫、兵力空虚的烂摊子，继续留在镐京已无安全和经济上的保障。',process:'平王在晋文侯、郑武公、秦襄公等诸侯的护送下将都城迁至洛邑（成周，今河南洛阳）。洛邑是西周初年周公营建的东都，位置居天下之中，交通便利经济发达。但平王东迁得到了诸侯援助也付出了政治代价——将岐山以西土地赐予秦襄公，意味着放弃了周人祖地关中。',result:'东周开始，周天子的直辖领地从关中千里平原缩小至洛阳周边数百里。王室财政日益拮据，连天子的丧葬费用都需要向诸侯借贷。诸侯开始自行其是，不再定期朝贡述职。',evaluation:'平王东迁是迫于现实的选择，但代价是周王室从一个能号令天下的中央政权变成了仅能勉强自保的地方政权。这揭示了一个政治规律：中央权威的衰落在很大程度上就是财政和军事能力双重弱化的结果。',impact:'东迁后中国历史进入春秋时期，"礼乐征伐自天子出"变为"自诸侯出"。平王东迁的直接后果之一是将关中故地拱手让给秦国，秦人由此获得了独立发展壮大的基地，五百多年后正是秦国统一了天下——历史的因果循环令人深思。'},
      {name:'齐桓公称霸',desc:'齐桓公任用管仲为相推行改革，"尊王攘夷"为号召，九合诸侯一匡天下，成为春秋第一霸主。管仲的改革涉及政治、军事、经济各方面，使齐国率先富强起来。',background:'齐襄公荒淫无道被弑后，流亡在外的公子小白抢先回国即位即齐桓公。他不计前嫌任用曾射杀自己（射中衣带钩）的管仲为相，展示了非凡的胸襟。当时戎狄南侵频频威胁中原诸侯，燕国被山戎围攻、卫国被狄人灭国、邢国岌岌可危。',process:'管仲推行"四民分业""相地而衰征""官山海"等全面改革，齐国迅速富强。公元前681年齐桓公在鄄地首次大会诸侯，正式打出"尊王攘夷"旗号。北击山戎救燕、驱逐狄人复卫邢、南伐楚质问"昭王南征不复"并在召陵与楚盟约。公元前651年葵丘之盟——齐桓公九合诸侯一匡天下，霸业达到顶峰。',result:'齐桓公在位四十二年，以"尊王"恢复王室权威、以"攘夷"保护中原诸侯，被公认为春秋第一霸主。管仲改革使齐国成为当时最富强的国家，"齐冠带衣履天下"形容齐国的经济繁荣。',evaluation:'齐桓公称霸的核心是管仲"尊王攘夷"的战略设计——以"尊王"获得道义合法性、以"攘夷"凝聚诸侯认同。这一模式证明：对外影响力的构建必须有内在的实力基础，而实力又必须依托道义话语才能持久。',impact:'齐桓公开启了春秋五霸的时代，"霸主"作为周天子之下事实上的国际秩序维护者成为此后两百年间的主流模式。管仲的改革理论和实践成为后世变法的重要参考，"仓廪实则知礼节、衣食足则知荣辱"等名言至今广为流传。'},
      {name:'晋文公称霸',desc:'晋文公重耳流亡十九年归国即位后励精图治，公元前632年在城濮之战中以退避三舍之计大败楚军，战后在践土之盟中被周襄王册封为诸侯之长，晋国称霸中原。',background:'晋献公晚年宠骊姬引发"骊姬之乱"，太子申生被迫自杀，公子重耳被迫流亡列国。他在狄、卫、齐、曹、宋、郑、楚、秦八国间奔波十九年，备尝人情冷暖。在楚国受到楚成王隆重款待时，重耳承诺若两国交战必"退避三舍"报答。公元前636年在秦穆公帮助下归国即位。',process:'重耳任用狐偃、赵衰、先轸等贤臣整顿内政，晋国迅速恢复国力。公元前632年楚国围攻宋国，晋文公率军救宋，履行"退避三舍"承诺主动后撤九十里至城濮。楚军将领子玉轻敌追击，晋军以虎皮蒙马震慑楚军战马，大败楚军。战后晋文公在践土召集诸侯大会盟，周襄王亲临册封为侯伯（诸侯之长）。',result:'城濮之战确立了晋国在中原的霸主地位，此后晋国称霸断断续续长达百余年。晋文公被周天子正式册封为霸主，拥有了"专征伐"的权力——可代表周天子讨伐不服从的诸侯。',evaluation:'晋文公的传奇人生诠释了"大器晚成"。六十二岁才即位的他以丰富的人生阅历和坚韧不拔的意志成就了霸业。"退避三舍"表面上是遵守承诺，实则是以退为进的战术——后撤让楚军深入拉长补给线。这展示了守信与谋略可以并行不悖的政治智慧。',impact:'晋国霸业的建立使中原地区长期处于晋楚对抗的格局中，这一南北对峙成为春秋中期以后的主线。晋文公塑造的霸主模式——内修德政外尊王室——被后来者不断效仿，奠定了春秋霸主政治的基本范式。'},
      {name:'楚庄王问鼎中原',desc:'楚庄王即位三年不理朝政，后"一鸣惊人"发愤图强，任用孙叔敖为令尹治理楚国。公元前606年，楚庄王率军至洛水边陈兵示威，向周天子使者询问九鼎轻重，公然挑战周王室权威。',background:'楚国据有江汉流域半壁江山，在南方独大。但中原诸侯一直视楚为蛮夷不屑与之为伍。楚庄王即位时内部贵族势力强大，他不急于有所作为而是故意沉湎酒色麻痹政敌，暗中观察朝中忠奸。',process:'三年后楚庄王对劝谏的大臣说"三年不飞一飞冲天，三年不鸣一鸣惊人"，开始雷厉风行整顿朝政，诛杀奸臣数百人进用忠臣数百人。任用孙叔敖为令尹兴建水利工程、发展生产。前606年楚庄王借征伐陆浑之戎的名义率军至洛水边，在新筑的"观兵台"上检阅军队。周定王派大夫王孙满前去慰劳，楚庄王开口便问："周天子的九鼎有多大、多重？"',result:'王孙满回答道"在德不在鼎"，以"周德虽衰天命未改"驳回了楚庄王的野心。楚庄王虽未直接夺取九鼎但震慑了周王室和中原诸侯，楚国在诸侯中的声望达到顶峰。此后楚庄王在邲之战中大败晋军，正式成为中原霸主。',evaluation:'楚庄王的"问鼎"是一次精心的政治宣示——我不需要真的拿走九鼎，只需通过"问"这个动作来展示楚国有实力挑战周王室。"问鼎"从此成为企图夺取政权的代名词。王孙满"在德不在鼎"的回应也极为精彩，点出了政治权力的真正本质：它不在于象征物而在于人心。',impact:'楚庄王问鼎是春秋时期最具象征意义的事件之一，它表明楚国的实力已超越中原任何一国。"问鼎中原""一鸣惊人"等成语皆由此而来。楚国从蛮夷到霸主的转变，也打破了中原中心论的偏见——先进文化不一定只在黄河流域。'},
      {name:'吴越争霸与卧薪尝胆',desc:'吴王阖闾败于越王勾践后重伤而死，其子夫差励精图治击败越国。勾践被俘后忍辱负重，归国后卧薪尝胆十年生聚，最终于公元前473年灭吴，成为春秋最后一位霸主。',background:'吴越两国地处长江下游，吴国以苏州为中心、越国以绍兴为中心，长期处于竞争之中。公元前496年吴王阖闾趁越国国丧之机伐越，在檇李之战中越王勾践用敢死队在阵前自刎震慑吴军趁乱大败吴军，阖闾伤重而死。死前嘱托儿子夫差"必毋忘越"。',process:'夫差励精图治令侍者每天提醒"夫差！而忘越王之杀而父乎"，三年后在夫椒之战中大败越军。勾践仅剩五千残兵困守会稽山，派文种贿赂吴太宰伯嚭向夫差求和。夫差不听伍子胥劝告接受求和。勾践入吴为夫差养马三年，甚至尝夫差粪便以判断其病情，终获信任被释放回国。归国后勾践卧薪尝胆——以柴草为榻、悬苦胆每日品尝提醒不忘会稽之耻。任用范蠡文种发展生产、训练军队，十年生聚十年教训。',result:'前473年越军攻入吴都，夫差自杀吴国灭亡。勾践乘胜北上与齐晋诸侯在徐州会盟，被周元王赐胙封为霸主。但越国的霸业昙花一现，勾践灭吴后范蠡飘然隐退，文种被赐死，所谓"飞鸟尽良弓藏"。',evaluation:'卧薪尝胆是中国历史上最著名的励志故事。"苦心人天不负，卧薪尝胆，三千越甲可吞吴"激励了无数逆境中的人。但故事的后半段同样发人深省——范蠡"兔死狗烹"的警告和文种的悲惨结局，说明权力的逻辑中感恩往往被猜忌取代。',impact:'勾践作为春秋最后一位霸主，他的成功与夫差的失败形成了经典的正反对照。夫差因骄纵放虎归山而国灭身死，勾践因卧薪尝胆隐忍复仇而成就霸业。"生于忧患死于安乐"这一道理通过这段历史得到了最生动的诠释。'},
      {name:'孔子周游列国创立儒家学派',desc:'孔子（前551—前479年）为推行仁政德治的政治理想，带领弟子周游卫、宋、陈、蔡等列国十四年，虽屡遭困厄但始终坚持。晚年返回鲁国整理六经，创立儒家学派，被后世尊为"至圣先师"。',background:'孔子出身鲁国没落贵族家庭，三岁丧父、十七岁丧母，青年时做过管理仓库和畜牧的小吏。他刻苦自学习礼，三十岁开始私人讲学打破了学在官府的传统。鲁国内乱孔子去职开始周游列国时已五十五岁。',process:'孔子带领颜回、子路、子贡等弟子先后到访卫、曹、宋、郑、陈、蔡、楚等国。在匡地被围困、在宋国险遭杀害、在陈蔡之间绝粮七日弟子饿得站不起来但孔子依然弦歌不绝。各国君主虽礼遇孔子但无一人真正采纳他的政治主张。六十八岁时孔子接受季康子邀请返回鲁国，不再过问政治专心整理《诗》《书》《礼》《乐》《易》《春秋》，从事教育和著述。',result:'公元前479年孔子去世享年七十三岁。弟子们守丧三年，子贡更是守墓六年。孔子的言行被弟子们整理成《论语》，儒家学派在此基础上逐渐发展壮大，继承者子思、孟子、荀子将其发扬光大。',evaluation:'孔子一生在政治上不得志——没有哪国君主真正推行他的仁政理想。但命运的反讽在于：他的政治理想没有在当下实现，却塑造了此后两千年的中国。他以私人讲学培养弟子的方式，无意中创造了一种更持久的影响力——教育远比行政命令更能改变人心。',impact:'儒家思想深刻影响了此后两千年的中国和东亚世界——从政治制度到家庭伦理、从教育理念到审美标准。孔子被尊为万世师表，儒家经典成为科举考试的核心内容。"仁义礼智信""己所不欲勿施于人"等理念至今仍是中国人价值观的重要组成部分。'}
    ],
    figures:[
      {name:'齐桓公',desc:'姜姓，名小白，春秋五霸之首。任用管仲为相推行全面改革，以"尊王攘夷"为号召九合诸侯一匡天下，北击山戎救燕、南伐楚国立威，使齐国成为春秋第一强国。'},
      {name:'管仲',desc:'齐国名相，被齐桓公尊为"仲父"。推行政治、军事、经济全面改革——四民分业、相地而衰征、官山海盐铁专卖，使齐国率先富强，被后世誉为"法家先驱""华夏第一相"。'},
      {name:'晋文公',desc:'姬姓，名重耳。流亡列国十九年备尝艰辛，六十二岁归国即位后励精图治，城濮之战以退避三舍大败楚军，践土之盟被周襄王册封为诸侯之长，晋国称霸中原百余年。'},
      {name:'楚庄王',desc:'芈姓熊氏，名侣。即位三年沉醉酒色不理朝政，后"一鸣惊人"发愤图强问鼎中原，任用孙叔敖治理内政，使楚国成为南方霸主，被列入春秋五霸。'},
      {name:'孔子',desc:'名丘字仲尼（前551—前479年），春秋末期鲁国人。带领弟子周游列国十四年推行仁政思想，晚年返鲁整理六经、修订《春秋》，创立儒家学派，被后世尊为"至圣先师""万世师表"，其思想深刻影响了中华文明和世界文化。'},
      {name:'老子',desc:'姓李名耳字聃，道家学派创始人。曾任周王室守藏室之史（国家图书馆馆长），见周室衰微后西出函谷关留下五千余言《道德经》，提出"道法自然""无为而治"等核心思想，被道教尊为太上老君。'},
      {name:'孙武',desc:'字长卿，齐国人，被吴王阖闾拜为大将。率吴军西破强楚、北威齐晋，著有《孙子兵法》十三篇，被誉为"兵学圣典""世界古代第一兵书"，被尊为"兵圣""百世兵家之师"。'}
    ],
    inventions:['铁器','牛耕','私学兴起','诸子百家思想萌芽'],
    turningPoints:[{y:'前770年',e:'平王东迁',d:'周平王在晋、郑等诸侯护卫下迁都洛邑，东周开始',s:'周王室权威衰落，诸侯争霸时代来临'},{y:'前551年',e:'孔子诞生',d:'儒家学派创始人孔子出生于鲁国陬邑（今山东曲阜）',s:'儒家思想诞生，影响中国两千多年'}],
    color:'#C9A86A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/add434a8-5872-4f40-997e-6588003e36f0.jpg'
  },
  { id:'warring-states', name:'战国时期', period:'公元前475年 - 公元前221年', start:-475, end:-221, founder:'三家分晋',
    desc:'战国时期是中国历史上最为动荡的时期之一，七雄并立，战争频繁，但也催生了空前活跃的思想文化。各国纷纷变法图强，商鞅变法使秦国由弱变强。这一时期，铁器广泛使用，农业生产力大幅提高，诸子百家思想达到鼎盛，为中华文化奠定了坚实基础。',
    events:[
      {name:'三家分晋',desc:'公元前403年，晋国被韩、赵、魏三家大夫瓜分，周威烈王被迫正式册封三家为诸侯。这一事件标志着战国时代的开端，司马光《资治通鉴》以此为开篇，警示礼崩乐坏始于名器之乱。',background:'晋国自献公以来就有"灭公族"的传统，异姓卿大夫逐渐掌控实权。春秋末期晋国已是六卿掌权，经过相互倾轧仅剩韩、赵、魏、智四家。智伯瑶实力最强以献地为由要挟三家割地，韩魏屈服、赵襄子拒绝。',process:'前455年智伯瑶联合韩魏围困赵氏于晋阳，引汾水灌城。危急关头赵襄子派谋士张孟谈秘密出城说服韩魏——"唇亡齿寒，智伯灭赵后下一个就是你们"。韩魏阵前倒戈三家联合反攻智伯，智伯兵败身亡被赵襄子将其头骨漆为饮器。此后韩赵魏三家瓜分智氏土地，晋国名存实亡。前403年周威烈王被迫正式册封三家为诸侯。',result:'晋国分裂为韩、赵、魏三国，春秋时期的第一强国就此消失。战国七雄格局由此形成——齐楚燕韩赵魏秦并立于天下。',evaluation:'三家分晋是"礼崩乐坏"的标志性事件。臣子瓜分君主的封地在周礼中是大逆不道的叛乱，但周天子不仅没有讨伐反而正式册封三家为诸侯。司马光选择以这一事件作为《资治通鉴》的开篇，意在警示：名分的混乱是一切政治混乱的根源。',impact:'三家分晋标志着战国时代正式开启。从春秋到战国的转变不仅是时间的分期更是时代的质变——战争从争霸变为兼并、从礼仪战变为歼灭战、从"不重伤不擒二毛"变为"争城以战杀人盈城"。晋国的分裂使秦国少了一个最强大的对手，为后来秦统一创造了条件。'},
      {name:'商鞅变法',desc:'公元前356年，秦孝公任用商鞅在秦国推行全面变法：废井田开阡陌、奖励军功与农耕、推行二十等爵制、实行连坐法。变法使秦国由西陲弱国一跃成为战国第一强国，为后来统一六国奠定了制度基础。',background:'秦国偏居西陲屡被中原诸侯轻视，到秦孝公即位时国力远不如东方六国。孝公痛感"诸侯卑秦丑莫大焉"，发布《求贤令》广招天下人才。卫国人公孙鞅（商鞅）闻讯入秦以霸道之术游说孝公，两人促膝长谈数日孝公大喜。',process:'商鞅在孝公支持下分两次推行变法。第一次（前356年）：颁布"什伍连坐"法、奖励军功禁止私斗、奖励耕织。为使百姓相信新法必行商鞅在栎阳南门"徙木立信"。第二次（前350年）：废井田开阡陌允许土地买卖、推行郡县制、统一度量衡、按户口征收赋税。太子犯法商鞅"刑其傅公子虔、黥其师公孙贾"以示法不阿贵。',result:'变法十年后秦国"道不拾遗山无盗贼""家给人足"，军队战斗力飙升。从前361年变法到前221年统一，秦国仅用140年就从西陲弱国变成了吞并六国的超级强国。变法法令在商鞅被车裂后也没有被废除。',evaluation:'商鞅变法是人类历史上最成功的国家改造案例之一。其核心逻辑是通过制度设计将国家力量最大化——把分散在贵族手中的土地、人口、赋税集中于国家，让所有社会成员的上进之路与国家目标捆绑。但"连坐法""禁私斗"等极端手段也带来了恐怖统治的副作用。',impact:'商鞅变法奠定了秦国统一天下的制度基础，也奠定了此后两千年中国"外儒内法"的治理模式。"徙木立信"的故事成为中国历史上取信于民的经典案例。"治世不一道便国不法古"的改革理念，也激励了后世无数变法者。'},
      {name:'长平之战',desc:'公元前260年，秦国与赵国在长平（今山西高平）展开战国时期规模最大的战役。赵括纸上谈兵取代老将廉颇，秦将白起以诱敌深入之计包围赵军，赵军粮尽援绝被迫投降，白起坑杀降卒四十余万，赵国从此一蹶不振。',background:'秦国攻占韩国野王（今河南沁阳）切断了韩上党郡与韩国本土的联系。上党郡守冯亭不愿降秦而献地于赵国，赵孝成王不顾平阳君赵豹的反对接受了这个烫手山芋。秦昭襄王大怒命左庶长王龁率军攻赵，两军在长平对峙。',process:'老将廉颇采取坚壁清野、以逸待劳的防御策略，坚守三年不出。秦国间谍在赵国散布谣言说"秦军不怕廉颇就怕赵奢之子赵括"。赵孝成王中计以赵括取代廉颇。赵括一到前线立即改守为攻全线出击。秦昭襄王秘密起用白起为主将，白起将计就计佯败诱使赵军深入，然后以二万五千骑兵切断赵军退路形成包围圈。赵军被围四十六日粮尽援绝，士兵甚至暗中相互杀食。',result:'赵括率精兵突围被秦军射杀，四十万赵军投降。白起认为"赵卒反复非尽杀之恐为乱"，将降卒全部坑杀仅放回二百四十名少年兵回赵国报信。此役赵国精锐尽丧举国震恐。',evaluation:'长平之战的悲剧是多重因素的结果：赵孝成王的决策失误、赵括的纸上谈兵、白起的残忍屠杀。但更深层的原因是秦国已通过商鞅变法建立了压倒性的国力优势——秦国有充足的粮草可以支撑三年围城战而赵国已经撑不住了。这是制度对个人英勇的胜利也是冷酷理性对传统武德的胜利。',impact:'长平之战后东方六国再无力单独对抗秦国，统一大势已不可逆转。"纸上谈兵"成为千古教训警示理论与实践的差距。"长平坑卒"更是中国战争史上最惨烈的一页，至今长平古战场仍能发掘出大量遗骨。'},
      {name:'荆轲刺秦王',desc:'公元前227年，燕太子丹为挽救危局派荆轲刺杀秦王嬴政。荆轲以献燕国督亢地图和秦叛将樊於期首级为名觐见秦王，"图穷而匕首见"，最终行刺失败被秦王侍卫所杀，留下"风萧萧兮易水寒"的千古绝唱。',background:'秦国灭韩破赵兵锋直指燕国，燕太子丹曾在秦国做人质受辱逃归对嬴政恨之入骨。太子丹找到卫国侠客荆轲请求他去刺杀秦王。荆轲提出需要两样东西以取得秦王的信任——燕国最富庶的督亢地区的地图、秦国叛将樊於期的人头。',process:'樊於期闻讯后慨然自刎献出头颅。太子丹为荆轲准备了淬过剧毒的徐夫人匕首藏在督亢地图的卷轴中，配以十三岁就敢杀人的秦舞阳为副使。易水边送别送行者皆白衣冠，高渐离击筑荆轲慷慨悲歌"风萧萧兮易水寒，壮士一去兮不复还"。咸阳宫内荆轲献上樊於期首级后展开地图，图穷匕首现。荆轲左手抓住秦王衣袖右手持匕首刺去，秦王挣断衣袖绕柱狂奔，殿上群臣因秦法不得带兵器上殿只能赤手空拳击打荆轲。侍医夏无且用药囊掷荆轲，左右大喊"王负剑"，秦王拔长剑斩断荆轲左腿。荆轲掷出匕首未中，靠在铜柱上大笑："事所以不成者，欲以生劫之，必得约契以报太子也。"',result:'荆轲被秦王侍卫所杀，秦舞阳在殿外被杀。秦王震怒增兵伐燕，五年后燕国灭亡俘虏燕王喜。太子丹逃至衍水被燕王喜派人斩首献给秦王求和，但于事无补。',evaluation:'荆轲刺秦是历史上最悲壮的刺杀行动——明知必死而赴义，展现了古代侠士舍生取义的精神。"士为知己者死"在此得到了极致体现。但从历史角度看刺杀并不能改变天下统一的趋势——秦始皇即便被杀秦国的统一战争也不会停止。',impact:'"风萧萧兮易水寒"成为中国文学中最具感染力的诗句之一。"图穷匕首见""荆轲刺秦""一去不复还"成为经典典故，千百年来激荡着中国人的侠义情怀。荆轲作为失败的英雄形象在中国文化中具有持久的魅力，被诗歌、戏曲、影视反复演绎。'},
      {name:'秦灭六国统一天下',desc:'秦王嬴政采纳李斯"灭韩以恐他国"的战略，从前230年灭韩开始至前221年灭齐为止，仅用十年时间以远交近攻之策逐一消灭六国，结束了自春秋以来五百多年的分裂战乱，建立了中国历史上第一个大一统帝国。',background:'经孝公、惠文王、武王、昭襄王、孝文王、庄襄王六代君主和商鞅、张仪、魏冉、范雎等名臣的连续努力，秦国已是战国第一强国。嬴政十三岁即位二十二岁亲政后迅速平定嫪毐叛乱、罢免吕不韦集中权力，任用李斯为相、王翦王贲父子为将，启动了统一战争。',process:'采用李斯的战略"先取韩以恐他国"：前230年灭韩国（最弱）→前228年灭赵国（最强对手，经长平已衰）→前225年灭魏国（引黄河水灌大梁城）→前223年灭楚国（王翦率六十万大军）→前222年灭燕国→前221年灭齐国（齐王建不战而降）。每灭一国即设置为秦国的郡县，不设分封。',result:'前221年齐国最后的抵抗瓦解，嬴政完成统一大业。"六王毕四海一"，秦国从一个西方诸侯变成了中国历史上第一个大一统帝国。嬴政自认"德兼三皇功过五帝"创"皇帝"称号自称始皇帝。',evaluation:'秦统一天下是商鞅变法以来秦国一百四十年苦练内功的结果而非偶然。六国不是被秦国的武力压倒，而是被秦国的制度效率压倒——秦国的郡县制、军功爵制、户籍制度、标准化管理远比武备废弛的六国高效。统一的本质是制度的胜利。',impact:'秦统一结束了自春秋以来五百五十年的分裂割据，奠定了中国两千多年统一多民族国家的基本格局。"海内为郡县""车同轨书同文行同伦"塑造了中华民族的共同体意识。此后两千多年统一始终是中国历史的主流——这正是秦统一最深远的历史意义。'}
    ],
    figures:[
      {name:'商鞅',desc:'卫国公子，姓公孙名鞅。入秦后被秦孝公任命为左庶长推行变法：废井田开阡陌、奖励军功与农耕、实行县制、统一度量衡。变法使秦国由西陲弱国一跃成为战国第一强国。后被诬以谋反车裂而死，但新法未废。'},
      {name:'孟子',desc:'名轲字子舆（约前372—前289年），战国时期儒家代表人物，被尊为"亚圣"。主张"性善论""仁政""民贵君轻"，游说齐、梁等国推行王道，晚年与弟子著《孟子》七篇，其思想对宋明理学影响深远。'},
      {name:'庄子',desc:'名周字子休（约前369—前286年），战国时期道家代表人物。继承发展老子思想，主张"逍遥游""齐物论"，以汪洋恣肆的寓言讽刺世俗，著有《庄子》三十三篇，与老子并称"老庄"。'},
      {name:'荀子',desc:'名况字卿（约前313—前238年），战国末期儒家代表人物。提出"性恶论"与孟子"性善论"相对，强调礼法并用、后天教化，曾任稷下学宫祭酒，弟子韩非、李斯皆为法家代表人物。'},
      {name:'韩非子',desc:'韩国公子（约前280—前233年），法家思想集大成者。综合商鞅的"法"、申不害的"术"、慎到的"势"为一体，著有《韩非子》五十五篇，主张以法治国。入秦后被李斯陷害死于狱中，但其学说被秦始皇奉为国策。'},
      {name:'墨子',desc:'名翟（约前468—前376年），墨家学派创始人。主张"兼爱非攻""尚贤尚同"，精通机械制造和守城防御技术，曾步行十日十夜从齐国到楚国阻止攻宋。墨家是战国时期唯一能与儒家抗衡的显学。'},
      {name:'屈原',desc:'芈姓屈氏名平字原（约前340—前278年），楚国贵族，中国第一位伟大的爱国诗人。曾任楚怀王左徒，因遭谗被放逐，楚国郢都被秦军攻破后抱石自沉汨罗江。著有《离骚》《天问》《九歌》等，开创楚辞一体，端午节由此而来。'},
      {name:'白起',desc:'秦国名将，被封为武安君。一生指挥大小七十余战未尝一败，伊阙之战斩首二十四万，长平之战坑杀赵军四十万，战国战死者共约二百万其中半数死于白起。后被秦昭襄王赐死，自刎前叹"长平之战，赵卒降者数十万人，我诈而尽坑之，是足以死"。'},
      {name:'廉颇',desc:'赵国名将，以勇猛善战闻名诸侯。在长平之战前夕被赵孝成王以赵括取代导致大败，晚年流亡魏楚两国，但始终心念赵国。"廉颇老矣，尚能饭否"成为千古名句。'},
      {name:'赵括',desc:'赵国将领，名将赵奢之子。虽精通兵法理论但缺乏实战经验，长平之战中取代老将廉颇，轻敌冒进被秦将白起包围，赵军粮尽援绝全军覆没，本人战死，"纸上谈兵"的典故即源于此。'}
    ],
    inventions:['都江堰水利工程','郡县制雏形','兵法著作','诸子百家学说'],
    turningPoints:[{y:'前356年',e:'商鞅变法',d:'秦孝公任用商鞅推行变法，废井田开阡陌，奖励军功和农耕',s:'秦国崛起，为统一六国奠定基础'},{y:'前260年',e:'长平之战',d:'秦将白起大败赵军，坑杀降卒四十万，赵国元气大伤',s:'东方六国再无力独立抗衡秦国'}],
    color:'#D4AF6A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/4dbb9f1b-a9d6-4e7d-8415-3467d4ddbedf.jpg'
  },
  { id:'qin', name:'秦朝', period:'公元前221年 - 公元前207年', start:-221, end:-207, founder:'秦始皇嬴政',
    desc:'秦朝是中国历史上第一个统一的中央集权制封建王朝，奠定了中国两千多年政治制度的基本格局。秦始皇统一六国后，推行郡县制，统一文字、货币、度量衡，修建万里长城和驰道。虽然秦朝仅存在短短15年，但其制度创新影响极为深远。"百代皆行秦政制"即是对其历史地位的准确概括。',
    events:[
      {name:'秦始皇统一六国',desc:'公元前221年，秦王嬴政灭掉六国中最后的齐国，完成统一大业。他自认"德兼三皇、功过五帝"，创"皇帝"称号自称始皇帝，废除谥号制度和分封制，将全国分为三十六郡，建立了高度中央集权的政治体制。',background:'统一前五百五十余年，华夏大地处于周天子名义共主下的诸侯割据状态。秦国自商鞅变法后国力日强，经六代君主积累已是战国第一强国。嬴政十三岁即位二十二岁平定嫪毐叛乱亲政，任用李斯、王翦等能臣，启动统一战争。',process:'前230年灭韩→前228年灭赵→前225年灭魏→前223年灭楚→前222年灭燕→前221年灭齐。每灭一国便在其地设郡派官员管理而非分封子弟。齐国是最后一个，齐王建束手投降，秦王嬴政完成了"六王毕四海一"的伟业。统一后嬴政创"皇帝"称号自称始皇帝，废分封全面推行郡县制，将全国分为三十六郡。',result:'一个空前庞大的统一帝国在东亚大陆上诞生——东至大海、西至陇西、南至岭南、北至河套，人口约两千万。中央集权的郡县制取代了沿袭千年的分封制，中国政治制度从此走上了与欧洲截然不同的道路。',evaluation:'秦始皇的统一并非偶然的军事成功而是秦国一百四十年制度建设的必然结果。郡县制、军功爵制、户籍管理、标准化生产——秦国的制度效率远超六国。统一的核心不是武力征服而是制度输出：把秦国的制度推广到全中国。',impact:'秦始皇的统一奠定了中国两千多年统一多民族国家的基本格局。"百代皆行秦政制"并非夸张——郡县制、皇帝制、标准化管理等制度框架至今仍以不同形式存在于中国的治理体系中。统一文字造就了文化中国的共同体，此后无论分裂多少次"书同文"的力量总会将中国拉回统一。'},
      {name:'统一文字货币度量衡',desc:'秦始皇采纳李斯建议统一全国文字为小篆（后简化隶书），统一货币为圆形方孔的半两钱，统一度量衡标准，又规定"车同轨"车轨标准宽度。这些举措极大便利了全国经济文化交流，为统一多民族国家的巩固奠定了制度根基。',background:'统一前七国各有文字货币和度量衡体系——韩赵魏的布币、齐燕的刀币、楚国的蚁鼻钱各不相同；度量衡标准各国有别，文字更是异形纷呈，同一个字在各国写法可能完全不同。如果这些差别不消除所谓统一不过是个空壳。',process:'李斯以秦国文字为基础参照六国文字简化为小篆作为标准文字颁行全国（后来程邈又简化出隶书）。货币统一为圆形方孔半两钱——"天圆地方"的造型延续两千年。度量衡——度制以寸尺丈引、量制以龠合升斗斛、衡制以铢两斤钧石为标准向全国推广。规定车轨统一宽度为六尺以适应驰道的标准化建设。',result:'这些标准化措施在十余年内基本推行到全国。圆形方孔钱成为此后两千年中国货币的标准造型，"半两钱""五铢钱"乃至清代铜钱都保持了这一基本形态。统一的度量衡和文字极大地降低了全国范围内的交易成本和行政成本。',evaluation:'秦始皇的标准化运动是人类历史上最早的大规模国家标准化工程——比欧洲的标准化早了近两千年。其根本逻辑是：要维护一个大一统国家就必须有一套统一的"基础设施"——语言基础设施（文字）、经济基础设施（货币度量衡）、交通基础设施（车轨驰道）。这个洞察至今仍有现实意义。',impact:'统一文字是秦始皇最深远的文化遗产——它使各地的中国人尽管说着互相听不懂的方言却可以通过同一种文字交流。汉字从此成为中国文化的核心载体和文化认同的基础。"书同文"是维系中国大一统的最坚固的纽带。'},
      {name:'蒙恬北逐匈奴筑长城',desc:'秦始皇派大将蒙恬率三十万大军北击匈奴七百余里，收复河套地区（今内蒙古鄂尔多斯一带）。随后征发数十万民夫将原秦、赵、燕三国旧长城连接扩建为万里长城，西起临洮东至辽东，是世界历史上规模最大的军事防御工程。',background:'北方草原上的匈奴趁中原战乱不断南下侵扰。河套地区（"河南地"）水草丰美战略位置重要，曾被匈奴占据。燕赵秦三国各自在北境修筑了防御墙但互不相连。统一后匈奴成为秦朝最主要的边患，秦始皇决心以军事加工程手段一劳永逸地解决北方威胁。',process:'前215年蒙恬率三十万大军北击匈奴收复河套地区，匈奴北撤七百余里十余年不敢南下。秦朝在河套设九原郡移民实边。蒙恬主持将秦赵燕三国原有的防御墙连接扩展——西起临洮（今甘肃岷县）东至辽东（今朝鲜半岛北部），全长万余里。修筑工程动员民夫和刑徒数十万历时多年，工程之浩大旷古未有。',result:'万里长城的建成极大地改变了北方战略格局——匈奴骑兵无法像以前一样轻易突破南下劫掠。长城沿线的烽火台和戍卒制度形成了完整的预警体系和边防网络。蒙恬威震北疆"却匈奴七百余里胡人不敢南下而牧马"。',evaluation:'长城是人类历史上规模最大的防御工程也是人类文明最壮观的建筑奇迹之一。但它的代价同样巨大——数十万民夫日夜劳作死伤无数。孟姜女哭长城的传说表达的是底层民众对无穷劳役的血泪控诉。长城既是中华民族勤劳智慧的象征也是暴政的纪念碑。',impact:'长城深刻影响了此后两千年中国与北方游牧民族的关系——它既是军事防线也是农-牧文明的分界线。长城的修建永远改变了北方的地理地貌和人文景观。至今长城已成为中华民族的国家象征和文化符号，"不到长城非好汉"。'},
      {name:'焚书坑儒',desc:'公元前213至前212年，秦始皇采纳李斯建议焚烧除秦国史记及医药卜筮种树之外的民间藏书，随后因方士侯生、卢生逃亡而迁怒儒生，在咸阳坑杀四百六十余名"犯禁"儒生方士。焚书坑儒虽意在统一思想，但造成了古代典籍的重大损失。',background:'统一后淳于越在咸阳宫宴会上当众批评郡县制建议恢复分封制。李斯认为"诸生不师今而学古以非当世"是对统一政权的严重威胁，"私学而相与非法教——人闻令下则各以其学议之"会导致政令无法推行。他上书请求禁绝私学。',process:'前213年秦始皇批准李斯建议：除秦国官修史书外民间所藏《诗》《书》及诸子百家著作一律焚毁；谈论《诗》《书》者斩首以古非今者灭族；医药卜筮种树之书不烧；欲学法令者以吏为师。前212年方士侯生卢生为秦始皇求仙药花费巨万后畏罪逃亡并散布对秦始皇的不满言论。秦始皇大怒下令彻查咸阳的方士儒生四百六十余人被坑杀。长子扶苏进谏劝父亲不要重罚儒生被贬往上郡监军。',result:'大量先秦典籍遭到毁灭性损失——除秦国官藏之外的民间书籍被付之一炬。思想文化界陷入万马齐喑的沉寂，"以吏为师"意味着文化的全面政治化。',evaluation:'焚书坑儒是秦朝暴政最臭名昭著的文化罪行。"焚书"试图以物理手段消灭不利于统治的思想，"坑儒"则是以肉体消灭来威慑知识分子。但思想是无法用火烧掉的——秦朝十五年就灭亡了而《诗》《书》却通过口耳相传和墙壁夹藏保存了下来。',impact:'焚书坑儒对后世思想统治产生了深远影响——历代帝王从中学会了更精妙的"软控制"手法而非粗暴的焚坑。但这一事件也确立了秦朝"暴秦"的负面形象，"焚书坑儒"成为文化专制主义的代名词。对知识分子的迫害反而使儒学在汉朝获得了一种悲壮的道义资本。'},
      {name:'秦始皇沙丘病逝',desc:'公元前210年，秦始皇在第五次东巡途中于沙丘平台（今河北广宗）病逝，享年五十岁。宦官赵高与丞相李斯合谋篡改遗诏，逼死合法继承人扶苏和大将蒙恬，立少子胡亥为帝（秦二世），为秦朝速亡埋下祸根。',background:'秦始皇晚年痴迷求仙问药遣徐福率数千童男童女入海求不死之药耗费巨万。他频繁出巡——在统一后的十一年中五次大规模东巡。前210年第五次东巡途中"至平原津而病"，病情迅速恶化。',process:'秦始皇在病危时写下遗诏命长子扶苏"以兵属蒙恬与丧会咸阳而葬"——意思是叫扶苏回咸阳主持葬礼实际上是指定他为继承人。遗诏盖好玉玺后交给赵高但还未发出秦始皇就死了。赵高扣下遗诏说服胡亥和丞相李斯密谋篡改——伪造诏书赐死扶苏和蒙恬立胡亥为太子。李斯起初反对但被赵高以"君听臣之计则长有封侯世世称孤"说服。扶苏接到假诏后不顾蒙恬劝阻含泪自杀。',result:'胡亥即位为秦二世，赵高专权滥杀宗室大臣。始皇的二十多个子女（除胡亥外）全部被杀。蒙恬蒙毅兄弟被赐死，李斯后被赵高诬陷腰斩于咸阳。强大的秦帝国在始皇帝死后仅三年便土崩瓦解。',evaluation:'沙丘之变是秦朝由盛转衰的转折点。扶苏宽厚仁德如果即位很可能修正始皇的暴政稳住民心和天下。赵高的阴谋之所以能成功根源在于秦始皇的权力独揽——最高权力没有制度性的交接机制仅凭一纸诏书，而诏书还没有发出就死了。这是独裁体制最脆弱的时刻。',impact:'沙丘之变的直接后果是大秦帝国在巅峰时刻急速崩溃。扶苏含冤而死的悲剧数千年来令人扼腕。赵高"指鹿为马"、李斯"黄犬之叹"等典故都源于这一事件。这场政变也警示后来者：权力的交接制度是一个政权长治久安的生命线。'},
      {name:'陈胜吴广起义',desc:'公元前209年，九百名戍卒在大泽乡（今安徽宿州）遇雨失期按律当斩，陈胜吴广揭竿而起发动起义，喊出"王侯将相宁有种乎"的千古名言。起义虽仅半年即被镇压，但引发了全国范围的反秦浪潮，敲响了秦朝的丧钟。',background:'秦二世元年（前209年）七月，朝廷征发闾左的贫民九百人去渔阳（今北京密云）戍守边地。陈胜吴广被任命为屯长。队伍行至大泽乡时遇连日大雨道路不通，算算时间已无法按期到达。按秦律"失期法皆斩"——迟到就要全部处死。',process:'陈胜对吴广说"今亡亦死举大计亦死——等死死国可乎？"他们在帛上写"陈胜王"塞入鱼腹又在夜间学狐鸣"大楚兴陈胜王"制造天意。杀死押送的秦尉后陈胜振臂一呼"王侯将相宁有种乎"九百戍卒揭竿而起。起义军迅速攻占蕲、铚、酇、苦、柘、谯等县，所到之处百姓"斩木为兵揭竿为旗"争相投奔。陈胜自立为张楚王，派诸将分兵攻城略地。周文率军西攻关中一度打到戏水（距咸阳仅数十里）。',result:'秦二世派章邯率骊山刑徒组成军队反攻周文兵败自杀。陈胜称王后骄傲自满杀害故交丧失人心众叛亲离，称王仅六个月就被车夫庄贾杀害。但起义的星星之火已成燎原之势——项梁项羽在会稽、刘邦在沛县、田儋在齐地先后起兵，秦朝统治全面崩溃。',evaluation:'陈胜吴广的起义虽然短暂但它证明了一个颠覆性的道理——权力不是天生的而可以被挑战。"王侯将相宁有种乎"这八个字是古代中国最具革命性的口号之一，它打破了贵族血统论向底层民众开放了造反的合法性。中国历史上第一次大规模农民起义由此开始。',impact:'大泽乡起义是秦朝灭亡的导火索。虽然起义仅半年即败但它引爆了全国性的反秦浪潮最终推翻了秦朝。陈胜以戍卒之身被司马迁写入《史记·陈涉世家》跻身"世家"之列——一个只当了六个月王的人被史家列入与诸侯同列，这是对他历史作用的公正评价。'},
      {name:'秦朝灭亡',desc:'公元前207年，刘邦率军自武关道攻入关中，秦王子婴素车白马、颈系绶带出降于轵道旁。随后项羽率大军入咸阳杀子婴、焚秦宫，秦朝正式灭亡。这个统一仅十五年的短命王朝虽因暴政速亡，但其制度框架深刻影响了此后两千年。',background:'陈胜吴广起义虽被镇压但全国反秦已成燎原之势。项羽在巨鹿之战破釜沉舟大败秦军主力章邯率领二十万秦军投降。刘邦则趁秦军主力被牵制在河北之机从武关道向西挺进关中。',process:'刘邦采纳张良郦食其的建议一路避实击虚尽量避免硬仗，先取陈留、南阳等重镇打开了通往关中的门户。赵高杀秦二世立子婴为秦王（此时已取消帝号）。子婴即位仅五天便设计杀死赵高，但大势已去。前207年十月刘邦军至霸上兵临咸阳。秦王子婴素车白马颈系绶带在轵道旁跪迎刘邦奉上传国玉玺。秦朝正式灭亡距统一仅十五年。',result:'刘邦进入咸阳后约法三章"杀人者死伤人及盗抵罪"废除秦朝苛法深得关中民心。项羽随后率四十万大军入关杀子婴焚烧秦宫室大火三月不灭。秦朝的宫阙、典籍、珍宝化为灰烬。',evaluation:'秦朝以摧枯拉朽之势统一天下却以不堪一击的速度土崩瓦解，是人类历史上最令人震撼的"其兴也勃其亡也忽"案例。根本原因在于秦政有"破"的雷霆万钧之力却无"立"的春风化雨之功——统一之后没有及时从战争模式切换到治理模式，继续以严刑峻法和无休止的劳役压榨百姓。',impact:'秦朝虽短但"百代皆行秦政制"——郡县制、皇帝制、标准化体系被汉朝继承并完善，成为此后两千年中国政治制度的骨架。秦朝速亡的教训也让汉初统治者选择了"无为而治""与民休息"的宽和政策，开创了四百年的大汉天下。秦朝是镜鉴——它告诉后来者：可以马上得天下不能马上治天下。'}
    ],
    figures:[
      {name:'秦始皇',desc:'嬴政（前259—前210年），中国历史上第一位皇帝，号称"始皇帝"。13岁即位22岁亲政，用十年时间灭六国完成统一大业，建立中国历史上第一个大一统中央集权帝国。推行郡县制废分封，统一文字货币度量衡，修长城筑驰道，其制度框架深刻影响了此后两千年的中国政治格局。晚年求仙问药、焚书坑儒，病死沙丘后秦朝迅速崩溃。'},
      {name:'李斯',desc:'楚国上蔡人，法家代表人物，秦始皇的丞相。向秦王嬴政献"灭韩以恐他国"的统一战略，统一后主持文字货币度量衡的标准化。始皇死后与赵高合谋篡改遗诏，后被赵高诬以谋反腰斩于咸阳市中，临刑前对儿子叹"吾欲与若复牵黄犬出上蔡东门逐狡兔，岂可得乎"。'},
      {name:'蒙恬',desc:'秦国名将，出身将门世家。率三十万大军北逐匈奴收复河套地区，修筑万里长城威震北疆。秦始皇死后被赵高伪造遗诏与扶苏一同赐死，死前叹"恬罪固当死矣，起临洮属之辽东，城堑万余里，此其中不能无绝地脉哉"。'},
      {name:'赵高',desc:'秦国宦官，秦始皇宠臣。始皇死后与李斯合谋篡改遗诏逼死扶苏和蒙恬立胡亥为帝。后陷害李斯独揽大权，以"指鹿为马"测试朝臣。最终被子婴设计杀死，秦朝也随即灭亡。"指鹿为马"成为颠倒黑白的经典典故。'},
      {name:'陈胜',desc:'字涉，秦末农民起义领袖。公元前209年与吴广等九百戍卒在大泽乡揭竿而起，喊出"王侯将相宁有种乎"的千古名言。起义后自立为张楚王，虽仅半年即被秦将章邯击败杀害，但点燃了全国反秦的燎原之火。'},
      {name:'吴广',desc:'字叔，与陈胜共同发动大泽乡起义。采用"鱼腹丹书""篝火狐鸣"的策略树立威望，起义后任都尉率军西征，在荥阳被部将田臧杀害。大泽乡起义虽迅速失败，但敲响了秦朝灭亡的丧钟。'},
      {name:'项羽',desc:'名籍字羽（前232—前202年），楚国名将项燕之后。力能扛鼎勇冠三军，巨鹿之战破釜沉舟大败秦军主力，自称西楚霸王分封十八路诸侯。但在垓下之战中被刘邦击败，四面楚歌中霸王别姬自刎乌江，年仅三十一岁。'}
    ],
    inventions:['郡县制','统一文字（小篆）','统一货币（半两钱）','统一度量衡'],
    turningPoints:[{y:'前221年',e:'秦朝建立',d:'秦王嬴政灭掉六国中最后的齐国，完成统一大业，自号始皇帝',s:'结束五百余年分裂，建立中国第一个大一统中央集权帝国'},{y:'前207年',e:'秦朝灭亡',d:'刘邦率先攻入咸阳，秦王子婴素车白马出降',s:'暴政导致中国第一个统一王朝仅存15年便速亡'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/d6e7d003-3f95-4a27-92b4-1f7d1a8a5e4d.jpg'
  },
  { id:'han', name:'汉朝', period:'公元前202年 - 公元220年', start:-202, end:220, founder:'汉高祖刘邦',
    desc:'汉朝分为西汉和东汉两个时期，是中国历史上最强盛的王朝之一，与同时期的罗马帝国并列为世界两大帝国。汉武帝时期国力达到鼎盛，北击匈奴，开辟丝绸之路，独尊儒术。汉朝在政治、经济、文化、科技等方面都取得了辉煌成就，"汉族""汉字""汉语"等称谓皆由此而来。',
    events:[
      {name:'刘邦建立汉朝',desc:'公元前202年，刘邦在垓下之战中彻底击败项羽，于定陶汜水之阳称帝建立汉朝，定都长安。刘邦出身平民，"以布衣提三尺剑取天下"，开创了"布衣将相"之局，成为中国历史上第一个平民出身的开国皇帝。',background:'秦末群雄逐鹿中刘邦从沛县亭长起步，与项羽成为灭秦后争夺天下的两大势力。刘邦入关中约法三章深得民心，项羽进入咸阳后杀秦宗室焚秦宫室不得人心。楚汉相争四年，刘邦虽屡战屡败却总能卷土重来——萧何坐镇关中保证粮草兵员源源不断、韩信在北线势如破竹、张良运筹帷幄决胜千里。',process:'前202年刘邦与韩信彭越英布等诸军在垓下合围项羽。项羽被围粮尽，夜间四面楚歌——汉军中楚人齐唱楚地歌谣使楚军以为家乡已降军心崩溃。项羽率八百骑突围至乌江边，乌江亭长请其渡江项羽笑曰"无面目见江东父老"，将爱马赠亭长后步行持短兵与追兵搏杀力尽自刎。刘邦随即在定陶汜水之阳被诸侯推戴称帝建立汉朝。',result:'刘邦定都长安（今西安）国号汉。延续了秦朝的郡县制同时部分恢复了分封制——郡国并行制。汉初推行黄老"无为而治"与民休息的方针，社会经济从秦末战乱中逐步恢复。',evaluation:'刘邦是中国历史上少有的平民开国皇帝。"布衣将相"——萧何是县吏、韩信是流浪汉、樊哙是屠狗者、周勃是吹箫送葬者——这群社会底层的人创造了一个延续四百年的伟大王朝。这意味着政治权力不再是贵族世袭的专利，有才者不论出身皆可参与国家治理。',impact:'汉朝是中国历史上最强盛的王朝之一。"汉"从此成为中国主体民族的名称——汉族、汉字、汉语皆由此而来。刘邦开创的"无为而治"模式为文景之治开创了思想基础，四百年汉朝奠定了中华文明的核心形态。'},
      {name:'文景之治',desc:'汉文帝、汉景帝在位期间（前180—前141年），奉行黄老"无为而治"思想，轻徭薄赋、与民休息，田租从"十五税一"降至"三十税一"，废除肉刑等酷刑。社会经济迅速恢复，府库充盈、人民安居，为后来汉武帝大规模开拓奠定了物质基础。',background:'汉初天下残破——秦末战乱加楚汉相争使人口锐减，"自天子不能具钧驷而将相或乘牛车"连天子都凑不齐四匹同色马来驾车。吕后死后诸吕之乱被周勃陈平等平定，代王刘恒（汉文帝）被迎立为帝。',process:'文帝景帝奉行黄老道家"无为而治"——大幅度减税：田租从十五税一降至三十税一甚至有十三年索性不征税。减轻刑罚：文帝废除肉刑（割鼻断足等）以笞刑代替；废除连坐法。厉行节俭：文帝在位二十三年宫室苑囿车骑服饰无所增益，想修一个露台算算要花费百金说"百金中民十家之产"便放弃了。开放山林川泽允许百姓自由渔猎樵采。',result:'文景时期经济迅速恢复人口大幅增长。史载"京师之钱累巨万万贯朽而不可校太仓之粟陈陈相因充溢露积于外腐败不可食"——国库的钱多到穿钱的绳子都朽断了、粮仓的粮食多到堆不下在外面发霉。百姓"人人自爱而重犯法先行义而后绌耻辱"。',evaluation:'文景之治是中国古代最成功的经济复苏案例。从秦末天下残破到文景的府库充盈仅用了不到六十年。其成功的核心逻辑极为简单：政府管得少一点、拿走的少一点、不要折腾老百姓——让市场经济和社会活力自然恢复。这一道理在后世两千多年中多次被验证。',impact:'文景之治为汉武帝大规模开拓积累了天文数字的财富储备。没有文景打下的物质基础就没有霍去病封狼居胥、没有张骞凿空西域、没有丝绸之路。它也为后世树立了"轻徭薄赋与民休息"的治世标准。'},
      {name:'汉武帝独尊儒术',desc:'公元前134年，汉武帝采纳大儒董仲舒"罢黜百家，独尊儒术"的建议，在长安设立太学教授五经，儒学从此成为官方正统思想。这一决策深刻塑造了中国两千年的政治文化和价值体系。',background:'汉初以黄老道家为治国指导思想，与民休息。到武帝时国力强盛但思想界仍然百家并存——儒家、道家、法家、阴阳家各有市场。董仲舒在"天人三策"中对武帝说："今师异道人异论百家殊方指意不同——是以上无以持一统。"思想不统一不利于政治统一。',process:'前134年武帝下诏"罢黜百家独尊儒术"——非儒学的诸子百家学说不再被官方支持和传播。在长安设立太学设五经博士（《诗》《书》《礼》《易》《春秋》）招收博士弟子员五十人。此后各郡国也设学校普及儒学教育。但武帝推崇的儒学已非孔孟原版——董仲舒将阴阳五行"天人感应"融入儒学创立了一套为皇权服务的政治神学。',result:'儒学从百家之一跃升为官方正统思想。此后两千年儒家经典成为科举考试的核心内容，"学而优则仕"成为社会普遍价值观。但"独尊儒术"并不意味着其他学说完全消亡——法家的制度技术、道家的处世哲学仍在政治和生活中发挥着实际作用。',evaluation:'汉武帝"独尊儒术"的战略意义类似于罗马帝国确立基督教为国教——以统一的价值体系凝聚一个大帝国的精神认同。但代价也是明显的：思想和学术被纳入政治轨道后创新活力大不如前。后世儒家在官方化的过程中也不断被改造，离孔孟的原始精神越来越远。',impact:'儒家作为中国的主流思想延续了两千年，深刻塑造了中国人的价值观——仁义礼智信、孝道、忠恕、中庸、天人合一。董仲舒的"天人感应"理论还赋予了儒家批评皇权的精神武器——当天降灾异时臣子可以此来规劝君主反省。这一思想传统在某种程度上起到了制度化的纠错功能。'},
      {name:'张骞出使西域开辟丝绸之路',desc:'公元前138年，汉武帝派张骞出使西域联络大月氏共击匈奴。张骞被匈奴扣押十年仍持汉节不屈，最终到达中亚。虽然军事联盟未成，但他带回了大量西域地理人文信息，被司马迁誉为"凿空"之举，丝绸之路由此开辟，东西方文明交流进入新时代。',background:'汉初匈奴强盛屡犯边境，高祖刘邦在白登之围中差点被俘此后被迫以和亲政策维持和平。武帝即位后决心反击，得知大月氏被匈奴击败西迁后与大月氏有深仇，决定派使者联络大月氏夹击匈奴。',process:'前138年张骞率一百余人从长安出发，途中被匈奴骑兵俘获扣押十年。匈奴单于给他娶妻生子试图同化，但张骞始终手持汉节不曾放下。十年后趁匈奴内乱逃离继续西行，穿越戈壁沙漠翻越葱岭（帕米尔高原），到达大月氏、大宛、康居等国。大月氏已在新土地安居不愿意再与匈奴作战。张骞未能完成军事联盟使命但在中亚生活一年多详细记录了各国的地理风俗物产情况。归途中再次被匈奴俘虏一年后脱逃，前126年回到长安，去时一百余人仅两人生还。',result:'张骞带回的信息大大拓宽了汉朝人的世界视野——原来西方有那么多文明富庶的国家。前119年张骞第二次出使西域率三百余人携带大量丝绸金币访问乌孙等国，各国也纷纷派遣使者回访长安。横贯欧亚大陆的丝绸之路由此正式开通。',evaluation:'张骞的"凿空"是人类文明交流史上的里程碑。在没有任何地图和指南的情况下穿越地球上最严酷的地形之一，十年被俘仍不改初心——这种精神力量是真正的"汉朝精神"。丝绸之路不仅是商业通道更是文明对话的桥梁。',impact:'丝绸之路的开通使中国丝绸、瓷器、漆器等商品远销罗马，西域的葡萄、核桃、石榴、黄瓜、芝麻、苜蓿、良马等传入中国。佛教在两汉之际经丝绸之路传入中国。丝绸之路是古代世界最伟大的跨文明交流网络，其影响一直持续到今天——"一带一路"的命名正是对这段历史的致敬。'},
      {name:'司马迁完成《史记》',desc:'约公元前91年，太史公司马迁在遭受宫刑的极大屈辱后发愤著书，终于完成了中国第一部纪传体通史《史记》。全书一百三十篇五十二万余字，上起黄帝下至汉武帝，被鲁迅称赞为"史家之绝唱，无韵之离骚"。',background:'司马迁出身史官世家，父亲司马谈是汉武帝的太史令。司马谈临终嘱托司马迁"余死汝必为太史为太史无忘吾所欲论著矣"。司马迁继任太史令后遍览"石室金匮之书"——国家档案馆中的全部藏书——开始撰写《史记》。',process:'天汉二年（前99年）李陵率五千步兵深入匈奴被八万骑兵包围弹尽粮绝后投降。满朝大臣都骂李陵时司马迁站出来为李陵说话认为他有国士之风投降是出于无奈。汉武帝大怒将司马迁以"诬上"罪判处死刑。按当时法律死刑可以用钱赎免（约五十万钱）或接受宫刑替代。司马迁家贫无力赎罪，为完成《史记》他选择了忍受宫刑这一极大耻辱。出狱后他以"究天人之际通古今之变成一家之言"的信念继续撰写，约前91年终于完成这部五十二万余字的巨著。',result:'《史记》一百三十篇——十二本纪、十表、八书、三十世家、七十列传，记录了从黄帝到汉武帝约三千年的历史。全书既是一部通史也是一部百科全书——政治军事经济文化天文地理包罗万象。',evaluation:'司马迁的伟大不仅在于他写了中国第一部通史，更在于他确立了"实录"的史学精神——不虚美不隐恶。他为失败的项羽立"本纪"、为平民陈胜立"世家"、为刺客游侠立"列传"——不以成败论英雄不以贵贱定价值。这种史德在古今中外都是罕见的。',impact:'《史记》是中国史学的不朽丰碑——此后两千年的二十四史全部沿用了《史记》创立的纪传体体例。它不仅影响了中国史学也深刻影响了中国文学——"霸王别姬""荆轲刺秦""鸿门宴"等名篇皆出自《史记》，至今仍是中国人最熟悉的历史故事。'},
      {name:'王莽篡汉建立新朝',desc:'公元8年，外戚王莽以"禅让"为名废汉自立，改国号为"新"。王莽推行了一系列激进的托古改制——废奴隶制、实行"王田制"、改革币制，但这些脱离实际的措施引发天下大乱，新朝仅存15年便在绿林赤眉起义中覆亡。',background:'西汉后期外戚干政成为顽疾。王莽的姑母王政君是汉元帝皇后历经四朝当了太皇太后。王莽以外戚身份逐渐积累政治声望——他以谦恭节俭著称曾让出封地赈济灾民被时人誉为"圣人"。汉平帝死后王莽立两岁的孺子婴为帝自封"摄皇帝"实际掌控全部朝政。',process:'公元8年王莽在"祥瑞""符命"的舆论造势下废汉自立改国号为"新"。他以《周礼》为蓝本推行一系列激进改革：废土地私有制实行"王田制"（土地国有不准买卖）；废奴隶制禁止买卖奴婢；推行"五均六筦"由政府管控市场和物价；频繁改革币制共改了四次导致货币混乱。这些政策过于激进脱离现实遭到贵族地主和普通百姓的普遍反对。',result:'改革引发全国性大乱——豪强地主反抗王田制、百姓被频繁的币制改革搞得破产、天灾人祸接踵而至。绿林军、赤眉军等农民起义席卷全国。公元23年绿林军攻入长安王莽在渐台被杀新朝灭亡仅存在15年。',evaluation:'王莽是中国历史上最矛盾的人物之一——他的改革理想主义色彩浓厚甚至被胡适称为"中国最早的社会主义者"。但从改革实践看王莽的问题在于只读《周礼》而不读现实——用一千年前的古制来治理一千年后的社会注定失败。理想主义需要建立在现实的坚实基础上否则不过是空中楼阁。',impact:'王莽新政的失败从反面证明了改革的铁律——制度设计必须与现实条件相匹配不能脱离实际照搬经典。新朝的短暂存在也让后世认识到"禅让"可以成为篡位的遮羞布。东汉建立后光武帝吸取教训进一步加强中央集权防止外戚干政重演。'},
      {name:'光武中兴',desc:'公元25年，汉宗室刘秀在鄗城称帝重建汉朝（东汉），定都洛阳。刘秀平定各地割据势力，采取"以柔道治天下"的方针，释放奴婢、精兵简政、休养生息，开创了"光武中兴"的治世局面。',background:'新朝灭亡后天下重新陷入军阀混战——刘玄的更始政权、刘盆子的赤眉政权、隗嚣割据陇右、公孙述割据巴蜀、各地豪强纷纷自立。刘秀出身汉宗室远支本是南阳一个普通地主家中排行老三，在天下大乱中随兄刘演起兵后独立发展。',process:'公元23年昆阳之战——刘秀以不足万人破王莽四十二万大军（中国历史上最经典的以少胜多战例之一）。兄长被杀后刘秀忍辱负重接受更始帝的任命去经略河北。在河北他争取豪强支持娶真定王刘扬的外甥女郭圣通（政治联姻）。公元25年在鄗城称帝国号仍为汉（东汉），随后以十余年时间逐一消灭刘永张步隗嚣公孙述等割据势力重新统一全国。',result:'刘秀定都洛阳史称东汉。他采取"以柔道治天下"方针：多次下诏释放奴婢禁止虐杀奴婢；裁并四百余县减少官员编制；减轻赋税恢复生产。社会秩序在战乱后迅速恢复。',evaluation:'光武帝是中国历史上最能忍辱负重的开国皇帝——兄长被杀后不流泪白天谈笑自若夜里以泪洗面；娶郭圣通是政治联姻而非本心但为了争取河北豪强只能接受。他以柔克刚的治国哲学具有高度的政治智慧——经历了王莽的激进改革和全国大乱后最需要的不是大刀阔斧的变革而是休养生息的安定。',impact:'光武中兴拉开了东汉近两百年的帷幕。刘秀开创的"以柔道治天下"模式为后世提供了平定大乱后恢复社会秩序的成功范例。民族融合在这一时期也取得进展——南匈奴归汉、西域重新与中原联系。'},
      {name:'蔡伦改进造纸术',desc:'公元105年，宦官蔡伦总结民间造纸经验，用树皮、麻头、破布、旧渔网等为原料造出轻便廉价的纸张，献给汉和帝。造纸术后来经阿拉伯传入欧洲，是中国古代四大发明中对世界文明影响最为深远的一项。',background:'纸出现以前中国人使用龟甲兽骨（商代）、青铜器（西周）、竹简木牍和丝帛（春秋战国至汉初）作为书写材料。竹简笨重——秦始皇每天批阅的奏章要以"石"为单位计量；丝帛昂贵只有贵族用得起。随着文化教育的普及社会急需一种轻便廉价的书写材料。',process:'蔡伦总结前人的造纸经验（西汉已有麻纸的雏形），将树皮麻头破布旧渔网等原料切碎浸泡后捣成纸浆，用竹帘从浆料中捞出一层薄浆膜晾干后揭下即为纸张。树皮中的纤维长造出的纸最为坚韧光滑。公元105年蔡伦将造出的纸献给汉和帝，和帝大加赞赏下令全国推广。',result:'纸张迅速取代竹简和丝帛成为最主要的书写材料。在蔡伦之后的数百年间造纸技术不断改进传播到朝鲜、日本、越南，后来经中亚阿拉伯传入欧洲——阿拉伯人在751年怛罗斯战役中俘获中国造纸工匠学会了造纸术。',evaluation:'造纸术的意义远超出技术发明本身——它为知识的大规模生产和传播提供了物质基础。纸张的廉价和便携使得更多的人可以读书写字，直接推动了教育的普及和文化的繁荣。没有纸张就没有后来的雕版印刷、活字印刷，也就没有文艺复兴和现代知识社会。',impact:'造纸术是中国古代四大发明中对世界文明影响最深远的一项。它从根本上改变了人类知识的保存和传播方式，被公认为人类文明史上的里程碑。今天的信息革命——从纸张到数字媒介——仍然在延续蔡伦开启的"信息载体革命"的逻辑。'},
      {name:'黄巾起义',desc:'公元184年，张角以太平道教义聚众数十万发动起义，因头裹黄巾为标志故称"黄巾军"。起义虽一年内即被镇压，但沉重打击了东汉统治，此后州郡拥兵自重，开启了军阀混战局面，东汉名存实亡。',background:'东汉后期外戚与宦官交替专权政治腐败到极点，卖官鬻爵公开标价。加上连年灾荒瘟疫流行民不聊生。巨鹿人张角利用《太平经》创立太平道以符咒符水治病为手段传教十余年发展信徒数十万遍布青徐幽冀荆扬兖豫八州。他提出"苍天已死黄天当立岁在甲子天下大吉"的口号。',process:'张角将信徒分为三十六方大方万余人小方六七千人，约定甲子年（184年）三月五日在洛阳和各州同时起义。但起义前夕叛徒唐周向朝廷告密，洛阳城内的大方首领马元义被捕车裂。张角被迫提前起义——头裹黄巾为标志号称黄巾军。起义席卷半个中国。东汉朝廷解除党锢之禁赦免被禁锢的党人，派皇甫嵩朱儁卢植等率军镇压。孙坚曹操刘备等人都在这一时期崭露头角。',result:'起义在不到一年内被镇压——张角病故黄巾军主力被各个击破。但各地余部仍此起彼伏持续十余年。朝廷为镇压起义被迫将军事财政权力大量下放给地方州郡，刺史改州牧拥有军政全权——"州郡拥兵"成为常态。',evaluation:'黄巾起义是东汉由衰转亡的转折点。起义虽然失败但起义暴露了东汉统治的空虚——为了镇压起义朝廷向地方让渡了太多权力，从此州牧成为事实上的半独立军阀。当中央无法控制地方时，天下大乱就只是时间问题了。',impact:'黄巾起义开启了东汉末年的军阀混战时代。州牧拥兵自重的局面为后来的群雄逐鹿三国鼎立埋下了伏笔。曹操、刘备、孙坚等三国的主要奠基人都是在镇压黄巾起义中起家的。一个农民起义没有推翻王朝却间接催生了三国时代——历史总是充满这种意想不到的连锁反应。'}
    ],
    figures:[
      {name:'刘邦',desc:'字季（前256—前195年），汉朝开国皇帝。出身沛县亭长，以布衣之身提三尺剑取天下。垓下之战击败项羽后称帝，定都长安。在位期间采取"与民休息"方针，减轻赋税、释放奴婢，为汉朝四百年基业奠定了基础。临终前与群臣白马盟誓"非刘氏而王者，天下共击之"。'},
      {name:'汉武帝',desc:'刘彻（前156—前87年），在位五十四年。北击匈奴、南平百越、东定朝鲜、西通西域，开辟丝绸之路；"罢黜百家独尊儒术"确立儒学正统；创年号制度。是中国历史上最有作为的帝王之一，但晚年穷兵黩武导致"海内虚耗、户口减半"。'},
      {name:'张骞',desc:'汉中成固人（？—前114年），西汉著名外交家探险家。奉汉武帝之命两次出使西域，被匈奴扣押十年仍持汉节不屈，最终到达大月氏、大宛、康居等国，被司马迁誉为"凿空"之举。丝绸之路由此开辟，东西方文明交流进入全新阶段。'},
      {name:'司马迁',desc:'字子长（前145—约前86年），西汉史学家文学家。继父司马谈之志任太史令，因替李陵降匈奴之事辩护触怒汉武帝遭受宫刑。在极大屈辱中发愤著书完成《史记》——中国第一部纪传体通史，五十二万余字记载了从黄帝到汉武帝近三千年的历史。'},
      {name:'董仲舒',desc:'广川人（前179—前104年），西汉大儒。向汉武帝上"天人三策"提出"罢黜百家独尊儒术"，被武帝采纳。将阴阳五行学说融入儒学，创立"天人感应""三纲五常"理论体系，使儒学从诸子之一跃升为官方正统思想。'},
      {name:'卫青',desc:'字仲卿，西汉名将，汉武帝皇后卫子夫之弟。出身骑奴被汉武帝提拔，七次率军出击匈奴，收复河套地区，官至大司马大将军。为人谦恭低调体恤士卒，是中国历史上从奴隶到位极人臣的传奇典范。'},
      {name:'霍去病',desc:'卫青外甥（前140—前117年），西汉天才将领。十八岁随卫青出征率八百骑兵深入匈奴腹地数百里，封冠军侯。二十二岁率五万骑兵出代郡北击匈奴二千余里，"封狼居胥"成为中国武将的最高荣耀。年仅二十四岁病逝，汉武帝悲痛不已。'},
      {name:'王莽',desc:'字巨君（前45—23年），西汉末年外戚。以"禅让"为名废汉自立建立新朝，推行激进的托古改制均告失败，在位仅十五年便在绿林赤眉起义中灭亡。后世史家多将其视为篡位者，但也有学者认为他是中国历史上最早的"社会主义"改革家。'},
      {name:'光武帝',desc:'刘秀（前5—57年），东汉开国皇帝。出身汉宗室远支，趁王莽末年天下大乱起兵，以少胜多经昆阳之战奠定胜局，公元25年在鄗城称帝。采取"以柔道治天下"方针休养生息，开创"光武中兴"的治世局面。'},
      {name:'班超',desc:'字仲升（32—102年），东汉名将外交家。投笔从戎出使西域，以"不入虎穴焉得虎子"的胆略降伏鄯善、于阗、疏勒等国，在西域经营三十一年使五十余国归附汉朝，被封为定远侯。'},
      {name:'蔡伦',desc:'字敬仲（约61—121年），东汉宦官发明家。总结民间造纸经验，用树皮麻头破布旧渔网为原料造出轻便廉价的纸张，公元105年献给汉和帝。造纸术后经阿拉伯传入欧洲，深刻影响了人类文明进程。'}
    ],
    inventions:['造纸术','地动仪','浑天仪','《史记》','丝绸之路','《汉书》'],
    turningPoints:[{y:'前202年',e:'汉朝建立',d:'刘邦在垓下之战中击败项羽，于定陶称帝建立汉朝',s:'开创汉族文化，奠定中华文明基础，汉成为民族代称'},{y:'前134年',e:'独尊儒术',d:'汉武帝采纳董仲舒建议，"罢黜百家，独尊儒术"',s:'儒家思想成为此后两千年中国社会的正统思想'},{y:'公元105年',e:'蔡伦改进造纸术',d:'宦官蔡伦用树皮、麻头、破布等原料造出轻便廉价的纸张',s:'造纸术成为中国古代四大发明之一，深刻影响世界文明进程'}],
    color:'#A0826D', bg:'https://miaoda-site-img.cdn.bcebos.com/images/5969a7e2-0c4f-4c3e-b8e9-6e0e6e3e6a7f.jpg'
