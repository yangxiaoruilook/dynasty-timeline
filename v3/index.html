<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国全历史</title>
<style>
  :root {
    --bg: #1a1812;
    --card: #242118;
    --card-hover: #2a2720;
    --text: #e8dfcf;
    --text-secondary: #a09880;
    --text-muted: #6b6258;
    --border: #3a3428;
    --primary: 45 90% 55%;
    --accent: 35 80% 50%;
    --radius: 16px;
    --shadow-card: 0 20px 60px -20px rgba(0,0,0,.6);
    --shadow-glow: 0 0 40px hsl(45 90% 55% / .3);
    --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(hsl(45 90% 55% / .03) 1px, transparent 1px),
      linear-gradient(90deg, hsl(45 90% 55% / .03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ── Hero ── */
  .hero {
    position:relative; z-index:1;
    text-align:center; padding:56px 24px 32px;
  }
  .hero h1 {
    font-size:clamp(32px,7vw,56px); font-weight:900; letter-spacing:.06em;
    background:linear-gradient(135deg, hsl(45 90% 55%), hsl(45 100% 70%), hsl(35 80% 50%));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    filter:drop-shadow(0 0 40px hsl(45 90% 55% / .35));
    margin-bottom:8px;
  }
  .hero p { color:var(--text-secondary); font-size:16px; letter-spacing:.04em; }

  /* ── Era Tabs ── */
  .era-tabs-wrap {
    position:sticky; top:0; z-index:100;
    background:hsl(30 15% 10% / .88);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    padding:12px 20px;
  }
  .era-tabs {
    display:flex; gap:4px; overflow-x:auto; justify-content:center;
    -webkit-overflow-scrolling:touch; scroll-behavior:smooth;
  }
  .era-tabs::-webkit-scrollbar { height:2px; }
  .era-tabs::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

  .era-tab {
    flex-shrink:0; padding:8px 18px; border-radius:24px;
    border:1px solid transparent; font-size:13px; font-weight:600;
    cursor:pointer; color:var(--text-muted);
    transition:all .3s ease; user-select:none; white-space:nowrap;
  }
  .era-tab:hover { color:var(--text); background:var(--card); }
  .era-tab.active {
    color:var(--bg); background:hsl(var(--primary));
    box-shadow:0 0 24px hsl(var(--primary) / .35);
    border-color:hsl(var(--primary));
  }

  /* ── Main Content ── */
  .container {
    position:relative; z-index:1;
    max-width:1280px; margin:0 auto; padding:32px 24px 80px;
  }

  /* Two-column grid */
  .main-grid {
    display:grid; grid-template-columns:1fr;
    gap:24px;
  }
  @media (min-width:1024px) {
    .main-grid { grid-template-columns:1fr 1fr; }
  }

  /* ── Cards ── */
  .card {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:28px 32px;
    box-shadow:var(--shadow-card);
    animation:fadeInUp .5s ease-out;
  }
  .card h2 {
    font-size:26px; font-weight:900; margin-bottom:6px;
    background:linear-gradient(135deg, hsl(var(--primary)), hsl(35 80% 55%));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .card .period-label {
    display:inline-block; font-size:13px; color:hsl(var(--primary));
    background:hsl(var(--primary) / .1); padding:4px 14px;
    border-radius:20px; margin-bottom:16px; font-weight:600;
  }
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }
  @keyframes slideInRight {
    from { opacity:0; transform:translateX(30px); }
    to { opacity:1; transform:translateX(0); }
  }

  /* ── Section titles ── */
  .section-title {
    font-size:18px; font-weight:700; margin-bottom:16px;
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--text), hsl(var(--primary)));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .section-title::before {
    content:''; display:inline-block;
    width:4px; height:18px; border-radius:2px;
    background:hsl(var(--primary));
    flex-shrink:0;
  }

  /* ── Event list ── */
  .event-list { display:flex; flex-direction:column; gap:6px; }
  .event-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; border-radius:8px;
    border:1px solid transparent;
    font-size:14px; cursor:pointer;
    transition:all .25s ease;
  }
  .event-item:hover {
    background:var(--card-hover);
    border-color:var(--border);
    transform:translateX(6px);
    box-shadow:0 4px 16px rgba(0,0,0,.3);
  }
  .event-dot {
    flex-shrink:0; width:8px; height:8px; border-radius:50%;
    background:hsl(var(--primary));
    box-shadow:0 0 8px hsl(var(--primary) / .5);
  }

  /* ── Figure tags ── */
  .tag-list { display:flex; flex-wrap:wrap; gap:8px; }
  .tag {
    display:inline-block; padding:6px 14px; border-radius:20px;
    font-size:13px; font-weight:500; cursor:default;
    background:hsl(var(--primary) / .08);
    color:hsl(var(--primary)); border:1px solid hsl(var(--primary) / .2);
    transition:all .25s ease;
  }
  .tag:hover {
    background:hsl(var(--primary) / .15);
    border-color:hsl(var(--primary) / .4);
    box-shadow:0 0 12px hsl(var(--primary) / .15);
  }

  /* ── Invention cards ── */
  .invention-grid {
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
  }
  @media (min-width:640px) {
    .invention-grid { grid-template-columns:repeat(4,1fr); }
  }
  .invention-item {
    background:var(--card-hover); border:1px solid var(--border);
    border-radius:12px; padding:14px; text-align:center;
    font-size:13px; font-weight:500;
    transition:all .3s ease;
  }
  .invention-item:hover {
    border-color:hsl(var(--primary) / .3);
    box-shadow:0 0 20px hsl(var(--primary) / .1);
    transform:translateY(-2px);
  }

  /* ── Turning points ── */
  .tp-card {
    background:var(--card-hover); border:1px solid var(--border);
    border-radius:12px; padding:16px;
    transition:all .3s ease; margin-bottom:8px;
    border-left:3px solid hsl(var(--primary) / .4);
  }
  .tp-card:hover {
    border-color:hsl(var(--primary) / .3);
    box-shadow:0 0 20px hsl(var(--primary) / .1);
  }
  .tp-year {
    font-size:12px; font-weight:700; color:hsl(var(--primary));
    margin-bottom:4px;
  }
  .tp-event { font-size:15px; font-weight:700; margin-bottom:4px; }
  .tp-desc { font-size:13px; color:var(--text-secondary); margin-bottom:4px; }
  .tp-sig { font-size:12px; color:var(--text-muted); font-style:italic; }

  /* ── Description text ── */
  .era-desc {
    font-size:15px; line-height:1.9; color:var(--text-secondary);
    margin-bottom:24px;
  }

  /* ── Detail overlay ── */
  .detail-overlay {
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    animation:fadeIn .2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity:0; }
    to { opacity:1; }
  }
  .detail-panel {
    background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px;
    max-width:640px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.8), 0 0 0 1px hsl(var(--primary) / .1);
    animation:slideUp .3s ease-out;
  }
  @keyframes slideUp {
    from { opacity:0; transform:translateY(40px); }
    to { opacity:1; transform:translateY(0); }
  }
  .detail-panel h3 {
    font-size:22px; margin-bottom:12px;
    background:linear-gradient(135deg, var(--text), hsl(var(--primary)));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .detail-panel .close-btn {
    position:absolute; top:16px; right:16px;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--border); background:var(--card);
    color:var(--text-secondary); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all .2s ease;
  }
  .detail-panel .close-btn:hover {
    border-color:hsl(var(--primary)); color:hsl(var(--primary));
  }

  /* ── Footer ── */
  footer {
    position:relative; z-index:1;
    text-align:center; padding:24px; color:var(--text-muted);
    font-size:12px; border-top:1px solid var(--border);
  }

  /* ── Responsive ── */
  @media (max-width:768px) {
    .card { padding:20px 18px; }
    .card h2 { font-size:22px; }
    .era-tabs { justify-content:flex-start; }
    .invention-grid { grid-template-columns:repeat(2,1fr); }
    .detail-panel { padding:24px 18px; max-width:95vw; }
  }
</style>
</head>
<body>

let activeEraIdx = 6; // 秦朝 default

// ── Render era tabs ──
function renderEraTabs() {
  document.getElementById('eraTabs').innerHTML = eras.map((e,i) => {
    const cls = i === activeEraIdx ? 'era-tab active' : 'era-tab';
    return `<span class="${cls}" data-idx="${i}">${e.name}</span>`;
  }).join('');
  // scroll active into view
  setTimeout(() => {
    const t = document.querySelector('#eraTabs .era-tab.active');
    if (t) t.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 100);
}

// ── Render main content ──
function renderContent() {
  const era = eras[activeEraIdx];
  if (!era) return;

  document.getElementById('mainContent').innerHTML = `
    <!-- Left Column: Overview + Events -->
    <div style="display:flex;flex-direction:column;gap:24px;">
      <div class="card" style="animation:fadeInUp .5s ease-out;">
        <span class="period-label">${era.period}</span>
        <h2>${era.name}</h2>
        <p class="era-desc" style="margin-top:16px;">${era.desc}</p>

        <div class="section-title">重大事件</div>
        <div class="event-list">
          ${era.events.map((ev,i) => `
            <div class="event-item" data-event-idx="${i}">
              <span class="event-dot"></span>
              <span>${ev}</span>
            </div>
          `).join('')}
        </div>
      </div>
    </div>

    <!-- Right Column: Figures + Inventions + Turning Points -->
    <div style="display:flex;flex-direction:column;gap:24px;animation:slideInRight .5s ease-out;">
      <!-- Famous Figures -->
      <div class="card">
        <div class="section-title">著名人物</div>
        <div class="tag-list">
          ${era.figures.map(f => `<span class="tag">${f}</span>`).join('')}
        </div>
      </div>

      <!-- Inventions & Achievements -->
      <div class="card">
        <div class="section-title">重要成就</div>
        <div class="invention-grid">
          ${era.inventions.map(inv => `
            <div class="invention-item">${inv}</div>
          `).join('')}
        </div>
      </div>

      <!-- Turning Points -->
      <div class="card">
        <div class="section-title">关键转折</div>
        ${era.turningPoints.map(tp => `
          <div class="tp-card">
            <div class="tp-year">${tp.y}</div>
            <div class="tp-event">${tp.e}</div>
            <div class="tp-desc">${tp.d}</div>
            <div class="tp-sig">${tp.s}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ── Tab click ──
document.getElementById('eraTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.era-tab');
  if (!tab) return;
  activeEraIdx = parseInt(tab.dataset.idx);
  renderEraTabs();
  renderContent();
  window.scrollTo({ top:0, behavior:'smooth' });
});

// ── Init ──
renderEraTabs();
renderContent();
</script>
