<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国历史朝代</title>
<style>
  :root {
    --bg: #1a1812;
    --card-bg: #242118;
    --card-bg-hover: #2a2720;
    --text: #e8dfcf;
    --text-secondary: #a09880;
    --text-muted: #6b6258;
    --border: #3a3428;
    --border-light: #4a4438;
    --radius: 16px;
    --primary: 45 90% 55%;
    --accent: 35 80% 50%;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* pattern grid background */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(hsl(45 90% 55% / .03) 1px, transparent 1px),
      linear-gradient(90deg, hsl(45 90% 55% / .03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* ── Hero ── */
  .hero {
    position: relative; z-index: 1;
    text-align: center; padding: 56px 24px 24px;
  }
  .hero h1 {
    font-size: clamp(28px, 6vw, 48px); font-weight: 900; letter-spacing: 0.06em;
    background: linear-gradient(135deg, hsl(45 90% 55%), hsl(45 100% 70%), hsl(35 80% 50%));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 30px hsl(45 90% 55% / .4));
  }
  .hero p {
    color: var(--text-secondary); font-size: 14px; margin-top: 8px;
    letter-spacing: 0.04em;
  }

  /* ── Period tabs ── */
  .period-tabs {
    position: relative; z-index: 1;
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 0 20px 20px;
  }
  .period-tab {
    padding: 7px 20px; border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text-secondary);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.3s ease; white-space: nowrap; user-select: none;
  }
  .period-tab:hover {
    border-color: hsl(var(--primary) / .5);
    color: hsl(var(--primary));
    box-shadow: 0 0 20px hsl(var(--primary) / .15);
  }
  .period-tab.active {
    background: hsl(var(--primary)); color: hsl(30 15% 10%);
    border-color: hsl(var(--primary));
    box-shadow: 0 0 24px hsl(var(--primary) / .35);
  }

  /* ── Dynasty tabs ── */
  .tab-bar-wrap {
    position: sticky; top: 0; z-index: 100;
    background: hsl(30 15% 10% / .85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }
  .tab-bar {
    display: flex; gap: 4px; overflow-x: auto; padding: 10px 0 12px;
    -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  .tab-bar::-webkit-scrollbar { height:3px; }
  .tab-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

  .tab {
    flex-shrink: 0; padding: 9px 22px; border-radius: 10px;
    border: 1px solid transparent;
    font-size: 14px; font-weight: 600; cursor: pointer;
    color: var(--text-muted); transition: all 0.3s ease; user-select: none;
  }
  .tab:hover { color: var(--text); background: var(--card-bg); }
  .tab.active {
    color: #fff; border-color: transparent;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }

  /* ── Content ── */
  .content-wrap {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto; padding: 28px 20px 80px;
  }
  .dynasty-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.6), 0 0 0 1px hsl(var(--primary) / .08);
    animation: fadeInUp .5s ease-out;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dynasty-card h2 {
    font-size: 34px; font-weight: 900; margin-bottom: 6px;
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(35 80% 55%));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    display: inline-block;
  }
  .dynasty-card .meta {
    font-size: 14px; color: var(--text-muted); margin-bottom: 28px;
    display: flex; flex-wrap: wrap; gap: 12px 24px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .dynasty-card .meta b { color: var(--text-secondary); font-weight: 600; }

  /* ── Event list ── */
  .event-list { display: flex; flex-direction: column; gap: 6px; }
  .event-item {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-radius: 10px;
    background: transparent;
    border: 1px solid transparent;
    font-size: 14px; cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
  }
  .event-item:hover {
    background: var(--card-bg-hover);
    border-color: var(--border-light);
    transform: translateX(6px);
    box-shadow: 0 4px 20px rgba(0,0,0,.3), 0 0 0 1px hsl(var(--primary) / .1);
  }
  .event-year {
    flex-shrink: 0; font-size: 12px; font-weight: 700;
    color: #fff; padding: 3px 12px; border-radius: 6px;
    min-width: 62px; text-align: center; letter-spacing: 0.03em;
  }
  .event-text { color: var(--text); line-height: 1.5; }

  /* ── Detail view ── */
  .detail-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px 36px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.6);
    animation: fadeInUp .4s ease-out;
  }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 20px; border-radius: 24px;
    border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary);
    font-size: 13px; cursor: pointer;
    margin-bottom: 24px; transition: all 0.3s ease;
    font-family: inherit;
  }
  .back-btn:hover {
    border-color: hsl(var(--primary) / .5);
    color: hsl(var(--primary));
    box-shadow: 0 0 20px hsl(var(--primary) / .1);
  }
  .detail-card h2 {
    font-size: 28px; margin-bottom: 16px; line-height: 1.4;
    background: linear-gradient(135deg, var(--text), hsl(var(--primary)));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .detail-year {
    display: inline-block; font-size: 13px; font-weight: 700;
    color: #fff; padding: 5px 16px; border-radius: 8px;
    margin-bottom: 20px; letter-spacing: 0.04em;
  }
  .detail-figures {
    font-size: 13px; color: var(--text-muted);
    margin-bottom: 20px; padding: 12px 16px;
    background: hsl(30 20% 16%);
    border-radius: 8px; border-left: 3px solid hsl(var(--primary) / .5);
  }
  .detail-desc {
    font-size: 15px; line-height: 2.1; color: var(--text-secondary);
  }

  /* ── Footer ── */
  footer {
    position: relative; z-index: 1;
    text-align: center; padding: 24px; color: var(--text-muted);
    font-size: 12px; border-top: 1px solid var(--border);
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .dynasty-card { padding: 24px 18px; }
    .dynasty-card h2 { font-size: 26px; }
    .tab { font-size: 13px; padding: 8px 16px; }
    .event-item { font-size: 13px; padding: 10px 14px; }
    .detail-card { padding: 24px 18px; }
    .detail-card h2 { font-size: 22px; }
    .detail-desc { font-size: 14px; }
    .hero { padding: 40px 20px 16px; }
  }
</style>
</head>

function fmtYear(y) { return y < 0 ? '前'+Math.abs(y) : '公元'+y; }
function dur(s,e) { const d=e-s; return (d>=100?'约':'')+d+'年'; }

// ── State ──
let activePeriod = 'preqin';
let activeDynasty = '夏';

// ── Render Period Tabs ──
function renderPeriodTabs() {
  document.getElementById('periodTabs').innerHTML = periods.map(p => {
    const cls = p.id === activePeriod ? 'period-tab active' : 'period-tab';
    return `<span class="${cls}" data-period="${p.id}">${p.name}</span>`;
  }).join('');
}

// ── Render Dynasty Tabs ──
function renderDynastyTabs() {
  const ds = dynasties.filter(d => d.period === activePeriod);
  if (!ds.find(d => d.name === activeDynasty)) {
    activeDynasty = ds[0].name;
  }
  const bar = document.getElementById('tabBar');
  bar.innerHTML = ds.map(d => {
    const cls = d.name === activeDynasty ? 'tab active' : 'tab';
    const c = palette[d.period];
    const style = d.name === activeDynasty ? `background:${c};` : `border-color:${c};color:${c};`;
    return `<span class="${cls}" data-dynasty="${d.name}" style="${style}">${d.name}</span>`;
  }).join('');

  const activeTab = bar.querySelector('.tab.active');
  if (activeTab) {
    activeTab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }
}

// ── Render Content ──
function renderContent() {
  const d = dynasties.find(dd => dd.name === activeDynasty);
  if (!d) return;
  const c = palette[d.period];
  const events = dynastyEvents[d.name] || [];

  document.getElementById('contentWrap').innerHTML = `
    <div class="dynasty-card">
      <h2>${d.name}</h2>
      <div class="meta">
        <span><b>时间：</b>${fmtYear(d.start)} — ${fmtYear(d.end)} · ${dur(d.start,d.end)}</span>
        <span><b>建立者：</b>${d.founder}</span>
        <span><b>都城：</b>${d.capital}</span>
      </div>
      <div class="event-list">
        ${events.map((e,i) => `
          <div class="event-item" data-idx="${i}">
            <span class="event-year" style="background:${c}">${fmtYear(e.y)}</span>
            <span class="event-text">${e.t}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function showDetail(dynastyName, idx) {
  const d = dynasties.find(dd => dd.name === dynastyName);
  if (!d) return;
  const c = palette[d.period];
  const events = dynastyEvents[d.name] || [];
  const e = events[idx];
  if (!e) return;

  document.getElementById('contentWrap').innerHTML = `
    <div class="detail-card">
      <button class="back-btn" onclick="renderContent()">&#8592; 返回${d.name}</button>
      <h2>${e.t}</h2>
      <div class="detail-year" style="background:${c}">${fmtYear(e.y)}</div>
      ${e.p ? `<div class="detail-figures"><b>相关人物：</b>${e.p}</div>` : ''}
      <div class="detail-desc">${e.desc || '暂无详细描述。该事件发生于'+fmtYear(e.y)+'，是'+d.name+'时期的重要历史事件。'}</div>
    </div>
  `;
  window.scrollTo({ top:0, behavior:'smooth' });
}

document.getElementById('contentWrap').addEventListener('click', function(e) {
  const item = e.target.closest('.event-item');
  if (!item) return;
  const idx = parseInt(item.dataset.idx);
  if (isNaN(idx)) return;
  showDetail(activeDynasty, idx);
});

document.getElementById('periodTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.period-tab');
  if (!tab) return;
  activePeriod = tab.dataset.period;
  renderPeriodTabs();
  renderDynastyTabs();
  renderContent();
});

document.getElementById('tabBar').addEventListener('click', function(e) {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeDynasty = tab.dataset.dynasty;
  renderDynastyTabs();
  renderContent();
  window.scrollTo({ top:0, behavior:'smooth' });
});

// ── Init ──
renderPeriodTabs();
renderDynastyTabs();
renderContent();
</script>
