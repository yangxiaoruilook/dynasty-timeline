<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国全历史网</title>
<style>
:root {
  --background: 30 15% 12%;
  --foreground: 40 25% 92%;
  --card: 30 18% 16%;
  --card-foreground: 40 25% 92%;
  --primary: 45 90% 55%;
  --primary-foreground: 30 15% 12%;
  --primary-glow: 45 100% 65%;
  --secondary: 30 35% 35%;
  --secondary-foreground: 40 25% 92%;
  --muted: 30 20% 22%;
  --muted-foreground: 40 20% 70%;
  --accent: 35 80% 50%;
  --accent-foreground: 30 15% 12%;
  --border: 30 25% 25%;
  --ring: 45 90% 55%;
  --radius: 0.75rem;

  --period-ancient: 35 60% 45%;
  --period-classical: 30 70% 40%;
  --period-medieval: 40 65% 50%;
  --period-imperial: 25 55% 35%;
  --period-modern: 35 75% 45%;

  --shadow-elegant: 0 20px 60px -20px hsl(var(--background) / 0.9);
  --shadow-glow: 0 0 40px hsl(var(--primary) / 0.3);
  --shadow-card: 0 10px 30px -10px hsl(var(--background) / 0.8);

  --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-history: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",ui-sans-serif,system-ui,-apple-system,sans-serif;
  background: hsl(var(--background)); color: hsl(var(--foreground)); line-height: 1.6;
  min-height: 100vh;
}

/* ── Background ── */
.bg-grid {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(hsl(var(--primary) / 0.05) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--primary) / 0.05) 1px, transparent 1px);
  background-size: 50px 50px;
}
.bg-gradient-overlay {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, hsl(var(--primary) / 0.06) 0%, transparent 60%),
              linear-gradient(180deg, hsl(var(--primary) / 0.03) 0%, transparent 40%);
}

/* ── Animations ── */
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}
@keyframes slideInRight {
  from { opacity:0; transform:translateX(30px); }
  to { opacity:1; transform:translateX(0); }
}
@keyframes pulseGlow {
  0%,100% { box-shadow:0 0 20px hsl(var(--primary) / 0.3); }
  50% { box-shadow:0 0 40px hsl(var(--primary) / 0.6); }
}
@keyframes slideUp {
  from { opacity:0; transform:translateY(32px); }
  to { opacity:1; transform:translateY(0); }
}
.animate-fade-in-up { animation: fadeInUp 0.6s ease-out; }
.animate-slide-in-right { animation: slideInRight 0.5s ease-out; }
.animate-pulse-glow { animation: pulseGlow 2s ease-in-out infinite; }

/* ── Header ── */
header {
  position:sticky; top:0; z-index:100;
  background:linear-gradient(180deg, hsl(var(--background)), hsl(var(--card)));
  border-bottom:1px solid hsl(var(--border) / 0.5);
  box-shadow:var(--shadow-elegant);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.header-inner {
  max-width:1400px; margin:0 auto; padding:24px 32px;
  text-align:center;
}
.header-deco {
  display:flex; align-items:center; justify-content:center; gap:16px;
  margin-bottom:8px;
}
.header-bar {
  width:4px; height:48px; border-radius:2px;
  background:linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 16px hsl(var(--primary) / 0.5);
}
header h1 {
  font-size:clamp(28px,4.5vw,42px); font-weight:800; letter-spacing:.12em;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 20px hsl(var(--primary) / 0.5)) drop-shadow(0 0 40px hsl(var(--primary) / 0.3));
  text-indent:.05em;
}
header .subtitle {
  color:hsl(var(--muted-foreground)); font-size:14px; margin-top:6px;
  max-width:672px; margin-left:auto; margin-right:auto;
}
.header-stats {
  display:flex; align-items:center; justify-content:center; gap:12px; margin-top:12px;
}
.header-stats .pill {
  padding:4px 16px; border-radius:9999px;
  background:hsl(var(--primary) / 0.1); border:1px solid hsl(var(--primary) / 0.2);
  font-size:12px; color:hsl(var(--muted-foreground));
}
.header-stats .pill strong {
  color:hsl(var(--primary)); font-weight:700;
}

/* ── Main Container ── */
.container {
  position:relative; z-index:1;
  max-width:1400px; margin:0 auto; padding:24px 32px 80px;
}

/* ── Timeline Card ── */
.timeline-card {
  background:hsl(var(--card) / 0.95); border:1px solid hsl(var(--border));
  border-radius:var(--radius); box-shadow:var(--shadow-card), 0 0 0 1px hsl(var(--primary) / 0.15), 0 0 20px hsl(var(--primary) / 0.1);
  padding:24px; margin-bottom:24px;
  transition:var(--transition-smooth); position:relative; overflow:hidden;
}
.timeline-card::before {
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(hsl(var(--primary) / 0.03) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--primary) / 0.03) 1px, transparent 1px);
  background-size:50px 50px; pointer-events:none; opacity:0.4;
}
.timeline-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px; position:relative; z-index:1;
}
.timeline-title-group {
  display:flex; align-items:center; gap:12px;
}
.timeline-icon {
  padding:8px; border-radius:8px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 20px hsl(var(--primary) / 0.4);
}
.timeline-icon svg { display:block; width:20px; height:20px; color:hsl(var(--primary-foreground)); }
.timeline-title-group h3 { font-size:20px; font-weight:700; }
.timeline-title-group p { font-size:12px; color:hsl(var(--muted-foreground)); margin-top:2px; }
.timeline-year-badge {
  padding:6px 16px; border-radius:9999px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:hsl(var(--primary-foreground)); font-weight:700; font-size:14px;
  box-shadow:0 0 20px hsl(var(--primary) / 0.4);
  position:relative; z-index:1;
}

/* ── Era info preview ── */
.era-preview {
  padding:16px 20px; border-radius:10px; margin-bottom:12px;
  background:hsl(var(--muted) / 0.3);
  border:1px solid hsl(var(--primary) / 0.15);
  position:relative; z-index:1;
}
.era-preview h4 {
  font-size:18px; font-weight:700;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:4px;
}
.era-preview .era-preview-period {
  font-size:12px; color:hsl(var(--muted-foreground)); font-weight:500;
  padding:3px 10px; border-radius:9999px; background:hsl(var(--background) / 0.5);
  display:inline-block; margin-bottom:8px;
}
.era-preview p { font-size:13px; color:hsl(var(--muted-foreground)); line-height:1.6; }

/* ── Slider ── */
input[type=range] {
  -webkit-appearance:none; width:100%; height:6px;
  border-radius:3px;
  background:linear-gradient(90deg,
    hsl(38 45% 38%), hsl(40 55% 45%), hsl(42 60% 48%), hsl(43 65% 50%),
    hsl(44 75% 52%), hsl(45 85% 54%), hsl(45 90% 55%), hsl(45 92% 57%),
    hsl(45 90% 55%), hsl(44 80% 52%), hsl(43 70% 50%), hsl(42 60% 48%),
    hsl(40 50% 44%), hsl(38 45% 38%), hsl(40 52% 44%), hsl(42 62% 48%),
    hsl(43 72% 50%), hsl(44 82% 53%), hsl(45 90% 55%)
  );
  outline:none; cursor:pointer; position:relative; z-index:1;
  margin:4px 0;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 16px hsl(var(--primary) / 0.5), 0 0 0 4px hsl(var(--background) / 0.6); cursor:pointer;
  border:2px solid hsl(var(--primary-foreground));
  transition:transform 0.15s ease;
}
input[type=range]::-webkit-slider-thumb:hover {
  transform:scale(1.15);
}

/* ── Era Bars ── */
.era-bars {
  position:relative; height:32px; margin:8px 0 14px; border-radius:8px;
  background:hsl(var(--muted) / 0.25);
  padding:6px; position:relative; z-index:1; overflow:hidden;
}
.era-bar {
  position:absolute; height:10px; border-radius:5px; cursor:pointer;
  top:50%; transform:translateY(-50%);
  transition:all 0.2s ease; opacity:.82;
  min-width:3px;
}
.era-bar:hover { height:16px; border-radius:8px; opacity:1; box-shadow:0 0 14px currentColor; z-index:1; }
.era-bar.active { height:16px; border-radius:8px; opacity:1; box-shadow:0 0 18px currentColor; z-index:2; }

/* ── Era Pills ── */
.era-pills {
  display:flex; flex-wrap:wrap; gap:6px; position:relative; z-index:1;
}
.era-pill {
  padding:6px 14px; border-radius:9999px; font-size:11px; font-weight:600;
  cursor:pointer; border:1px solid hsl(var(--border) / 0.6);
  background:hsl(var(--muted) / 0.4); color:hsl(var(--muted-foreground));
  transition:all 0.25s ease; white-space:nowrap; letter-spacing:.02em;
}
.era-pill:hover { background:hsl(var(--muted)); color:hsl(var(--foreground)); border-color:hsl(var(--primary) / 0.3); }
.era-pill.active {
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:hsl(var(--primary-foreground)); border-color:transparent;
  box-shadow:0 0 20px hsl(var(--primary) / 0.5);
  transform:scale(1.06);
}

/* ── Content Grid ── */
.main-grid {
  display:grid; grid-template-columns:1fr; gap:24px;
}
@media (min-width:1280px) {
  .main-grid { grid-template-columns:1fr 1fr; }
}
.col { display:flex; flex-direction:column; gap:24px; }

/* ── Tabs ── */
.content-tabs {
  display:flex; gap:4px; background:hsl(var(--muted) / .5);
  padding:4px; border-radius:10px; margin-bottom:16px;
}
.content-tab {
  flex:1; padding:10px 8px; border-radius:8px; font-size:12px; font-weight:600;
  text-align:center; cursor:pointer; color:hsl(var(--muted-foreground));
  transition:all .25s ease; border:none; background:none;
  white-space:nowrap;
}
.content-tab:hover { color:hsl(var(--foreground)); background:hsl(var(--muted)); }
.content-tab.active {
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:hsl(var(--primary-foreground)); box-shadow:0 0 16px hsl(var(--primary) / .4);
}

/* ── Stat cards ── */
.stat-cards {
  display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px;
}
.stat-item {
  text-align:center; padding:20px 16px; border-radius:12px;
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  transition:all .25s ease;
}
.stat-item:hover { border-color:hsl(var(--primary) / .3); box-shadow:0 0 20px hsl(var(--primary) / .1); }
.stat-item .stat-icon { font-size:24px; margin-bottom:6px; }
.stat-item .stat-num { font-size:28px; font-weight:800; color:hsl(var(--primary)); }
.stat-item .stat-label { font-size:11px; color:hsl(var(--muted-foreground)); margin-top:2px; }

/* ── Cards ── */
.card {
  background:hsl(var(--card)); border:1px solid hsl(var(--border));
  border-radius:var(--radius); padding:24px 28px;
  box-shadow:var(--shadow-card);
}
.card h2 {
  font-size:22px; font-weight:800; margin-bottom:4px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.card .period-label {
  display:inline-block; font-size:12px; color:hsl(var(--primary));
  background:hsl(var(--primary) / 0.08); padding:4px 14px;
  border-radius:9999px; margin-bottom:12px; font-weight:600; letter-spacing:.04em;
}
.era-desc {
  font-size:14px; line-height:1.9; color:hsl(var(--muted-foreground));
  margin-top:12px;
}

/* ── Section titles ── */
.section-title {
  font-size:15px; font-weight:700; margin-bottom:12px; margin-top:20px;
  display:flex; align-items:center; gap:8px; color:hsl(var(--foreground));
}
.section-title::before {
  content:''; display:inline-block; width:3px; height:16px; border-radius:2px;
  background:linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  flex-shrink:0; box-shadow:0 0 8px hsl(var(--primary) / 0.4);
}

/* ── Event list ── */
.event-list { display:flex; flex-direction:column; gap:4px; }
.event-item {
  display:flex; align-items:flex-start; gap:10px;
  padding:9px 12px; border-radius:8px; border:1px solid transparent;
  background:hsl(var(--muted) / 0.3); font-size:13px;
  cursor:pointer; transition:all 0.25s ease; line-height:1.5;
}
.event-item:hover {
  background:hsl(var(--muted)); border-color:hsl(var(--primary) / 0.3);
  transform:translateX(4px); box-shadow:0 4px 16px rgba(0,0,0,0.3);
}
.clickable-item { cursor:pointer; }
.tag.clickable-item:hover { background:hsl(var(--primary) / 0.12); border-color:hsl(var(--primary) / 0.4); }
.invention-item.clickable-item:hover { border-color:hsl(var(--primary) / 0.5); box-shadow:0 0 20px hsl(var(--primary) / 0.15); }
.tp-card.clickable-item:hover { border-color:hsl(var(--primary) / 0.5); box-shadow:0 0 20px hsl(var(--primary) / 0.15); }
.event-dot {
  flex-shrink:0; width:6px; height:6px; border-radius:50%;
  background:hsl(var(--primary)); box-shadow:0 0 8px hsl(var(--primary) / 0.5);
  margin-top:7px;
}

/* ── Tags / Figure list ── */
.tag-list { display:flex; flex-direction:column; gap:4px; }
.tag {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px;
  font-size:13px; font-weight:500;
  background:hsl(var(--muted) / 0.15); color:hsl(var(--foreground));
  border:1px solid transparent; transition:all 0.25s ease;
}
.tag::before { content:''; flex-shrink:0; width:5px; height:5px; border-radius:50%; background:hsl(var(--primary) / 0.6); }
.tag:hover { background:hsl(var(--muted) / 0.3); border-color:hsl(var(--border)); }

/* ── Invention list ── */
.invention-grid { display:flex; flex-direction:column; gap:4px; }
.invention-item {
  display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px;
  font-size:13px; font-weight:500;
  background:hsl(var(--muted) / 0.15); color:hsl(var(--foreground));
  border:1px solid transparent; transition:all 0.25s ease;
}
.invention-item::before { content:'\2726'; flex-shrink:0; font-size:10px; color:hsl(var(--primary) / 0.6); }
.invention-item:hover { background:hsl(var(--muted) / 0.3); border-color:hsl(var(--border)); }

/* ── Turning points ── */
.tp-card {
  background:hsl(var(--muted) / 0.2); border:1px solid hsl(var(--border));
  border-radius:12px; padding:14px; transition:all 0.3s ease; margin-bottom:8px;
  border-left:3px solid hsl(var(--primary));
}
.tp-card:hover { border-color:hsl(var(--primary) / 0.4); box-shadow:0 4px 16px rgba(0,0,0,0.3); }
.tp-year { font-size:11px; font-weight:700; color:hsl(var(--primary)); margin-bottom:4px; letter-spacing:.05em; }
.tp-event { font-size:14px; font-weight:700; margin-bottom:4px; }
.tp-desc { font-size:13px; color:hsl(var(--muted-foreground)); margin-bottom:4px; line-height:1.5; }
.tp-sig { font-size:12px; color:hsl(var(--muted-foreground) / 0.7); font-style:italic; }

/* ── Detail overlay ── */
.detail-overlay {
  position:fixed; inset:0; z-index:200;
  background:rgba(0,0,0,0.75); backdrop-filter:blur(8px);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.detail-panel {
  position:relative;
  background:hsl(var(--card)); border:1px solid hsl(var(--primary) / 0.2);
  border-radius:var(--radius); padding:28px;
  max-width:560px; width:100%; max-height:82vh; overflow-y:auto;
  box-shadow:var(--shadow-card), 0 0 60px hsl(var(--primary) / 0.1);
  animation:slideUp 0.3s ease-out;
}
.detail-panel h3 { font-size:20px; margin-bottom:12px; }
.detail-close {
  position:sticky; top:0; float:right;
  width:32px; height:32px; border-radius:50%;
  border:1px solid hsl(var(--border)); background:hsl(var(--muted));
  color:hsl(var(--muted-foreground)); font-size:18px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s ease; z-index:1;
}
.detail-close:hover { border-color:hsl(var(--primary)); color:hsl(var(--primary)); }
.detail-body { font-size:14px; line-height:2; color:hsl(var(--muted-foreground)); }

/* ── Footer ── */
footer {
  position:relative; z-index:1; text-align:center; padding:24px;
  color:hsl(var(--muted-foreground)); font-size:12px;
  border-top:1px solid hsl(var(--border));
}

/* ── Scrollbar ── */
.card::-webkit-scrollbar { width:4px; }
.card::-webkit-scrollbar-track { background:transparent; }
.card::-webkit-scrollbar-thumb { background:hsl(var(--border)); border-radius:2px; }

@media (max-width:768px) {
  .header-inner { padding:20px 16px; }
  .container { padding:16px 16px 60px; }
  .card { padding:18px 16px; height:auto; min-height:500px; }
  .card h2 { font-size:20px; }
  .detail-panel { padding:20px 16px; max-width:94vw; }
  .timeline-card { padding:16px; }
  .timeline-header { flex-direction:column; gap:12px; align-items:flex-start; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-gradient-overlay"></div>

<header>
  <div class="header-inner animate-fade-in-up">
    <div class="header-deco">
      <span class="header-bar"></span>
      <h1>中 国 全 历 史</h1>
      <span class="header-bar"></span>
    </div>
    <p class="subtitle">穿越五千年历史长河，探索中华文明的璀璨轨迹</p>
    <div class="header-stats">
      <span class="pill"><strong>19</strong> 个历史时期</span>
      <span class="pill"><strong>5000+</strong> 年历史跨度</span>
    </div>
  </div>
</header>

<div class="container">
  <!-- Timeline -->
  <div class="timeline-card animate-fade-in-up" id="timelineCard">
    <div class="timeline-header">
      <div class="timeline-title-group">
        <div class="timeline-icon animate-pulse-glow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        </div>
        <div>
          <h3>历史时间轴</h3>
          <p>拖动滑块探索五千年历史</p>
        </div>
      </div>
      <span class="timeline-year-badge" id="yearBadge">公元220年</span>
    </div>

    <div id="eraPreview" class="era-preview" style="display:none;"></div>

    <input type="range" id="timeSlider" min="0" max="100" step="0.1" value="50">

    <div class="era-bars" id="eraBars"></div>

    <div class="era-pills" id="eraPills"></div>
  </div>

  <!-- Content -->
  <div class="main-grid" id="mainContent"></div>
</div>

<footer>数据来源：百度百科 · 中国历史年表 &nbsp;|&nbsp; 基于中国全历史网架构重建</footer>

<div class="detail-overlay" id="detailOverlay" style="display:none;"></div>

<script>
// ── Data ──
const eras = [
  { id:'ancient', name:'上古时期', period:'史前 - 公元前2070年', start:-3000, end:-2070,
    desc:'此时期是人类社会发展的初级阶段，也是中华文明的孕育期。北京猿人、蓝田人等古人类的发现，展示了中国早期人类的智慧与生存状态。随着石器工具的进步和火的使用，人类社会逐渐进入新石器时代，农业、畜牧业开始兴起，定居生活成为可能。',
    events:[
      {name:'北京猿人生活',desc:'约70万年前，北京周口店地区的北京猿人已能制造和使用打制石器，掌握了保存火种的技术，以采集和狩猎为生，是东亚地区目前已发现最早的古人类之一。'},
      {name:'仰韶文化兴起',desc:'约公元前5000年，以彩陶为鲜明特征的新石器时代文化在黄河中游地区兴起，西安半坡遗址是典型代表，先民进入定居农耕生活，种植粟黍，驯养猪狗等家畜。'},
      {name:'大汶口文化发展',desc:'约公元前4300年，大汶口文化在黄河下游山东地区繁荣发展，墓葬中出现明显的贫富分化和社会分层现象，出土了精美的玉器和象牙制品，是龙山文化的直接前身。'},
      {name:'三皇五帝传说时期',desc:'远古传说中的帝王时代，伏羲、女娲、神农为"三皇"，黄帝、颛顼、帝喾、尧、舜为"五帝"。黄帝在阪泉之战中击败炎帝、涿鹿之战中擒杀蚩尤，被尊为中华民族的人文初祖。'}
    ],
    figures:[
      {name:'黄帝',desc:'姬姓，号轩辕氏，被尊为中华民族的人文初祖。阪泉之战击败炎帝，涿鹿之战擒杀蚩尤，统一华夏部落，被后世尊为"五帝"之首。传说中养蚕、舟车、音律等皆始于黄帝时期。'},
      {name:'炎帝',desc:'姜姓，号神农氏，教民农耕、尝百草发明医药，被尊为农业和医药之神。后与黄帝结盟，共同形成华夏族的核心，"炎黄子孙"由此而来。'},
      {name:'尧',desc:'陶唐氏，五帝之一。命羲和观测天象制定历法，晚年禅让帝位给舜而非传子，开创了中国最早的"禅让"政治传统，被儒家奉为圣王典范。'},
      {name:'舜',desc:'有虞氏，五帝之一。出身贫寒，以孝闻名天下，经受尧的三年考察后受禅为帝。命大禹治水成功，晚年将帝位禅让给大禹。'},
      {name:'禹',desc:'姒姓，因治水功绩卓著受舜禅让为部落联盟首领。采用疏导之法治理滔天洪水，划定九州、铸造九鼎，是中国历史上第一个王朝——夏朝的奠基者。'}
    ],
    inventions:['石器工具','火的使用','彩陶制作','农业种植'],
    turningPoints:[{y:'约前5000年',e:'仰韶文化兴起',d:'以彩陶为特色的新石器时代文化，分布在黄河中游地区',s:'标志着中国进入定居农业社会，文明曙光初现'}],

  { id:'xia', name:'夏朝', period:'公元前2070年 - 公元前1600年', start:-2070, end:-1600,
    desc:'夏朝是中国历史上第一个世袭制王朝，标志着中国由原始社会向奴隶制社会的过渡。大禹治水成功后建立夏朝，开创了"家天下"的政治格局。夏朝虽然文献记载较少，但考古发现的二里头文化被认为与夏朝有关，出土了宫殿基址、青铜器等重要遗迹遗物。',
    events:[
      {name:'大禹治水建立夏朝',desc:'约公元前2070年，大禹采用疏导之法成功治理滔天洪水，受舜禅让为部落联盟首领，划定九州、铸造九鼎，建立了中国历史上第一个世袭制王朝——夏朝。'},
      {name:'启继承王位开创世袭制',desc:'大禹之子启击败法定继承人伯益，在钧台大会诸侯即天子位，从此"公天下"变为"家天下"，禅让制被世袭制取代，成为中国王位继承制度的转折点。'},
      {name:'太康失国与后羿夺权',desc:'夏第三代君主太康沉湎田猎不恤民事，东夷有穷氏首领后羿趁机夺取夏朝政权，"太康失国"成为后世君主荒政误国的经典警示。'},
      {name:'少康中兴',desc:'太康之孙少康在有仍氏等部落协助下积蓄力量，最终反攻复国，重建夏朝统治，史称"少康中兴"，是中国历史上第一次王朝中兴。'},
      {name:'夏桀暴政与夏朝灭亡',desc:'约公元前1600年，末代君主夏桀荒淫暴虐，自比太阳，民众咒骂"时日曷丧？予及汝皆亡"。商汤在伊尹辅佐下兴兵灭夏，鸣条之战夏军大败，夏朝覆亡。'}
    ],
    figures:[
      {name:'大禹',desc:'夏朝开国君主。因治水有功受舜禅让，划定九州、铸造九鼎，将部落联盟改造为早期国家形态，是中国历史上第一个世袭王朝的创立者，其子启继承王位开启了"家天下"时代。'},
      {name:'启',desc:'大禹之子，夏朝第二代君主。击败法定继承人伯益，在钧台大会诸侯正式即天子位，以世袭制取代禅让制，开创了中国王位家族传承的先河。'},
      {name:'太康',desc:'夏朝第三代君主，大禹之孙。即位后沉湎田猎游乐不理朝政，被东夷有穷氏首领后羿趁虚而入夺取政权，流亡在外多年不得归国，史称"太康失国"。'},
      {name:'少康',desc:'夏朝第六代君主，太康之孙。在流亡中长大，依靠有仍氏等部落支持积蓄力量，最终以少胜多反攻复国成功，史称"少康中兴"，是中国历史上第一次王朝中兴。'},
      {name:'桀',desc:'夏朝末代君主。力大无穷能徒手搏虎，但荒淫暴虐宠幸妹喜，大兴土木建造倾宫瑶台，自比太阳永不坠落。最终被商汤在鸣条之战击败，夏朝覆亡。'}
    ],
    inventions:['世袭制度','历法雏形','青铜器初现','城市规划'],
    turningPoints:[{y:'约前2070年',e:'夏朝建立',d:'大禹治水成功，受舜禅让建立中国历史上第一个王朝',s:'标志着中国进入王朝时代，原始社会结束'},{y:'约前1600年',e:'夏朝灭亡',d:'夏桀暴虐无道，商汤起兵灭夏，鸣条之战夏军大败',s:'暴政导致王朝更替，开启商朝时代'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/93877b7d-3c74-4ad0-9a6a-62a4516a666b.jpg'
  },
  { id:'shang', name:'商朝', period:'公元前1600年 - 公元前1046年', start:-1600, end:-1046,
    desc:'商朝是中国历史上第二个王朝，以青铜器文明和甲骨文闻名于世。商朝的青铜冶炼技术达到了很高的水平，司母戊鼎是世界最大的青铜器。甲骨文的出现标志着中国文字的成熟，为后世留下了大量珍贵的甲骨文资料。商朝实行神权政治，占卜活动频繁。',
    events:[
      {name:'商汤灭夏建立商朝',desc:'约公元前1600年，商部族首领汤以"吊民伐罪"为号召，在伊尹辅佐下联合各部族起兵讨伐夏桀，经鸣条之战大败夏军，夏桀被流放南巢，商朝正式建立。'},
      {name:'盘庚迁殷',desc:'约公元前1300年，商王盘庚力排众议将都城从奄（今山东曲阜）迁至殷（今河南安阳），此后273年不再迁都。殷墟遗址出土了大量甲骨文和青铜器，是20世纪中国最重大的考古发现之一。'},
      {name:'武丁中兴',desc:'商王武丁在位59年，任用贤臣傅说、甘盘，妻子妇好多次率军出征，商朝国力达到鼎盛，疆域空前辽阔，北至燕山、南达江淮、西到陇东、东抵海滨。'},
      {name:'妇好出征',desc:'商王武丁之妻妇好是中国有文字记载以来第一位女将军，多次统率大军征伐羌方、土方等周边方国，甲骨文中关于她的占卜记录多达二百余条。'},
      {name:'帝辛暴政',desc:'商朝末代君主帝辛（纣王）虽有文武之才，但宠幸妲己、拒谏饰非，以炮烙之刑残害忠良，叔父比干因直言进谏被剖心而死，微子、箕子等纷纷出走。'},
      {name:'牧野之战与商朝灭亡',desc:'约公元前1046年，周武王姬发率诸侯联军在牧野与商军决战，商军主力远在东南征战，临时武装的奴隶阵前倒戈，纣王兵败逃回朝歌自焚于鹿台，商朝灭亡。'}
    ],
    figures:[
      {name:'商汤',desc:'商朝开国君主，子姓，名履。以"吊民伐罪"为号召，在名相伊尹辅佐下联合各部族起兵灭夏，经鸣条之战大败夏桀，建立了中国历史上第二个王朝，被后世视为"革命"的典范——以有道伐无道。'},
      {name:'伊尹',desc:'商朝开国名相，出身奴隶，以烹饪之道比喻治国之理得到商汤赏识。辅佐商汤灭夏建商，汤去世后又辅佐三代商王，被后世尊为"元圣"，是中国历史上最早的贤相典范。'},
      {name:'盘庚',desc:'商朝第二十任君主，力排众议将都城从奄迁至殷（今河南安阳），此后273年不再迁都，商朝进入稳定发展期。殷墟遗址成为20世纪中国最重大的考古发现之一。'},
      {name:'武丁',desc:'商朝第二十三任君主，在位59年。任用贤臣傅说、甘盘，其妻妇好是中国最早的女将军。在位期间商朝国力达到鼎盛，疆域空前辽阔，史称"武丁中兴"。'},
      {name:'妇好',desc:'商王武丁之妻，中国有文字记载以来第一位女将军。多次统率大军征伐羌方、土方等周边方国，甲骨文中关于她的占卜记录达二百余条，墓葬出土了大量青铜器和玉器。'},
      {name:'纣王',desc:'商朝末代君主，名受。虽有文武之才但宠幸妲己、拒谏饰非，以炮烙之刑残害忠良，叔父比干因直言进谏被剖心。牧野之战兵败后自焚于鹿台，商朝覆亡。'},
      {name:'比干',desc:'商纣王叔父，官至少师（丞相）。因纣王暴虐无道，冒着灭族危险连续三日跪谏纣王，被纣王怒而剖心。后世尊为"亘古第一忠臣"，民间奉为文财神。'}
    ],
    inventions:['甲骨文','青铜器','历法','占卜术'],
    turningPoints:[{y:'约前1300年',e:'盘庚迁殷',d:'商王盘庚力排众议将都城迁至殷（今河南安阳），此后273年不再迁都',s:'商朝进入稳定发展期，殷墟成为重要考古遗址'},{y:'约前1046年',e:'商朝灭亡',d:'周武王伐纣，牧野之战商军阵前倒戈，纣王自焚于鹿台',s:'青铜文明达到顶峰后衰落，周朝建立'}],
    color:'#A0826D', bg:'https://miaoda-site-img.cdn.bcebos.com/images/d91e5372-7269-4ee0-9f64-5d4c58cd3b0e.jpg'
  },
  { id:'zhou', name:'西周', period:'公元前1046年 - 公元前771年', start:-1046, end:-771,
    desc:'西周建立了完善的分封制和宗法制度，形成了"天子—诸侯—卿大夫—士"的等级体系。周公制礼作乐，确立了礼乐文化的基础，对中国后世政治制度和文化传统产生了深远影响。西周时期农业、手工业都有很大发展，青铜器铭文成为重要的历史资料。',
    events:[
      {name:'武王伐纣建立周朝',desc:'约公元前1046年，周武王姬发继承父亲文王遗志，会合八百诸侯于盟津，在牧野之战中击败商纣王，攻入朝歌建立周朝，定都镐京（今西安西南），开启了延续八百年的周王朝。'},
      {name:'周公东征',desc:'武王去世后幼子成王即位，周公旦摄政辅佐。管叔、蔡叔勾结纣王之子武庚发动叛乱，周公率军东征三年平定三监之乱，巩固了周朝对东方广大地区的统治。'},
      {name:'周公制礼作乐',desc:'周公旦在东征胜利后大规模分封诸侯，制定了一整套典章制度，确立了以嫡长子继承为核心的宗法制和以周天子为顶点的分封体系，礼乐文明成为中华文化的核心基因。'},
      {name:'成康之治',desc:'周成王、周康王在位期间（约前1043—前996年），延续周公之政，轻徭薄赋、明德慎罚，社会安定和谐，史载"天下安宁，刑错四十余年不用"，是西周最鼎盛的时期。'},
      {name:'国人暴动',desc:'公元前841年，周厉王推行专利政策垄断山林川泽之利，又派卫巫监视国人言论使"道路以目"，镐京城内的"国人"（自由民）忍无可忍发动暴动驱逐厉王，这一年成为中国历史确切纪年之始。'},
      {name:'烽火戏诸侯与西周灭亡',desc:'公元前771年，周幽王宠幸褒姒废嫡立庶，为博美人一笑不惜点燃烽火台戏弄诸侯。当犬戎联军真的来犯时诸侯无人来援，镐京被攻破，幽王被杀于骊山之下，西周覆亡。'}
    ],
    figures:[
      {name:'周武王',desc:'姬姓，名发，周朝开国君主。继承父亲文王遗志，会合八百诸侯于盟津，在牧野之战中以少胜多击败商纣王，建立周朝定都镐京，开启了延续八百年的周王朝。'},
      {name:'周公旦',desc:'周武王之弟，姓姬名旦。武王去世后摄政辅佐年幼的成王，率军东征平定三监之乱，大规模分封诸侯，制礼作乐确立宗法制和分封制，被尊为儒家元圣，是中华礼乐文明的总设计师。'},
      {name:'姜子牙',desc:'姜姓吕氏，名尚，号太公望。在渭水之滨垂钓时被周文王访得，年逾七十辅佐文王武王两代灭商建周，因功封于齐地成为齐国开国之君，被尊为兵家始祖。'},
      {name:'周成王',desc:'名诵，武王之子。幼年即位由叔父周公旦摄政，成年后周公归政，亲政期间继续推行周公的制度建设，与子康王共同开创了"成康之治"的盛世局面。'},
      {name:'周康王',desc:'名钊，成王之子。在位期间延续成王和周公的治国方针，轻徭薄赋、明德慎罚，社会安定四十余年不用刑罚，是西周国力的鼎盛时期。'},
      {name:'周幽王',desc:'名宫湦，西周最后一任君主。宠幸褒姒废嫡立庶，为博美人一笑不惜烽火戏诸侯。公元前771年犬戎联军攻破镐京，幽王被杀于骊山之下，西周灭亡。'}
    ],
    inventions:['分封制','宗法制','礼乐制度','井田制'],
    turningPoints:[{y:'约前1046年',e:'西周建立',d:'周武王伐纣成功，建立周朝，定都镐京',s:'分封制和宗法制确立，礼乐文化形成'},{y:'前771年',e:'西周灭亡',d:'犬戎攻破镐京，周幽王被杀于骊山之下',s:'西周结束，平王东迁洛邑，进入春秋时期'}],
    color:'#B8956A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/a0f5a1de-0315-4d68-ba22-3f7f45566a5e.jpg'
  },
  { id:'spring-autumn', name:'春秋时期', period:'公元前770年 - 公元前476年', start:-770, end:-476,
    desc:'春秋时期是东周的前半期，周王室权威衰落，诸侯争霸成为主旋律。齐桓公、晋文公、楚庄王、吴王阖闾、越王勾践先后称霸，史称"春秋五霸"。这一时期，铁器开始使用，生产力提高，社会经济发展，思想文化空前活跃，出现了百家争鸣的萌芽。',
    events:[
      {name:'平王东迁',desc:'公元前770年，周平王在晋文侯、郑武公等诸侯的护卫下将都城从镐京东迁至洛邑（今河南洛阳），东周开始。此后周王室直辖领地大幅缩小，权威一落千丈，诸侯争霸时代正式拉开帷幕。'},
      {name:'齐桓公称霸',desc:'齐桓公任用管仲为相推行改革，"尊王攘夷"为号召，九合诸侯一匡天下，成为春秋第一霸主。管仲的改革涉及政治、军事、经济各方面，使齐国率先富强起来。'},
      {name:'晋文公称霸',desc:'晋文公重耳流亡十九年归国即位后励精图治，公元前632年在城濮之战中以退避三舍之计大败楚军，战后在践土之盟中被周襄王册封为诸侯之长，晋国称霸中原。'},
      {name:'楚庄王问鼎中原',desc:'楚庄王即位三年不理朝政，后"一鸣惊人"发愤图强，任用孙叔敖为令尹治理楚国。公元前606年，楚庄王率军至洛水边陈兵示威，向周天子使者询问九鼎轻重，公然挑战周王室权威。'},
      {name:'吴越争霸与卧薪尝胆',desc:'吴王阖闾败于越王勾践后重伤而死，其子夫差励精图治击败越国。勾践被俘后忍辱负重，归国后卧薪尝胆十年生聚，最终于公元前473年灭吴，成为春秋最后一位霸主。'},
      {name:'孔子周游列国创立儒家学派',desc:'孔子（前551—前479年）为推行仁政德治的政治理想，带领弟子周游卫、宋、陈、蔡等列国十四年，虽屡遭困厄但始终坚持。晚年返回鲁国整理六经，创立儒家学派，被后世尊为"至圣先师"。'}
    ],
    figures:[
      {name:'齐桓公',desc:'姜姓，名小白，春秋五霸之首。任用管仲为相推行全面改革，以"尊王攘夷"为号召九合诸侯一匡天下，北击山戎救燕、南伐楚国立威，使齐国成为春秋第一强国。'},
      {name:'管仲',desc:'齐国名相，被齐桓公尊为"仲父"。推行政治、军事、经济全面改革——四民分业、相地而衰征、官山海盐铁专卖，使齐国率先富强，被后世誉为"法家先驱""华夏第一相"。'},
      {name:'晋文公',desc:'姬姓，名重耳。流亡列国十九年备尝艰辛，六十二岁归国即位后励精图治，城濮之战以退避三舍大败楚军，践土之盟被周襄王册封为诸侯之长，晋国称霸中原百余年。'},
      {name:'楚庄王',desc:'芈姓熊氏，名侣。即位三年沉醉酒色不理朝政，后"一鸣惊人"发愤图强问鼎中原，任用孙叔敖治理内政，使楚国成为南方霸主，被列入春秋五霸。'},
      {name:'孔子',desc:'名丘字仲尼（前551—前479年），春秋末期鲁国人。带领弟子周游列国十四年推行仁政思想，晚年返鲁整理六经、修订《春秋》，创立儒家学派，被后世尊为"至圣先师""万世师表"，其思想深刻影响了中华文明和世界文化。'},
      {name:'老子',desc:'姓李名耳字聃，道家学派创始人。曾任周王室守藏室之史（国家图书馆馆长），见周室衰微后西出函谷关留下五千余言《道德经》，提出"道法自然""无为而治"等核心思想，被道教尊为太上老君。'},
      {name:'孙武',desc:'字长卿，齐国人，被吴王阖闾拜为大将。率吴军西破强楚、北威齐晋，著有《孙子兵法》十三篇，被誉为"兵学圣典""世界古代第一兵书"，被尊为"兵圣""百世兵家之师"。'}
    ],

  { id:'warring-states', name:'战国时期', period:'公元前475年 - 公元前221年', start:-475, end:-221,
    desc:'战国时期是中国历史上最为动荡的时期之一，七雄并立，战争频繁，但也催生了空前活跃的思想文化。各国纷纷变法图强，商鞅变法使秦国由弱变强。这一时期，铁器广泛使用，农业生产力大幅提高，诸子百家思想达到鼎盛，为中华文化奠定了坚实基础。',
    events:[
      {name:'三家分晋',desc:'公元前403年，晋国被韩、赵、魏三家大夫瓜分，周威烈王被迫正式册封三家为诸侯。这一事件标志着战国时代的开端，司马光《资治通鉴》以此为开篇，警示礼崩乐坏始于名器之乱。'},
      {name:'商鞅变法',desc:'公元前356年，秦孝公任用商鞅在秦国推行全面变法：废井田开阡陌、奖励军功与农耕、推行二十等爵制、实行连坐法。变法使秦国由西陲弱国一跃成为战国第一强国，为后来统一六国奠定了制度基础。'},
      {name:'长平之战',desc:'公元前260年，秦国与赵国在长平（今山西高平）展开战国时期规模最大的战役。赵括纸上谈兵取代老将廉颇，秦将白起以诱敌深入之计包围赵军，赵军粮尽援绝被迫投降，白起坑杀降卒四十余万，赵国从此一蹶不振。'},
      {name:'荆轲刺秦王',desc:'公元前227年，燕太子丹为挽救危局派荆轲刺杀秦王嬴政。荆轲以献燕国督亢地图和秦叛将樊於期首级为名觐见秦王，"图穷而匕首见"，最终行刺失败被秦王侍卫所杀，留下"风萧萧兮易水寒"的千古绝唱。'},
      {name:'秦灭六国统一天下',desc:'秦王嬴政采纳李斯"灭韩以恐他国"的战略，从前230年灭韩开始至前221年灭齐为止，仅用十年时间以远交近攻之策逐一消灭六国，结束了自春秋以来五百多年的分裂战乱，建立了中国历史上第一个大一统帝国。'}
    ],
    figures:['商鞅','孟子','庄子','荀子','韩非子','墨子','屈原','白起','廉颇','赵括'],
    inventions:['都江堰水利工程','郡县制雏形','兵法著作','诸子百家学说'],
    turningPoints:[{y:'前356年',e:'商鞅变法',d:'秦孝公任用商鞅推行变法，废井田开阡陌，奖励军功和农耕',s:'秦国崛起，为统一六国奠定基础'},{y:'前260年',e:'长平之战',d:'秦将白起大败赵军，坑杀降卒四十万，赵国元气大伤',s:'东方六国再无力独立抗衡秦国'}],
    color:'#D4AF6A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/4dbb9f1b-a9d6-4e7d-8415-3467d4ddbedf.jpg'

  { id:'qin', name:'秦朝', period:'公元前221年 - 公元前207年', start:-221, end:-207,
    desc:'秦朝是中国历史上第一个统一的中央集权制封建王朝，奠定了中国两千多年政治制度的基本格局。秦始皇统一六国后，推行郡县制，统一文字、货币、度量衡，修建万里长城和驰道。虽然秦朝仅存在短短15年，但其制度创新影响极为深远。"百代皆行秦政制"即是对其历史地位的准确概括。',
    events:[
      {name:'秦始皇统一六国',desc:'公元前221年，秦王嬴政灭掉六国中最后的齐国，完成统一大业。他自认"德兼三皇、功过五帝"，创"皇帝"称号自称始皇帝，废除谥号制度和分封制，将全国分为三十六郡，建立了高度中央集权的政治体制。'},
      {name:'统一文字货币度量衡',desc:'秦始皇采纳李斯建议统一全国文字为小篆（后简化隶书），统一货币为圆形方孔的半两钱，统一度量衡标准，又规定"车同轨"车轨标准宽度。这些举措极大便利了全国经济文化交流，为统一多民族国家的巩固奠定了制度根基。'},
      {name:'蒙恬北逐匈奴筑长城',desc:'秦始皇派大将蒙恬率三十万大军北击匈奴七百余里，收复河套地区（今内蒙古鄂尔多斯一带）。随后征发数十万民夫将原秦、赵、燕三国旧长城连接扩建为万里长城，西起临洮东至辽东，是世界历史上规模最大的军事防御工程。'},
      {name:'焚书坑儒',desc:'公元前213至前212年，秦始皇采纳李斯建议焚烧除秦国史记及医药卜筮种树之外的民间藏书，随后因方士侯生、卢生逃亡而迁怒儒生，在咸阳坑杀四百六十余名"犯禁"儒生方士。焚书坑儒虽意在统一思想，但造成了古代典籍的重大损失。'},
      {name:'秦始皇沙丘病逝',desc:'公元前210年，秦始皇在第五次东巡途中于沙丘平台（今河北广宗）病逝，享年五十岁。宦官赵高与丞相李斯合谋篡改遗诏，逼死合法继承人扶苏和大将蒙恬，立少子胡亥为帝（秦二世），为秦朝速亡埋下祸根。'},
      {name:'陈胜吴广起义',desc:'公元前209年，九百名戍卒在大泽乡（今安徽宿州）遇雨失期按律当斩，陈胜吴广揭竿而起发动起义，喊出"王侯将相宁有种乎"的千古名言。起义虽仅半年即被镇压，但引发了全国范围的反秦浪潮，敲响了秦朝的丧钟。'},
      {name:'秦朝灭亡',desc:'公元前207年，刘邦率军自武关道攻入关中，秦王子婴素车白马、颈系绶带出降于轵道旁。随后项羽率大军入咸阳杀子婴、焚秦宫，秦朝正式灭亡。这个统一仅十五年的短命王朝虽因暴政速亡，但其制度框架深刻影响了此后两千年。'}
    ],
    figures:['秦始皇','李斯','蒙恬','赵高','陈胜','吴广','项羽'],
    inventions:['郡县制','统一文字（小篆）','统一货币（半两钱）','统一度量衡'],
    turningPoints:[{y:'前221年',e:'秦朝建立',d:'秦王嬴政灭掉六国中最后的齐国，完成统一大业，自号始皇帝',s:'结束五百余年分裂，建立中国第一个大一统中央集权帝国'},{y:'前207年',e:'秦朝灭亡',d:'刘邦率先攻入咸阳，秦王子婴素车白马出降',s:'暴政导致中国第一个统一王朝仅存15年便速亡'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/d6e7d003-3f95-4a27-92b4-1f7d1a8a5e4d.jpg'
  },
  { id:'han', name:'汉朝', period:'公元前202年 - 公元220年', start:-202, end:220,
    desc:'汉朝分为西汉和东汉两个时期，是中国历史上最强盛的王朝之一，与同时期的罗马帝国并列为世界两大帝国。汉武帝时期国力达到鼎盛，北击匈奴，开辟丝绸之路，独尊儒术。汉朝在政治、经济、文化、科技等方面都取得了辉煌成就，"汉族""汉字""汉语"等称谓皆由此而来。',
    events:[
      {name:'刘邦建立汉朝',desc:'公元前202年，刘邦在垓下之战中彻底击败项羽，于定陶汜水之阳称帝建立汉朝，定都长安。刘邦出身平民，"以布衣提三尺剑取天下"，开创了"布衣将相"之局，成为中国历史上第一个平民出身的开国皇帝。'},
      {name:'文景之治',desc:'汉文帝、汉景帝在位期间（前180—前141年），奉行黄老"无为而治"思想，轻徭薄赋、与民休息，田租从"十五税一"降至"三十税一"，废除肉刑等酷刑。社会经济迅速恢复，府库充盈、人民安居，为后来汉武帝大规模开拓奠定了物质基础。'},
      {name:'汉武帝独尊儒术',desc:'公元前134年，汉武帝采纳大儒董仲舒"罢黜百家，独尊儒术"的建议，在长安设立太学教授五经，儒学从此成为官方正统思想。这一决策深刻塑造了中国两千年的政治文化和价值体系。'},
      {name:'张骞出使西域开辟丝绸之路',desc:'公元前138年，汉武帝派张骞出使西域联络大月氏共击匈奴。张骞被匈奴扣押十年仍持汉节不屈，最终到达中亚。虽然军事联盟未成，但他带回了大量西域地理人文信息，被司马迁誉为"凿空"之举，丝绸之路由此开辟，东西方文明交流进入新时代。'},
      {name:'司马迁完成《史记》',desc:'约公元前91年，太史公司马迁在遭受宫刑的极大屈辱后发愤著书，终于完成了中国第一部纪传体通史《史记》。全书一百三十篇五十二万余字，上起黄帝下至汉武帝，被鲁迅称赞为"史家之绝唱，无韵之离骚"。'},
      {name:'王莽篡汉建立新朝',desc:'公元8年，外戚王莽以"禅让"为名废汉自立，改国号为"新"。王莽推行了一系列激进的托古改制——废奴隶制、实行"王田制"、改革币制，但这些脱离实际的措施引发天下大乱，新朝仅存15年便在绿林赤眉起义中覆亡。'},
      {name:'光武中兴',desc:'公元25年，汉宗室刘秀在鄗城称帝重建汉朝（东汉），定都洛阳。刘秀平定各地割据势力，采取"以柔道治天下"的方针，释放奴婢、精兵简政、休养生息，开创了"光武中兴"的治世局面。'},
      {name:'蔡伦改进造纸术',desc:'公元105年，宦官蔡伦总结民间造纸经验，用树皮、麻头、破布、旧渔网等为原料造出轻便廉价的纸张，献给汉和帝。造纸术后来经阿拉伯传入欧洲，是中国古代四大发明中对世界文明影响最为深远的一项。'},
      {name:'黄巾起义',desc:'公元184年，张角以太平道教义聚众数十万发动起义，因头裹黄巾为标志故称"黄巾军"。起义虽一年内即被镇压，但沉重打击了东汉统治，此后州郡拥兵自重，开启了军阀混战局面，东汉名存实亡。'}
    ],
    figures:['刘邦','汉武帝','张骞','司马迁','董仲舒','卫青','霍去病','王莽','光武帝','班超','蔡伦'],
    inventions:['造纸术','地动仪','浑天仪','《史记》','丝绸之路','《汉书》'],

  },
  { id:'three-kingdoms', name:'三国时期', period:'220年 - 280年', start:220, end:280,
    desc:'三国时期是中国历史上的著名分裂时期，魏、蜀、吴三国鼎立。这一时期虽战争频繁，但也涌现出诸葛亮、曹操、关羽等一大批杰出的政治家、军事家和文学家。三国故事被后世演绎成《三国演义》，成为中国文学瑰宝，在世界范围内都有广泛影响。',
    events:[
      {name:'曹丕称帝建立魏国',desc:'公元220年，曹操病逝后其子曹丕逼迫汉献帝禅让，于洛阳称帝建立魏国，东汉正式灭亡。曹丕推行九品中正制选拔人才，这一制度后来被士族门阀利用，影响了此后数百年的政治格局。'},
      {name:'刘备称帝建立蜀汉',desc:'公元221年，刘备在成都称帝继承汉统，国号"汉"（史称蜀汉）。刘备以"兴复汉室"为旗帜，任用诸葛亮为丞相，在益州建立了相对稳定的政权。'},
      {name:'孙权称帝建立吴国',desc:'公元229年，孙权在武昌称帝后迁都建业（今南京），正式建立吴国。孙权派卫温、诸葛直率船队到达夷洲（今台湾），是中国有史记载最早的中央政权经略台湾的行动。'},
      {name:'诸葛亮北伐',desc:'公元228至234年，蜀汉丞相诸葛亮为"北定中原、兴复汉室"六次从汉中出兵北伐曹魏，其中最著名的是第一次出祁山和第五次在五丈原与司马懿对峙。234年诸葛亮病逝于五丈原军中，临终上呈《出师表》，"鞠躬尽瘁，死而后已"成为千古名句。'},
      {name:'司马懿高平陵之变',desc:'公元249年，魏国太傅司马懿趁大将军曹爽陪同少帝出城祭扫高平陵之机发动政变，以迅雷之势控制京城洛阳，曹爽束手被杀。此后司马氏彻底掌控曹魏朝政大权，为日后代魏立晋扫清了障碍。'},
      {name:'邓艾偷渡阴平灭蜀汉',desc:'公元263年，魏国大将邓艾率军从无人防守的阴平小道翻越摩天岭天险，如神兵天降般兵临成都城下，后主刘禅出城投降，蜀汉灭亡。刘禅被迁至洛阳后留下"此间乐，不思蜀"的典故。'},
      {name:'三国归晋',desc:'公元280年，晋武帝司马炎派王濬率楼船水师顺长江而下直取建业，吴主孙皓效仿刘禅自缚出降，东吴灭亡。至此分裂六十年的三国时代彻底结束，中国重归统一。'}
    ],
    figures:['曹操','刘备','孙权','诸葛亮','关羽','张飞','赵云','周瑜','司马懿','陆逊'],

    color:'#B8956A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/6393b4d4-b4b7-4f9c-9e0e-7b3b3e7e9f2c.jpg'
  },
  { id:'jin', name:'两晋时期', period:'265年 - 420年', start:265, end:420,
    desc:'两晋分为西晋和东晋。西晋短暂统一后，因八王之乱和永嘉之乱而迅速灭亡。东晋偏安江南，北方陷入五胡十六国的混乱局面。这一时期，士族门阀势力极度强大，"王与马共天下"是当时的真实写照。玄学盛行，王羲之的书法、顾恺之的绘画、陶渊明的诗歌均达到了艺术高峰。',
    events:[
      {name:'司马炎建立西晋',desc:'公元265年，司马昭之子司马炎逼迫魏元帝禅让，在洛阳称帝建立西晋，定都洛阳。280年灭吴统一全国后，司马炎推行占田制和户调制，社会经济得到一定恢复。但他在继承人问题上犯下重大失误，选择了智力低下的司马衷为太子。'},
      {name:'八王之乱',desc:'公元291至306年，西晋宗室诸王为争夺中枢权力爆发了长达十六年的血腥内讧。汝南王、楚王、赵王、齐王、长沙王、成都王、河间王、东海王相继卷入混战，战火燃遍中原大地，西晋国力消耗殆尽，此后无力抵御内迁少数民族的反抗。'},
      {name:'永嘉之乱',desc:'公元311年，匈奴贵族刘曜率军攻破西晋都城洛阳，俘虏晋怀帝，屠杀王公士民三万余人，焚烧宫室。建兴四年（316年）刘曜又攻陷长安，俘虏晋愍帝，西晋灭亡。中原士族纷纷携家南迁，史称"衣冠南渡"。'},
      {name:'司马睿建立东晋',desc:'公元317年，西晋宗室司马睿在南迁士族的拥戴下于建康（今南京）称帝建立东晋。当时有"王与马，共天下"之说——琅琊王氏的代表人物王导在内主持朝政，其堂兄王敦在外统率军队，士族门阀势力一度凌驾于皇权之上。'},
      {name:'淝水之战',desc:'公元383年，前秦皇帝苻坚率八十余万大军南下欲一举灭晋。东晋宰相谢安坐镇建康指挥，其弟谢石、侄谢玄率八万北府兵在淝水大败前秦军，苻坚身中流矢逃回北方，前秦随即土崩瓦解。"风声鹤唳、草木皆兵"均出自此战。'},
      {name:'刘裕代晋建宋',desc:'公元420年，东晋权臣刘裕逼迫晋恭帝禅让，在建康称帝建立宋朝（刘宋），东晋灭亡。刘裕出身寒门从军起家，"气吞万里如虎"，但在北伐即将成功之际因后方变故功亏一篑。从此南方进入南朝时期。'}
    ],
    figures:['司马炎','司马睿','王导','王羲之','陶渊明','顾恺之','谢安','刘裕'],
    inventions:['行书与草书','山水诗','田园诗','玄学思想'],
    turningPoints:[{y:'316年',e:'西晋灭亡',d:'匈奴首领刘曜攻破长安，俘虏晋愍帝，西晋覆灭',s:'北方陷入五胡十六国大混乱，汉族士民大规模南迁'},{y:'383年',e:'淝水之战',d:'谢安坐镇建康指挥，其弟谢石、侄谢玄在淝水大败苻坚',s:'保住了江南汉族政权，延续了中华文明的正朔'}],
    color:'#C9A86A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/3798c5d5-c5c8-4a0d-8f1f-8c4c4f8f9a3d.jpg'
  },
  { id:'northern-southern', name:'南北朝时期', period:'420年 - 589年', start:420, end:589,
    desc:'南北朝时期是中国历史上又一个大分裂时期。南方经历了宋、齐、梁、陈四个朝代，北方则先后有北魏、东魏、西魏、北齐、北周五个政权。这一时期，佛教在中国广泛传播，石窟艺术（云冈、龙门石窟）达到鼎盛，民族融合加速推进。北魏孝文帝的汉化改革对中华文明发展具有里程碑意义。',
    events:[
      {name:'刘裕建宋与南朝开始',desc:'公元420年，刘裕代东晋建宋（刘宋），定都建康，南朝由此开始。刘裕在位期间打击豪强、轻徭薄赋，史称其"清简寡欲、严整有法度"。刘宋是南朝疆域最大、国力最强的一个朝代。'},
      {name:'北魏统一北方',desc:'公元439年，鲜卑拓跋部建立的北魏终于统一了自西晋灭亡以来分裂了百余年的中国北方，结束了五胡十六国混战局面，形成了南北朝长期对峙的格局。'},
      {name:'北魏孝文帝汉化改革',desc:'公元494年，北魏孝文帝拓跋宏力排鲜卑贵族旧势力的强烈反对，将都城从平城（今山西大同）迁至洛阳，强制推行全面汉化：禁胡服胡语、改鲜卑姓为汉姓（拓跋改元姓）、鼓励鲜卑贵族与汉族通婚。这场改革极大地促进了北方民族大融合。'},
      {name:'梁武帝与南朝佛教极盛',desc:'公元502年，萧衍代齐建梁（南梁），在位四十八年。梁武帝晚年笃信佛教，四次舍身同泰寺出家被大臣重金赎回，广建佛寺，"南朝四百八十寺"正是此时的写照。但这也导致国家财力枯竭、朝政荒废。'},
      {name:'侯景之乱',desc:'公元548年，东魏降将侯景在寿阳起兵叛梁，次年攻破建康，将八十余岁的梁武帝萧衍囚禁饿死于台城。侯景军在建康大肆烧杀抢掠，富庶繁华的江南遭到毁灭性打击，南朝从此一蹶不振。'},
      {name:'北周灭北齐统一北方',desc:'公元577年，北周武帝宇文邕亲率大军攻灭北齐，统一了中国北方。宇文邕此前已推行灭佛运动没收寺院财产充作军费，大大增强了国力。但天不假年，统一北方仅一年后他便病逝于出征突厥途中，年仅三十六岁。'},
      {name:'杨坚代周建隋',desc:'公元581年，北周外戚杨坚以"受禅"为名取代年仅七岁的周静帝，建立隋朝。589年隋文帝派大军南下灭陈俘虏陈后主，结束了自东汉末年以来近四百年的分裂局面，中国重归大一统。'}
    ],
    figures:['刘裕','北魏孝文帝','梁武帝萧衍','陈霸先','祖冲之','郦道元','贾思勰'],
    inventions:['均田制','三长制','石窟艺术','《水经注》','《齐民要术》'],
    turningPoints:[{y:'494年',e:'孝文帝改革',d:'北魏孝文帝拓跋宏迁都洛阳，禁胡服胡语，改鲜卑姓为汉姓',s:'极大促进了民族大融合，为隋唐大一统奠定文化和制度基础'},{y:'589年',e:'隋朝统一',d:'隋文帝杨坚派晋王杨广率五十一万大军南下灭陈，俘虏陈后主',s:'结束自东汉末年以来近四百年的分裂局面，中国重归统一'}],
    color:'#D4AF6A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/2e2c0e6e-e6e7-4a1f-9f2f-9d5d5f0f6a2e.jpg'
  },
  { id:'sui', name:'隋朝', period:'581年 - 618年', start:581, end:618,
    desc:'隋朝虽然国祚短暂仅37年，但它结束了近三百年的分裂局面，重新统一了中国。隋文帝开创了科举制度，隋炀帝修建了贯通南北的大运河。这些制度创新和重大工程建设对后世影响极为深远。科举制打破了门阀士族对政治权力的垄断，大运河则成为此后千年中国经济的大动脉。',
    events:[
      {name:'杨坚建立隋朝',desc:'公元581年，北周外戚杨坚以"受禅"之名取代年仅七岁的周静帝宇文阐，即位于长安建立隋朝，是为隋文帝。杨坚在位期间勤俭治国、整顿吏治，社会经济迅速从战乱中复苏。'},
      {name:'隋灭南陈统一全国',desc:'公元589年，隋文帝派晋王杨广率五十一万大军分八路南下伐陈，势如破竹攻入建康，俘虏沉湎酒色的陈后主陈叔宝。自西晋永嘉之乱以来分裂了273年的中国终于重归统一。'},
      {name:'开创科举制度',desc:'隋文帝废除九品中正制，隋炀帝于大业年间正式设立进士科，以考试策问取士取代门第荐举。科举制把读书、考试和任官结合起来，打破了门阀士族对政治权力的垄断，此后延续一千三百年，深刻影响了中国社会结构和世界文官制度的发展。'},
      {name:'开凿大运河',desc:'公元605至610年，隋炀帝征发百万民夫开凿以洛阳为中心、南起余杭（今杭州）北至涿郡（今北京）的大运河，全长两千余公里，沟通海河、黄河、淮河、长江、钱塘江五大水系，成为此后千年中国经济文化交流的大动脉。但工程过度劳民伤财也是隋朝速亡的重要原因。'},
      {name:'完善三省六部制',desc:'隋朝将中央行政体制规范为三省（中书省决策、门下省审核、尚书省执行）六部（吏户礼兵刑工），这套高效分权的中央官制被唐朝继承并进一步完善，成为此后中国历代王朝中央行政的基本框架。'},
      {name:'三征高句丽',desc:'公元612至614年，隋炀帝倾全国之力三次亲征高句丽，动用兵力超过百万，民夫加倍。三次征讨或以惨败告终或无功而返，耗费了巨量人力物力，民不聊生激起遍地农民起义，加速了隋朝的崩溃。'},
      {name:'隋朝灭亡',desc:'公元618年，隋炀帝杨广在江都（今扬州）被禁军将领宇文化及缢杀，享年五十岁。李渊在长安废隋恭帝自立为帝建立唐朝，隋朝仅存在37年便覆亡。后人评价隋炀帝"其功也巨，其过也暴"。'}
    ],
    figures:['隋文帝杨坚','隋炀帝杨广','独孤皇后','宇文化及'],
    inventions:['科举制度','大运河','赵州桥','三省六部制'],
    turningPoints:[{y:'605年',e:'开创科举制',d:'隋炀帝正式设立进士科，以考试选拔人才代替门第荐举',s:'打破门阀垄断，开辟了平民通过读书入仕的道路，影响中国一千三百年'},{y:'605—610年',e:'修建大运河',d:'以洛阳为中心，南起余杭北至涿郡，全长两千余公里',s:'促进南北经济文化交流，成为此后千年中国经济的大动脉'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/3455d1f1-f1f2-4b2f-9a3f-0e6e6f7f5b3f.jpg'
  },
  { id:'tang', name:'唐朝', period:'618年 - 907年', start:618, end:907,
    desc:'唐朝是中国历史上最强盛的王朝之一，国力强盛、文化繁荣、对外开放，是当时世界上最强大的国家。贞观之治和开元盛世是中国封建社会的巅峰时期。唐朝在诗歌、绘画、音乐、舞蹈等方面都达到了极高的成就，李白、杜甫、王维等诗人的作品至今广为传诵。唐朝对日本、朝鲜半岛、越南等周边地区影响深远。',
    events:[
      {name:'李渊称帝建唐',desc:'公元618年，隋太原留守李渊在次子李世民的极力推动下于长安太极殿称帝，建立唐朝。李渊（唐高祖）实行了一系列恢复社会经济的政策，但在继承人问题上优柔寡断，为后来的兄弟相残埋下伏笔。'},
      {name:'玄武门之变',desc:'公元626年六月初四，秦王李世民在长安玄武门设伏射杀太子李建成和齐王李元吉，随后逼迫唐高祖李渊立自己为太子。两个月后李世民即位为唐太宗，虽然手段残酷，但他开创的贞观之治为中国封建社会树立了治国典范。'},
      {name:'贞观之治',desc:'唐太宗李世民在位期间（627—649年），以"水能载舟亦能覆舟"为治国理念，虚心纳谏、知人善任，房玄龄、杜如晦、魏征等贤臣辅佐朝政。这一时期政治清明、社会安定、四夷宾服，太宗被四方尊为"天可汗"，是中国历史上治世的最佳范例。'},
      {name:'玄奘西行取经',desc:'公元629至645年，高僧玄奘法师孤身西行求法，历经千难万险途经百余国到达天竺（印度），在那烂陀寺学习佛法。归国后带回佛经六百五十七部，在长安大慈恩寺主持翻译工作，其《大唐西域记》是研究中亚和南亚古代史的珍贵文献。'},
      {name:'武则天称帝',desc:'公元690年，唐高宗皇后武则天废唐睿宗自立为帝，改国号为"周"，定都洛阳。她是中国历史上唯一的女皇帝，在位期间推行殿试和武举、编修《姓氏录》打破关陇贵族垄断，但任用酷吏、大兴告密之风也为人诟病。'},
      {name:'开元盛世',desc:'唐玄宗李隆基在位前期（713—741年）励精图治，以姚崇、宋璟为相，虚心纳谏、整顿吏治、发展经济。开元年间唐朝国力臻于极盛，长安成为当时世界上最大最繁华的国际化大都市，人口超过百万，各国商旅云集。'},
      {name:'安史之乱',desc:'公元755年，身兼范阳、平卢、河东三镇节度使的安禄山以"讨伐杨国忠"为名在范阳起兵叛乱，攻破洛阳、长安。唐玄宗仓皇逃往四川，在马嵬坡被迫赐死杨贵妃。战乱持续七年多，虽最终平定，但唐朝从此由盛转衰，藩镇割据局面形成。'},
      {name:'黄巢起义',desc:'公元875年，盐贩出身的黄巢响应王仙芝起义，后成为起义领袖。880年黄巢军攻入长安建立"大齐"，诗人黄巢名句"冲天香阵透长安，满城尽带黄金甲"即出自此时。884年起事最终失败，但沉重打击了唐朝统治。'},
      {name:'朱温篡唐',desc:'公元907年，唐朝权臣朱温（朱全忠）逼迫唐哀帝李柷禅让，在汴州（今开封）称帝建立后梁，定都汴京。绵延289年的大唐帝国正式灭亡，中国进入了五代十国的大分裂时期。'}
    ],
    figures:['李世民','武则天','李白','杜甫','白居易','玄奘','鉴真','狄仁杰','颜真卿','韩愈'],
    inventions:['雕版印刷术','火药','唐诗','飞钱（早期汇票）'],
    turningPoints:[{y:'627—649年',e:'贞观之治',d:'唐太宗李世民虚心纳谏，任用魏征、房玄龄等贤臣治理国家',s:'政治清明，经济繁荣，文化昌盛，被后世奉为治国典范'},{y:'755年',e:'安史之乱',d:'范阳节度使安禄山以讨伐杨国忠为名起兵叛乱，战火遍及大半个中国',s:'唐朝由盛转衰的转折点，此后藩镇割据局面持续一百五十余年'}],
    color:'#A0826D', bg:'https://miaoda-site-img.cdn.bcebos.com/images/ac30e2f2-f2f3-4c3f-0a4f-1f7f7f6f4c0f.jpg'
  },
  { id:'five-dynasties', name:'五代十国时期', period:'907年 - 960年', start:907, end:960,
    desc:'五代十国是唐朝灭亡后中国再次陷入的分裂时期。北方中原地区先后经历了后梁、后唐、后晋、后汉、后周五个朝代，南方和山西则有十个割据政权。这一时期虽然战乱频繁，但经济文化仍有重要发展，后周世宗柴荣的改革尤为突出，为后来宋朝统一奠定了坚实基础。',
    events:[
      {name:'朱温灭唐建立后梁',desc:'公元907年，宣武节度使朱温逼迫唐哀帝禅让，在汴州称帝建立后梁，五代正式开始。朱温原名朱全忠（唐僖宗赐名），以背叛黄巢起义军起家，最终篡唐自立，为人残忍多疑，在位仅五年即被亲子所杀。'},
      {name:'李存勖建立后唐',desc:'公元923年，沙陀人李存勖在魏州称帝灭后梁，建立后唐迁都洛阳。李存勖骁勇善战，灭梁之战中亲率精骑冲锋陷阵。但称帝后自满骄奢、宠信伶人，仅三年后在兵变中被杀，留下"生于忧患死于安乐"的警示。'},
      {name:'石敬瑭割让燕云十六州',desc:'公元936年，后唐河东节度使石敬瑭为夺取帝位向契丹（辽朝）求援，以割让燕云十六州、每年进贡帛三十万匹、自称"儿皇帝"的屈辱条件换取辽太宗耶律德光出兵相助。燕云十六州的丧失使中原王朝失去了北方重要屏障。'},
      {name:'郭威建立后周',desc:'公元951年，后汉大将郭威在澶州被兵士拥立为帝，回汴京建立后周。郭威出身寒微深知民间疾苦，在位三年革除弊政、减轻赋税，一扫五代暴政之风，为后周盛世奠定了基础。'},
      {name:'柴荣改革',desc:'公元954年，后周世宗柴荣即位后锐意进取：澄清吏治、整顿军队、抑制佛教（灭佛铸钱充军费）、恢复农业生产。他在位仅五年便使后周国力大增，相继击败北汉、后蜀、南唐，可惜北伐契丹途中病逝，年仅三十九岁。'},
      {name:'陈桥兵变与宋朝建立',desc:'公元960年正月初三，后周殿前都点检赵匡胤奉命率军北上抵御契丹，行至陈桥驿时部下将一件事先准备好的黄袍披在他身上，高呼"万岁"拥立其为帝。赵匡胤回师汴京后以和平方式取代年仅七岁的周恭帝，建立宋朝。'}
    ],
    figures:['朱温','李存勖','石敬瑭','郭威','柴荣（周世宗）','赵匡胤','李煜'],
    inventions:['火药武器开始实战应用','活字印刷技术萌芽','词的发展成熟'],
    turningPoints:[{y:'936年',e:'割让燕云十六州',d:'后晋石敬瑭为换取契丹出兵支持，将燕云十六州割让给辽朝',s:'中原王朝失去北方天然屏障，对后世数百年军事格局产生深远影响'},{y:'960年',e:'宋朝建立',d:'赵匡胤在陈桥驿发动兵变，被将士黄袍加身拥立为帝',s:'结束五代十国分裂局面，中国再次走向统一'}],
    color:'#B8956A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/45b3e3f3-f3f4-4d4f-1b5f-2f8f8f7f5d1f.jpg'
  },
  { id:'song', name:'宋朝', period:'960年 - 1279年', start:960, end:1279,
    desc:'宋朝分为北宋和南宋两个阶段，是中国历史上经济、文化、科技最发达的朝代之一。北宋都城汴京（开封）是当时世界上最大的城市。宋朝虽然军事上较为弱势，但经济极度繁荣，商业高度发达，出现了世界上最早的纸币"交子"。指南针、火药、活字印刷术三大发明都在宋朝得到重大发展或广泛应用。',
    events:[
      {name:'赵匡胤建立宋朝',desc:'公元960年，赵匡胤陈桥兵变黄袍加身，回师汴京建立了宋朝。他采取"先南后北"的统一方略，先后灭荆南、后蜀、南汉、南唐等割据政权，基本统一了中原和南方地区，但始终未能收复燕云十六州。'},
      {name:'杯酒释兵权',desc:'公元961年，宋太祖赵匡胤在一次宴会上借酒劝谕石守信等大将交出兵权，以"多积金钱、厚自娱乐"诱导他们放弃军职。这一和平解除武将兵权的方式避免了刘邦、朱元璋式的屠戮功臣，但也确立了宋朝"重文轻武"的国策，埋下了军事积弱的隐患。'},
      {name:'王安石变法',desc:'公元1069年，宋神宗任命王安石为宰相推行大规模新政改革：青苗法、免役法、市易法、保甲法等涵盖财政、军事、教育各方面，旨在"富国强兵"。变法触动了大官僚地主阶级的利益，在司马光等保守派激烈反对下最终失败，新旧党争持续了半个世纪。'},
      {name:'毕昇发明活字印刷术',desc:'约公元1040年，北宋平民毕昇发明了胶泥活字印刷术。与雕版印刷相比，活字可以拆卸重排反复使用，大大提高了印刷效率。活字印刷术后来传入朝鲜、日本、欧洲，是中国古代四大发明之一，极大地推动了人类知识的传播。'},
      {name:'靖康之变',desc:'公元1127年，金国大军南下攻破北宋都城汴京，俘虏宋徽宗、宋钦宗二帝及后妃、宗室、大臣三千余人北去，汴京被洗劫一空。侥幸逃脱的康王赵构在应天府（今商丘）即位，北宋灭亡南宋开始。岳飞悲愤地写下"靖康耻，犹未雪"的千古词句。'},
      {name:'岳飞郾城大捷',desc:'公元1140年，岳飞率岳家军在郾城等地大败金国精锐骑兵拐子马和铁浮图，乘胜进军至距汴京仅四十五里的朱仙镇，"直捣黄龙府"的壮志即将实现。然而宋高宗和秦桧连发十二道金牌强令班师，十年战功毁于一旦。'},
      {name:'绍兴和议与岳飞冤狱',desc:'公元1141年，南宋与金国达成屈辱的"绍兴和议"：宋向金称臣，每年纳贡银二十五万两、绢二十五万匹。同年底，岳飞被以"莫须有"的罪名在杭州风波亭遇害，年仅三十九岁。岳飞的悲剧成为中国历史上忠臣蒙冤的最典型代表。'},
      {name:'崖山海战与南宋灭亡',desc:'公元1279年，元军在崖山（今广东新会）与南宋残部展开最后的决战。宋军战败，丞相陆秀夫背负八岁的幼帝赵昺跳海殉国，十余万军民不愿投降纷纷蹈海而死。南宋灭亡，蒙古元朝统一了全中国。"崖山之后无中华"之说虽过于绝对，但确实标志着一个时代的终结。'}
    ],
    figures:['赵匡胤','王安石','苏轼','岳飞','文天祥','朱熹','沈括','辛弃疾','李清照'],
    inventions:['活字印刷术','指南针','火药武器','纸币（交子）','《梦溪笔谈》'],
    turningPoints:[{y:'1044年',e:'火药配方正式记载',d:'曾公亮《武经总要》首次详细记载了火药的三种配方',s:'火药开始用于军事领域，逐步改变了世界战争形态'},{y:'1127年',e:'靖康之变',d:'金国大军南下攻破汴京，俘虏宋徽宗、宋钦宗二帝北去',s:'北宋灭亡，宋室南迁临安，进入南宋时期'}],
    color:'#C9A86A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/b86ef4f4-f4f5-4e5f-2c6f-3f9f9f8f6e2f.jpg'
  },
  { id:'yuan', name:'元朝', period:'1271年 - 1368年', start:1271, end:1368,
    desc:'元朝是由蒙古族建立的中国历史上疆域最辽阔的统一王朝，其版图横跨欧亚大陆。元朝定都大都（今北京），首次将西藏、云南等地正式纳入中国版图。元朝时期，中外交流空前活跃，马可·波罗等西方旅行家来到中国。元曲（关汉卿《窦娥冤》等）和杂剧是中国文学史上的璀璨明珠。',
    events:[
      {name:'铁木真统一蒙古称成吉思汗',desc:'公元1206年，铁木真在斡难河源头召开忽里台大会被推举为全蒙古的大汗，尊号成吉思汗（意为"拥有四海的大汗"）。他创建了千户制军政合一的蒙古国家，颁布《大札撒》法典，开启了蒙古征服世界的时代。'},
      {name:'忽必烈建元定都大都',desc:'公元1271年，忽必烈取《易经》"大哉乾元"之意改国号为"大元"，次年定都大都（今北京），这是中国历史上首次由少数民族政权建立的大一统王朝。大都成为当时世界上最宏伟的都城之一。'},
      {name:'元灭南宋统一全国',desc:'公元1279年，元将张弘范在崖山海战中彻底击败南宋残部，南宋灭亡。自唐末五代分裂三百余年后中国再次实现统一，且元朝疆域之辽阔远超汉唐：北至西伯利亚、南至南海、东至朝鲜半岛、西至东欧。'},
      {name:'马可·波罗来华',desc:'公元1275年，威尼斯旅行家马可·波罗随父亲沿丝绸之路到达元大都，得到忽必烈信任留居中国十七年。其《马可·波罗游记》向欧洲详细描绘了中国的富庶与文明，激发了哥伦布等航海家开辟新航路的热情。'},
      {name:'行省制度确立',desc:'元朝在全国设立岭北、辽阳、河南、陕西、四川、甘肃、云南、江浙、江西、湖广十个行中书省，作为中央的派出机构管理地方。行省制度有效地巩固了大一统国家的行政体系建设，被明清两朝沿袭，一直影响到今天中国的省级行政区划。'},
      {name:'红巾军起义',desc:'公元1351年，韩山童、刘福通等人以"石人一只眼，挑动黄河天下反"的谶语为号召，发动治理黄河的民夫在颍州起义。红巾军迅速蔓延全国，朱元璋、陈友谅、张士诚等各路起义军纷纷起事，元朝统治土崩瓦解。'},
      {name:'元朝灭亡',desc:'公元1368年，朱元璋在应天（南京）称帝建立明朝，随即派徐达、常遇春率二十五万明军北伐。北伐军势如破竹攻克大都，元顺帝妥懽帖睦尔仓皇北逃至上都（今内蒙古正蓝旗），元朝在中国内地的统治至此结束。'}
    ],
    figures:['忽必烈','成吉思汗','郭守敬','关汉卿','马致远','马可·波罗'],
    inventions:['《授时历》（精确到365.2425天）','元曲','行省制度','回回炮'],
    turningPoints:[{y:'1279年',e:'元朝统一全国',d:'元军在崖山海战中击败南宋残部，陆秀夫背幼帝跳海殉国',s:'中国历史上首次由少数民族政权完成全国统一'},{y:'1368年',e:'元朝灭亡',d:'朱元璋部下徐达、常遇春率明军攻克大都，元顺帝北逃',s:'蒙古势力退回草原，汉人重新建立统一王朝'}],
    color:'#D4AF6A', bg:'https://miaoda-site-img.cdn.bcebos.com/images/7009f5f5-f5f6-4f6f-3d7f-4f0f0f9f7f3f.jpg'
  },
  { id:'ming', name:'明朝', period:'1368年 - 1644年', start:1368, end:1644,
    desc:'明朝是中国历史上最后一个由汉族建立的大一统王朝。明初国力强盛，郑和七下西洋展示了中国强大的海上实力。永乐年间编纂的《永乐大典》是当时世界上最大的百科全书。明朝中后期出现了资本主义萌芽，王阳明心学影响深远。但明朝后期宦官专权、党争激烈、财政危机，最终被农民起义推翻。',
    events:[
      {name:'朱元璋称帝建明',desc:'公元1368年正月初四，朱元璋在应天府（今南京）即皇帝位，国号大明，建元洪武。朱元璋出身安徽凤阳贫苦农家，少年时当过和尚和乞丐，是中国历史上出身最寒微的开国皇帝，即位后重典治国、严惩贪腐。'},
      {name:'靖难之役',desc:'公元1399至1402年，燕王朱棣以"清君侧"为名起兵反抗建文帝的削藩政策，历经三年内战攻入南京。建文帝在大火中不知所踪（成为中国历史著名悬案），朱棣在南京即位为明成祖，改元永乐。'},
      {name:'永乐迁都北京',desc:'公元1421年，明成祖朱棣力排众议将都城从南京迁至北京。北京紫禁城的建设历时十四年，动用工匠民夫数十万人。朱棣提出"天子守国门"的理念——以首都直接镇守北方边防，这一决策深刻影响了此后五百余年中国的政治地理格局。'},
      {name:'郑和七下西洋',desc:'公元1405至1433年，郑和奉明成祖之命率领由两百余艘海船、两万七千余人组成的庞大船队七次远航西洋，最远到达非洲东海岸和红海沿岸。航海规模之大、技术之先进远超同时期的欧洲航海家。但永乐之后明朝实行海禁，中国从此退出了远洋舞台。'},
      {name:'土木堡之变',desc:'公元1449年，明英宗朱祁镇在宦官王振怂恿下御驾亲征瓦剌，结果在土木堡（今河北怀来）被瓦剌大军围困，明军精锐尽失，英宗被俘。留守北京的于谦力排南迁之议，率军民坚守北京打退瓦剌进攻，保住了明朝江山。'},
      {name:'张居正改革',desc:'公元1572至1582年，内阁首辅张居正利用万历帝年幼独揽朝政推行全面改革：一条鞭法简化税制统一征银、考成法整顿吏治提高行政效率、清丈田亩增加国家财政收入。改革使明朝一度中兴，但张居正去世后遭万历帝清算，改革成果尽废。'},
      {name:'戚继光抗倭',desc:'明代中期倭寇（日本海盗与中国走私商勾结的海上武装集团）肆虐东南沿海。名将戚继光在浙江义乌招募农民矿工组建"戚家军"，创造"鸳鸯阵"战法，先后在台州、福建等地多次大破倭寇，基本肃清了东南沿海的倭患。'},
      {name:'李自成攻破北京与明朝灭亡',desc:'公元1644年三月十九日，李自成率领大顺农民军攻入北京，崇祯帝朱由检在煤山（今景山）自缢殉国，死前在衣襟上留下"朕死无面目见祖宗于地下，自去冠冕，以发覆面"的遗言。明朝灭亡，随后清军入关拉开了清朝统治的序幕。'}
    ],
    figures:['朱元璋','朱棣','郑和','王阳明','张居正','戚继光','李时珍','海瑞','徐光启'],
    inventions:['《永乐大典》','《本草纲目》','《天工开物》','紫禁城','明代青花瓷'],
    turningPoints:[{y:'1405—1433年',e:'郑和下西洋',d:'郑和率领两万七千余人的庞大船队七次远航，访问三十多个国家和地区',s:'展示了明朝强大的海上实力，促进了中国与亚非各国的经济文化交流'},{y:'1644年',e:'明朝灭亡',d:'李自成农民军攻入北京，崇祯帝在万岁山（煤山）自缢殉国',s:'最后一个汉族大一统王朝结束，清军随即入关定鼎中原'}],
    color:'#8B7355', bg:'https://miaoda-site-img.cdn.bcebos.com/images/fc23f6f6-f6f7-5f7f-4e8f-5f1f1f0f8f4f.jpg'
  },
  { id:'qing', name:'清朝', period:'1636年 - 1912年', start:1636, end:1912,
    desc:'清朝是中国历史上最后一个封建王朝，由满族建立。康雍乾三朝国力达到鼎盛，康乾盛世时期中国疆域超过1300万平方公里，人口突破三亿规模。但清朝中后期闭关锁国，与工业革命失之交臂，在西方列强的侵略下逐渐沦为半殖民地半封建社会。1911年辛亥革命推翻帝制，终结了中国延续两千多年的封建君主专制制度。',
    events:[
      {name:'努尔哈赤建后金与皇太极改国号为清',desc:'公元1616年，建州女真首领努尔哈赤在赫图阿拉称汗建立后金。其子皇太极继位后于1636年在盛京（今沈阳）称帝，改国号为"大清"，改族名为"满洲"。皇太极仿行明制建立六部，加速了满族的封建化进程。'},
      {name:'清军入关定鼎北京',desc:'公元1644年，明朝山海关总兵吴三桂引清军入关，清睿亲王多尔衮率八旗军击败李自成大顺军攻占北京。同年顺治帝自盛京迁都北京即皇帝位，清朝开始了对全中国的统治。'},
      {name:'康熙平定三藩收台湾',desc:'康熙帝爱新觉罗·玄烨八岁登基，智擒权臣鳌拜后亲政。1673至1681年平定吴三桂等三藩之乱，1683年派施琅率水师渡海统一台湾（郑氏政权投降），巩固了大一统局面。'},
      {name:'康乾盛世',desc:'康熙、雍正、乾隆三朝（1661—1795年）持续134年，是中国封建社会的最后一个鼎盛时期。国家统一、疆域辽阔超过1300万平方公里，人口从约两千万激增至三亿。但乾隆后期吏治腐败、八旗腐朽，盛世之下危机暗伏。'},
      {name:'鸦片战争',desc:'公元1840至1842年，英国以清廷钦差大臣林则徐虎门销烟为借口发动侵华战争。清军战败后签订了中国近代史上第一个不平等条约《南京条约》：开放五口通商、赔款2100万银元、割让香港岛给英国。中国开始沦为半殖民地半封建社会。'},
      {name:'太平天国运动',desc:'公元1851至1864年，洪秀全在广西金田村发动起义建立"太平天国"，定都天京（今南京），势力发展到十八省。曾国藩组建湘军、李鸿章组建淮军与之激战十余年。战争造成数千万人死亡，是中国历史上最惨烈的内战之一。'},

// ── Time helpers ──
const minYear = -3000, maxYear = 2026;
function yearToPercent(y) {
  return ((y - minYear) / (maxYear - minYear)) * 100;
}
function percentToYear(p) {
  return Math.round(minYear + (p / 100) * (maxYear - minYear));
}
function formatYear(y) {
  if (y < 0) return `公元前${Math.abs(y)}年`;
  return `公元${y}年`;
}
function getEraForYear(y) {
  for (let i = eras.length - 1; i >= 0; i--) {
    if (y >= eras[i].start && y <= eras[i].end) return i;
  }
  return y < 0 ? 0 : eras.length - 1;
}

// ── State ──
let sliderVal = 50;
let activeIdx = getEraForYear(percentToYear(sliderVal));

// ── Build timeline ──
function buildEraBars() {
  const totalRange = maxYear - minYear;
  document.getElementById('eraBars').innerHTML = eras.map((e, i) => {
    const left = ((e.start - minYear) / totalRange) * 100;
    const width = ((e.end - e.start) / totalRange) * 100;
    const isActive = i === activeIdx;
    return `<span class="era-bar${isActive ? ' active' : ''}"
      style="left:${left}%;width:${Math.max(width,0.4)}%;background:${e.color};"
      title="${e.name} (${e.period})"
      data-idx="${i}"
      data-start="${e.start}"
      data-end="${e.end}"></span>`;
  }).join('');
}

function buildEraPills() {
  document.getElementById('eraPills').innerHTML = eras.map((e, i) => {
    const isActive = i === activeIdx;
    return `<span class="era-pill${isActive ? ' active' : ''}"
      data-idx="${i}" style="${isActive ? `box-shadow:0 0 20px ${e.color}80` : ''}">${e.name}</span>`;
  }).join('');
}

function updateEraPreview() {
  const era = eras[activeIdx];
  const preview = document.getElementById('eraPreview');
  if (era) {
    preview.style.display = 'block';
    preview.innerHTML = `
      <h4>${era.name}</h4>
      <span class="era-preview-period">${era.period}</span>
      <p>${era.desc}</p>
    `;
  }
}

function updateYearBadge() {
  document.getElementById('yearBadge').textContent = formatYear(percentToYear(sliderVal));
}

function selectEra(idx) {
  activeIdx = idx;
  const era = eras[idx];
  sliderVal = yearToPercent(Math.round((era.start + era.end) / 2));
  document.getElementById('timeSlider').value = sliderVal;
  updateYearBadge();
  buildEraBars();
  buildEraPills();
  updateEraPreview();
  renderContent();
}

// ── Detail overlay ──
function showDetail(era, type, idx) {
  const overlay = document.getElementById('detailOverlay');
  overlay.style.display = 'flex';
  const tp = era.turningPoints || [];

  let title, bodyContent;

  if (type === 'event') {
    const ev = era.events[idx];
    title = ev.name;
    bodyContent = `
      <p style="font-size:14px;line-height:1.9;color:hsl(var(--foreground));">${ev.desc}</p>
      ${renderContextSection(era)}
    `;
  } else if (type === 'figure') {
    const fig = era.figures[idx];
    const figName = typeof fig === 'object' ? fig.name : fig;
    const figDesc = typeof fig === 'object' ? fig.desc : '';
    title = figName;
    // Find events that mention this figure
    const relatedEvents = era.events.filter(ev => {
      const en = typeof ev === 'object' ? ev.name : ev;
      return en.includes(figName);
    });
    bodyContent = `
      ${figDesc ? `<p style="font-size:14px;line-height:1.9;color:hsl(var(--foreground));margin-bottom:16px;">${figDesc}</p>` : ''}
      <div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">
        <span style="display:inline-block;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:hsl(var(--primary) / .15);color:hsl(var(--primary));">${era.name}</span>
        <span style="font-size:12px;color:hsl(var(--muted-foreground));">${era.period}</span>
      </div>
      ${relatedEvents.length > 0 ? `
        <p style="margin-top:16px;"><strong style="color:hsl(var(--primary))">相关重大事件</strong></p>
        ${relatedEvents.map(ev => `
          <div style="margin-bottom:6px;padding:8px 12px;background:hsl(var(--muted) / .15);border-radius:6px;font-size:13px;color:hsl(var(--muted-foreground));">
            ${typeof ev === 'object' ? ev.name : ev}
          </div>
        `).join('')}
      ` : ''}
      ${renderContextSection(era)}
    `;
  } else if (type === 'invention') {
    const inv = era.inventions[idx];
    const invName = typeof inv === 'object' ? inv.name : inv;
    const invDesc = typeof inv === 'object' ? inv.desc : '';
    title = invName;
    bodyContent = `
      ${invDesc ? `<p style="font-size:14px;line-height:1.9;color:hsl(var(--foreground));margin-bottom:16px;">${invDesc}</p>` : ''}
      <div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">
        <span style="display:inline-block;padding:3px 10px;border-radius:9999px;font-size:11px;font-weight:600;background:hsl(var(--primary) / .15);color:hsl(var(--primary));">${era.name}</span>
        <span style="font-size:12px;color:hsl(var(--muted-foreground));">${era.period}</span>
      </div>
      <p style="font-size:14px;line-height:1.9;color:hsl(var(--foreground));">「${invName}」是${era.name}时期的重要发明创造与文明成果，代表了当时社会的科技水平和创造力。${era.desc}</p>
      ${renderContextSection(era)}
    `;
  } else if (type === 'turning') {
    const t = tp[idx];
    title = t.e;
    bodyContent = `
      <div style="margin-bottom:12px;">
        <span style="display:inline-block;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:700;background:hsl(var(--primary) / .15);color:hsl(var(--primary));">${t.y}</span>
      </div>
      <p style="font-size:14px;line-height:1.9;color:hsl(var(--foreground));margin-bottom:12px;">${t.d}</p>
      <div style="padding:12px;background:hsl(var(--primary) / .08);border-radius:8px;border-left:3px solid hsl(var(--primary));">
        <p style="font-size:13px;color:hsl(var(--primary));"><strong>历史影响：</strong>${t.s}</p>
      </div>
      ${renderContextSection(era)}
    `;
  }

  overlay.innerHTML = `
    <div class="detail-panel">
      <button class="detail-close" onclick="closeDetail()">&times;</button>
      <span class="period-label">${era.period}</span>
      <h3>${title}</h3>
      <div class="detail-body">${bodyContent}</div>
    </div>
  `;
}

function renderContextSection(era) {
  const tp = era.turningPoints || [];
  return `
    ${tp.length > 0 ? `
      <p style="margin-top:20px;"><strong style="color:hsl(var(--primary))">时代背景 · 历史转折</strong></p>
      ${tp.map(t => `
        <div style="margin-bottom:10px;padding:10px;background:hsl(var(--muted) / .2);border-radius:8px;border-left:3px solid hsl(var(--primary) / .5);">
          <span style="font-size:12px;font-weight:700;color:hsl(var(--primary));">${t.y} · ${t.e}</span>
          <p style="font-size:13px;color:hsl(var(--muted-foreground));margin:4px 0;">${t.d}</p>
          <p style="font-size:12px;color:hsl(var(--primary) / .7);">${t.s}</p>
        </div>
      `).join('')}
    ` : ''}
    <p style="margin-top:16px;"><strong style="color:hsl(var(--primary))">同时代著名人物：</strong>${era.figures.map(f=>typeof f==='object'?f.name:f).join('、')}</p>
    <p style="margin-top:8px;"><strong style="color:hsl(var(--primary))">同时代重要成就：</strong>${era.inventions.map(inv=>typeof inv==='object'?inv.name:inv).join('、')}</p>
  `;
}

function closeDetail() {
  document.getElementById('detailOverlay').style.display = 'none';
}

// ── Event bindings ──
// Slider
document.getElementById('timeSlider').addEventListener('input', function() {
  sliderVal = parseFloat(this.value);
  const y = percentToYear(sliderVal);
  const idx = getEraForYear(y);
  if (idx !== activeIdx) {
    activeIdx = idx;
    buildEraBars();
    buildEraPills();
    updateEraPreview();
    renderContent();
  }
  updateYearBadge();
});

// Era bars click
document.getElementById('eraBars').addEventListener('click', function(e) {
  const bar = e.target.closest('.era-bar');
  if (!bar) return;
  selectEra(parseInt(bar.dataset.idx));
});

// Era pills click
document.getElementById('eraPills').addEventListener('click', function(e) {
  const pill = e.target.closest('.era-pill');
  if (!pill) return;
  selectEra(parseInt(pill.dataset.idx));
});

// Item detail + tab switching
document.getElementById('mainContent').addEventListener('click', function(e) {
  const tab = e.target.closest('.content-tab');
  if (tab) {
    const group = tab.dataset.group;
    document.querySelectorAll(`.content-tab[data-group="${group}"]`).forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelectorAll(`.tab-panel[data-group="${group}"]`).forEach(p => p.style.display = 'none');
    const cap = tab.dataset.tab.charAt(0).toUpperCase() + tab.dataset.tab.slice(1);
    const targetId = 'tabRight' + cap;
    const target = document.getElementById(targetId);
    if (target) target.style.display = 'block';
    return;
  }
  const era = eras[activeIdx];
  // Event click
  const eventItem = e.target.closest('.event-item');
  if (eventItem) {
    const idx = parseInt(eventItem.dataset.eventIdx);
    if (!isNaN(idx)) showDetail(era, 'event', idx);
    return;
  }
  // Figure click
  const figureItem = e.target.closest('[data-figure-idx]');
  if (figureItem) {
    const idx = parseInt(figureItem.dataset.figureIdx);
    if (!isNaN(idx)) showDetail(era, 'figure', idx);
    return;
  }
  // Invention click
  const invItem = e.target.closest('[data-invention-idx]');
  if (invItem) {
    const idx = parseInt(invItem.dataset.inventionIdx);
    if (!isNaN(idx)) showDetail(era, 'invention', idx);
    return;
  }
  // Turning point click
  const tpItem = e.target.closest('[data-turning-idx]');
  if (tpItem) {
    const idx = parseInt(tpItem.dataset.turningIdx);
    if (!isNaN(idx)) showDetail(era, 'turning', idx);
    return;
  }
});

// Detail overlay close
document.getElementById('detailOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeDetail();
});

// ── Init ──
function init() {
  // Default to showing 秦朝
  activeIdx = 6; // 秦朝
  sliderVal = yearToPercent(Math.round((eras[6].start + eras[6].end) / 2));
  document.getElementById('timeSlider').value = sliderVal;
  updateYearBadge();
  buildEraBars();
  buildEraPills();
  updateEraPreview();
  renderContent();
}

init();
</script>
</body></html>
