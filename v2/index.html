<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国历史朝代 · 分页签浏览</title>
<style>
  :root {
    --bg: #faf8f5;
    --card-bg: #ffffff;
    --text: #2c2416;
    --text-secondary: #6b5e4a;
    --text-muted: #a09888;
    --border: #e8e0d5;
    --shadow: 0 4px 20px rgba(60,40,20,0.08);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1814;
      --card-bg: #242118;
      --text: #e8dfcf;
      --text-secondary: #a09880;
      --text-muted: #6b6258;
      --border: #3a3428;
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
  }

  .hero {
    text-align: center; padding: 40px 24px 20px;
  }
  .hero h1 {
    font-size: clamp(24px, 5vw, 40px); font-weight: 900; letter-spacing: 0.05em;
    background: linear-gradient(135deg, #d4a853, #c0392b, #e67e22, #8e44ad, #2980b9);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .hero p { color: var(--text-secondary); font-size: 14px; margin-top: 6px; }

  /* ── Period tabs ── */
  .period-tabs {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 0 20px 16px;
  }
  .period-tab {
    padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card-bg); color: var(--text-secondary);
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; white-space: nowrap; user-select: none;
  }
  .period-tab:hover { border-color: var(--text); color: var(--text); }
  .period-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* ── Dynasty tabs ── */
  .tab-bar-wrap {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 0 20px;
  }
  .tab-bar {
    display: flex; gap: 4px; overflow-x: auto; padding: 8px 0 10px;
    -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  .tab-bar::-webkit-scrollbar { height:3px; }
  .tab-bar::-webkit-scrollbar-thumb { background: var(--border); border-radius:2px; }

  .tab {
    flex-shrink: 0; padding: 8px 20px; border-radius: 10px 10px 0 0;
    border: 1px solid transparent; border-bottom: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    color: var(--text-muted); transition: all 0.2s; user-select: none;
    position: relative;
  }
  .tab:hover { color: var(--text); background: var(--card-bg); }
  .tab.active {
    color: #fff; border-color: transparent; border-radius: 10px;
  }

  /* ── Content ── */
  .content-wrap {
    max-width: 900px; margin: 0 auto; padding: 24px 20px 60px;
  }
  .dynasty-card {
    background: var(--card-bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px 32px;
    box-shadow: var(--shadow);
  }
  .dynasty-card h2 {
    font-size: 32px; margin-bottom: 4px;
    display: flex; align-items: center; gap: 12px;
  }
  .dynasty-card .meta {
    font-size: 14px; color: var(--text-muted); margin-bottom: 20px;
    display: flex; flex-wrap: wrap; gap: 12px 24px;
  }
  .dynasty-card .meta b { color: var(--text-secondary); font-weight: 600; }

  .event-list { display: flex; flex-direction: column; gap: 8px; }
  .event-item {
    display: flex; align-items: baseline; gap: 12px;
    padding: 8px 14px; border-radius: 8px;
    background: var(--bg); border: 1px solid var(--border);
    font-size: 14px; transition: transform 0.15s;
  }
  .event-item:hover { transform: translateX(4px); }
  .event-year {
    flex-shrink: 0; font-size: 12px; font-weight: 700;
    color: #fff; padding: 2px 10px; border-radius: 4px;
    min-width: 60px; text-align: center;
  }
  .event-text { color: var(--text); }

  footer {
    text-align: center; padding: 24px; color: var(--text-muted);
    font-size: 12px; border-top: 1px solid var(--border);
  }

  @media (max-width: 768px) {
    .dynasty-card { padding: 20px 16px; }
    .dynasty-card h2 { font-size: 24px; }
    .tab { font-size: 13px; padding: 7px 14px; }
    .event-item { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="tab-bar-wrap">
  <div class="tab-bar" id="tabBar"></div>
</div>

<div class="content-wrap" id="contentWrap"></div>

<footer>数据来源：百度百科 · 中国历史年表 &nbsp;|&nbsp; v2.0 · 分页签模式</footer>

const dynastyEvents = {

  '西晋': [{y:280,t:'三家归晋·天下一统'},{y:290,t:'太康之治·短暂繁荣'},{y:291,t:'八王之乱·国力崩溃'},{y:311,t:'永嘉之祸·五胡乱华'}],
  '东晋': [{y:318,t:'王与马共天下·门阀政治'},{y:383,t:'淝水之战·八万破百万'},{y:321,t:'祖逖北伐·中流击楫'},{y:353,t:'王羲之兰亭集序'}],
  '十六国': [{y:304,t:'匈奴刘渊建汉·五胡十六国'},{y:376,t:'前秦苻坚统一北方'}],
  '南北朝': [{y:494,t:'北魏孝文帝改革·迁都汉化'},{y:460,t:'祖冲之计算圆周率到七位'},{y:540,t:'贾思勰著《齐民要术》'},{y:548,t:'侯景之乱·南朝衰败'}],

  '中华人民共和国': [{y:1949,t:'开国大典·中国人民站起来了'},{y:1950,t:'抗美援朝·保家卫国'},{y:1964,t:'两弹一星·国之重器'},{y:1978,t:'改革开放·经济腾飞'},{y:1997,t:'香港回归·一国两制'},{y:2008,t:'北京奥运会·大国崛起'},{y:2020,t:'全面脱贫·建成小康'}],

function fmtYear(y) { return y < 0 ? '前'+Math.abs(y) : '公元'+y; }
function dur(s,e) { const d=e-s; return (d>=100?'约':'')+d+'年'; }

// ── State ──
let activePeriod = 'preqin';
let activeDynasty = '夏';

// ── Render Period Tabs ──
function renderPeriodTabs() {
  document.getElementById('periodTabs').innerHTML = periods.map(p => {
    const cls = p.id === activePeriod ? 'period-tab active' : 'period-tab';
    return `<span class="${cls}" data-period="${p.id}">${p.name}</span>`;
  }).join('');
}

// ── Render Dynasty Tabs ──
function renderDynastyTabs() {
  const ds = dynasties.filter(d => d.period === activePeriod);
  if (!ds.find(d => d.name === activeDynasty)) {
    activeDynasty = ds[0].name;
  }
  const bar = document.getElementById('tabBar');
  bar.innerHTML = ds.map(d => {
    const cls = d.name === activeDynasty ? 'tab active' : 'tab';
    const c = palette[d.period];
    const style = d.name === activeDynasty ? `background:${c};` : `border-color:${c};color:${c};`;
    return `<span class="${cls}" data-dynasty="${d.name}" style="${style}">${d.name}</span>`;
  }).join('');

  // Scroll active tab into view
  const activeTab = bar.querySelector('.tab.active');
  if (activeTab) {
    activeTab.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }
}

// ── Render Content ──
function renderContent() {
  const d = dynasties.find(dd => dd.name === activeDynasty);
  if (!d) return;
  const c = palette[d.period];
  const events = dynastyEvents[d.name] || [];

  document.getElementById('contentWrap').innerHTML = `
    <div class="dynasty-card">
      <h2><span style="font-size:36px;">${periods.find(p=>p.id===d.period)?.name ? '' : ''}</span>${d.name}</h2>
      <div class="meta">
        <span><b>时间：</b>${fmtYear(d.start)} — ${fmtYear(d.end)} · ${dur(d.start,d.end)}</span>
        <span><b>建立者：</b>${d.founder}</span>
        <span><b>都城：</b>${d.capital}</span>
      </div>
      <div class="event-list">
        ${events.map(e => `
          <div class="event-item">
            <span class="event-year" style="background:${c}">${fmtYear(e.y)}</span>
            <span class="event-text">${e.t}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ── Event Delegation ──
document.getElementById('periodTabs').addEventListener('click', function(e) {
  const tab = e.target.closest('.period-tab');
  if (!tab) return;
  activePeriod = tab.dataset.period;
  renderPeriodTabs();
  renderDynastyTabs();
  renderContent();
});

document.getElementById('tabBar').addEventListener('click', function(e) {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  activeDynasty = tab.dataset.dynasty;
  renderDynastyTabs();
  renderContent();
  window.scrollTo({ top:0, behavior:'smooth' });
});

// ── Init ──
renderPeriodTabs();
renderDynastyTabs();
renderContent();
</script>
</body>
</html>
