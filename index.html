<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国全历史网</title>
<style>
:root {
  --bg: #1c1915;
  --card-bg: #24201a;
  --card-hover: #2d2820;
  --text: #e8dfcf;
  --text-secondary: #a09880;
  --text-muted: #6b6258;
  --border: #3d3528;
  --primary: 45 90% 55%;
  --primary-glow: 45 95% 62%;
  --primary-hex: #e6c444;
  --muted: 30 20% 22%;
  --muted-foreground: 40 20% 70%;
  --radius: 16px;
  --shadow-card: 0 8px 32px rgba(0,0,0,.5);
  --shadow-elegant: 0 20px 60px -20px rgba(0,0,0,.9);
  --shadow-glow: 0 0 40px hsl(45 90% 55% / .2);
  --transition: all .3s cubic-bezier(.4,0,.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh;
}

/* Background — grid + architecture pattern + warm glow */
.bg-layer {
  position:fixed; inset:0; z-index:0; pointer-events:none;
}
.bg-layer.grid {
  background-image:
    linear-gradient(hsl(var(--primary) / .04) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--primary) / .04) 1px, transparent 1px);
  background-size: 56px 56px;
}
.bg-layer.pattern {
  background-image:
    /* roof tile pattern */
    repeating-linear-gradient(0deg, transparent, transparent 4px, hsl(var(--primary) / .015) 4px, hsl(var(--primary) / .015) 5px),
    /* vertical columns */
    repeating-linear-gradient(90deg, transparent, transparent 80px, hsl(var(--primary) / .02) 80px, hsl(var(--primary) / .02) 81px);
  opacity:0.7;
}
.bg-layer.glow {
  background:
    radial-gradient(ellipse 70% 50% at 50% 0%, hsl(42 70% 45% / .07) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 30% 70%, hsl(35 50% 35% / .04) 0%, transparent 50%),
    radial-gradient(ellipse 50% 40% at 70% 70%, hsl(35 50% 35% / .04) 0%, transparent 50%);
}

/* ── Header ── */
header {
  position:sticky; top:0; z-index:100;
  background:linear-gradient(180deg, hsl(var(--bg)), hsl(var(--card-bg)));
  border-bottom:1px solid hsl(var(--border) / 0.5);
  box-shadow:var(--shadow-elegant);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
}
.header-inner {
  max-width:1200px; margin:0 auto; padding:20px 32px;
  text-align:center;
}
.header-deco {
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-bottom:6px;
}
.header-bar {
  width:4px; height:40px; border-radius:2px;
  background:linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 16px hsl(var(--primary) / 0.5);
}
header h1 {
  font-size:clamp(24px,4vw,36px); font-weight:800; letter-spacing:.1em;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 20px hsl(var(--primary) / 0.5)) drop-shadow(0 0 40px hsl(var(--primary) / 0.3));
  cursor:pointer;
}
header .subtitle {
  color:hsl(var(--muted-foreground)); font-size:13px; margin-top:4px;
  max-width:600px; margin-left:auto; margin-right:auto;
}
.header-stats {
  display:flex; align-items:center; justify-content:center; gap:10px; margin-top:10px;
}
.header-stats .pill {
  padding:4px 14px; border-radius:9999px;
  background:hsl(var(--primary) / 0.1); border:1px solid hsl(var(--primary) / 0.2);
  font-size:12px; color:hsl(var(--muted-foreground));
}
.header-stats .pill strong {
  color:hsl(var(--primary)); font-weight:700;
}

/* ── Container ── */
.container { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:32px 24px 80px; }

/* ── Page visibility ── */
.page { display:none; animation: fadeIn .4s ease; }
.page.active { display:block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

/* ── Home ── */
.era-grid {
  display:grid; grid-template-columns:repeat(3,1fr); gap:16px;
}
.era-card {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px; cursor:pointer;
  transition:var(--transition); position:relative; overflow:hidden;
}
.era-card:hover {
  background:var(--card-hover); transform:translateY(-4px);
  box-shadow:var(--shadow-glow); border-color:hsl(var(--primary) / .4);
}
.era-card .era-bar { height:4px; border-radius:2px; margin-bottom:16px; }
.era-card .era-name { font-size:18px; font-weight:700; }
.era-card .era-period { font-size:12px; color:var(--text-muted); margin-top:4px; }
.era-card .era-desc {
  font-size:13px; color:var(--text-secondary); line-height:1.6; margin-top:10px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}

/* ── Timeline Card ── */
.timeline-card {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-card), 0 0 0 1px hsl(var(--primary) / .08), 0 0 32px hsl(var(--primary) / .08);
  padding:24px; margin-bottom:32px;
  transition:var(--transition); position:relative; overflow:hidden;
}
.timeline-card::before {
  content:''; position:absolute; inset:0;
  background-image:
    linear-gradient(hsl(var(--primary) / .02) 1px, transparent 1px),
    linear-gradient(90deg, hsl(var(--primary) / .02) 1px, transparent 1px);
  background-size:48px 48px; pointer-events:none; opacity:0.5;
}
.timeline-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; position:relative; z-index:1;
}
.timeline-title-group {
  display:flex; align-items:center; gap:12px;
}
.timeline-icon {
  padding:10px; border-radius:10px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 20px hsl(var(--primary) / .4);
  flex-shrink:0;
}
.timeline-icon svg { display:block; width:20px; height:20px; color:#1a1814; }
.timeline-title-group h3 { font-size:18px; font-weight:700; }
.timeline-title-group p { font-size:12px; color:hsl(var(--muted-foreground)); margin-top:2px; }
.timeline-year-badge {
  padding:7px 18px; border-radius:9999px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:#1a1814; font-weight:700; font-size:14px;
  box-shadow:0 0 20px hsl(var(--primary) / .4);
  position:relative; z-index:1; white-space:nowrap;
}

/* ── Slider ── */
.timeline-card input[type=range] {
  -webkit-appearance:none; width:100%; height:4px;
  border-radius:2px;
  background:linear-gradient(90deg,
    hsl(35 50% 40%), hsl(35 55% 45%), hsl(38 60% 48%), hsl(40 65% 50%),
    hsl(42 70% 50%), hsl(44 80% 52%), hsl(45 85% 54%), hsl(45 90% 55%),
    hsl(44 80% 52%), hsl(42 70% 50%), hsl(40 65% 50%), hsl(38 60% 48%),
    hsl(35 55% 45%), hsl(35 50% 40%), hsl(38 55% 46%), hsl(40 65% 50%),
    hsl(42 75% 52%), hsl(44 85% 54%), hsl(45 90% 55%)
  );
  outline:none; cursor:pointer; position:relative; z-index:1;
  margin-bottom:4px;
}
.timeline-card input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:22px; height:14px; border-radius:7px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  box-shadow:0 0 12px hsl(var(--primary) / .5); cursor:pointer;
  border:2px solid #1c1915;
}

/* ── Era Bars ── */
.era-bars {
  position:relative; height:40px; margin:6px 0 14px; border-radius:8px;
  background:linear-gradient(90deg, hsl(var(--muted) / .15), hsl(var(--muted) / .3), hsl(var(--muted) / .15));
  padding:8px; z-index:1; overflow:hidden;
}
.era-bar {
  position:absolute; height:14px; border-radius:3px; cursor:pointer;
  top:50%; transform:translateY(-50%);
  transition:all .2s ease; opacity:.8;
}
.era-bar:hover { height:20px; opacity:1; box-shadow:0 0 12px currentColor; }
.era-bar.active { height:20px; opacity:1; box-shadow:0 0 14px currentColor; z-index:1; }

/* ── Era Pills ── */
.era-pills {
  display:flex; flex-wrap:wrap; gap:8px; position:relative; z-index:1; margin-bottom:16px;
}
.era-pill {
  padding:8px 16px; border-radius:9999px; font-size:12px; font-weight:600;
  cursor:pointer; border:1px solid var(--border);
  background:hsl(var(--muted) / .5); color:hsl(var(--muted-foreground));
  transition:all .25s ease; white-space:nowrap;
}
.era-pill:hover { background:hsl(var(--muted)); color:var(--text); border-color:hsl(var(--primary) / .25); }
.era-pill.active {
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  color:#1a1814; border-color:transparent;
  box-shadow:0 0 20px hsl(var(--primary) / .5);
  transform:scale(1.05);
}

/* ── Era Preview ── */
.era-preview {
  padding:20px; border-radius:12px; margin-bottom:16px;
  background:linear-gradient(135deg, hsl(var(--muted) / .5), hsl(var(--muted) / .3));
  border:2px solid hsl(var(--primary) / .15); position:relative; z-index:1;
}
.era-preview h4 {
  font-size:22px; font-weight:800;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.era-preview .era-preview-period {
  display:inline-block; font-size:12px; color:hsl(var(--muted-foreground));
  padding:2px 12px; border-radius:20px; background:hsl(var(--muted) / .5);
  border:1px solid hsl(var(--primary) / .1); margin:6px 0 10px;
}
.era-preview p { font-size:14px; color:hsl(var(--muted-foreground)); line-height:1.7; }

/* ── Inline Content ── */
.main-content {
  display:none; margin-top:24px;
  animation: fadeIn .4s ease;
}
.main-content.visible { display:block; }

.content-grid {
  display:grid; grid-template-columns:1fr 1fr; gap:24px;
}
.content-col {
  display:flex; flex-direction:column; gap:24px;
}
.content-card {
  background:var(--card-bg); border:1px solid var(--border);
  border-radius:var(--radius); padding:24px 28px;
  box-shadow:var(--shadow-card);
}
.content-card .card-label {
  display:inline-block; font-size:12px; color:hsl(var(--primary));
  background:hsl(var(--primary) / .08); padding:4px 14px;
  border-radius:9999px; margin-bottom:12px; font-weight:600; letter-spacing:.04em;
}
.content-card h2 {
  font-size:22px; font-weight:800; margin-bottom:4px;
  background:linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.content-card .card-desc {
  font-size:14px; line-height:1.9; color:hsl(var(--muted-foreground));
  margin-top:12px;
}
.content-card h3 {
  font-size:15px; font-weight:700; margin:20px 0 12px;
  display:flex; align-items:center; gap:8px; color:var(--text);
}
.content-card h3::before {
  content:''; width:3px; height:16px; border-radius:2px;
  background:linear-gradient(180deg, hsl(var(--primary)), hsl(var(--primary-glow)));
  flex-shrink:0; box-shadow:0 0 8px hsl(var(--primary) / .4);
}

@media (max-width:1024px) {
  .content-grid { grid-template-columns:1fr; }
}
@media (max-width:640px) {
  .content-card { padding:18px; }
}

/* ── Detail Page ── */
.detail-nav { display:flex; gap:12px; margin-bottom:24px; align-items:center; }
.detail-nav button {
  padding:8px 20px; border-radius:20px; font-size:13px; font-weight:600;
  background:var(--card-bg); border:1px solid var(--border);
  color:var(--text-secondary); cursor:pointer; transition:var(--transition);
}
.detail-nav button:hover { border-color:hsl(var(--primary)); color:hsl(var(--primary)); }
.detail-nav .current-name { font-size:20px; font-weight:700; color:hsl(var(--primary)); margin:0 8px; }

.detail-hero {
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:32px; margin-bottom:24px;
}
.detail-hero h1 { font-size:28px; font-weight:800; color:hsl(var(--primary)); }
.detail-hero .dh-period {
  font-size:13px; color:var(--text-muted); margin-top:4px;
  padding:4px 14px; background:hsl(var(--primary) / .06); border-radius:20px;
  display:inline-block; margin-bottom:16px;
}
.detail-hero .dh-desc { font-size:15px; color:var(--text-secondary); line-height:1.9; }

.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.detail-card {
  background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius);
  padding:24px;
}
.detail-card h3 {
  font-size:15px; font-weight:700; margin-bottom:14px;
  display:flex; align-items:center; gap:8px; color:hsl(var(--primary));
}
.detail-card h3::before { content:''; width:3px; height:14px; border-radius:2px; background:hsl(var(--primary)); flex-shrink:0; }

.event-list { display:flex; flex-direction:column; gap:6px; }
.event-item { display:flex; align-items:flex-start; gap:10px; padding:10px 14px; border-radius:8px; background:hsl(var(--primary) / .03); font-size:13px; line-height:1.5; }
.event-dot { width:6px; height:6px; border-radius:50%; background:hsl(var(--primary)); flex-shrink:0; margin-top:7px; }

.tag-row { display:flex; flex-wrap:wrap; gap:8px; }
.tag-item { padding:6px 14px; border-radius:20px; font-size:13px; font-weight:500; background:hsl(var(--primary) / .06); color:hsl(var(--primary)); border:1px solid hsl(var(--primary) / .12); }
.invention-item { padding:12px 16px; border-radius:12px; background:hsl(var(--primary) / .03); font-size:13px; text-align:center; font-weight:500; }
.invention-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

.tp-card { padding:14px 16px; border-radius:12px; background:hsl(var(--primary) / .03); border-left:3px solid hsl(var(--primary)); margin-bottom:8px; }
.tp-card .tpc-year { font-size:11px; font-weight:700; color:hsl(var(--primary)); margin-bottom:4px; }
.tp-card .tpc-event { font-size:14px; font-weight:700; }
.tp-card .tpc-desc { font-size:13px; color:var(--text-secondary); }
.tp-card .tpc-sig { font-size:12px; color:var(--text-muted); font-style:italic; margin-top:2px; }

/* ── Footer ── */
.app-footer { text-align:center; padding:24px; color:var(--text-muted); font-size:12px; border-top:1px solid var(--border); position:relative; z-index:1; }

/* ── Responsive ── */
@media (max-width:1024px) {
  .era-grid { grid-template-columns:repeat(2,1fr); }
  .detail-grid { grid-template-columns:1fr; }
}
@media (max-width:640px) {
  .era-grid { grid-template-columns:1fr; }
  .header-inner { padding:16px 12px; }
  .container { padding:20px 12px 60px; }
  .timeline-card { padding:16px; }
  .detail-nav { flex-wrap:wrap; justify-content:center; }
  .detail-hero { padding:20px; }
  .detail-card { padding:16px; }
  .invention-grid { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<div class="bg-layer grid"></div>
<div class="bg-layer pattern"></div>
<div class="bg-layer glow"></div>

<!-- Header -->
<header>
  <div class="header-inner">
    <div class="header-deco">
      <span class="header-bar"></span>
      <h1 data-page="main">中 国 全 历 史</h1>
      <span class="header-bar"></span>
    </div>
    <p class="subtitle">穿越五千年历史长河，探索中华文明的璀璨轨迹</p>
    <div class="header-stats">
      <span class="pill"><strong>19</strong> 个历史时期</span>
      <span class="pill"><strong>5000+</strong> 年历史跨度</span>
    </div>
  </div>
</header>

<!-- ====== MAIN PAGE (Timeline + Home) ====== -->
<div class="page active" id="page-main">
  <div class="container">
    <!-- Timeline Card -->
    <div class="timeline-card">
      <div class="timeline-header">
        <div class="timeline-title-group">
          <div class="timeline-icon" id="tlIcon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div>
            <h3>历史时间轴</h3>
            <p>拖动滑块或点击色条探索历史</p>
          </div>
        </div>
        <span class="timeline-year-badge" id="tlYearBadge">公元2026年</span>
      </div>
      <div class="era-preview" id="tlPreview"></div>
      <input type="range" id="tlSlider" min="0" max="100" step="0.1" value="100">
      <div class="era-bars" id="eraBars"></div>
      <div class="era-pills" id="eraPills"></div>
    </div>

    <!-- Inline Content -->
    <div class="main-content" id="mainContent"></div>
  </div>
</div>

<!-- ====== DETAIL PAGE ====== -->
<div class="page" id="page-detail">
  <div class="container">
    <div class="detail-nav">
      <button id="detailPrev">← 上一个</button>
      <button data-page="main" style="font-size:12px;">返回主页</button>
      <span class="current-name" id="detailEraName"></span>
      <button data-page="main" style="font-size:12px;">返回主页</button>
      <button id="detailNext">下一个 →</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<footer class="app-footer">中国全历史网 · 穿越五千年历史长河，探索中华文明的璀璨轨迹</footer>

// ═══════════ APP LOGIC ═══════════
let currentPage = 'main';
let timelineEraIdx = 7; // default to 秦朝
let detailEraIdx = 0;

function navigate(page, eraIdx) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'main') renderMain();
  if (page === 'detail' && eraIdx !== undefined) {
    detailEraIdx = eraIdx;
    renderDetail();
  }
  window.scrollTo({ top:0, behavior:'smooth' });
}

// ── Timeline constants ──
const TIMELINE_MIN = -3000, TIMELINE_MAX = 2026;
const TIMELINE_RANGE = TIMELINE_MAX - TIMELINE_MIN;

function yearToPct(y) { return ((y - TIMELINE_MIN) / TIMELINE_RANGE) * 100; }
function pctToYear(p) { return Math.round(TIMELINE_MIN + (p / 100) * TIMELINE_RANGE); }
function fmtYear(y) { return y < 0 ? '公元前'+Math.abs(y)+'年' : '公元'+y+'年'; }

// ── Era Bars ──
function buildEraBars() {
  document.getElementById('eraBars').innerHTML = eras.map((e, i) => {
    const left = ((e.start - TIMELINE_MIN) / TIMELINE_RANGE) * 100;
    const width = ((e.end - e.start) / TIMELINE_RANGE) * 100;
    const isActive = i === timelineEraIdx;
    return `<span class="era-bar${isActive ? ' active' : ''}"
      style="left:${left}%;width:${Math.max(width, 0.35)}%;background:${e.color};"
      title="${e.name} (${e.period})"
      data-idx="${i}"></span>`;
  }).join('');
}

// ── Era Pills ──
function buildEraPills() {
  document.getElementById('eraPills').innerHTML = eras.map((e, i) => {
    const isActive = i === timelineEraIdx;
    return `<span class="era-pill${isActive ? ' active' : ''}"
      data-idx="${i}" style="${isActive ? `box-shadow:0 0 20px ${e.color}80` : ''}">${e.name}</span>`;
  }).join('');
}

// ── Era Preview ──
function updateEraPreview() {
  const e = eras[timelineEraIdx];
  document.getElementById('tlPreview').innerHTML = `
    <h4>${e.name}</h4>
    <span class="era-preview-period">${e.period}</span>
    <p>${e.desc}</p>
  `;
}

// ── Year Badge ──
function updateYearBadge() {
  const pct = parseFloat(document.getElementById('tlSlider').value);
  document.getElementById('tlYearBadge').textContent = fmtYear(pctToYear(pct));
}

// ── Inline Content ──
function renderInlineContent() {
  const e = eras[timelineEraIdx];
  const tp = e.turningPoints || [];
  const mc = document.getElementById('mainContent');
  mc.innerHTML = `
    <div class="content-grid">
      <div class="content-col">
        <div class="content-card">
          <span class="card-label">${e.period}</span>
          <h2>${e.name}</h2>
          <p class="card-desc">${e.desc}</p>
          <h3>重大事件</h3>
          <div class="event-list">
            ${e.events.map(ev => `<div class="event-item"><span class="event-dot"></span><span>${ev}</span></div>`).join('')}
          </div>
        </div>
      </div>
      <div class="content-col">
        <div class="content-card">
          <h3 style="margin-top:0;">著名人物</h3>
          <div class="tag-row">
            ${e.figures.map(f => `<span class="tag-item">${f}</span>`).join('')}
          </div>
          <h3>重要成就</h3>
          <div class="invention-grid">
            ${e.inventions.map(inv => `<div class="invention-item">${inv}</div>`).join('')}
          </div>
        </div>
        ${tp.length > 0 ? `
        <div class="content-card">
          <h3 style="margin-top:0;">历史转折点</h3>
          ${tp.map(t => `
            <div class="tp-card">
              <div class="tpc-year">${t.y}</div>
              <div class="tpc-event">${t.e}</div>
              <div class="tpc-desc">${t.d}</div>
              <div class="tpc-sig">${t.s}</div>
            </div>
          `).join('')}
        </div>
        ` : ''}
      </div>
    </div>
  `;
  mc.classList.add('visible');
}

// ── Select Era ──
function selectTimelineEra(idx) {
  timelineEraIdx = idx;
  const midYear = Math.round((eras[idx].start + eras[idx].end) / 2);
  document.getElementById('tlSlider').value = yearToPct(midYear);
  updateYearBadge();
  buildEraBars();
  buildEraPills();
  updateEraPreview();
  renderInlineContent();
}

// ── Slider Input ──
function onSliderInput() {
  const pct = parseFloat(document.getElementById('tlSlider').value);
  const year = pctToYear(pct);
  updateYearBadge();

  let idx = eras.length - 1;
  for (let i = eras.length - 1; i >= 0; i--) {
    if (year >= eras[i].start && year <= eras[i].end) { idx = i; break; }
  }
  if (idx !== timelineEraIdx) {
    timelineEraIdx = idx;
    buildEraBars();
    buildEraPills();
    updateEraPreview();
    renderInlineContent();
  }
}

// ── Main Render ──
function renderMain() {
  const era = eras[timelineEraIdx];
  const midYear = Math.round((era.start + era.end) / 2);
  document.getElementById('tlSlider').value = yearToPct(midYear);
  updateYearBadge();
  buildEraBars();
  buildEraPills();
  updateEraPreview();
  renderInlineContent();
}

// ── Detail ──
function renderDetail() {
  const e = eras[detailEraIdx];
  document.getElementById('detailEraName').textContent = e.name;

  const tp = e.turningPoints || [];
  document.getElementById('detailContent').innerHTML = `
    <div class="detail-hero">
      <h1>${e.name}</h1>
      <span class="dh-period">${e.period}</span>
      <p class="dh-desc">${e.desc}</p>
    </div>
    <div class="detail-grid">
      <div class="detail-card">
        <h3>重大事件</h3>
        <div class="event-list">
          ${e.events.map(ev => `<div class="event-item"><span class="event-dot"></span><span>${ev}</span></div>`).join('')}
        </div>
      </div>
      <div class="detail-card">
        <h3>著名人物</h3>
        <div class="tag-row">
          ${e.figures.map(f => `<span class="tag-item">${f}</span>`).join('')}
        </div>
        <h3 style="margin-top:24px;">重要成就</h3>
        <div class="invention-grid">
          ${e.inventions.map(inv => `<div class="invention-item">${inv}</div>`).join('')}
        </div>
      </div>
      ${tp.length > 0 ? `
      <div class="detail-card" style="grid-column:1/-1;">
        <h3>历史转折点</h3>
        ${tp.map(t => `
          <div class="tp-card">
            <div class="tpc-year">${t.y}</div>
            <div class="tpc-event">${t.e}</div>
            <div class="tpc-desc">${t.d}</div>
            <div class="tpc-sig">${t.s}</div>
          </div>
        `).join('')}
      </div>
      ` : ''}
    </div>
  `;

  document.getElementById('detailPrev').style.visibility = detailEraIdx > 0 ? 'visible' : 'hidden';
  document.getElementById('detailNext').style.visibility = detailEraIdx < eras.length - 1 ? 'visible' : 'hidden';
}

// ── Event Bindings ──
document.querySelectorAll('[data-page]').forEach(el => {
  el.addEventListener('click', function() {
    const page = this.dataset.page;
    if (page === 'main') { renderMain(); navigate('main'); }
    else navigate(page);
  });
});

document.getElementById('detailPrev').addEventListener('click', () => {
  if (detailEraIdx > 0) { detailEraIdx--; renderDetail(); window.scrollTo({ top:0, behavior:'smooth' }); }
});
document.getElementById('detailNext').addEventListener('click', () => {
  if (detailEraIdx < eras.length - 1) { detailEraIdx++; renderDetail(); window.scrollTo({ top:0, behavior:'smooth' }); }
});

document.getElementById('tlSlider').addEventListener('input', onSliderInput);

// Era bars click delegation
document.getElementById('eraBars').addEventListener('click', function(e) {
  const bar = e.target.closest('.era-bar');
  if (bar) { selectTimelineEra(parseInt(bar.dataset.idx)); }
});

// Era pills click delegation
document.getElementById('eraPills').addEventListener('click', function(e) {
  const pill = e.target.closest('.era-pill');
  if (pill) { selectTimelineEra(parseInt(pill.dataset.idx)); }
});

// Click timeline preview to scroll to content
document.getElementById('tlPreview').addEventListener('click', function() {
  var mc = document.getElementById('mainContent');
  if (mc.classList.contains('visible')) {
    mc.scrollIntoView({ behavior:'smooth', block:'start' });
  }
});

// Pulse glow animation for timeline icon
setInterval(function() {
  const icon = document.getElementById('tlIcon');
  icon.style.boxShadow = icon.style.boxShadow === '0 0 24px hsl(var(--primary) / .6)' ? '0 0 14px hsl(var(--primary) / .35)' : '0 0 24px hsl(var(--primary) / .6)';
}, 2000);

// ── Init ──
renderMain();
</script>
</body></html>
